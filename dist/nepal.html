&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;한 장 캔버스&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;공공기관(Public Entity)의 조달을 공개입찰 원칙으로 수행하여, 자격을 갖춘 입찰자에게 차별 없이 동등한 참여 기회를 보장하고 경쟁을 제한하는 분할발주를 금지한다.&lt;/p&gt;
  &lt;div class=&quot;cards&quot;&gt;
    &lt;div class=&quot;card span2&quot;&gt;&lt;h3&gt;절차&lt;/h3&gt;&lt;ol class=&quot;steps&quot;&gt;&lt;li&gt;발주기관 원가산정(cost estimate) 및 조달계획 수립 (PPA §5, §6)&lt;/li&gt;&lt;li&gt;조달방식 선택 — 국제공개입찰·국내공개입찰·견적·직접구매·수요자위원회·직영 중 택일 (PPA §8(1)(a))&lt;/li&gt;&lt;li&gt;사전자격심사 실시 여부 결정 — 대규모·복잡 공사 또는 고가 물품이면 실시 (PPA §11(1), §12)&lt;/li&gt;&lt;li&gt;입찰서류 작성·승인 후 입찰공고 (PPA §13, §14)&lt;/li&gt;&lt;li&gt;입찰서류 판매 — 원가 구간별 법정 수수료 납부 (PPR r.48)&lt;/li&gt;&lt;li&gt;입찰서 제출 — 입찰서류가 정한 승인 원가산정액의 2~3% 입찰보증 동봉 (PPA §21, 현행 PPR r.53)&lt;/li&gt;&lt;li&gt;개찰 및 심사 — 미비 입찰서는 심사 제외 (PPA §22~§24)&lt;/li&gt;&lt;li&gt;입찰 평가 및 낙찰 결정 (PPA §25, §27)&lt;/li&gt;&lt;li&gt;계약 체결 — 계약이행보증 제출 후 (PPA §52)&lt;/li&gt;&lt;li&gt;불복 시 발주기관장 이의신청 → 검토위원회 재심 (PPA §47~§50)&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;적용 대상&lt;/h3&gt;&lt;p style=&quot;margin:0;font-size:13.5px;line-height:1.7&quot;&gt;네팔 공공기관의 공공재원 조달에는 원칙적으로 PPA/PPR와 e-GP 지침이 적용된다. 현행 기준은 직접구매 100만 네팔루피 이하, 봉인견적 200만 루피 이하, 그 초과는 공개입찰이다. 국제입찰 적용 여부는 PPA §9의 요건과 개별 공고·표준입찰서류를 확인해야 하며 금액만으로 자동 분류하지 않는다.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;법적 근거&lt;/h3&gt;&lt;div class=&quot;law&quot;&gt;&lt;span class=&quot;nm&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://ntnc.org.np/sites/default/files/doc_page/Public%20Procurement%20Act%202007.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Public Procurement Act, 2063 (2007)&lt;/a&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;§8(1)(a), §9, §11, §12, §13, §21, §28, §41, §63&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:auto&quot;&gt;법률&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;law&quot;&gt;&lt;span class=&quot;nm&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://ntnc.org.np/sites/default/files/doc_page/Public%20Procurement%20Rules%202007.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Public Procurement Rules, 2064 (2007)&lt;/a&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;r.39, r.48, r.53, r.54, r.141&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:auto&quot;&gt;시행규칙&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;law&quot;&gt;&lt;span class=&quot;nm&quot;&gt;PPMO 표준입찰서류(Standard Bidding Documents)&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:auto&quot;&gt;표준문서&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;law&quot;&gt;&lt;span class=&quot;nm&quot;&gt;RBBL Financial Administrative Regulation, 2011&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:auto&quot;&gt;시행규칙&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;권한 기관&lt;/h3&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;&lt;a class=&quot;ref&quot; href=&quot;https://ppmo.gov.np/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;공공조달모니터링국(PPMO)&lt;/a&gt;&lt;/b&gt;&lt;span&gt;표준 입찰양식 수립, 조달정책 수립, 법 이행 모니터링, 블랙리스트 결정&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;발주 공공기관(Public Entity)&lt;/b&gt;&lt;span&gt;원가산정·입찰공고·개찰·평가·낙찰·계약 체결&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;평가위원회(Evaluation Committee)&lt;/b&gt;&lt;span&gt;입찰서 심사 및 평가 (PPA §71)&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;검토위원회(Review Committee)&lt;/b&gt;&lt;span&gt;발주기관장 결정에 대한 이의 재심 (PPA §48~§50)&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;네팔 상업은행&lt;/b&gt;&lt;span&gt;입찰보증증권 발행. 외국은행 발행분은 네팔 소재 상업은행의 상호보증 필요&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;이해관계자&lt;/h3&gt;&lt;p style=&quot;margin:0;font-size:13.5px;line-height:1.7&quot;&gt;발주 공공기관(Public Entity), 국내외 입찰자, 공공조달모니터링국(PPMO), 입찰보증을 발행하는 네팔 상업은행, 외국 입찰자의 현지 대리인(agent), 이의제기를 심사하는 검토위원회(Review Committee)&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;제출서류&lt;/h3&gt;&lt;div class=&quot;docset&quot;&gt;&lt;b&gt;입찰자(공통)&lt;/b&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;법인 설립증명서(Certificate of Incorporation)&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;사업자등록번호(VAT 등록증 및 PAN 등록증)&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;납세 완납 증명원(tax clearance certificate)&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;해당 입찰 자격을 갖추었음을 명시한 진술서&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;입찰보증(입찰서류가 정한 승인 원가산정액의 2~3%, 현금 또는 적격 은행 보증)&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;입찰서류 구매 수수료 영수증&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;docset&quot;&gt;&lt;b&gt;외국인 입찰자(현지 대리인 지정 시)&lt;/b&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;대리인의 이름과 주소&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;대리인 수수료 금액·통화·지급방법&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;대리인과의 그 밖의 계약 조건&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;현지 대리인인 경우: 대리인의 PAN(영구계좌번호) 등록증명서 인증등본 및 대리인 수락서(letter of acceptance)&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;docset&quot;&gt;&lt;b&gt;발주 공공기관&lt;/b&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;입찰공고문(notice of invitation to bids)&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;입찰서류(PPMO 표준양식, standard bidding documents)&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;사전자격심사서류(prequalification documents)&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;평가보고서(evaluation report)&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;낙찰통지서(letter of acceptance)&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;조달계약서(procurement contract)&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;유의사항 · 병목&lt;/h3&gt;&lt;ul class=&quot;plain&quot;&gt;&lt;li&gt;입찰서 유효기간 내 계약이 체결되지 못하면 발주기관이 전 입찰자에게 연장 요청 공문을 보내야 하고, 연장에 응한 입찰자는 보증기간도 은행에서 다시 연장해 제출해야 한다 (PPR r.53(5)(6))&lt;/li&gt;&lt;li&gt;외국은행 발행 입찰보증증권은 네팔 소재 상업은행의 상호보증이 있어야 수리된다 — 현지 은행망이 없으면 보증 발급 단계에서 지연 (PPR r.53(4))&lt;/li&gt;&lt;li&gt;대리인 정보를 누락하거나 신고액보다 많은 수수료를 지급한 사실이 드러나면 발주기관이 블랙리스트 절차에 착수한다 (PPR r.39(3) → r.141)&lt;/li&gt;&lt;li&gt;블랙리스트 등재 시 최대 3년간 모든 공공기관 조달 참여가 차단된다 (PPA §63(1)(2))&lt;/li&gt;&lt;li&gt;직접구매 중 §41(1)(b)(e)(f) 사유는 중앙정부 기관의 경우 수석사무차관을 위원장으로 하는 위원회 권고와 내각 결정을 거쳐야 해 소요기간이 길다 (PPA §41(2))&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;진입장벽&lt;/h3&gt;&lt;ul class=&quot;plain&quot;&gt;&lt;li&gt;행정절차 지연 및 연방제 시행에 따른 협력 이해관계자 다변화&lt;/li&gt;&lt;li&gt;환율 변동&lt;/li&gt;&lt;li&gt;보수적인 비자 발급 운영&lt;/li&gt;&lt;li&gt;기업 진출 시 현지 파트너 협력이 사실상 필수 요건&lt;/li&gt;&lt;li&gt;2022년 부패인식지수(CPI) 35점/100점, 180개국 중 108위&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;현장 검증 필요&lt;/h3&gt;&lt;ul class=&quot;plain&quot;&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;관련 제도&lt;/h3&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;네팔 조달 거버넌스·감독체계&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;네팔 ODA 사업 발굴·형성 절차&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;법령 원문&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;현장에서 발주처에 그대로 제시할 수 있는 조문 원문입니다. 우리 요약이 아니라 verbatim이며,
    조문 번호를 누르면 원문 문서로 이동합니다. 한국어 요지 아래로 직역(참고용)을 펼칠 수 있습니다.&lt;/p&gt;
  &lt;div class=&quot;quotes&quot;&gt;&lt;div class=&quot;qc&quot;&gt;
  &lt;div class=&quot;qhd&quot;&gt;
    &lt;span class=&quot;qart&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://ntnc.org.np/sites/default/files/doc_page/Public%20Procurement%20Act%202007.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;§9&lt;/a&gt;&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;Public Procurement Act, 2063 (2007)&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;qtext&quot;&gt;Except as otherwise provided in this Act, a Public Entity making any procurement shall, to the extent possible, make by inviting open bids, and provide equal opportunity to qualified bidders to participate in such procurement process without any discrimination.&lt;/div&gt;
  &lt;p class=&quot;qgist&quot;&gt;공개입찰이 원칙이며, 자격을 갖춘 입찰자에게 차별 없이 동등한 기회를 준다.&lt;/p&gt;
  &lt;details&gt;&lt;summary&gt;한국어 직역(참고 — 공식 번역 아님)&lt;/summary&gt;&lt;p class=&quot;qko&quot;&gt;이 법에 달리 정한 경우를 제외하고, 공공기관은 조달 시 가능한 한 공개입찰로 하며 자격을 갖춘 입찰자에게 차별 없이 동등한 참여 기회를 제공한다.&lt;/p&gt;&lt;/details&gt;
&lt;/div&gt;&lt;div class=&quot;qc&quot;&gt;
  &lt;div class=&quot;qhd&quot;&gt;
    &lt;span class=&quot;qart&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://ntnc.org.np/sites/default/files/doc_page/Public%20Procurement%20Act%202007.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;§41(1)&lt;/a&gt;&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;Public Procurement Act, 2063 (2007)&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;qtext&quot;&gt;Notwithstanding anything contained elsewhere in this Act, goods or consultancy services or other services may be directly procured or construction work may be caused to be carried out directly in the following conditions:- (a) Low-value procurement valuing up to the prescribed amount, (b) If only one supplier or construction entrepreneur or consultant or service provider has the technical efficiency or capacity to fulfill the procurement requirement, (c) If only one supplier has the exclusive right to supply the goods to be procured and no other appropriate alternative is available, ...&lt;/div&gt;
  &lt;p class=&quot;qgist&quot;&gt;직접구매(경쟁 예외)는 저가·유일공급자·독점권 등 법정 6개 사유에만 허용된다.&lt;/p&gt;
  &lt;details&gt;&lt;summary&gt;한국어 직역(참고 — 공식 번역 아님)&lt;/summary&gt;&lt;p class=&quot;qko&quot;&gt;이 법의 다른 규정에도 불구하고, 다음 각 경우에는 물품·컨설팅·기타 용역을 직접 조달하거나 공사를 직접 수행하게 할 수 있다 — (a) 규정 금액 이하의 저가 조달, (b) 요건을 충족할 기술·역량을 갖춘 공급자·시공자·컨설턴트가 단 하나뿐인 경우, (c) 조달 물품의 독점 공급권을 가진 공급자가 단 하나이고 다른 적절한 대안이 없는 경우 등.&lt;/p&gt;&lt;/details&gt;
&lt;/div&gt;&lt;div class=&quot;qc&quot;&gt;
  &lt;div class=&quot;qhd&quot;&gt;
    &lt;span class=&quot;qart&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://ntnc.org.np/sites/default/files/doc_page/Public%20Procurement%20Rules%202007.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;r.39(1)(d)&lt;/a&gt;&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;Public Procurement Rules, 2064 (2007)&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;qtext&quot;&gt;If he/she is a local agent, the attested copy of his/her Permanent Account Number Registration Certificate and a letter of acceptance by him/her to become an agent.&lt;/div&gt;
  &lt;p class=&quot;qgist&quot;&gt;현지 대리인은 PAN(영구계좌번호) 등록증명서 인증등본과 대리인 수락서를 낸다.&lt;/p&gt;
  &lt;details&gt;&lt;summary&gt;한국어 직역(참고 — 공식 번역 아님)&lt;/summary&gt;&lt;p class=&quot;qko&quot;&gt;현지 대리인인 경우, 그의 영구계좌번호(PAN) 등록증명서 인증등본과 대리인이 되겠다는 수락서.&lt;/p&gt;&lt;/details&gt;
&lt;/div&gt;&lt;div class=&quot;qc&quot;&gt;
  &lt;div class=&quot;qhd&quot;&gt;
    &lt;span class=&quot;qart&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://ntnc.org.np/sites/default/files/doc_page/Public%20Procurement%20Rules%202007.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;r.53(1)&lt;/a&gt;&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;Public Procurement Rules, 2064 (2007)&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;qtext&quot;&gt;A bidder shall have to submit along with a bid, a bid security of at least 2.5 percent of the quoted amount of his/her bid in cash or the bid security issued by a commercial bank equivalent to that amount.&lt;/div&gt;
  &lt;p class=&quot;qgist&quot;&gt;입찰보증은 입찰금액의 최소 2.5%를 현금 또는 상업은행 발행 보증으로 낸다.&lt;/p&gt;
  &lt;details&gt;&lt;summary&gt;한국어 직역(참고 — 공식 번역 아님)&lt;/summary&gt;&lt;p class=&quot;qko&quot;&gt;입찰자는 입찰서와 함께 입찰금액의 최소 2.5%에 해당하는 입찰보증을 현금 또는 상업은행이 발행한 보증으로 제출해야 한다.&lt;/p&gt;&lt;/details&gt;
&lt;/div&gt;&lt;div class=&quot;qc&quot;&gt;
  &lt;div class=&quot;qhd&quot;&gt;
    &lt;span class=&quot;qart&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://ntnc.org.np/sites/default/files/doc_page/Public%20Procurement%20Rules%202007.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;r.54&lt;/a&gt;&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;Public Procurement Rules, 2064 (2007)&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;qtext&quot;&gt;(a) For a bid or proposal of consultancy service with cost estimate of up to one hundred million Rupees, - Ninety days (b) For a bid or proposal of a consultancy service with cost estimate whatsoever above one hundred million Rupees - One hundred and twenty days.&lt;/div&gt;
  &lt;p class=&quot;qgist&quot;&gt;입찰서 유효기간은 원가산정 1억 루피 이하 90일, 초과 120일이다.&lt;/p&gt;
  &lt;details&gt;&lt;summary&gt;한국어 직역(참고 — 공식 번역 아님)&lt;/summary&gt;&lt;p class=&quot;qko&quot;&gt;(a) 원가산정 1억 루피 이하의 입찰 또는 컨설팅 제안 — 90일, (b) 1억 루피 초과 — 120일.&lt;/p&gt;&lt;/details&gt;
&lt;/div&gt;&lt;div class=&quot;qc&quot;&gt;
  &lt;div class=&quot;qhd&quot;&gt;
    &lt;span class=&quot;qart&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://ntnc.org.np/sites/default/files/doc_page/Public%20Procurement%20Rules%202007.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;r.141(1)&lt;/a&gt;&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;Public Procurement Rules, 2064 (2007)&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;qtext&quot;&gt;If a Public Entity requires to blacklist a bidder, proponent, consultant, service provider, supplier, construction entrepreneur or other person, firm, organization or company pursuant to Section 63 of the Act, it shall have to request in writing with details of statement and reasons related thereto along with relevant document, to the Public Procurement Monitoring Office.&lt;/div&gt;
  &lt;p class=&quot;qgist&quot;&gt;블랙리스트 절차는 규칙(Rules) r.141, 실체 근거는 법(Act) §63에서 확인한다.&lt;/p&gt;
  &lt;details&gt;&lt;summary&gt;한국어 직역(참고 — 공식 번역 아님)&lt;/summary&gt;&lt;p class=&quot;qko&quot;&gt;공공기관이 법 제63조에 따라 입찰자 등을 블랙리스트에 올리려면, 관련 진술·사유와 서류를 갖추어 공공조달모니터링국(PPMO)에 서면으로 요청해야 한다.&lt;/p&gt;&lt;/details&gt;
&lt;/div&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;현행 기준 반영 3건&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;공식 법령·기관 원문으로 확인한 현행 기준과 실무 확인사항입니다.
    출처는 각 항목에 연결했으며.&lt;/p&gt;
  &lt;div class=&quot;disc&quot; data-sev=&quot;high&quot;&gt;
  &lt;div class=&quot;top&quot;&gt;
    &lt;span class=&quot;badge bad&quot;&gt;필수 확인&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;네팔&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;D01&lt;/span&gt;
  &lt;/div&gt;
  &lt;h3&gt;canvas.submittedDocuments[외국인 입찰자].documents&lt;/h3&gt;
  &lt;div class=&quot;quote act&quot;&gt;&lt;b&gt;현행 기준&lt;/b&gt;If he/she is a local agent, the attested copy of his/her Permanent Account Number Registration Certificate and a letter of acceptance by him/her to become an agent&lt;/div&gt;
  &lt;p class=&quot;cite&quot;&gt;확인 출처 · &lt;a class=&quot;ref&quot; href=&quot;https://ntnc.org.np/sites/default/files/doc_page/Public%20Procurement%20Rules%202007.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Public Procurement Rules, 2064 (2007)&lt;/a&gt; r.39(1)(d)&lt;/p&gt;
  &lt;div class=&quot;todo&quot;&gt;&lt;b&gt;실무 확인&lt;/b&gt;네팔 입찰에 현지 대리인을 세운다면 대리인의 PAN 등록증명서 인증등본과 대리인 수락서를 준비한다. 주민등록 등본을 준비했다면 요구서류가 아니므로 다시 받아야 한다.&lt;/div&gt;
  &lt;details class=&quot;review&quot;&gt;
  &lt;summary&gt;Field verification (English)&lt;/summary&gt;
  &lt;div class=&quot;rv&quot;&gt;
    &lt;p&gt;&lt;b&gt;Current legal basis&lt;/b&gt; — Public Procurement Rules 2064 (2007) r.39(1)(d) requires the attested copy of the agent&amp;#x27;s Permanent Account Number (PAN) Registration Certificate and a letter of acceptance to become an agent.&lt;/p&gt;
    &lt;p class=&quot;rv-verify&quot;&gt;&lt;b&gt;✔ Verify&lt;/b&gt; — Check the procuring entity&amp;#x27;s standard bidding documents against PPR r.39(1)(d): confirm a local agent must provide a PAN registration certificate and a letter of acceptance, not a resident registration document.&lt;/p&gt;
  &lt;/div&gt;
&lt;/details&gt;

  &lt;p class=&quot;act-row&quot;&gt;산출물 반영 — 제출서류를 &amp;#x27;PAN 등록증명서 인증등본 + 대리인 수락서&amp;#x27;로 교정했다. 실무 준비 시 원문 r.39(1)(d)를 기준으로 삼을 것.&lt;/p&gt;
&lt;/div&gt;&lt;div class=&quot;disc&quot; data-sev=&quot;medium&quot;&gt;
  &lt;div class=&quot;top&quot;&gt;
    &lt;span class=&quot;badge warn&quot;&gt;추가 확인&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;네팔&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;D02&lt;/span&gt;
  &lt;/div&gt;
  &lt;h3&gt;canvas.bottlenecks / 대리인 위반 시 제재 근거&lt;/h3&gt;
  &lt;div class=&quot;quote act&quot;&gt;&lt;b&gt;현행 기준&lt;/b&gt;the Public Entity shall carry out proceedings to blacklist such a bidder according to Rule 141 — 여기서 141은 법(Act)이 아니라 규칙(Rules)의 조항이며, 블랙리스트의 실체 근거는 Act §63이다.&lt;/div&gt;
  &lt;p class=&quot;cite&quot;&gt;확인 출처 · &lt;a class=&quot;ref&quot; href=&quot;https://ntnc.org.np/sites/default/files/doc_page/Public%20Procurement%20Rules%202007.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Public Procurement Rules, 2064 (2007)&lt;/a&gt; r.39(3), r.141 / &lt;a class=&quot;ref&quot; href=&quot;https://ntnc.org.np/sites/default/files/doc_page/Public%20Procurement%20Act%202007.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Public Procurement Act, 2063 (2007)&lt;/a&gt; §63&lt;/p&gt;
  &lt;div class=&quot;todo&quot;&gt;&lt;b&gt;실무 확인&lt;/b&gt;실무 준비를 바꿀 필요는 없다. 다만 블랙리스트 근거를 확인해야 할 때 법(Act)에서 제141조를 찾지 말고 규칙(Rules) r.141과 법 §63을 본다.&lt;/div&gt;
  &lt;details class=&quot;review&quot;&gt;
  &lt;summary&gt;Field verification (English)&lt;/summary&gt;
  &lt;div class=&quot;rv&quot;&gt;
    &lt;p&gt;&lt;b&gt;Current legal basis&lt;/b&gt; — Rule 141 belongs to the Public Procurement Rules 2064 (2007), not the Act; the substantive basis is Section 63 of the Public Procurement Act 2063 (2007). The Act has only 76 sections, so no Section 141 exists.&lt;/p&gt;
    &lt;p class=&quot;rv-verify&quot;&gt;&lt;b&gt;✔ Verify&lt;/b&gt; — No change to bid preparation. When citing the basis, use PPR r.141 (procedure) together with PPA §63 (substance).&lt;/p&gt;
  &lt;/div&gt;
&lt;/details&gt;

  &lt;p class=&quot;act-row&quot;&gt;산출물 반영 — 출처를 &amp;#x27;PPR 2007 r.141(절차) + PPA 2007 §63(실체 근거)&amp;#x27;로 분리 표기했다. 자료집 서술 내용 자체는 정확하다.&lt;/p&gt;
&lt;/div&gt;&lt;div class=&quot;disc&quot; data-sev=&quot;low&quot;&gt;
  &lt;div class=&quot;top&quot;&gt;
    &lt;span class=&quot;badge muted&quot;&gt;참고&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;네팔&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;D03&lt;/span&gt;
  &lt;/div&gt;
  &lt;h3&gt;canvas.legalBasis.articles&lt;/h3&gt;
  &lt;div class=&quot;quote act&quot;&gt;&lt;b&gt;현행 기준&lt;/b&gt;원문은 Section — Sub-section — clause 3단 체계다. 각각 §11(1)(a)(b), §8(1)(a)(4), §41(1)(a)~(f)에 해당한다.&lt;/div&gt;
  &lt;p class=&quot;cite&quot;&gt;확인 출처 · &lt;a class=&quot;ref&quot; href=&quot;https://ntnc.org.np/sites/default/files/doc_page/Public%20Procurement%20Act%202007.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Public Procurement Act, 2063 (2007)&lt;/a&gt; §8, §11, §13, §41&lt;/p&gt;
  &lt;div class=&quot;todo&quot;&gt;&lt;b&gt;실무 확인&lt;/b&gt;원문에서 조문을 찾을 때 항(Sub-section) 단계를 넣어 §41(1)(a) 형태로 본다. 본 사이트의 인용은 이미 교정돼 있다.&lt;/div&gt;


  &lt;p class=&quot;act-row&quot;&gt;산출물 반영 — legalBasis와 procedure의 인용을 원문 3단 체계로 교정했다.&lt;/p&gt;
&lt;/div&gt;

&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;검증&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;Public Procurement Act 2063(2007) 및 Public Procurement Rules 2064(2007) 영문 원문 PDF에서 관련 조문의 제목·문언·수치를 확인했다.&lt;/p&gt;
  &lt;div class=&quot;cards&quot;&gt;
    &lt;div class=&quot;card span2&quot;&gt;&lt;h3&gt;검증 범위&lt;/h3&gt;
      &lt;p style=&quot;margin:0;font-size:13.5px;line-height:1.7&quot;&gt;PPA 2063의 2026년 제2차 개정법과 PPR 2064의 제14·15차 개정까지 반영해 조달방식별 기준금액, 공고기한, 입찰보증, 계약이행보증, 불복절차와 예외를 조문 단위로 대조했다.&lt;/p&gt;
      &lt;p style=&quot;margin:12px 0 0;font-size:12.5px;color:var(--muted)&quot;&gt;확인일 2026-07-22 · 자료집 기준일 2026-02-23&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;대조에 쓴 원문&lt;/h3&gt;&lt;ul class=&quot;srcs&quot; style=&quot;padding-left:16px;margin:0&quot;&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://ntnc.org.np/sites/default/files/doc_page/Public%20Procurement%20Act%202007.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;The Public Procurement Act, 2063 (2007)&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;법률&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;대조 조문 §8(1)(a), §9, §11(1)(2)(3), §12, §13, §21, §28, §41(1)(2)(3), §63&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-22 · Government of Nepal (영문본 사본: NTNC 공개 게시)&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://ntnc.org.np/sites/default/files/doc_page/Public%20Procurement%20Rules%202007.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;The Public Procurement Regulation, 2007&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;시행규칙&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;대조 조문 r.39(1)(2)(3), r.48(1)(2), r.53(1)~(8), r.54(a)(b), r.141(1)~(6)&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-22 · Government of Nepal (영문본 사본: NTNC 공개 게시)&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://ppmo.gov.np/category/acts-regulations&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Public Procurement Monitoring Office 법령 게시 페이지&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;지침·정책&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-22 · PPMO&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://hr.parliament.gov.np/en/bills/TqsiRdta&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Public Procurement (Second Amendment) Act, 2083&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;법률&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;대조 조문 Amending Act §§1-31; PPA §§2, 8, 10-14, 23, 25-27, 30, 36, 40-45, 50, 52A, 54, 58A, 59, 61A-62A, 65-67, 74&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-28 · Federal Parliament of Nepal&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://ppmo.gov.np/content/13300/public-procurement--second-amendment--ordinance--2083/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Public Procurement (Second Amendment) Ordinance, 2083 — official Gazette text retained as enactment-text evidence&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;명령·조례&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;대조 조문 Ordinance §§1-31, including amended PPA §§14, 41A, 42A, 47-50, 52A, 54, 58A, 65-67&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-28 · Public Procurement Monitoring Office&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://ppmo.gov.np/content/13231/public-procurement--fourteth-amendment--rules--2082/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Public Procurement (Fourteenth Amendment) Rules, 2082&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;시행규칙&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;대조 조문 Amending Rules rr.1-30; PPR rr.2-3, 10-12, 21A-22, 26, 31C, 31J, 37, 44, 64, 110, 111A, 113A, 118, 120A&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-28 · Public Procurement Monitoring Office&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://ppmo.gov.np/content/13339/public-procurement--fifteenth-amendment--rules--2083/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Public Procurement (Fifteenth Amendment) Rules, 2083&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;시행규칙&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;대조 조문 Amending Rules rr.1-2; replacement PPR r.120A&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-28 · Public Procurement Monitoring Office&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card span2&quot;&gt;&lt;h3&gt;주의&lt;/h3&gt;&lt;p class=&quot;note&quot;&gt;2026-04-30 제2차 개정 조례는 즉시 발효됐고, 이를 대체한 제2차 개정법은 연방의회 기록상 2026-07-09(2083-03-25) 인증됐다. 현행 대조는 개정법의 조문을 기준으로 한다.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;PPR 제15차 개정은 2026-07-14 즉시 발효했으며 r.120A의 공사기간 연장 특별절차를 교체했다. 기준금액·보증·불복의 기존 조문은 제14차 개정 반영본과 함께 읽었다.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;PPA는 §14의 공고기간을 국내 30일에서 21일, 국제 45일에서 30일, 봉인견적 15일에서 7일로 단축하고 전자공고 시 별도 매체 공고를 면제했다.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;p style=&quot;margin:22px 0 0;font-size:12.5px;color:var(--muted)&quot;&gt;
    조문 대조 완료 — 조문의 존재와 문언 일치만 뜻합니다. 법적 해석·적용 타당성·개정 반영 여부는 별도 검토 대상입니다.
  &lt;/p&gt;
&lt;/section&gt;

&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;한 장 캔버스&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;공공조달 정책·표준을 중앙에서 통일하고 법 이행을 모니터링하되, 감독기관이 개별 조달의 집행과 분쟁 판단에서 분리되도록 하여 발주기관의 자율성과 입찰자의 구제 통로를 동시에 확보한다.&lt;/p&gt;
  &lt;div class=&quot;cards&quot;&gt;
    &lt;div class=&quot;card span2&quot;&gt;&lt;h3&gt;절차&lt;/h3&gt;&lt;ol class=&quot;steps&quot;&gt;&lt;li&gt;PPMO가 조달정책·법령 개선안을 네팔 정부에 권고 (§65(1)(a))&lt;/li&gt;&lt;li&gt;법 시행에 필요한 기술지침·매뉴얼 발간 (§65(1)(b))&lt;/li&gt;&lt;li&gt;표준입찰서류·사전자격서류·계약서·제안요청서 표준양식 제정 (§65(1)(c))&lt;/li&gt;&lt;li&gt;조달 웹사이트(e-GP) 설치·운영 및 법령·매뉴얼 상시 게시 (§65(1)(f), §70)&lt;/li&gt;&lt;li&gt;발주기관이 e-GP를 통해 공고·입찰서 접수·계약·대금지급 수행 (§69(1))&lt;/li&gt;&lt;li&gt;PPMO가 조달통계 수집 및 법령 준수 여부 기술감사 (§65(1)(d))&lt;/li&gt;&lt;li&gt;입찰자 이의신청 → 발주기관장이 절차 중지 후 5일 내 서면 결정 (§47(6))&lt;/li&gt;&lt;li&gt;불복 시 검토위원회 재심 → 통지 시 조달절차 중지 (§49, §51)&lt;/li&gt;&lt;li&gt;발주기관 요청에 따라 PPMO가 블랙리스트 심사·결정 (§63, r.141)&lt;/li&gt;&lt;li&gt;PPMO가 조달절차 연차보고서를 네팔 정부에 제출 (§65(1)(m))&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;적용 대상&lt;/h3&gt;&lt;p style=&quot;margin:0;font-size:13.5px;line-height:1.7&quot;&gt;네팔의 모든 공공기관(Public Entity) 조달에 적용된다. 다만 이의신청은 조달계약 발효 이전 절차에 한정되며(§47(2)), 규정 금액 미만 조달은 발주기관장 결정에 대해 검토위원회 재심을 신청할 수 없다(§47(8)).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;법적 근거&lt;/h3&gt;&lt;div class=&quot;law&quot;&gt;&lt;span class=&quot;nm&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://ntnc.org.np/sites/default/files/doc_page/Public%20Procurement%20Act%202007.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Public Procurement Act, 2063 (2007)&lt;/a&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;§47, §48, §49, §50, §51, §63, §64, §65, §69, §70&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:auto&quot;&gt;법률&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;law&quot;&gt;&lt;span class=&quot;nm&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://ntnc.org.np/sites/default/files/doc_page/Public%20Procurement%20Rules%202007.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Public Procurement Rules, 2064 (2007)&lt;/a&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;r.140, r.141, r.142, r.143&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:auto&quot;&gt;시행규칙&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;law&quot;&gt;&lt;span class=&quot;nm&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.bolpatra.gov.np/egp/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;e-GP(bolpatra) 전자조달 포털&lt;/a&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:auto&quot;&gt;지침·정책&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;권한 기관&lt;/h3&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;&lt;a class=&quot;ref&quot; href=&quot;https://ppmo.gov.np/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;공공조달모니터링국(PPMO)&lt;/a&gt;&lt;/b&gt;&lt;span&gt;조달정책·법령 개선 권고, 기술지침·매뉴얼 발간, 표준입찰서류 제정, 조달통계 수집 및 기술감사, 조달 웹사이트 설치·운영, 블랙리스트 결정 및 해제기준 수립, 연차보고서 제출, 검토위원회 사무국&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;&lt;a class=&quot;ref&quot; href=&quot;https://opmcm.gov.np/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;총리실(OPMCM)&lt;/a&gt;&lt;/b&gt;&lt;span&gt;PPMO 소속 상급기관&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;검토위원회(Review Committee)&lt;/b&gt;&lt;span&gt;발주기관장 결정에 대한 재심. 항소법원 판사 출신 또는 특별직 퇴직자가 위원장, 공학직 1급 퇴직자 및 조달 전문가가 위원. 임기 3년, 1회 연임 가능&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;발주 공공기관장&lt;/b&gt;&lt;span&gt;1차 이의신청 심사. 오류 확인 시 조달절차 중지 후 5일 내 서면 결정&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;재무총감사실(FCGO)&lt;/b&gt;&lt;span&gt;PPMO 설립 전 최대 6개월간 그 기능을 대행하도록 규정된 경과 기관&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;이해관계자&lt;/h3&gt;&lt;p style=&quot;margin:0;font-size:13.5px;line-height:1.7&quot;&gt;공공조달모니터링국(PPMO), 총리실(Office of the Prime Minister and Council of Ministers), 연방·주·지방 발주 공공기관, 검토위원회, 입찰자, 재무총감사실(FCGO)&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;제출서류&lt;/h3&gt;&lt;div class=&quot;docset&quot;&gt;&lt;b&gt;입찰자&lt;/b&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;이의신청서(application for review) — 발주기관의 작위·부작위와 위반된 법령 조항을 명시 (§47(4))&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;검토위원회 재심신청서(application to the Review Committee, §49)&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;블랙리스트 절차 시 해명서 및 소명자료 (r.141(5))&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;docset&quot;&gt;&lt;b&gt;발주 공공기관&lt;/b&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;이의신청 서면 결정문 및 향후 절차 안내 (§47(6)(7))&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;블랙리스트 요청서 — 사유·근거·관련서류 첨부 (r.141(1))&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;docset&quot;&gt;&lt;b&gt;PPMO&lt;/b&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;표준입찰서류(standard bidding documents)&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;기술지침·매뉴얼(technical guidelines and manuals, §65(1)(b))&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;블랙리스트 결정 통지 및 공고 (r.141(3))&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;조달 연차보고서(annual report, §65(1)(m))&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;유의사항 · 병목&lt;/h3&gt;&lt;ul class=&quot;plain&quot;&gt;&lt;li&gt;이의신청 기한이 사유 인지일로부터 7일로 매우 짧고, 기한을 넘긴 신청은 아예 처리되지 않는다 (§47(3)(5))&lt;/li&gt;&lt;li&gt;이의신청은 계약 발효 전 절차에만 가능해 계약 체결 후에는 이 경로로 다툴 수 없다 (§47(2))&lt;/li&gt;&lt;li&gt;규정 금액 미만 조달은 검토위원회 재심 통로가 차단된다 (§47(8))&lt;/li&gt;&lt;li&gt;PPMO는 타 공공기관의 조달절차에 관여하거나 분쟁을 해결할 수 없다 — 개별 입찰 민원을 PPMO에 제기해도 처리 권한이 없다 (§65(2))&lt;/li&gt;&lt;li&gt;블랙리스트는 즉시 참가배제(r.141(2)(3))가 가능해, 소명 30일(r.141(4))이 진행되는 동안 이미 입찰 참여가 막힐 수 있다&lt;/li&gt;&lt;li&gt;전자조달 전환은 네팔관보 고시로 정한 범위에서 이뤄지므로 기관·품목별로 적용 시점이 다를 수 있다 (§69(1))&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;진입장벽&lt;/h3&gt;&lt;ul class=&quot;plain&quot;&gt;&lt;li&gt;e-GP(bolpatra) 포털이 네팔어·영어 혼용이라 공고 검색과 마감일 파악에 현지 지원이 필요&lt;/li&gt;&lt;li&gt;발주 공공기관이 연방·주·지방으로 분산돼 공고 채널을 단일 창구로 파악하기 어려움&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;현장 검증 필요&lt;/h3&gt;&lt;ul class=&quot;plain&quot;&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;관련 제도&lt;/h3&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;네팔 공공조달 입찰제도&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;네팔 ODA 사업 발굴·형성 절차&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;법령 원문&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;현장에서 발주처에 그대로 제시할 수 있는 조문 원문입니다. 우리 요약이 아니라 verbatim이며,
    조문 번호를 누르면 원문 문서로 이동합니다. 한국어 요지 아래로 직역(참고용)을 펼칠 수 있습니다.&lt;/p&gt;
  &lt;div class=&quot;quotes&quot;&gt;&lt;div class=&quot;qc&quot;&gt;
  &lt;div class=&quot;qhd&quot;&gt;
    &lt;span class=&quot;qart&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://ntnc.org.np/sites/default/files/doc_page/Public%20Procurement%20Act%202007.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;§64(1)&lt;/a&gt;&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;Public Procurement Act, 2063 (2007)&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;qtext&quot;&gt;A Public Procurement Monitoring Office under the Office of the Prime Minister and Council of Ministers shall be established in order to monitor procurement activities.&lt;/div&gt;
  &lt;p class=&quot;qgist&quot;&gt;PPMO는 총리·각료회의 사무처 산하의 조달 감독기관이다.&lt;/p&gt;
  &lt;details&gt;&lt;summary&gt;한국어 직역(참고 — 공식 번역 아님)&lt;/summary&gt;&lt;p class=&quot;qko&quot;&gt;조달 활동을 감독하기 위해 총리 및 각료회의 사무처 산하에 공공조달모니터링국(PPMO)을 둔다.&lt;/p&gt;&lt;/details&gt;
&lt;/div&gt;&lt;div class=&quot;qc&quot;&gt;
  &lt;div class=&quot;qhd&quot;&gt;
    &lt;span class=&quot;qart&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://ntnc.org.np/sites/default/files/doc_page/Public%20Procurement%20Act%202007.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;§65(2)&lt;/a&gt;&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;Public Procurement Act, 2063 (2007)&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;qtext&quot;&gt;Notwithstanding anything contained in Sub-section (1), the Public Procurement Monitoring Office shall not involve in any manner in the procurement proceedings, except the procurement proceedings of its office, of other public entities nor shall resolve any dispute arisen in respect thereof.&lt;/div&gt;
  &lt;p class=&quot;qgist&quot;&gt;PPMO는 자기 사무소 조달을 제외하고 다른 기관의 개별 조달절차에 관여하거나 분쟁을 해결할 수 없다.&lt;/p&gt;
  &lt;details&gt;&lt;summary&gt;한국어 직역(참고 — 공식 번역 아님)&lt;/summary&gt;&lt;p class=&quot;qko&quot;&gt;제1항에도 불구하고 PPMO는 자기 사무소의 조달을 제외하고는 다른 공공기관의 조달절차에 어떤 방식으로도 관여할 수 없으며, 그에 관한 분쟁을 해결할 수도 없다.&lt;/p&gt;&lt;/details&gt;
&lt;/div&gt;&lt;div class=&quot;qc&quot;&gt;
  &lt;div class=&quot;qhd&quot;&gt;
    &lt;span class=&quot;qart&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://ntnc.org.np/sites/default/files/doc_page/Public%20Procurement%20Act%202007.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;§47(3)&lt;/a&gt;&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;Public Procurement Act, 2063 (2007)&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;qtext&quot;&gt;The application under Sub-section (1) shall have to be filed within the period specified, if any, in this Act for making application and, if not so specified, within seven days from the date of the bidder or proponent having become aware of that the Public Entity has made an error or has dishonored the duty relating to the procurement proceedings.&lt;/div&gt;
  &lt;p class=&quot;qgist&quot;&gt;이의신청은 오류·의무위반을 안 날로부터 7일 내에 발주기관장에게 해야 한다.&lt;/p&gt;
  &lt;details&gt;&lt;summary&gt;한국어 직역(참고 — 공식 번역 아님)&lt;/summary&gt;&lt;p class=&quot;qko&quot;&gt;이의신청은 이 법에 정한 기한이 있으면 그 기한 내, 없으면 입찰자가 발주기관의 오류·의무해태를 안 날부터 7일 이내에 제기해야 한다.&lt;/p&gt;&lt;/details&gt;
&lt;/div&gt;&lt;div class=&quot;qc&quot;&gt;
  &lt;div class=&quot;qhd&quot;&gt;
    &lt;span class=&quot;qart&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://ntnc.org.np/sites/default/files/doc_page/Public%20Procurement%20Act%202007.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;§63(1)&lt;/a&gt;&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;Public Procurement Act, 2063 (2007)&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;qtext&quot;&gt;The Public Procurement Monitoring Office may blacklist a bidder, proponent, consultant, service provider, supplier, construction entrepreneur or other person, firm, organization or company in the following grounds from one year to three years on the basis of seriousness of his/her act.&lt;/div&gt;
  &lt;p class=&quot;qgist&quot;&gt;블랙리스트는 PPMO가 행위의 중대성에 따라 1~3년으로 결정한다.&lt;/p&gt;
  &lt;details&gt;&lt;summary&gt;한국어 직역(참고 — 공식 번역 아님)&lt;/summary&gt;&lt;p class=&quot;qko&quot;&gt;PPMO는 다음 사유가 있는 입찰자 등을 그 행위의 중대성에 따라 1년에서 3년까지 블랙리스트에 올릴 수 있다.&lt;/p&gt;&lt;/details&gt;
&lt;/div&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;현행 기준 반영 2건&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;공식 법령·기관 원문으로 확인한 현행 기준과 실무 확인사항입니다.
    출처는 각 항목에 연결했으며.&lt;/p&gt;
  &lt;div class=&quot;disc&quot; data-sev=&quot;medium&quot;&gt;
  &lt;div class=&quot;top&quot;&gt;
    &lt;span class=&quot;badge warn&quot;&gt;추가 확인&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;네팔&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;D01&lt;/span&gt;
  &lt;/div&gt;
  &lt;h3&gt;canvas.authorities / 입찰공고 주체&lt;/h3&gt;
  &lt;div class=&quot;quote act&quot;&gt;&lt;b&gt;현행 기준&lt;/b&gt;PPMO의 법정 권한은 조달 웹사이트의 &amp;#x27;설치·운영&amp;#x27;(§65(1)(f))이며, §65(2)는 &amp;#x27;PPMO는 자기 사무소의 조달을 제외하고 다른 공공기관의 조달절차에 어떤 방식으로도 관여해서는 안 되며 그에 관해 발생한 분쟁을 해결해서도 안 된다&amp;#x27;고 명시한다. 개별 입찰의 공고 주체는 각 발주 공공기관이다.&lt;/div&gt;
  &lt;p class=&quot;cite&quot;&gt;확인 출처 · &lt;a class=&quot;ref&quot; href=&quot;https://ntnc.org.np/sites/default/files/doc_page/Public%20Procurement%20Act%202007.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Public Procurement Act, 2063 (2007)&lt;/a&gt; §65(1)(f), §65(2)&lt;/p&gt;
  &lt;div class=&quot;todo&quot;&gt;&lt;b&gt;실무 확인&lt;/b&gt;입찰 공고는 e-GP 포털에서 찾되 계약 상대와 문의처는 개별 발주기관이다. 입찰 관련 이의는 PPMO가 아니라 발주기관장에게 7일 내 제기하고, 불복 시 검토위원회로 간다. PPMO에 제기하면 처리 권한이 없어 기한만 소진된다.&lt;/div&gt;
  &lt;details class=&quot;review&quot;&gt;
  &lt;summary&gt;Field verification (English)&lt;/summary&gt;
  &lt;div class=&quot;rv&quot;&gt;
    &lt;p&gt;&lt;b&gt;Current legal basis&lt;/b&gt; — PPA 2063 (2007) §65(1)(f) gives PPMO the power to set up and operate the procurement website; §65(2) bars PPMO from involving in any manner in other entities&amp;#x27; procurement proceedings or resolving disputes. Individual tenders are published and contracted by each procuring entity.&lt;/p&gt;
    &lt;p class=&quot;rv-verify&quot;&gt;&lt;b&gt;✔ Verify&lt;/b&gt; — Confirm each tender&amp;#x27;s issuing and contracting body is the individual procuring entity, not PPMO. Complaints go to the head of the procuring entity (§47), then the Review Committee (§49).&lt;/p&gt;
  &lt;/div&gt;
&lt;/details&gt;

  &lt;p class=&quot;act-row&quot;&gt;산출물 반영 — &amp;#x27;PPMO는 포털 운영·표준 관장, 공고와 계약의 주체는 개별 발주기관&amp;#x27;으로 역할을 분리 기재했다. 이의는 발주기관장(§47) → 검토위원회(§49) 경로로 제기해야 한다.&lt;/p&gt;
&lt;/div&gt;&lt;div class=&quot;disc&quot; data-sev=&quot;low&quot;&gt;
  &lt;div class=&quot;top&quot;&gt;
    &lt;span class=&quot;badge muted&quot;&gt;참고&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;네팔&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;D02&lt;/span&gt;
  &lt;/div&gt;
  &lt;h3&gt;canvas.authorities[PPMO].role&lt;/h3&gt;
  &lt;div class=&quot;quote act&quot;&gt;&lt;b&gt;현행 기준&lt;/b&gt;§65(1)은 (a)~(n) 14개 호로 권한을 규정한다. 실무 영향이 큰 권한은 블랙리스트 해제기준 수립 및 해제 결정((j)), 검토위원회 사무국 수행(§65(3)), 입찰자·조달담당자 정기 교육((i)), 조달 연차보고서 제출((m))이다.&lt;/div&gt;
  &lt;p class=&quot;cite&quot;&gt;확인 출처 · &lt;a class=&quot;ref&quot; href=&quot;https://ntnc.org.np/sites/default/files/doc_page/Public%20Procurement%20Act%202007.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Public Procurement Act, 2063 (2007)&lt;/a&gt; §65(1)(a)~(n), §65(3)&lt;/p&gt;
  &lt;div class=&quot;todo&quot;&gt;&lt;b&gt;실무 확인&lt;/b&gt;블랙리스트에 등재됐다면 해제 창구는 PPMO다. PPMO가 정한 해제기준에 따라 신청한다. 검토위원회 재심의 사무국도 PPMO가 맡으므로 접수 경로를 여기서 확인한다.&lt;/div&gt;


  &lt;p class=&quot;act-row&quot;&gt;산출물 반영 — authorities의 PPMO 역할에 14개 호를 요약 반영하고, 블랙리스트 해제기준 수립·검토위원회 사무국 기능을 명시했다.&lt;/p&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;검증&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;PPMO 공식 사이트(ppmo.gov.np)에서 기관 소속·기능·e-GP 포털 주소를 확인하고, PPA 2007 영문 원문에서 §47·§48·§63·§64·§65·§69·§70을 조문 단위로 대조. PPR 2007에서 r.140~r.143을 확인.&lt;/p&gt;
  &lt;div class=&quot;cards&quot;&gt;
    &lt;div class=&quot;card span2&quot;&gt;&lt;h3&gt;검증 범위&lt;/h3&gt;
      &lt;p style=&quot;margin:0;font-size:13.5px;line-height:1.7&quot;&gt;제2차 개정법까지 반영한 PPMO·정부조달서비스국의 권한, e-GP 의무범위, 공고기한, 보증, 공공조달검토위원회 불복기한·금액 하한과 조달예외를 현행 조문으로 확인했다.&lt;/p&gt;
      &lt;p style=&quot;margin:12px 0 0;font-size:12.5px;color:var(--muted)&quot;&gt;확인일 2026-07-22 · 자료집 기준일 2026-02-23&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;대조에 쓴 원문&lt;/h3&gt;&lt;ul class=&quot;srcs&quot; style=&quot;padding-left:16px;margin:0&quot;&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://ntnc.org.np/sites/default/files/doc_page/Public%20Procurement%20Act%202007.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;The Public Procurement Act, 2063 (2007)&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;법률&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;대조 조문 §47(1)~(8), §48(1)~(7), §63, §64(1)(2)(3), §65(1)(a)~(n), §65(2)(3), §69(1)(2), §70&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-22 · Government of Nepal (영문본 사본: NTNC 공개 게시)&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://ntnc.org.np/sites/default/files/doc_page/Public%20Procurement%20Rules%202007.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;The Public Procurement Regulation, 2007&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;시행규칙&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;대조 조문 r.140, r.141(1)~(6), r.142, r.143&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-22 · Government of Nepal (영문본 사본: NTNC 공개 게시)&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://ppmo.gov.np/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PPMO 공식 사이트&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;지침·정책&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-22 · Public Procurement Monitoring Office&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.bolpatra.gov.np/egp/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;e-GP(bolpatra) 전자조달 포털&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;지침·정책&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-22 · PPMO&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://hr.parliament.gov.np/en/bills/TqsiRdta&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Public Procurement (Second Amendment) Act, 2083&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;법률&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;대조 조문 Amending Act §§1-31; PPA §§14, 41A, 47-50, 61A-62A, 65-67, 74&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-28 · Federal Parliament of Nepal&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://ppmo.gov.np/content/13300/public-procurement--second-amendment--ordinance--2083/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Public Procurement (Second Amendment) Ordinance, 2083 — official Gazette enactment text&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;명령·조례&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;대조 조문 Ordinance §§1-31; amended PPA §§47-50, 61A-62A, 65-67&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-28 · Public Procurement Monitoring Office&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://ppmo.gov.np/content/13339/public-procurement--fifteenth-amendment--rules--2083/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Public Procurement Rules, 2064, as amended through the Fifteenth Amendment Rules, 2083&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;시행규칙&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;대조 조문 PPR rr.53, 84-85, 101, 103-104, 110, 120A, 129, 140-143; Fifteenth Amendment rr.1-2&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-28 · Public Procurement Monitoring Office&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://pefa.gov.np/public/uploads/97716822-NP-Gandaki-Apr2025-PFMPR-SN-Public%20with%20PEFA%20Check.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Electronic Procurement System Operation Directive, 2023 and PEFA verification&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;지침·정책&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;대조 조문 Directive §5; PEFA 2025 §2.4.12 and procurement-method threshold table&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-28 · Government of Nepal, PEFA Secretariat&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://giwmscdntwo.gov.np/media/pdf_upload/Public%20Procurement%20Magazine%2C%202082_eqf38rn.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Public Procurement Magazine, 2082&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;지침·정책&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;대조 조문 Review procedure discussion citing PPA §§47-50 and PPR r.129; current NPR 20,000,000 review floor&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-28 · Public Procurement Monitoring Office&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card span2&quot;&gt;&lt;h3&gt;주의&lt;/h3&gt;&lt;p class=&quot;note&quot;&gt;PPA §64(1)은 PPMO를 &amp;#x27;총리실 및 각료회의 사무처(Office of the Prime Minister and Council of Ministers) 산하&amp;#x27;로 규정한다.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;제2차 개정법은 PPA §65의 PPMO 권한에 e-marketplace 운영과 EPC 기술지침 기능을 추가하고 §66A로 총리실 산하 정부조달서비스국을 신설했다.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;Electronic Procurement System Operation Directive 2023 §5에 따라 공공재원을 사용하는 모든 경쟁입찰·사전자격·제안 요청은 e-GP가 의무다. 봉인견적과 직접구매에도 e-GP를 사용할 수 있다.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;공공조달검토위원회 재심 하한은 현행 PPR r.129 기준 NPR 20,000,000이며, 과거 영문본 r.101의 NPR 30,000,000 표기는 후속 개정으로 대체됐다.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;p style=&quot;margin:22px 0 0;font-size:12.5px;color:var(--muted)&quot;&gt;
    조문 대조 완료 — 조문의 존재와 문언 일치만 뜻합니다. 법적 해석·적용 타당성·개정 반영 여부는 별도 검토 대상입니다.
  &lt;/p&gt;
&lt;/section&gt;
&lt;/div&gt;

;, &quot;target&quot;: &quot;P12&quot;, &quot;type&quot;: &quot;sequence&quot;, &quot;label&quot;: &quot;기간 경과·기준 충족&quot;}, {&quot;id&quot;: &quot;E13&quot;, &quot;source&quot;: &quot;P12&quot;, &quot;target&quot;: &quot;P04&quot;, &quot;type&quot;: &quot;loop&quot;, &quot;label&quot;: &quot;참가자격 회복&quot;}, {&quot;id&quot;: &quot;E14&quot;, &quot;source&quot;: &quot;P05&quot;, &quot;target&quot;: &quot;P13&quot;, &quot;type&quot;: &quot;sequence&quot;}];

var _sel=document.getElementById(&#x27;sel&#x27;);
if(_sel) _sel.addEventListener(&#x27;change&#x27;,function(){ location.href=&#x27;../&#x27;+this.value+&#x27;/index.html&#x27;; });

/* 엣지 그리기 — 노드 DOM 위치를 재서 SVG로 연결 */
function draw(){
  var board=document.getElementById(&#x27;board&#x27;),svg=document.getElementById(&#x27;edges&#x27;);
  if(!board||!svg)return;
  var bb=board.getBoundingClientRect();
  svg.setAttribute(&#x27;viewBox&#x27;,&#x27;0 0 &#x27;+board.scrollWidth+&#x27; &#x27;+board.scrollHeight);
  svg.setAttribute(&#x27;width&#x27;,board.scrollWidth); svg.setAttribute(&#x27;height&#x27;,board.scrollHeight);
  var cs=getComputedStyle(document.documentElement);
  var C={sequence:cs.getPropertyValue(&#x27;--muted&#x27;).trim(),
         message:cs.getPropertyValue(&#x27;--back&#x27;).trim(),
         loop:cs.getPropertyValue(&#x27;--warn&#x27;).trim()};
  var d=&#x27;&lt;defs&gt;&#x27;;
  [&#x27;sequence&#x27;,&#x27;message&#x27;,&#x27;loop&#x27;].forEach(function(t){
    d+=&#x27;&lt;marker id=&quot;m-&#x27;+t+&#x27;&quot; viewBox=&quot;0 0 8 8&quot; refX=&quot;7&quot; refY=&quot;4&quot; markerWidth=&quot;6&quot; markerHeight=&quot;6&quot; orient=&quot;auto&quot;&gt;&#x27;
      +&#x27;&lt;path d=&quot;M0 0 L8 4 L0 8 z&quot; fill=&quot;&#x27;+C[t]+&#x27;&quot;/&gt;&lt;/marker&gt;&#x27;;
  });
  d+=&#x27;&lt;/defs&gt;&#x27;;
  var GAP=5;
  function rel(rc){return {x:rc.left-bb.left+board.scrollLeft, y:rc.top-bb.top+board.scrollTop,
                            r:rc.right-bb.left+board.scrollLeft, b:rc.bottom-bb.top+board.scrollTop,
                            w:rc.width, h:rc.height};}
  function box(id){
    var el=board.querySelector(&#x27;.node[data-id=&quot;&#x27;+id+&#x27;&quot;]&#x27;);
    if(!el)return null; return rel(el.getBoundingClientRect());
  }

  /* 라우팅은 korea100studio의 거터 라우팅을 우리 그리드에 이식한 것이다.
     핵심: 카드를 지나야 하는 선은 카드가 없는 거터(행 하단·열 측면)로 우회한다.
     DOM에서 노드·행·열을 실측할 수 있어, 여러 직교 경로 후보를 만들고
     무관한 카드를 가장 적게 관통하는(동수면 가장 짧은) 것을 고른다. */

  // 장애물(모든 노드)과 거터(노드 없는 띠) 실측
  var OB=[];
  board.querySelectorAll(&#x27;.node&#x27;).forEach(function(el){ var r=box(el.dataset.id); r.id=el.dataset.id; OB.push(r); });
  var rowGut=[], colGut=[];
  board.querySelectorAll(&#x27;.brow:not(.head)&#x27;).forEach(function(el){ var r=rel(el.getBoundingClientRect());
    rowGut.push(r.y+9); rowGut.push(r.b-9); });
  var hc=board.querySelectorAll(&#x27;.brow.head .bcell&#x27;);
  for(var i=1;i&lt;hc.length;i++){ var r=rel(hc[i].getBoundingClientRect()); colGut.push(r.x+11); colGut.push(r.r-11); }

  function segHit(ax,ay,bx,by,e1,e2){
    var n=0, M=3;
    for(var i=0;i&lt;OB.length;i++){ var o=OB[i]; if(o.id===e1||o.id===e2) continue;
      var L=o.x+M,R=o.r-M,T=o.y+M,B=o.b-M;
      if(Math.abs(ay-by)&lt;0.5){ if(ay&gt;T&amp;&amp;ay&lt;B &amp;&amp; Math.max(ax,bx)&gt;L &amp;&amp; Math.min(ax,bx)&lt;R) n++; }
      else { if(ax&gt;L&amp;&amp;ax&lt;R &amp;&amp; Math.max(ay,by)&gt;T &amp;&amp; Math.min(ay,by)&lt;B) n++; }
    } return n;
  }
  function uniq(pts){ return pts.filter(function(p,i){ return i===0 || Math.abs(p.x-pts[i-1].x)&gt;0.5 || Math.abs(p.y-pts[i-1].y)&gt;0.5; }); }
  function score(pts,e1,e2){ pts=uniq(pts); var p=0,l=0;
    for(var i=0;i&lt;pts.length-1;i++){ p+=segHit(pts[i].x,pts[i].y,pts[i+1].x,pts[i+1].y,e1,e2);
      l+=Math.abs(pts[i].x-pts[i+1].x)+Math.abs(pts[i].y-pts[i+1].y); }
    return {pts:pts,p:p,l:l}; }

  function route(a,b,ed){
    var acx=a.x+a.w/2,acy=a.y+a.h/2,bcx=b.x+b.w/2,bcy=b.y+b.h/2, e1=ed.source,e2=ed.target, cs=[];
    // 세로 계열 — a의 위/아래 변에서 나가 b의 위/아래 변으로
    var below=bcy&gt;acy, sp={x:acx,y:below?a.b:a.y}, tp={x:bcx,y:below?b.y:b.b}, tg={x:tp.x,y:tp.y+(below?-GAP:GAP)};
    cs.push(score([sp,{x:sp.x,y:tg.y},tg,tp],e1,e2));                                   // 직선/L
    rowGut.forEach(function(my){ if(my&gt;Math.min(sp.y,tp.y)+6&amp;&amp;my&lt;Math.max(sp.y,tp.y)-6)   // 행 거터 크로스
      cs.push(score([sp,{x:sp.x,y:my},{x:tp.x,y:my},tg,tp],e1,e2)); });
    colGut.forEach(function(gx){                                                          // 열 측면 탈출
      var as={x:gx&gt;acx?a.r:a.x,y:acy};
      cs.push(score([as,{x:gx,y:acy},{x:gx,y:tg.y},tg,tp],e1,e2)); });
    // 가로 계열 — a의 좌/우 변에서 나가 b의 좌/우 변으로
    var right=bcx&gt;acx, sp2={x:right?a.r:a.x,y:acy}, tp2={x:right?b.x:b.r,y:bcy}, tg2={x:tp2.x+(right?-GAP:GAP),y:tp2.y};
    cs.push(score([sp2,{x:tg2.x,y:sp2.y},tg2,tp2],e1,e2));
    colGut.forEach(function(mx){ if(mx&gt;Math.min(sp2.x,tp2.x)+6&amp;&amp;mx&lt;Math.max(sp2.x,tp2.x)-6)
      cs.push(score([sp2,{x:mx,y:sp2.y},{x:mx,y:tp2.y},tg2,tp2],e1,e2)); });
    rowGut.forEach(function(gy){                                                          // 행 거터 우회
      var as={x:acx,y:gy&gt;acy?a.b:a.y};
      cs.push(score([as,{x:acx,y:gy},{x:tp2.x,y:gy},tg2,tp2],e1,e2)); });
    // 회귀선 — 아래로 크게 우회 (되돌아가는 흐름을 시각적으로 구분)
    if(ed.type===&#x27;loop&#x27;){ var gy=Math.max(a.b,b.b)+26;
      cs.push(score([{x:acx,y:a.b},{x:acx,y:gy},{x:bcx,y:gy},{x:bcx,y:b.b+GAP},{x:bcx,y:b.b}],e1,e2)); }
    cs=cs.filter(function(c){return c.pts.length&gt;=2;});
    cs.sort(function(x,y){ return x.p-y.p || x.l-y.l; });
    return cs[0];
  }

  function rnd(v){return Math.round(v*10)/10;}
  function orthPath(pts){                    // 직교 경로 + 모서리 라운딩
    pts=uniq(pts); if(pts.length&lt;2)return &#x27;&#x27;;
    var d=&#x27;M&#x27;+rnd(pts[0].x)+&#x27; &#x27;+rnd(pts[0].y);
    for(var i=1;i&lt;pts.length-1;i++){
      var p=pts[i-1],c=pts[i],n=pts[i+1];
      var d1=Math.hypot(c.x-p.x,c.y-p.y)||1, d2=Math.hypot(n.x-c.x,n.y-c.y)||1, r=Math.min(7,d1/2,d2/2);
      d+=&#x27; L&#x27;+rnd(c.x-(c.x-p.x)/d1*r)+&#x27; &#x27;+rnd(c.y-(c.y-p.y)/d1*r);
      d+=&#x27; Q&#x27;+rnd(c.x)+&#x27; &#x27;+rnd(c.y)+&#x27; &#x27;+rnd(c.x+(n.x-c.x)/d2*r)+&#x27; &#x27;+rnd(c.y+(n.y-c.y)/d2*r);
    }
    var e=pts[pts.length-1]; return d+&#x27; L&#x27;+rnd(e.x)+&#x27; &#x27;+rnd(e.y);
  }

  EDGES.forEach(function(ed){
    var a=box(ed.source),b=box(ed.target); if(!a||!b)return;
    var t=ed.type||&#x27;sequence&#x27;, rt=route(a,b,ed);
    d+=&#x27;&lt;path d=&quot;&#x27;+orthPath(rt.pts)+&#x27;&quot; fill=&quot;none&quot; stroke=&quot;&#x27;+C[t]+&#x27;&quot; stroke-width=&quot;1.5&quot; opacity=&quot;&#x27;
      +(t===&#x27;sequence&#x27;?&#x27;.55&#x27;:&#x27;.8&#x27;)+&#x27;&quot;&#x27;+(t!==&#x27;sequence&#x27;?&#x27; stroke-dasharray=&quot;4 3&quot;&#x27;:&#x27;&#x27;)
      +&#x27; marker-end=&quot;url(#m-&#x27;+t+&#x27;)&quot;/&gt;&#x27;;
  });
  svg.innerHTML=d;
}

var KIND={&quot;act&quot;: &quot;법률&quot;, &quot;regulation&quot;: &quot;시행규칙&quot;, &quot;ordinance&quot;: &quot;명령·조례&quot;, &quot;directive&quot;: &quot;지침·정책&quot;, &quot;standard-document&quot;: &quot;표준문서&quot;, &quot;treaty-agreement&quot;: &quot;양자합의&quot;, &quot;donor-rule&quot;: &quot;공여기관 규정&quot;, &quot;practice&quot;: &quot;현장 관행&quot;};
function openNode(id){
  var n=NODES[id]; if(!n)return;
  var h=&#x27;&lt;span class=&quot;badge plain muted&quot;&gt;&#x27;+n.id+&#x27;&lt;/span&gt; &#x27;
       +&#x27;&lt;span class=&quot;badge plain muted&quot;&gt;&#x27;+n.lane+&#x27;&lt;/span&gt; &#x27;
       +&#x27;&lt;span class=&quot;badge plain muted&quot;&gt;&#x27;+n.stage+&#x27;&lt;/span&gt;&#x27;;
  h+=&#x27;&lt;h3&gt;&#x27;+n.name+&#x27;&lt;/h3&gt;&#x27;;
  h+=&#x27;&lt;dl class=&quot;kv&quot;&gt;&#x27;;
  h+=&#x27;&lt;dt&gt;담당&lt;/dt&gt;&lt;dd&gt;&#x27;+n.actor+&#x27;&lt;/dd&gt;&#x27;;
  if(n.action) h+=&#x27;&lt;dt&gt;내용&lt;/dt&gt;&lt;dd&gt;&#x27;+n.action+&#x27;&lt;/dd&gt;&#x27;;
  if(n.deadline) h+=&#x27;&lt;dt&gt;기한&lt;/dt&gt;&lt;dd&gt;&#x27;+n.deadline+&#x27;&lt;/dd&gt;&#x27;;
  if(n.output_documents&amp;&amp;n.output_documents.length)
    h+=&#x27;&lt;dt&gt;산출 문서&lt;/dt&gt;&lt;dd&gt;&#x27;+n.output_documents.join(&#x27; · &#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  if(n.blocker) h+=&#x27;&lt;dt&gt;병목&lt;/dt&gt;&lt;dd style=&quot;color:var(--warn)&quot;&gt;&#x27;+n.blocker+&#x27;&lt;/dd&gt;&#x27;;
  if(n.legal_basis&amp;&amp;n.legal_basis.length){
    h+=&#x27;&lt;dt&gt;근거 조문&lt;/dt&gt;&lt;dd&gt;&#x27;+n.legal_basis.map(function(l){
      var nm=l.url?&#x27;&lt;a class=&quot;ref&quot; href=&quot;&#x27;+l.url+&#x27;&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;&#x27;+l.law+&#x27;&lt;/a&gt;&#x27;:l.law;
      return &#x27;&lt;div style=&quot;margin-bottom:4px&quot;&gt;&#x27;+nm+&#x27; &lt;code&gt;&#x27;+l.article+&#x27;&lt;/code&gt;&lt;/div&gt;&#x27;;}).join(&#x27;&#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  }
  if(typeof n.confidence===&#x27;number&#x27;){
    h+=&#x27;&lt;dt&gt;법령 근거 확신도&lt;/dt&gt;&lt;dd&gt;&#x27;+n.confidence.toFixed(2)
      +(n.confidence&lt;0.8?&#x27; &lt;span class=&quot;badge warn&quot;&gt;현장 검증 필요&lt;/span&gt;&#x27;:&#x27;&#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  }
  if(n.confidence_reason) h+=&#x27;&lt;dt&gt;확신도 산정 근거&lt;/dt&gt;&lt;dd&gt;&#x27;+n.confidence_reason+&#x27;&lt;/dd&gt;&#x27;;
  var ins=EDGES.filter(function(x){return x.target===id}),
      outs=EDGES.filter(function(x){return x.source===id});
  if(ins.length) h+=&#x27;&lt;dt&gt;선행&lt;/dt&gt;&lt;dd&gt;&#x27;+ins.map(function(x){
    return (NODES[x.source]?NODES[x.source].name:x.source)+(x.label?&#x27; (&#x27;+x.label+&#x27;)&#x27;:&#x27;&#x27;);}).join(&#x27; · &#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  if(outs.length) h+=&#x27;&lt;dt&gt;후속&lt;/dt&gt;&lt;dd&gt;&#x27;+outs.map(function(x){
    return (NODES[x.target]?NODES[x.target].name:x.target)+(x.label?&#x27; (&#x27;+x.label+&#x27;)&#x27;:&#x27;&#x27;);}).join(&#x27; · &#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  h+=&#x27;&lt;/dl&gt;&#x27;;
  document.getElementById(&#x27;dbody&#x27;).innerHTML=h;
  document.getElementById(&#x27;dlg&#x27;).showModal();
}

document.querySelectorAll(&#x27;.node&#x27;).forEach(function(b){
  b.addEventListener(&#x27;click&#x27;,function(){openNode(b.dataset.id)});
  b.addEventListener(&#x27;mouseenter&#x27;,function(){
    var id=b.dataset.id;
    var rel={};rel[id]=1;
    EDGES.forEach(function(x){if(x.source===id)rel[x.target]=1;if(x.target===id)rel[x.source]=1;});
    document.querySelectorAll(&#x27;.node&#x27;).forEach(function(o){o.classList.toggle(&#x27;dim&#x27;,!rel[o.dataset.id])});
  });
  b.addEventListener(&#x27;mouseleave&#x27;,function(){
    document.querySelectorAll(&#x27;.node&#x27;).forEach(function(o){o.classList.remove(&#x27;dim&#x27;)});
  });
});
document.getElementById(&#x27;dlg&#x27;).addEventListener(&#x27;click&#x27;,function(ev){
  if(ev.target===this) this.close();
});

addEventListener(&#x27;load&#x27;,draw); addEventListener(&#x27;resize&#x27;,draw);
new MutationObserver(draw).observe(document.documentElement,{attributes:true,attributeFilter:[&#x27;data-theme&#x27;]});
&lt;/script&gt;

html,body{overflow-x:hidden}
:root{
  --bg:#fff; --fg:#16181d; --muted:#6b7280; --line:#e5e7eb; --soft:#f7f8fa;
  --key:#157f3d; --key-bg:#eaf5ee; --warn:#b45309; --warn-bg:#fdf5e7;
  --back:#1d4ed8; --back-bg:#eef2ff; --bad:#b91c1c; --bad-bg:#fdeced;
  --info:#0369a1; --info-bg:#e8f4fb;
  --font:-apple-system,BlinkMacSystemFont,&quot;Apple SD Gothic Neo&quot;,&quot;Pretendard&quot;,&quot;Noto Sans KR&quot;,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1115; --fg:#e8eaed; --muted:#9aa3af; --line:#272c36; --soft:#161a21;
    --key:#4ade80; --key-bg:#12261a; --warn:#fbbf24; --warn-bg:#2a2113;
    --back:#93b4fd; --back-bg:#161d33; --bad:#fca5a5; --bad-bg:#2b1618;
    --info:#7dd3fc; --info-bg:#10222e;
  }
}
:root[data-theme=&quot;dark&quot;]{
  --bg:#0f1115; --fg:#e8eaed; --muted:#9aa3af; --line:#272c36; --soft:#161a21;
  --key:#4ade80; --key-bg:#12261a; --warn:#fbbf24; --warn-bg:#2a2113;
  --back:#93b4fd; --back-bg:#161d33; --bad:#fca5a5; --bad-bg:#2b1618;
  --info:#7dd3fc; --info-bg:#10222e;
}
:root[data-theme=&quot;light&quot;]{
  --bg:#fff; --fg:#16181d; --muted:#6b7280; --line:#e5e7eb; --soft:#f7f8fa;
  --key:#157f3d; --key-bg:#eaf5ee; --warn:#b45309; --warn-bg:#fdf5e7;
  --back:#1d4ed8; --back-bg:#eef2ff; --bad:#b91c1c; --bad-bg:#fdeced;
  --info:#0369a1; --info-bg:#e8f4fb;
}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);
  font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:inherit}
/* 원문·공식 사이트로 나가는 링크. 화살표로 외부 이동임을 알린다. */
a.ref{color:var(--info);text-decoration:none;border-bottom:1px solid transparent}
a.ref:hover{border-bottom-color:currentColor}
a.ref::after{content:&quot;↗&quot;;font-size:.78em;margin-left:2px;opacity:.65;vertical-align:1px}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}

header.site{border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:50}
header.site .wrap{display:flex;align-items:center;gap:14px;height:58px}
.brand{font-weight:800;letter-spacing:-.02em;text-decoration:none;font-size:16px}
.brand-sub{color:var(--muted);font-size:12.5px}
header.site nav{margin-left:auto;display:flex;align-items:center;gap:18px;font-size:13.5px}
header.site nav a{color:var(--muted);text-decoration:none}
header.site nav a:hover,header.site nav a[aria-current]{color:var(--fg)}
.asof{color:var(--muted);font-size:12px}

.hero{padding:44px 0 30px}
.eyebrow{display:flex;align-items:center;gap:10px;color:var(--key);font-weight:700;font-size:12.5px;letter-spacing:.02em}
.eyebrow::before{content:&quot;&quot;;width:26px;height:2px;background:var(--key)}
h1{font-size:clamp(28px,4.2vw,44px);letter-spacing:-.035em;margin:14px 0 12px;font-weight:800}
.lede{font-size:clamp(15px,1.7vw,18px);color:var(--fg);max-width:70ch;margin:0;font-weight:600;letter-spacing:-.01em}
.lede + .lede{margin-top:4px}
.meta{color:var(--muted);font-size:13px;margin-top:14px}

.statbar{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--soft)}
.statbar .wrap{display:flex;gap:16px;align-items:center;padding-block:16px;flex-wrap:wrap}
.stats{display:flex;gap:26px;margin-left:auto;flex-wrap:wrap}
.stat b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.stat span{font-size:11.5px;color:var(--muted)}
.stat.ok b{color:var(--key)} .stat.bad b{color:var(--bad)}
.search{flex:1;min-width:260px;display:flex;align-items:center;gap:10px;background:var(--bg);
  border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.search label{font-size:12px;color:var(--muted);white-space:nowrap;padding-right:10px;border-right:1px solid var(--line)}
.search input{flex:1;border:0;background:transparent;color:inherit;font:inherit;outline:none}
.search .count{font-size:12px;color:var(--muted);white-space:nowrap}

.cols{display:grid;grid-template-columns:220px 1fr;gap:28px;padding:26px 0 60px;align-items:start}
@media (max-width:820px){.cols{grid-template-columns:1fr}}
.side h3{font-size:12px;color:var(--muted);margin:0 0 10px;font-weight:700;letter-spacing:.02em}
.side button{display:flex;width:100%;align-items:center;gap:9px;background:none;border:0;color:inherit;
  font:inherit;padding:7px 10px;border-radius:7px;cursor:pointer;text-align:left}
.side button:hover{background:var(--soft)}
.side button[aria-pressed=&quot;true&quot;]{background:var(--key-bg);font-weight:700}
.side .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.side .n{margin-left:auto;color:var(--muted);font-size:12.5px}
.side .grp{margin-bottom:22px}

.panel{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel-hd{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700;font-size:14px}
.panel-hd span{color:var(--muted);font-weight:500}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line)}
td{padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--soft)}
td.no{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;width:44px}
td.name a{font-weight:700;text-decoration:none;letter-spacing:-.01em}
td.name a:hover{text-decoration:underline}
td.name p{margin:3px 0 0;color:var(--muted);font-size:12.5px;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{padding:40px 16px;text-align:center;color:var(--muted);font-size:14px}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;
  padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.badge::before{content:&quot;&quot;;width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.plain::before{display:none}
.badge.ok{background:var(--key-bg);color:var(--key)}
.badge.info{background:var(--info-bg);color:var(--info)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.bad{background:var(--bad-bg);color:var(--bad)}
.badge.muted{background:var(--soft);color:var(--muted)}

.subnav{border-bottom:1px solid var(--line);background:var(--soft)}
.subnav .wrap{display:flex;align-items:center;gap:12px;padding-block:12px;flex-wrap:wrap}
.subnav label{font-size:12px;color:var(--muted)}
select,.btn{font:inherit;font-size:13.5px;color:inherit;background:var(--bg);
  border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
.btn:hover{background:var(--soft)}
.btn[disabled]{opacity:.4;cursor:default}
.pos{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}

.dtl-hd{padding:26px 0 20px}
.dtl-hd .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dtl-hd h1{font-size:clamp(24px,3.4vw,36px);margin:12px 0 8px}
.dtl-hd .one{color:var(--muted);font-size:15.5px;max-width:78ch;margin:0}
.tiles{display:flex;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;
  margin-top:22px;width:fit-content;max-width:100%;flex-wrap:wrap}
.tile{padding:14px 22px;border-right:1px solid var(--line);min-width:104px}
.tile:last-child{border-right:0}
.tile b{display:block;font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.25}
.tile span{font-size:11.5px;color:var(--muted)}
.tile.ok b{color:var(--key)} .tile.warn b{color:var(--warn)} .tile.bad b{color:var(--bad)}

section.blk{padding:34px 0;border-top:1px solid var(--line)}
section.blk &gt; h2{font-size:21px;letter-spacing:-.02em;margin:0 0 6px;font-weight:800}
section.blk &gt; .desc{color:var(--muted);font-size:13.5px;margin:0 0 20px}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.hd-row{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.hd-row .legend{margin-left:auto}

.boardwrap{position:relative;border:1px solid var(--line);border-radius:12px;overflow:auto}
.board{position:relative;min-width:940px}
.board svg.edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.brow{display:grid;border-bottom:1px solid var(--line)}
.brow:last-child{border-bottom:0}
.brow.head{background:var(--soft);position:sticky;top:0;z-index:3}
/* gap은 같은 셀에 세로로 쌓인 노드 사이로 화살표가 지나갈 통로다. 좁히면 화살촉이 뭉갠다. */
.bcell{padding:14px 12px;border-right:1px solid var(--line);min-height:64px;
  display:flex;flex-direction:column;gap:26px;justify-content:center}
.bcell:last-child{border-right:0}
.brow.head .bcell{min-height:0;padding:11px 12px;justify-content:flex-start}
.stage-k{font-weight:800;font-size:12px;color:var(--key);letter-spacing:.02em}
.stage-t{font-size:13px;font-weight:700}
.lane-t{font-size:13px;font-weight:700;color:var(--muted)}
.node{position:relative;z-index:2;background:var(--bg);border:1px solid var(--line);
  border-radius:9px;padding:10px 12px;cursor:pointer;text-align:left;font:inherit;color:inherit;
  width:100%;display:block;transition:box-shadow .12s,border-color .12s}
.node:hover{border-color:var(--muted);box-shadow:0 2px 10px rgba(0,0,0,.07)}
.node .id{font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.04em;
  display:flex;justify-content:space-between;align-items:center;gap:8px}
.node .nm{font-size:13px;font-weight:700;margin-top:3px;letter-spacing:-.01em;line-height:1.4}
.node .tag{font-size:10px;font-weight:700;padding:1px 6px;border-radius:999px}
.node[data-tone=&quot;key&quot;]{border-color:var(--key);background:var(--key-bg)}
.node[data-tone=&quot;key&quot;] .tag{background:var(--key);color:var(--bg)}
.node[data-tone=&quot;warn&quot;]{border-color:var(--warn);background:var(--warn-bg)}
.node[data-tone=&quot;warn&quot;] .tag{background:var(--warn);color:var(--bg)}
.node[data-tone=&quot;back&quot;]{border-color:var(--back);background:var(--back-bg)}
.node[data-tone=&quot;back&quot;] .tag{background:var(--back);color:var(--bg)}
.node.dim{opacity:.34}

.drawer{position:fixed;inset:0;z-index:100;display:none;width:100vw;height:100vh;
  max-width:100vw;max-height:100vh;margin:0;padding:0;border:0;background:transparent;overflow:hidden}
.drawer[open]{display:block}
.drawer::backdrop{background:rgba(0,0,0,.34)}
.drawer .pane{position:absolute;right:0;top:0;bottom:0;width:min(440px,92vw);background:var(--bg);
  border-left:1px solid var(--line);padding:24px;overflow:auto}
.drawer h3{margin:10px 0 4px;font-size:19px;letter-spacing:-.02em}
.drawer .close{position:absolute;right:18px;top:18px;background:none;border:0;color:var(--muted);
  font-size:22px;cursor:pointer;line-height:1;padding:4px}
.kv{margin:18px 0 0;font-size:13.5px}
.kv dt{font-size:11.5px;color:var(--muted);font-weight:700;margin-top:14px}
.kv dd{margin:3px 0 0}
.kv code{font-size:12.5px;background:var(--soft);padding:1px 6px;border-radius:4px}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}
.card{border:1px solid var(--line);border-radius:11px;padding:17px 19px}
.card h3{margin:0 0 11px;font-size:13.5px;letter-spacing:.01em}
.card.span2{grid-column:span 2}
@media (max-width:820px){.card.span2{grid-column:span 1}}
ol.steps{margin:0;padding-left:20px;font-size:13.5px;line-height:1.75}
ol.steps li{margin-bottom:5px}
ul.plain{margin:0;padding-left:18px;font-size:13.5px;line-height:1.7}
ul.plain li{margin-bottom:6px}
.law{display:flex;gap:9px;align-items:baseline;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.law:last-child{border-bottom:0}
.law .nm{font-weight:600}
.law .ar{color:var(--muted);font-size:12.5px}
.docset{margin-bottom:13px}
.docset b{font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:12px;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:3px 8px}
.auth{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.auth:last-child{border-bottom:0}
.auth b{flex:none;max-width:42%;font-size:13px}
.auth span{color:var(--muted);font-size:12.5px}

.disc{border:1px solid var(--line);border-left-width:4px;border-radius:10px;padding:17px 19px;margin-bottom:15px}
.disc[data-sev=&quot;high&quot;]{border-left-color:var(--bad)}
.disc[data-sev=&quot;medium&quot;]{border-left-color:var(--warn)}
.disc[data-sev=&quot;low&quot;]{border-left-color:var(--muted)}
.disc .top{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:9px}
.disc .top .badge{white-space:normal;max-width:100%;overflow-wrap:anywhere}
.disc h3{margin:0;font-size:14.5px;letter-spacing:-.01em}
.disc .quote{font-size:13px;margin:9px 0;padding:10px 13px;border-radius:8px;background:var(--soft);line-height:1.65}
.disc .quote b{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;letter-spacing:.02em}
.disc .quote.src{border-left:2px solid var(--muted)}
.disc .quote.act{border-left:2px solid var(--key)}
.disc .cite{font-size:12px;color:var(--muted);margin:8px 0 0}
.disc .impact{font-size:13.5px;margin:11px 0 0;line-height:1.7}
.disc .act-row{font-size:13px;margin:11px 0 0;padding-top:11px;border-top:1px dashed var(--line);color:var(--muted)}
.review{margin:11px 0 0;border:1px solid var(--info);border-radius:8px;background:var(--info-bg)}
.review summary{cursor:pointer;padding:9px 13px;font-size:12px;font-weight:700;color:var(--info);list-style:none}
.review summary::-webkit-details-marker{display:none}
.review summary::before{content:&quot;▸ &quot;;font-size:10px}
.review[open] summary::before{content:&quot;▾ &quot;}
.review .rv{padding:2px 13px 13px}
.review .rv p{font-size:13px;line-height:1.65;margin:8px 0 0}
.review .rv-topic{font-weight:700;font-size:13.5px}
.review .rv-verify{padding:9px 11px;border-radius:6px;background:var(--bg);border:1px dashed var(--info)}
.fieldcheck{margin:11px 0 0;padding:11px 13px;border-radius:8px;background:var(--soft);border:1px solid var(--line)}
.fieldcheck .fc-hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.fieldcheck .fc-find{font-size:13px;line-height:1.7;margin:0}
.todo{margin:13px 0 0;padding:12px 14px;border-radius:9px;background:var(--key-bg);
  border:1px solid var(--key);font-size:13.5px;line-height:1.7}
.todo b{display:block;font-size:11px;color:var(--key);letter-spacing:.03em;margin-bottom:4px}
.up{margin:11px 0 0;padding:12px 14px;border-radius:9px;background:var(--soft);border:1px solid var(--line)}
.up .hd{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:7px}
.up .hd b{font-size:11px;color:var(--muted);letter-spacing:.03em}
.up .txt{font-size:13px;line-height:1.7;padding:9px 12px;border-radius:7px;background:var(--bg);
  border:1px dashed var(--line)}
.up .txt i{display:block;font-style:normal;font-size:10.5px;color:var(--muted);margin-bottom:3px}

.quotes{display:flex;flex-direction:column;gap:14px}
.qc{border:1px solid var(--line);border-left:3px solid var(--info);border-radius:9px;padding:15px 17px}
.qc .qhd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:9px}
.qc .qart{font-weight:700;font-size:13px}
.qc .qtext{font-family:ui-monospace,&quot;SF Mono&quot;,Menlo,monospace;font-size:12.5px;line-height:1.7;
  background:var(--soft);border-radius:7px;padding:11px 13px;white-space:pre-wrap;word-break:break-word}
.qc .qgist{font-size:13.5px;line-height:1.7;margin:10px 0 0}
.qc details{margin:8px 0 0}
.qc summary{font-size:12px;color:var(--muted);cursor:pointer;list-style:none}
.qc summary::-webkit-details-marker{display:none}
.qc summary::before{content:&quot;▸ &quot;;font-size:10px}
.qc details[open] summary::before{content:&quot;▾ &quot;}
.qc .qko{font-size:13px;line-height:1.7;color:var(--muted);margin:7px 0 0;padding-left:12px;border-left:1px solid var(--line)}
.srcs{font-size:13.5px}
.srcs li{margin-bottom:9px}
.srcs a{color:var(--info)}
.srcs .ar{display:block;color:var(--muted);font-size:12px;margin-top:1px}
.note{font-size:13.5px;line-height:1.7;color:var(--muted);margin:0 0 8px;padding-left:15px;position:relative}
.note::before{content:&quot;·&quot;;position:absolute;left:4px}

footer.site{border-top:1px solid var(--line);padding:28px 0 46px;color:var(--muted);font-size:12.5px;line-height:1.8}
footer.site a{color:var(--muted)}
&lt;/style&gt;

    var cur=document.documentElement.getAttribute(&#x27;data-theme&#x27;);
    if(!cur) cur=matchMedia(&#x27;(prefers-color-scheme:dark)&#x27;).matches?&#x27;dark&#x27;:&#x27;light&#x27;;

&lt;div class=&quot;wrap dtl-hd&quot;&gt;
  &lt;div class=&quot;row&quot;&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;NO 12&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;네팔 · Nepal&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;ODA 사업형성&lt;/span&gt;
    &lt;span class=&quot;badge ok&quot;&gt;조문 대조 완료&lt;/span&gt;

    &lt;div class=&quot;tile&quot;&gt;&lt;b&gt;4&lt;/b&gt;&lt;span&gt;행위 레인&lt;/span&gt;&lt;/div&gt;
