&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;한 장 캔버스&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;국가개발계획 우선순위에 따라 원조사업을 선정하고, 재무부를 단일 창구로 삼아 공여기관과의 접촉·협상·협정 체결을 일원화함으로써 수원국의 주인의식과 재원관리 책무성을 확보한다.&lt;/p&gt;
  &lt;div class=&quot;cards&quot;&gt;
    &lt;div class=&quot;card span2&quot;&gt;&lt;h3&gt;절차&lt;/h3&gt;&lt;ol class=&quot;steps&quot;&gt;&lt;li&gt;수원기관이 공여기관과 접촉하기 전 재무부의 사전 승인을 받는다 — 요청·제안·협상·정보제공·개념서 서신교환·MoU 체결 모두 포함 (FAMP §3.3.2(k))&lt;/li&gt;&lt;li&gt;공여기관도 원조 동원에 앞서 재무부 승인을 받는다 (FAMP §3.3.5(b))&lt;/li&gt;&lt;li&gt;수원기관이 사업 준비성 체크리스트에 따라 재무부에 사업제안서 제출 — KOICA 사업은 PCP를 N-2년 기준으로 작성 (FAMP §3.3.2(b))&lt;/li&gt;&lt;li&gt;수원기관 상급부처 및 재무부 검토&lt;/li&gt;&lt;li&gt;재무부 공한과 함께 PCP를 KOICA 네팔사무소에 제출&lt;/li&gt;&lt;li&gt;KOICA 본부 PCP 검토위원회 심사 → 통과 시 예비조사 실시&lt;/li&gt;&lt;li&gt;예비조사 결과로 사업제안서 최종 승인 시 기획조사 실시&lt;/li&gt;&lt;li&gt;기획조사 산출물인 PD(Project Document) 도출 후 PD 심사위원회 심사&lt;/li&gt;&lt;li&gt;위원회 통과 시 대한민국 재정당국에 예산요구&lt;/li&gt;&lt;li&gt;소관부처와 협의의사록(RoD) 체결&lt;/li&gt;&lt;li&gt;주네팔 대한민국대사관 ↔ 네팔 재무부 간 양해각서(MoU) 체결 — 재무부가 정부를 대표해 서명 (FAMP §3.3.1(d))&lt;/li&gt;&lt;li&gt;MoU에 근거해 PMC 파견인력 비자·노동허가 지원, 조세면제는 개별 협정과 현행법에 따름 (FAMP §3.6.1)&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;

    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;적용 대상&lt;/h3&gt;&lt;p style=&quot;margin:0;font-size:13.5px;line-height:1.7&quot;&gt;네팔 정부가 수원하는 대외원조 전반에 적용된다. 무상원조는 원칙적으로 세금 납부에 사용할 수 없고, 차관 재원 사업에는 조세면제 조항을 원칙적으로 넣지 않으며, 국내에서 충분히 생산되는 물품의 수입에는 면제를 부여하지 않는다(FAMP §3.6.1). 현물 지원은 소관부처 추천을 받아 재무부가 현행법에 따라 조세면제를 부여할 수 있다. 2019년 정책의 &amp;#x27;양허성 차관은 사업당 1천만 달러 초과만 수용&amp;#x27; 문턱은 2025년 정책에서 삭제됐다.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;법적 근거&lt;/h3&gt;&lt;div class=&quot;law&quot;&gt;&lt;div class=&quot;law-copy&quot;&gt;&lt;span class=&quot;nm&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://mof.gov.np/divisions/ierd/content/1564/foreign-aid-mobilization-policy--2025/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Foreign Aid Mobilization Policy, 2025&lt;/a&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;§3.2, §3.3.1, §3.3.2, §3.3.5, §3.6.1, §3.7&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;law-meta&quot;&gt;&lt;span class=&quot;badge plain muted&quot;&gt;지침·정책&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;law&quot;&gt;&lt;div class=&quot;law-copy&quot;&gt;&lt;span class=&quot;nm&quot;&gt;Public Debt Management Act, 2079 (2022)&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;law-meta&quot;&gt;&lt;span class=&quot;badge plain muted&quot;&gt;법률&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;law&quot;&gt;&lt;div class=&quot;law-copy&quot;&gt;&lt;span class=&quot;nm&quot;&gt;Financial Procedure and Fiscal Accountability Act, 2076 (2019)&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;law-meta&quot;&gt;&lt;span class=&quot;badge plain muted&quot;&gt;법률&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;law&quot;&gt;&lt;div class=&quot;law-copy&quot;&gt;&lt;span class=&quot;nm&quot;&gt;협의의사록(Record of Discussion, RoD)&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;law-meta&quot;&gt;&lt;span class=&quot;badge plain muted&quot;&gt;양자합의&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;law&quot;&gt;&lt;div class=&quot;law-copy&quot;&gt;&lt;span class=&quot;nm&quot;&gt;양해각서(Memorandum of Understanding, MoU) — 주네팔 대한민국대사관 ↔ 네팔 재무부&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;law-meta&quot;&gt;&lt;span class=&quot;badge plain muted&quot;&gt;양자합의&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;law&quot;&gt;&lt;div class=&quot;law-copy&quot;&gt;&lt;span class=&quot;nm&quot;&gt;KOICA 사업심사 가이드라인 및 PCP·PD 심사 일정&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;law-meta&quot;&gt;&lt;span class=&quot;badge plain muted&quot;&gt;공여기관 규정&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;


    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;권한 기관&lt;/h3&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;&lt;a class=&quot;ref&quot; href=&quot;https://mof.gov.np/divisions/ierd/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;재무부(MoF) 국제경제관계국&lt;/a&gt;&lt;/b&gt;&lt;span&gt;대외원조 동원의 단일 창구(focal point). 개발파트너와의 서신·요청·협상·재정협정 서명을 정부를 대표해 수행. 차관 협상 전 내각의 원칙적 동의와 협상 권한을 확보하고 현물 지원의 조세면제를 승인&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;수원기관 및 상급 소관부처&lt;/b&gt;&lt;span&gt;사업 발굴, 사업 준비성 체크리스트에 따른 제안서 제출, 협상 대표 지명, 사업책임자 임명, RoD 체결 당사자. 공여기관 접촉 전 재무부 사전 승인 필요&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;&lt;a class=&quot;ref&quot; href=&quot;https://npc.gov.np/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;국가계획위원회(NPC)&lt;/a&gt;&lt;/b&gt;&lt;span&gt;개발협력 조정기구의 위원으로 참여. 2019년 정책에 있던 &amp;#x27;사업 제안 시 NPC 동의&amp;#x27; 요건은 2025년 정책에서 삭제됨&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;&lt;a class=&quot;ref&quot; href=&quot;https://koica.go.kr/sites/nepal_kr/index.do&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;KOICA 네팔사무소&lt;/a&gt;&lt;/b&gt;&lt;span&gt;PCP 접수, 현지 협의, 사업 형성 지원&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.koica.go.kr/sites/koica_kr/index.do&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;KOICA 본부&lt;/a&gt;&lt;/b&gt;&lt;span&gt;PCP 검토위원회·PD 심사위원회 운영, 예비조사·기획조사 실시 결정&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;&lt;a class=&quot;ref&quot; href=&quot;https://np.mofa.go.kr/np-ko/index.do&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;주네팔 대한민국대사관&lt;/a&gt;&lt;/b&gt;&lt;span&gt;네팔 재무부와 MoU 체결 당사자&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;주·지방정부&lt;/b&gt;&lt;span&gt;관할 구역 사업 발굴 및 소관부처를 거쳐 재무부에 제안. 협상 대표 지명, 현물 지원은 재무부 승인 필요&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;이해관계자&lt;/h3&gt;&lt;p style=&quot;margin:0;font-size:13.5px;line-height:1.7&quot;&gt;네팔 재무부(MoF) 국제경제관계국, 수원기관 및 상급 소관부처, 주·지방정부, 국가계획위원회(NPC), KOICA 네팔사무소, KOICA 본부, 주네팔 대한민국대사관, 대한민국 재정당국, 사업수행 PMC&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;제출서류&lt;/h3&gt;&lt;div class=&quot;docset&quot;&gt;&lt;b&gt;수원기관·소관부처&lt;/b&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;재무부 사전 승인 (공여기관 접촉·제안·협상·서신·MoU 체결 전, FAMP §3.3.2(k))&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;사업 준비성 체크리스트에 따른 사업제안서 (FAMP §3.3.2(b))&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;사업제안서(Project Concept Paper, PCP) — KOICA 사업&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;협상 대표 지명서 (FAMP §3.3.2(c))&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;docset&quot;&gt;&lt;b&gt;네팔 재무부&lt;/b&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;PCP 송부 공한&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;재정협정(financing agreement) (FAMP §3.3.1(d))&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;차관 협상 전 내각 원칙동의·협상권한 (FAMP §3.3.1(e))&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;현물 지원 조세면제 승인 (FAMP §3.6.1(d))&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;docset&quot;&gt;&lt;b&gt;공여기관(개발파트너)&lt;/b&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;원조 동원 전 재무부 승인 (FAMP §3.3.5(b))&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;향후 3~5년 지원 규모·중점분야 통보 (FAMP §3.3.5(c))&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;대외원조정보시스템 보고 (FAMP §3.3.5(i))&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;docset&quot;&gt;&lt;b&gt;KOICA&lt;/b&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;PCP 검토위원회 결과&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;예비조사 보고서&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;기획조사 결과&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;사업기획문서(Project Document, PD)&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;PD 심사위원회 결과&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;docset&quot;&gt;&lt;b&gt;양국 정부&lt;/b&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;협의의사록(RoD)&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;양해각서(MoU)&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;유의사항 · 병목&lt;/h3&gt;&lt;ul class=&quot;plain&quot;&gt;&lt;li&gt;재무부 사전 승인 없이 수원기관과 먼저 접촉하면 정책 위반이 된다. 공여기관 역시 원조 동원에 앞서 재무부 승인을 받아야 한다 (FAMP §3.3.2(k), §3.3.5(b))&lt;/li&gt;&lt;li&gt;조세면제가 2019년 정책보다 좁아졌다. 무상원조는 원칙적으로 세금 납부에 쓸 수 없고, 국내에서 충분히 생산되는 물품 수입에는 면제가 없다 — 기자재 조달 시 원산지와 세부담을 사업비에 반영해야 한다 (FAMP §3.6.1(a)(c))&lt;/li&gt;&lt;li&gt;N-2년 PCP 제출 구조라 사업 착수까지 최소 2년 이상의 리드타임이 필요하다&lt;/li&gt;&lt;li&gt;PCP 검토위원회와 PD 심사위원회 두 개의 게이트를 모두 통과해야 예산요구로 넘어간다&lt;/li&gt;&lt;li&gt;연방제 시행·확산으로 사업 추진 책임과 권한이 지방으로 분산되면서 과도기적 비효율과 혼선이 발생. 재무부뿐 아니라 관련 중앙부처와 지방부처 모두와 협의해야 한다&lt;/li&gt;&lt;li&gt;기술협력 재원으로 차량·장비를 구매하거나 해외 연수·훈련에 참가하려면 재무부 사전 승인이 필요하다 (FAMP §3.3.2(j))&lt;/li&gt;&lt;li&gt;행정절차 지연, 환율 변동, 보수적인 비자 발급 운영&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;진입장벽&lt;/h3&gt;&lt;ul class=&quot;plain&quot;&gt;&lt;li&gt;기업 진출 시 현지 파트너 협력이 사실상 필수 요건&lt;/li&gt;&lt;li&gt;2022년 부패인식지수(CPI) 35점/100점, 180개국 중 108위&lt;/li&gt;&lt;li&gt;연방제 전환에 따른 협의 대상 다변화로 이해관계자 파악 부담 증가&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;관련 제도&lt;/h3&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;네팔 공공조달 입찰제도&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;네팔 조달 거버넌스·감독체계&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;네팔 도시계획·부지규제&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;네팔 건축허가·환경심사&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;네팔 기술검사·보험·준공제도&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;

  &lt;/div&gt;
&lt;/section&gt;





&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;법령 원문&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;현장에서 발주처에 그대로 제시할 수 있는 조문 원문입니다. 우리 요약이 아니라 verbatim이며,
    조문 번호를 누르면 원문 문서로 이동합니다. 한국어 요지 아래로 직역(참고용)을 펼칠 수 있습니다.&lt;/p&gt;
  &lt;div class=&quot;quotes&quot;&gt;&lt;div class=&quot;qc&quot;&gt;
  &lt;div class=&quot;qhd&quot;&gt;
    &lt;span class=&quot;qart&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://mof.gov.np/divisions/ierd/content/1564/foreign-aid-mobilization-policy--2025/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;§3.7.1&lt;/a&gt;&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;Foreign Aid Mobilization Policy, 2025&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;qtext&quot;&gt;International Development Cooperation Policy, 2076 (2019 AD) has been repealed.&lt;/div&gt;
  &lt;p class=&quot;qgist&quot;&gt;대외원조 동원 절차의 현행 근거는 Foreign Aid Mobilization Policy 2025이다.&lt;/p&gt;
  &lt;details&gt;&lt;summary&gt;한국어 직역(참고 — 공식 번역 아님)&lt;/summary&gt;&lt;p class=&quot;qko&quot;&gt;국제개발협력정책 2076(2019년)은 폐지됐다.&lt;/p&gt;&lt;/details&gt;
&lt;/div&gt;&lt;div class=&quot;qc&quot;&gt;
  &lt;div class=&quot;qhd&quot;&gt;
    &lt;span class=&quot;qart&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://mof.gov.np/divisions/ierd/content/1564/foreign-aid-mobilization-policy--2025/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;§3.3.2(k)&lt;/a&gt;&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;Foreign Aid Mobilization Policy, 2025&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;qtext&quot;&gt;All government agencies at any level, constitutional bodies, state owned enterprises, and institutions or foundations operating under full or partial government grants must obtain prior approval from the Ministry before seeking foreign aid, making formal requests, presenting proposals, engaging in negotiations, sharing any information, corresponding with development partners with concept papers and proposals, or signing memorandums of understanding or agreements.&lt;/div&gt;
  &lt;p class=&quot;qgist&quot;&gt;정부기관은 원조 제안·협상·정보제공·개념서 서신교환·MoU 체결에 앞서 재무부 사전 승인을 받아야 한다.&lt;/p&gt;
  &lt;details&gt;&lt;summary&gt;한국어 직역(참고 — 공식 번역 아님)&lt;/summary&gt;&lt;p class=&quot;qko&quot;&gt;모든 수준의 정부기관·헌법기관·공기업 및 정부 전액·일부 보조로 운영되는 기관·재단은, 대외원조를 구하거나 공식 요청·제안·협상·정보제공, 개발파트너와의 개념서·제안서 서신교환, MoU·협정 체결에 앞서 재무부의 사전 승인을 받아야 한다.&lt;/p&gt;&lt;/details&gt;
&lt;/div&gt;&lt;div class=&quot;qc&quot;&gt;
  &lt;div class=&quot;qhd&quot;&gt;
    &lt;span class=&quot;qart&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://mof.gov.np/divisions/ierd/content/1564/foreign-aid-mobilization-policy--2025/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;§3.3.5(b)&lt;/a&gt;&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;Foreign Aid Mobilization Policy, 2025&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;qtext&quot;&gt;Obtain approval from the Ministry before mobilizing any kind of foreign aid.&lt;/div&gt;
  &lt;p class=&quot;qgist&quot;&gt;개발파트너(공여기관)도 어떤 형태의 원조를 동원하기 전에 재무부 승인을 받아야 한다.&lt;/p&gt;
  &lt;details&gt;&lt;summary&gt;한국어 직역(참고 — 공식 번역 아님)&lt;/summary&gt;&lt;p class=&quot;qko&quot;&gt;어떤 형태의 대외원조든 동원하기 전에 재무부의 승인을 받는다.&lt;/p&gt;&lt;/details&gt;
&lt;/div&gt;&lt;div class=&quot;qc&quot;&gt;
  &lt;div class=&quot;qhd&quot;&gt;
    &lt;span class=&quot;qart&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://mof.gov.np/divisions/ierd/content/1564/foreign-aid-mobilization-policy--2025/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;§3.6.1&lt;/a&gt;&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;Foreign Aid Mobilization Policy, 2025&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;qtext&quot;&gt;(a) Foreign aid received as grants shall generally not be used for tax payments. (b) Tax exemption provisions shall generally not be included in loan-funded projects. (c) No tax exemptions shall be granted for the import of goods that are sufficiently produced within the country.&lt;/div&gt;
  &lt;p class=&quot;qgist&quot;&gt;조세면제가 좁아졌다 — 무상원조는 세금 납부에 못 쓰고, 차관사업엔 면제 조항이 없으며, 국내 생산이 충분한 물품 수입엔 면제가 없다.&lt;/p&gt;
  &lt;details&gt;&lt;summary&gt;한국어 직역(참고 — 공식 번역 아님)&lt;/summary&gt;&lt;p class=&quot;qko&quot;&gt;(a) 무상으로 받은 대외원조는 원칙적으로 세금 납부에 사용하지 않는다. (b) 차관 재원 사업에는 원칙적으로 조세면제 조항을 포함하지 않는다. (c) 국내에서 충분히 생산되는 물품의 수입에는 조세면제를 부여하지 않는다.&lt;/p&gt;&lt;/details&gt;
&lt;/div&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;현행 기준 반영 4건&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;공식 법령·기관 원문으로 확인한 현행 기준과 실무 확인사항입니다.
    출처는 각 항목에 연결했으며.&lt;/p&gt;
  &lt;div class=&quot;disc&quot; data-sev=&quot;high&quot;&gt;
  &lt;div class=&quot;top&quot;&gt;
    &lt;span class=&quot;badge bad&quot;&gt;필수 확인&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;네팔&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;D01&lt;/span&gt;
  &lt;/div&gt;
  &lt;h3&gt;canvas.procedure / 사업 발굴 착수 지점&lt;/h3&gt;
  &lt;div class=&quot;quote act&quot;&gt;&lt;b&gt;현행 기준&lt;/b&gt;FAMP 2025 §3.3.2(k) — 모든 수준의 정부기관·헌법기관·공기업과 정부 출연·보조 기관은 대외원조를 구하거나, 공식 요청·제안, 협상, 정보 제공, 개념서와 제안서에 관한 서신교환, MoU 또는 협정 체결에 앞서 재무부의 사전 승인을 받아야 한다. §3.3.5(b) — 개발파트너는 어떤 형태의 대외원조를 동원하기 전에도 재무부의 승인을 받아야 한다.&lt;/div&gt;
  &lt;p class=&quot;cite&quot;&gt;확인 출처 · &lt;a class=&quot;ref&quot; href=&quot;https://mof.gov.np/divisions/ierd/content/1564/foreign-aid-mobilization-policy--2025/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Foreign Aid Mobilization Policy, 2025&lt;/a&gt; §3.3.2(k), §3.3.5(b)&lt;/p&gt;
  &lt;div class=&quot;todo&quot;&gt;&lt;b&gt;실무 확인&lt;/b&gt;사업 발굴을 위해 수원기관 부처에 먼저 연락하지 않는다. 재무부 국제경제관계국을 통한 접촉 경로를 먼저 확인하고, 수원기관이 재무부 사전 승인을 받았는지 확인한 뒤 협의를 진행한다. 공여기관 자신도 원조 동원 전 재무부 승인 대상이다.&lt;/div&gt;
  &lt;details class=&quot;review&quot;&gt;
  &lt;summary&gt;Field verification (English)&lt;/summary&gt;
  &lt;div class=&quot;rv&quot;&gt;
    &lt;p&gt;&lt;b&gt;Current legal basis&lt;/b&gt; — Foreign Aid Mobilization Policy 2025 §3.3.2(k) requires government agencies to obtain prior Ministry of Finance approval before seeking aid, making proposals, negotiating, sharing information, corresponding on concept papers, or signing MoUs; §3.3.5(b) requires development partners to obtain Ministry approval before mobilizing any aid.&lt;/p&gt;
    &lt;p class=&quot;rv-verify&quot;&gt;&lt;b&gt;✔ Verify&lt;/b&gt; — Confirm the MoF (International Economic Relations Division) approval route before contacting a line ministry, and check the recipient agency has prior MoF approval. This applies to the donor agency itself too (§3.3.5(b)).&lt;/p&gt;
  &lt;/div&gt;
&lt;/details&gt;

  &lt;p class=&quot;act-row&quot;&gt;산출물 반영 — procedure 1~2단계에 재무부 사전 승인을 명시하고 근거를 현행 FAMP §3.3.2(k)·§3.3.5(b)로 반영했다.&lt;/p&gt;
&lt;/div&gt;&lt;div class=&quot;disc&quot; data-sev=&quot;medium&quot;&gt;
  &lt;div class=&quot;top&quot;&gt;
    &lt;span class=&quot;badge warn&quot;&gt;추가 확인&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;네팔&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;D03&lt;/span&gt;
  &lt;/div&gt;
  &lt;h3&gt;canvas.procedure / PCP 작성 주체&lt;/h3&gt;
  &lt;div class=&quot;quote act&quot;&gt;&lt;b&gt;현행 기준&lt;/b&gt;FAMP 2025 §3.3.2(a)(b)는 소관부처가 대외원조 대상 사업 목록을 작성하고 사업 준비성 체크리스트에 따라 재무부에 제안서를 제출하도록 규정한다. 제안서 작성 주체는 소관부처이고 재무부는 접수·검토·송부 창구다.&lt;/div&gt;
  &lt;p class=&quot;cite&quot;&gt;확인 출처 · &lt;a class=&quot;ref&quot; href=&quot;https://mof.gov.np/divisions/ierd/content/1564/foreign-aid-mobilization-policy--2025/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Foreign Aid Mobilization Policy, 2025&lt;/a&gt; §3.3.2(a), §3.3.2(b), §3.3.1(a)&lt;/p&gt;
  &lt;div class=&quot;todo&quot;&gt;&lt;b&gt;실무 확인&lt;/b&gt;PCP 작성·협의 상대는 수원기관(소관부처)으로 보되, 송부는 재무부 공한을 거친다. 착수 시 KOICA 네팔사무소에 해당 사업의 준비성 체크리스트 서식과 제출 경로를 확인한다.&lt;/div&gt;
  &lt;details class=&quot;review&quot;&gt;
  &lt;summary&gt;Field verification (English)&lt;/summary&gt;
  &lt;div class=&quot;rv&quot;&gt;
    &lt;p&gt;&lt;b&gt;Current legal basis&lt;/b&gt; — FAMP 2025 §3.3.2(a)(b) has line ministries prepare a project list and submit proposals to the Ministry per a project readiness checklist; the Ministry receives, reviews and forwards. The preparer is the line ministry.&lt;/p&gt;
    &lt;p class=&quot;rv-verify&quot;&gt;&lt;b&gt;✔ Verify&lt;/b&gt; — Treat the line ministry as the PCP preparer; forwarding goes through a MoF letter. Confirm the readiness-checklist form and submission route with the KOICA Nepal office.&lt;/p&gt;
  &lt;/div&gt;
&lt;/details&gt;

  &lt;p class=&quot;act-row&quot;&gt;산출물 반영 — 절차상 정합적인 Ⅱ-1 서술(수원기관 작성 → 상급부처·재무부 검토 → 재무부 공한 첨부 송부)을 채택했다. 2025년 정책 §3.3.2(b)가 소관부처의 제안서 제출을 명시해 이 해석을 뒷받침한다.&lt;/p&gt;
&lt;/div&gt;&lt;div class=&quot;disc&quot; data-sev=&quot;medium&quot;&gt;
  &lt;div class=&quot;top&quot;&gt;
    &lt;span class=&quot;badge warn&quot;&gt;추가 확인&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;네팔&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;D04&lt;/span&gt;
  &lt;/div&gt;
  &lt;h3&gt;canvas.bottlenecks / 조세·관세 면제 범위&lt;/h3&gt;
  &lt;div class=&quot;quote act&quot;&gt;&lt;b&gt;현행 기준&lt;/b&gt;FAMP 2025 §3.6.1 — (a) 무상으로 받은 대외원조는 원칙적으로 세금 납부에 사용하지 않는다. (b) 차관 재원 사업에는 원칙적으로 조세면제 조항을 포함하지 않는다. (c) 국내에서 충분히 생산되는 물품의 수입에는 조세면제를 부여하지 않는다. (d) 현물 지원의 경우 소관부처 추천에 따라 재무부가 현행법에 따라 면제를 부여할 수 있다.&lt;/div&gt;
  &lt;p class=&quot;cite&quot;&gt;확인 출처 · &lt;a class=&quot;ref&quot; href=&quot;https://mof.gov.np/divisions/ierd/content/1564/foreign-aid-mobilization-policy--2025/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Foreign Aid Mobilization Policy, 2025&lt;/a&gt; §3.6.1(a)(b)(c)(d)&lt;/p&gt;
  &lt;div class=&quot;todo&quot;&gt;&lt;b&gt;실무 확인&lt;/b&gt;기자재 목록을 짤 때 네팔 국내에서 충분히 생산되는 품목인지 먼저 확인한다. 해당하면 면제를 전제로 예산을 잡지 않는다. 차관 연계 사업이면 면제 조항 자체가 없을 수 있으므로 협정문에서 확인한다.&lt;/div&gt;
  &lt;details class=&quot;review&quot;&gt;
  &lt;summary&gt;Field verification (English)&lt;/summary&gt;
  &lt;div class=&quot;rv&quot;&gt;
    &lt;p&gt;&lt;b&gt;Current legal basis&lt;/b&gt; — FAMP 2025 §3.6.1: (a) grants shall generally not be used for tax payments; (b) loan-funded projects shall generally not include tax-exemption provisions; (c) no exemption for importing goods sufficiently produced within Nepal.&lt;/p&gt;
    &lt;p class=&quot;rv-verify&quot;&gt;&lt;b&gt;✔ Verify&lt;/b&gt; — When listing equipment, check whether items are sufficiently produced in Nepal (no exemption). For loan-linked projects, check the financing agreement for any exemption clause.&lt;/p&gt;
  &lt;/div&gt;
&lt;/details&gt;

  &lt;p class=&quot;act-row&quot;&gt;산출물 반영 — applicability와 bottlenecks에 면제 제한을 반영하고, 마스터리스트 소요기간(약 3개월)은 2019년 정책 시기 실무 경험치로 fieldVerification에 남겼다.&lt;/p&gt;
&lt;/div&gt;&lt;div class=&quot;disc&quot; data-sev=&quot;low&quot;&gt;
  &lt;div class=&quot;top&quot;&gt;
    &lt;span class=&quot;badge muted&quot;&gt;참고&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;네팔&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;D05&lt;/span&gt;
  &lt;/div&gt;
  &lt;h3&gt;canvas.bottlenecks / 누락된 실무 제약&lt;/h3&gt;
  &lt;div class=&quot;quote act&quot;&gt;&lt;b&gt;현행 기준&lt;/b&gt;FAMP 2025 §3.3.2(j) — 소관부처는 기술협력 재원을 차량·장비 구매나 해외 연수·훈련 참가에 사용하려면 재무부의 사전 승인을 받아야 한다.&lt;/div&gt;
  &lt;p class=&quot;cite&quot;&gt;확인 출처 · &lt;a class=&quot;ref&quot; href=&quot;https://mof.gov.np/divisions/ierd/content/1564/foreign-aid-mobilization-policy--2025/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Foreign Aid Mobilization Policy, 2025&lt;/a&gt; §3.3.2(j)&lt;/p&gt;
  &lt;div class=&quot;todo&quot;&gt;&lt;b&gt;실무 확인&lt;/b&gt;기술협력 재원으로 차량·장비를 사거나 연수·훈련 해외 파견을 계획하면 재무부 사전 승인 절차를 일정에 반영한다.&lt;/div&gt;


  &lt;p class=&quot;act-row&quot;&gt;산출물 반영 — bottlenecks에 기술협력 재원 차량·장비 구매 및 해외 연수의 재무부 사전승인 요건을 반영했다.&lt;/p&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;검증&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;네팔 재무부의 Foreign Aid Mobilization Policy 2025와 의회·PPMO가 게시한 2026년 현행 조달법·시행규칙을 함께 대조했다. 원조사업 형성 절차와 이후 공공조달에 적용되는 금액 기준·기간·보증·불복·예외를 조문별로 분리 확인했다.&lt;/p&gt;
  &lt;div class=&quot;cards&quot;&gt;
    &lt;div class=&quot;card span2&quot;&gt;&lt;h3&gt;검증 범위&lt;/h3&gt;
      &lt;p style=&quot;margin:0;font-size:13.5px;line-height:1.7&quot;&gt;FAMP 2025 §3.1.3, §3.2, §3.3.1, §3.3.2, §3.3.5, §3.6.1, §3.7과 Public Procurement Act 현행 §§8, 14, 20~21, 41~46, 47~52A, 59, 65~67, Public Procurement Rules 현행 rr.53, 84~85, 104, 110, 120A, 129를 확인했다.&lt;/p&gt;
      &lt;p style=&quot;margin:12px 0 0;font-size:12.5px;color:var(--muted)&quot;&gt;확인일 2026-07-23 · 자료집 기준일 2026-02-23&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;대조에 쓴 원문&lt;/h3&gt;&lt;ul class=&quot;srcs&quot; style=&quot;padding-left:16px;margin:0&quot;&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://mof.gov.np/divisions/ierd/content/1564/foreign-aid-mobilization-policy--2025/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Foreign Aid Mobilization Policy, 2025 (वैदेशिक सहायता परिचालन नीति, २०८२) — English Translation&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;지침·정책&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;대조 조문 §3.1.3, §3.2, §3.3.1(a)(d)(e), §3.3.2(b)(c)(j)(k), §3.3.5(b)(c)(i), §3.6.1(a)~(g), §3.7.1, §3.7.2&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;원문 확인 2026-07-23 · Government of Nepal, Ministry of Finance&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://giwmscdntwo.gov.np/media/pdf_upload/print_copy_IDCMP-2019_Eng-fullpage_20191107071739_ku6pxnl.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;International Development Cooperation Policy, 2019 — FAMP 2025 §3.7.1로 폐지됨&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;지침·정책&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;대조 조문 §3.2.11, §3.3.1, §3.4.2, §4.1.1, §5.2.1~§5.2.4 (대조 이력 보존용)&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;원문 확인 2026-07-22 · Government of Nepal, Ministry of Finance&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://hr.parliament.gov.np/en/bills/TqsiRdta&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Public Procurement (Second Amendment) Act, 2083 — Parliament authentication record&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;법률&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;대조 조문 §§8, 14, 20~21, 23, 25~27, 30, 36, 40~46, 47~52A, 54, 59, 61A~62A, 65~67, 74&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;원문 확인 2026-07-28 · Federal Parliament of Nepal&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://ppmo.gov.np/content/13300/public-procurement--second-amendment--ordinance--2083/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Public Procurement (Second Amendment) Ordinance, 2083 — official Gazette text used for article-by-article amendment comparison&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;명령·조례&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;대조 조문 Amending §§1~31; amended PPA §§2, 8, 10~14, 23, 25~27, 30, 36, 40~46, 50, 52A, 54, 58A~59, 61A~62A, 65~67, 74&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;원문 확인 2026-07-28 · Public Procurement Monitoring Office, Government of Nepal&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://ppmo.gov.np/content/13339/public-procurement--fifteenth-amendment--rules--2083/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Public Procurement (Fifteenth Amendment) Rules, 2083&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;시행규칙&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;대조 조문 rr.31, 52~53, 70, 84~85, 104, 110, 120A, 129; Fifteenth Amendment rr.1~2&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;원문 확인 2026-07-28 · Public Procurement Monitoring Office, Government of Nepal&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://pefa.gov.np/public/uploads/97716822-NP-Gandaki-Apr2025-PFMPR-SN-Public%20with%20PEFA%20Check.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Electronic Procurement System Operation Directive, 2023 — §5 application summarized in official PEFA assessment&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;지침·정책&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;대조 조문 §5; PPR rr.31, 70, 84~85 threshold application&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;원문 확인 2026-07-28 · Government of Nepal / PEFA Secretariat&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://mof.gov.np/divisions/ierd/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;네팔 재무부 국제경제관계국 부서 페이지&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;지침·정책&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;원문 확인 2026-07-23 · Ministry of Finance, Government of Nepal&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card span2&quot;&gt;&lt;h3&gt;주의&lt;/h3&gt;&lt;p class=&quot;note&quot;&gt;2026년판 기준자료가 Foreign Aid Mobilization Policy 2025를 수원체계 근거로 반영한 것을 확인했다. 본 레코드는 정책 원문 §3.3·§3.6·§3.7을 기준으로 세부 절차와 조세 범위를 정리했다.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;승계된 것 — 재무부 단일 창구(§3.3.1(a)), 정부기관의 접촉 전 재무부 사전승인(§3.3.2(k), 종전 §5.2.2와 문언 거의 동일), 공여기관의 재무부 경유 의무(§3.3.5(b), 종전 §5.2.3 전단), 재무부의 협상·재정협정 서명(§3.3.1(d)).&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;삭제된 것 — 정부기관 사업 제안 시 국가계획위원회(NPC) 동의 요건(종전 §5.2.3 후단), 양허성 차관 사업당 1천만 달러 문턱(종전 §3.4.2).&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;축소된 것 — 조세면제. 종전에는 협정상 면제를 전제로 부담 주체를 정했으나, 2025년 정책은 무상원조를 세금 납부에 쓰지 않고 차관 사업에 면제 조항을 넣지 않으며 국내 생산이 충분한 물품 수입에 면제를 부여하지 않는다(§3.6.1(a)(b)(c)).&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;신설된 것 — 차관 협상 전 내각(각료회의)의 원칙적 동의와 협상 권한 확보(§3.3.1(e)), 사업 준비성 체크리스트에 따른 제안서 제출(§3.3.2(b)), 외국인 근로자·자원봉사자 비자 및 노동허가 근거(§3.6.1(f)(g)).&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;영문본은 번역본이며, 원문에 &amp;#x27;영문본과 네팔어본이 충돌하면 네팔어본이 유효하다&amp;#x27;는 단서가 붙어 있다.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;FAMP는 사업 형성·정부 승인 체계를 규율하지만 입찰보증률이나 조달방법 금액 기준을 직접 정하지 않는다. 네팔 공공기관이 공공재원으로 조달하는 단계의 수치는 현행 PPA/PPR에서 별도로 확인했다.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;PPMO의 제15차 시행규칙 개정은 2026-07-14부터 효력이 발생했으며 r.120A의 특별 계약기간 연장 절차를 바꿨다. 조달방법 문턱·보증·불복 기준은 함께 대조한 현행 조문을 적용했다.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;p style=&quot;margin:22px 0 0;font-size:12.5px;color:var(--muted)&quot;&gt;
    조문 대조 완료 — 조문의 존재와 문언 일치만 뜻합니다. 관할·필지·시설에 따른 사업 적용판정은 별도입니다.
  &lt;/p&gt;
&lt;/section&gt;

  function candidateBox(p,w,h){

    if(box.b&gt;board.scrollHeight-4)score+=(box.b-board.scrollHeight+4)*100000;
    if(score&gt;=limit)return score;

  labelJobs.forEach(function(job){
    var group=document.createElementNS(NS,&#x27;g&#x27;); group.setAttribute(&#x27;class&#x27;,&#x27;edge-label-group&#x27;);

    group.setAttribute(&#x27;data-edge-source&#x27;,job.ed.source);
    group.setAttribute(&#x27;data-edge-target&#x27;,job.ed.target);
    var bg=document.createElementNS(NS,&#x27;rect&#x27;); bg.setAttribute(&#x27;class&#x27;,&#x27;edge-label-bg&#x27;);
    bg.setAttribute(&#x27;rx&#x27;,&#x27;4&#x27;); bg.setAttribute(&#x27;fill&#x27;,BG); bg.setAttribute(&#x27;fill-opacity&#x27;,&#x27;.96&#x27;);
    var txt=document.createElementNS(NS,&#x27;text&#x27;); txt.setAttribute(&#x27;class&#x27;,&#x27;edge-label&#x27;);

    txt.setAttribute(&#x27;dominant-baseline&#x27;,&#x27;central&#x27;); txt.setAttribute(&#x27;fill&#x27;,job.color);
    txt.setAttribute(&#x27;font-size&#x27;,&#x27;10&#x27;); txt.setAttribute(&#x27;font-weight&#x27;,&#x27;700&#x27;);
    txt.style.visibility=&#x27;hidden&#x27;; txt.textContent=job.ed.label;

    var measured=txt.getBBox(),w=Math.max(measured.width,txt.getComputedTextLength())+7;
    var h=Math.max(measured.height,12)+5;

    /* 점수는 offset에 음이 아닌 패널티만 더하므로 score &gt;= offset 이 늘 성립한다.

      leader.setAttribute(&#x27;stroke&#x27;,job.color); leader.setAttribute(&#x27;stroke-width&#x27;,&#x27;1&#x27;);

       이어져 보이게 한다. 지도 라벨의 표준 기법이며, 가리는 면적이 사각형

      txt.setAttribute(&#x27;stroke&#x27;,BG); txt.setAttribute(&#x27;stroke-width&#x27;,&#x27;3&#x27;);
      txt.setAttribute(&#x27;stroke-linejoin&#x27;,&#x27;round&#x27;);

  });
}

  if(n.output_documents&amp;&amp;n.output_documents.length)
    h+=&#x27;&lt;dt&gt;산출 문서&lt;/dt&gt;&lt;dd&gt;&#x27;+n.output_documents.join(&#x27; · &#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  if(n.blocker) h+=&#x27;&lt;dt&gt;병목&lt;/dt&gt;&lt;dd style=&quot;color:var(--warn)&quot;&gt;&#x27;+n.blocker+&#x27;&lt;/dd&gt;&#x27;;
  if(n.legal_basis&amp;&amp;n.legal_basis.length){
    var basisLabel=n.basis_scope===&#x27;axis&#x27;?&#x27;축 전체 관련 제도 근거&#x27;
      :(n.workflow_kind===&#x27;statutory&#x27;?&#x27;근거 조문&#x27;:&#x27;관련 제도 근거&#x27;);
    h+=&#x27;&lt;dt&gt;&#x27;+basisLabel+&#x27;&lt;/dt&gt;&lt;dd&gt;&#x27;+n.legal_basis.map(function(l){
      var nm=l.url?&#x27;&lt;a class=&quot;ref&quot; href=&quot;&#x27;+l.url+&#x27;&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;&#x27;+l.law+&#x27;&lt;/a&gt;&#x27;:l.law;
      var meta=(l.kind?&#x27; &lt;span class=&quot;badge plain muted&quot;&gt;&#x27;+l.kind+&#x27;&lt;/span&gt;&#x27;:&#x27;&#x27;)
        +(l.scope_label?&#x27; &lt;span class=&quot;badge info&quot;&gt;&#x27;+l.scope_label+&#x27;&lt;/span&gt;&#x27;:&#x27;&#x27;)
        +(l.verification?&#x27; &lt;span class=&quot;badge &#x27;+l.verification_tone+&#x27;&quot;&gt;&#x27;+l.verification+&#x27;&lt;/span&gt;&#x27;:&#x27;&#x27;);
      return &#x27;&lt;div style=&quot;margin-bottom:9px&quot;&gt;&#x27;+nm+&#x27; &lt;code&gt;&#x27;+l.article+&#x27;&lt;/code&gt;&#x27;+meta
        +(l.note?&#x27;&lt;div style=&quot;margin-top:3px;color:var(--muted)&quot;&gt;&#x27;+l.note+&#x27;&lt;/div&gt;&#x27;:&#x27;&#x27;)+&#x27;&lt;/div&gt;&#x27;;}).join(&#x27;&#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  }
  if(typeof n.confidence===&#x27;number&#x27;){
    h+=&#x27;&lt;dt&gt;법령 근거 확신도&lt;/dt&gt;&lt;dd&gt;&#x27;+n.confidence.toFixed(2)
      +(n.confidence&lt;0.8?&#x27; &lt;span class=&quot;badge warn&quot;&gt;현장 검증 필요&lt;/span&gt;&#x27;:&#x27;&#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  }
  if(n.confidence_reason) h+=&#x27;&lt;dt&gt;확신도 산정 근거&lt;/dt&gt;&lt;dd&gt;&#x27;+n.confidence_reason+&#x27;&lt;/dd&gt;&#x27;;
  if(n.evidence_status) h+=&#x27;&lt;dt&gt;근거 상태&lt;/dt&gt;&lt;dd&gt;&#x27;+n.evidence_status+&#x27;&lt;/dd&gt;&#x27;;
  if(n.report_use) h+=&#x27;&lt;dt&gt;보고서 반영&lt;/dt&gt;&lt;dd&gt;&#x27;+n.report_use+&#x27;&lt;/dd&gt;&#x27;;
  if(n.permit_gates&amp;&amp;n.permit_gates.length){
    h+=&#x27;&lt;dt&gt;연결 Gate&lt;/dt&gt;&lt;dd&gt;&#x27;+n.permit_gates.map(function(g){
      var dep=g.depends_on&amp;&amp;g.depends_on.length?&#x27; · 선행 Gate &#x27;+g.depends_on.map(function(x){return &#x27;G&#x27;+x;}).join(&#x27;, &#x27;):&#x27;&#x27;;
      return &#x27;&lt;div style=&quot;margin-bottom:8px&quot;&gt;&lt;b&gt;G&#x27;+g.order+&#x27; &#x27;+g.gate+&#x27;&lt;/b&gt;&#x27;+dep
        +&#x27;&lt;div&gt;&#x27;+g.decision+&#x27;&lt;/div&gt;&lt;div style=&quot;color:var(--muted)&quot;&gt;산출물 · &#x27;+g.output+&#x27;&lt;/div&gt;&lt;/div&gt;&#x27;;}).join(&#x27;&#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  }
  if(n.open_questions&amp;&amp;n.open_questions.length){
    h+=&#x27;&lt;dt&gt;현장 확인질문&lt;/dt&gt;&lt;dd&gt;&#x27;+n.open_questions.map(function(q){
      return &#x27;&lt;div style=&quot;margin-bottom:10px&quot;&gt;&lt;span class=&quot;badge &#x27;+(q.blocking?&#x27;bad&#x27;:&#x27;muted&#x27;)+&#x27;&quot;&gt;&#x27;
        +(q.blocking?&#x27;Gate 차단&#x27;:&#x27;추가 확인&#x27;)+&#x27;&lt;/span&gt; &lt;code&gt;&#x27;+q.id+&#x27;&lt;/code&gt;&lt;div&gt;&#x27;+q.question+&#x27;&lt;/div&gt;&#x27;
        +&#x27;&lt;div style=&quot;color:var(--muted)&quot;&gt;영향 · &#x27;+q.why+&#x27;&lt;/div&gt;&#x27;
        +&#x27;&lt;div style=&quot;color:var(--muted)&quot;&gt;확인기관 · &#x27;+q.confirm_with.join(&#x27; · &#x27;)+&#x27;&lt;/div&gt;&#x27;
        +&#x27;&lt;div style=&quot;color:var(--muted)&quot;&gt;증빙 · &#x27;+q.evidence.join(&#x27; · &#x27;)+&#x27;&lt;/div&gt;&lt;/div&gt;&#x27;;}).join(&#x27;&#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  }
  var ins=EDGES.filter(function(x){return x.target===id}),
      outs=EDGES.filter(function(x){return x.source===id});
  /* 보드에서 순차 라벨을 접어 두므로 여기가 전이 문구를 빠짐없이 보는 자리다.
     한 줄로 이어붙이면 묻히므로 연결 종류별 배지로 세워 준다. */
  function edgeLine(otherId,x){
    var tone=x.type===&#x27;loop&#x27;?&#x27;back&#x27;:(x.type===&#x27;message&#x27;?&#x27;info&#x27;:&#x27;muted&#x27;);
    return &#x27;&lt;div style=&quot;margin-bottom:5px&quot;&gt;&#x27;+(NODES[otherId]?NODES[otherId].name:otherId)
      +(x.label?&#x27; &lt;span class=&quot;badge &#x27;+tone+&#x27;&quot;&gt;&#x27;+x.label+&#x27;&lt;/span&gt;&#x27;:&#x27;&#x27;)+&#x27;&lt;/div&gt;&#x27;;
  }
  if(ins.length) h+=&#x27;&lt;dt&gt;선행&lt;/dt&gt;&lt;dd&gt;&#x27;+ins.map(function(x){
    return edgeLine(x.source,x);}).join(&#x27;&#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  if(outs.length) h+=&#x27;&lt;dt&gt;후속&lt;/dt&gt;&lt;dd&gt;&#x27;+outs.map(function(x){
    return edgeLine(x.target,x);}).join(&#x27;&#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  h+=&#x27;&lt;/dl&gt;&#x27;;
  document.getElementById(&#x27;dbody&#x27;).innerHTML=h;
  document.getElementById(&#x27;dlg&#x27;).showModal();
}

/* 인접 카드 강조와 숨긴 순차 라벨 노출을 한 곳에서 처리한다. focus·blur를 함께
   걸어 마우스 없이 Tab만으로도 같은 정보에 닿게 한다 — 카드는 button이라 원래
   포커스를 받는데 지금까지 hover에만 반응해 키보드에서는 강조가 동작하지 않았다. */
function peek(id,on){
  var rel={};rel[id]=1;
  EDGES.forEach(function(x){if(x.source===id)rel[x.target]=1;if(x.target===id)rel[x.source]=1;});
  document.querySelectorAll(&#x27;.node&#x27;).forEach(function(o){o.classList.toggle(&#x27;dim&#x27;,on&amp;&amp;!rel[o.dataset.id])});
  var sv=document.getElementById(&#x27;edges&#x27;); if(!sv)return;
  sv.querySelectorAll(&#x27;.edge-label-group&#x27;).forEach(function(g){
    g.classList.toggle(&#x27;lit&#x27;, on &amp;&amp; (g.getAttribute(&#x27;data-edge-source&#x27;)===id
                                   ||g.getAttribute(&#x27;data-edge-target&#x27;)===id));
  });
}
document.querySelectorAll(&#x27;.node&#x27;).forEach(function(b){
  b.addEventListener(&#x27;click&#x27;,function(){openNode(b.dataset.id)});
  b.addEventListener(&#x27;mouseenter&#x27;,function(){peek(b.dataset.id,true)});
  b.addEventListener(&#x27;focus&#x27;,function(){peek(b.dataset.id,true)});
  b.addEventListener(&#x27;mouseleave&#x27;,function(){peek(b.dataset.id,false)});
  b.addEventListener(&#x27;blur&#x27;,function(){peek(b.dataset.id,false)});
});
var _all=document.getElementById(&#x27;labelall&#x27;);
if(_all) _all.addEventListener(&#x27;change&#x27;,function(){
  var bd=document.getElementById(&#x27;board&#x27;);
  if(bd) bd.classList.toggle(&#x27;show-all-labels&#x27;,this.checked);
});
document.getElementById(&#x27;dlg&#x27;).addEventListener(&#x27;click&#x27;,function(ev){
  if(ev.target===this) this.close();
});

   경우가 많아 상시 표시하면 분기 조건 라벨까지 묻힌다. 기본은 숨기고 카드를

&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;한 장 캔버스&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;대상 필지의 권원과 토지이용 적합성, 용도지역·건폐율·용적률·높이·이격·주차, 재해·지반과 기반시설 인입조건을 개념설계 전에 확인하는 제도축&lt;/p&gt;
  &lt;div class=&quot;cards&quot;&gt;
    &lt;div class=&quot;card span2&quot;&gt;&lt;h3&gt;국가별 건축 인허가 절차 · 7단계&lt;/h3&gt;&lt;p class=&quot;workflow-disclosure&quot;&gt;해당 국가의 법령·관할기관 공식자료에서 확인한 신청·심사·보완·결정 절차를 표시한다. 업무구조도와 노드 상세에는 국가 절차만 두고, ODA 조사팀의 사업별 확인질문은 페이지 하단의 별도 접이식 목록으로 분리한다.&lt;/p&gt;&lt;p class=&quot;workflow-disclosure&quot;&gt;&lt;b&gt;적용 범위&lt;/b&gt; · 건축허가 접수에서 접근도로(access road), 필지(plot), 유도토지개발계획(GLD planning)과 지방 건축조례(building by-laws) 적합성을 검토하고 KMC가 구청(ward) 현장조사·인접통지를 거쳐 도면승인을 결정하는 흐름이다.&lt;/p&gt;&lt;ol class=&quot;steps&quot;&gt;&lt;li&gt;B01 등록 설계자의 필지·계획도서 작성 — 지방정부 등록 또는 네팔기술위원회(Nepal Engineering Council) 자격을 갖춘 설계자가 권원·지적도·필지계획도(lot plan), 접근도로, 건축·구조도서와 설계상세를 작성·서명한다. / 산출물: 등록 설계자 서명 필지·건축·구조도서&lt;/li&gt;&lt;li&gt;B02 지방정부 건축허가 신청·권원자료 제출 — 소유자가 신청서와 신분·법인자료, 토지권리·지적자료, 세금증빙과 서명도서를 관할 지방정부 허가창구에 제출한다. / 산출물: 건축허가 신청·권원·필지도서·접수기록&lt;/li&gt;&lt;li&gt;B03 신청서·도서 완비성 확인 — 지방정부 등록창구가 신청서·권원·설계자 자격과 필수도서를 확인하고 누락·불완전 자료는 소유자와 설계자에게 보완 통지한다. / 산출물: 완비접수 또는 서류 보완통지&lt;/li&gt;&lt;li&gt;B04 접근도로·필지·유도토지개발계획·건축조례 심사 — 시 측량담당자(municipal surveyor)가 접근도로, 토지필지와 적용 유도토지개발계획을 확인하고 건축조례 담당 기술자(engineer)가 용도·배치·이격·높이·주차 등 지방기준 적합성을 심사한다. / 산출물: 부지·도로·유도토지개발계획·건축조례 심사의견&lt;/li&gt;&lt;li&gt;B05 현장조사·인접통지·현지조사 — 관할 지방정부가 현장을 확인하고 인접자 통지기간과 현지조사(local inquiry)를 마친 뒤 조사기록을 허가부서로 회송한다. / 산출물: 현장조사·인접통지·현지조사 기록&lt;/li&gt;&lt;li&gt;B06 필지·조례 부적합 도서 수정·재제출 — 접근도로·필지·GLD 또는 건축조례에 부적합하거나 자료가 누락되면 설계자와 신청인이 지적사항을 수정해 등록창구에 재제출한다. / 산출물: 수정 필지·건축도서·보완답변&lt;/li&gt;&lt;li&gt;B07 부지·조례 적합 도면승인·허가결정 — 권한 있는 지방정부 담당자가 부지·조례·현장조사 결과가 적합한 신청을 승인해 건축허가와 승인도면을 발급하거나 보완·거부를 통지한다. / 산출물: 건축허가·승인도면·부지조건 또는 거부통지&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
    &lt;div class=&quot;card span2&quot;&gt;&lt;h3&gt;공식 결정 Gate · 1개&lt;/h3&gt;&lt;p class=&quot;workflow-disclosure&quot;&gt;위 절차 중 관할기관이 공식 문서를 발급하거나 처분하는 결정 지점만 분리했습니다. Gate 1/N은 이 페이지 안의 표시번호이며, 관할·사업별 적용조건과 근거 수준은 각 Gate에서 확인합니다.&lt;/p&gt;&lt;ol class=&quot;official-gates&quot;&gt;&lt;li class=&quot;official-gate&quot; data-source-order=&quot;1&quot;&gt;&lt;div class=&quot;gate-title&quot;&gt;&lt;span class=&quot;badge info&quot;&gt;Gate 1/1&lt;/span&gt;&lt;b&gt;지방정부의 부지·조례 적합 건축허가 결정&lt;/b&gt;&lt;/div&gt;&lt;p&gt;관할 지방정부가 접근도로·필지·공간계획·건축조례 적합성과 건축허가 진입을 공식 결정한다.&lt;/p&gt;&lt;dl class=&quot;gate-meta&quot;&gt;&lt;dt&gt;결정기관&lt;/dt&gt;&lt;dd&gt;관할 지방정부&lt;/dd&gt;&lt;dt&gt;적용 관할·조건&lt;/dt&gt;&lt;dd&gt;네팔 지방정부 관할에서 신축·증축·용도변경을 계획하는 모든 ODA 건축사업&lt;/dd&gt;&lt;dt&gt;산출물&lt;/dt&gt;&lt;dd&gt;건축허가·승인도면·조건 또는 거부통지&lt;/dd&gt;&lt;dt&gt;근거 수준&lt;/dt&gt;&lt;dd&gt;노드 직접근거&lt;/dd&gt;&lt;dt&gt;연결 근거&lt;/dt&gt;&lt;dd&gt;&lt;span class=&quot;gate-basis&quot;&gt;&lt;span class=&quot;law-name&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.lawcommission.gov.np/content/12187/12187-building-act-2055/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;건축법 2055(1998, 개정 포함)&lt;/a&gt;&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot;&gt;법률&lt;/span&gt;&lt;span class=&quot;badge info&quot;&gt;원문 링크 연결&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;gate-basis&quot;&gt;&lt;span class=&quot;law-name&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://plgsp.gov.np/sites/default/files/2023-09/Resource_Book_on_Building_Bylaws%20and%20Building%20Permit%20System%20in_Nepal.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;네팔 건축조례·건축허가제도 자료집&lt;/a&gt;&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot;&gt;공식 안내&lt;/span&gt;&lt;span class=&quot;badge info&quot;&gt;공식자료 연결&lt;/span&gt;&lt;/span&gt;&lt;/dd&gt;&lt;/dl&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;적용 대상&lt;/h3&gt;&lt;p style=&quot;margin:0;font-size:13.5px;line-height:1.7&quot;&gt;네팔 지방정부 관할에서 신축·증축·용도변경을 계획하는 모든 ODA 건축사업&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;법적 근거&lt;/h3&gt;&lt;div class=&quot;law&quot;&gt;&lt;div class=&quot;law-copy&quot;&gt;&lt;span class=&quot;nm&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.lawcommission.gov.np/content/12187/12187-building-act-2055/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;건축법 2055(1998, 개정 포함)&lt;/a&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;law-meta&quot;&gt;&lt;span class=&quot;badge plain muted&quot;&gt;법률&lt;/span&gt;&lt;span class=&quot;badge info&quot;&gt;원문 링크 연결&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;운영 중 공식자료&lt;/h3&gt;&lt;div class=&quot;law&quot;&gt;&lt;div class=&quot;law-copy&quot;&gt;&lt;span class=&quot;nm&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://plgsp.gov.np/sites/default/files/2023-09/Resource_Book_on_Building_Bylaws%20and%20Building%20Permit%20System%20in_Nepal.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;네팔 건축조례·건축허가제도 자료집&lt;/a&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;law-meta&quot;&gt;&lt;span class=&quot;badge plain muted&quot;&gt;공식 안내&lt;/span&gt;&lt;span class=&quot;badge info&quot;&gt;공식자료 연결&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;

    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;권한 기관&lt;/h3&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;&lt;a class=&quot;ref&quot; href=&quot;https://mofaga.gov.np/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;관할 지방정부&lt;/a&gt;&lt;/b&gt;&lt;span&gt;지방정부 관할구역의 토지이용·건축도면 승인과 건축허가 집행기관 &lt;span class=&quot;badge info&quot;&gt;공식자료 연결&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;&lt;a class=&quot;ref&quot; href=&quot;https://dudbc.gov.np/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;도시개발·건축건설국(DUDBC)&lt;/a&gt;&lt;/b&gt;&lt;span&gt;국가 건축법·건축기준과 관할 밖 기술지원을 담당하는 중앙 전문기관 &lt;span class=&quot;badge info&quot;&gt;공식자료 연결&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;이해관계자&lt;/h3&gt;&lt;p style=&quot;margin:0;font-size:13.5px;line-height:1.7&quot;&gt;관할 지방정부, 도시개발·건축건설국(DUDBC)&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;제출서류&lt;/h3&gt;&lt;div class=&quot;docset&quot;&gt;&lt;b&gt;01 지방정부의 부지·조례 적합 건축허가 결정&lt;/b&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;건축허가·승인도면·조건 또는 거부통지&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;


    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;관련 제도&lt;/h3&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;네팔 공공조달 입찰제도&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;네팔 조달 거버넌스·감독체계&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;네팔 ODA 사업 발굴·형성 절차&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;네팔 건축허가·환경심사&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;네팔 기술검사·보험·준공제도&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;details class=&quot;card field-application&quot;&gt;&lt;summary&gt;&lt;span&gt;ODA 사업별 적용 확인사항&lt;/span&gt;&lt;small&gt;법정절차 외 체크리스트 · 6개&lt;/small&gt;&lt;/summary&gt;&lt;div class=&quot;field-application-body&quot;&gt;&lt;p class=&quot;workflow-disclosure&quot;&gt;아래 항목은 해당 국가의 법정 절차가 아니라 대상 사업의 관할·필지·시설 조건을 확정하기 위한 조사 체크리스트입니다. 업무구조도와 공식 결정 Gate에는 포함하지 않습니다.&lt;/p&gt;&lt;ul class=&quot;plain&quot;&gt;&lt;li&gt;출국 전: 권원·지적도·계획도·측량·지반·침수·기반시설 자료를 문서번호와 함께 요청한다. → 부지 자료 인벤토리와 결측대장&lt;/li&gt;&lt;li&gt;기관협의: 관할 계획기관에 필지별 수치와 특구·재해·문화재 등 중첩규제를 서면 확인한다. → 필지 규제표와 기관 확인공문&lt;/li&gt;&lt;li&gt;보고서 반영: 도시계획·부지규제의 확인·미확인·조건부 항목을 분리하고 근거문서 번호와 설계·일정·예산 영향을 연결한다. → 도시계획·부지규제 근거대장·보고서 반영표&lt;/li&gt;&lt;li&gt;어느 지방정부가 관할하며 해당 필지의 조례상 용도·도로·밀도·높이·이격·주차·재해기준은 무엇인가? — 영향: 공간프로그램, 배치, 층수, 공사비와 부지 적합성을 결정한다.; 담당 수원기관·현지 건축전문가; 확인기관 관할 지방정부, 도시개발·건축건설국(DUDBC); 필요 증빙 토지권원·지적도, 관할 지방정부 건축조례, 필지별 계획·도로·재해 확인서, 승인 측량도와 기반시설 인입확약&lt;/li&gt;&lt;li&gt;대상 필지의 용도지역, 허용용도, 건폐율·용적률·높이·이격·주차와 재해·기반시설 조건은 무엇인가? — 영향: 공간프로그램, 배치, 층수, 공사비와 부지 적합성을 결정한다.; 담당 수원기관·현지 건축전문가; 확인기관 관할 지방정부, 도시개발·건축건설국(DUDBC); 필요 증빙 필지 권원·지적도·경계측량, 현행 토지이용계획·용도지역 확인서, 필지별 개발기준표와 기반시설 인입확약&lt;/li&gt;&lt;li&gt;건축허가제도 공식 자료집의 사업별 적용조건을 어떤 원본·공문·현장기록으로 입증할 것인가? — 영향: 공개된 국가 기본경로와 실제 필지·시설·관할의 적용판정을 분리해 보고서의 과단정을 막는다.; 담당 현지 건축전문가·조사총괄; 확인기관 관할 지방정부, 도시개발·건축건설국(DUDBC); 필요 증빙 토지권원·지적도, 관할 지방정부 건축조례, 필지별 계획·도로·재해 확인서, 승인 측량도와 기반시설 인입확약&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;핵심 적용판단&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;확인된 법령 사실과 사업별 조건부·미확정 판단을 분리해 표시합니다.&lt;/p&gt;
  &lt;div class=&quot;decision-list&quot;&gt;&lt;div class=&quot;decision&quot; data-state=&quot;conditional&quot;&gt;&lt;span class=&quot;badge warn&quot;&gt;조건부&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;NPL-BLD-C-001&lt;/span&gt;&lt;p&gt;네팔은 국가 건축법·NBC와 지방정부 건축허가가 결합된 구조이므로, 국가 코드만으로 설계 가능 규모를 확정할 수 없고 관할 지방정부 조례·필지확인이 선행돼야 한다.&lt;/p&gt;&lt;div class=&quot;sources&quot;&gt;근거 · 네팔 건축조례·건축허가제도 자료집 · 건축법 2055(1998, 개정 포함)&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;부지·특구 적용조건&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;공개 법령만으로 확정할 수 없는 필지별 규칙과 필요한 원자료입니다.&lt;/p&gt;
  &lt;div class=&quot;overlay-grid&quot;&gt;&lt;div class=&quot;overlay&quot;&gt;&lt;span class=&quot;badge bad&quot;&gt;미확정&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;NPL-LOCAL-OVERLAY-001&lt;/span&gt;&lt;h3&gt;대상 필지의 관할 지방정부·계획구역·특구&lt;/h3&gt;&lt;p&gt;국가 법체계가 계획·허가의 틀을 정하더라도 실제 필지의 허용용도와 수치기준은 지방계획·조례·특구규정·재해지도에서 확정해야 한다.&lt;/p&gt;&lt;p class=&quot;missing&quot;&gt;&lt;b&gt;결측 증빙&lt;/b&gt; · 필지 식별정보 · 현행 계획도·조례 · 관할기관의 필지별 규제확인서&lt;/p&gt;&lt;p&gt;&lt;b&gt;사업 영향&lt;/b&gt; · 확인 전에는 건폐율·용적률·높이·이격·주차를 국가 공통 수치로 단정하지 않는다.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/section&gt;





&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;검증&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;네팔 건축조례·건축허가제도 자료집·건축법 2055(1998, 개정 포함)·환경보호법 2019(2076)·네팔 국가건축기준 공식 대장의 공식 법령·정부 서비스 페이지에서 제도 존재, 담당기관과 적용범위를 확인했다.&lt;/p&gt;
  &lt;div class=&quot;cards&quot;&gt;
    &lt;div class=&quot;card span2&quot;&gt;&lt;h3&gt;검증 범위&lt;/h3&gt;
      &lt;p style=&quot;margin:0;font-size:13.5px;line-height:1.7&quot;&gt;건축허가와 부지·조례 심사는 지방정부가 집행하고, 그 절차 골격은 건축법과 연방 자료집이 전국 공통으로 정리한다. 필지별 수치는 관할 지방정부 조례로 확정한다.&lt;/p&gt;
      &lt;p style=&quot;margin:12px 0 0;font-size:12.5px;color:var(--muted)&quot;&gt;확인일 2026-08-07 · 자료집 기준일 2026-08-07&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;대조에 쓴 원문&lt;/h3&gt;&lt;ul class=&quot;srcs&quot; style=&quot;padding-left:16px;margin:0&quot;&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.lawcommission.gov.np/content/12187/12187-building-act-2055/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Building Act, 2055 (1998), as amended&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;법률&lt;/span&gt;&lt;span class=&quot;badge ok&quot; style=&quot;margin-left:6px&quot;&gt;현행 확인&lt;/span&gt;&lt;span class=&quot;badge info&quot; style=&quot;margin-left:6px&quot;&gt;원문 링크 연결&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;원문 확인 2026-08-07&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;상태 확인 2026-08-07 · 네팔 법률위원회 현행법 대장에서 개정이 반영된 Building Act 2055와 Sections 10-14, 17-19를 확인&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;네팔 법률위원회의 현행법 페이지가 법률 원문과 개정 이력을 제공한다.&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://plgsp.gov.np/sites/default/files/2023-09/Resource_Book_on_Building_Bylaws%20and%20Building%20Permit%20System%20in_Nepal.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Resource Book on Building Bylaws and Building Permit System in Nepal&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;공식 안내&lt;/span&gt;&lt;span class=&quot;badge info&quot; style=&quot;margin-left:6px&quot;&gt;운영 중 공식 안내&lt;/span&gt;&lt;span class=&quot;badge info&quot; style=&quot;margin-left:6px&quot;&gt;공식자료 연결&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;원문 확인 2026-08-07&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;상태 확인 2026-08-07 · 연방·일반행정부 산하 PLGSP가 지방정부 건축조례·허가시스템의 단계별 공식 자료집으로 현재 게시&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;연방정부 지방행정 지원 프로그램의 건축허가 집행 자료집이다. 지방별 조례 원본을 추가 확보해야 한다.&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card span2&quot;&gt;&lt;h3&gt;주의&lt;/h3&gt;&lt;p class=&quot;note&quot;&gt;비공식 한국어 요약이며 법률자문이나 관할기관의 유권해석을 대신하지 않는다.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;자료의 현행·운영 상태는 사이트가 자료별 상태·확인일·판단근거로 관리한다. 최신 개정 추적이 끝나지 않은 자료만 검증 예외로 별도 표시한다.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;건폐율·용적률·높이·이격·주차, 환경평가 유형, 수수료·실제 기간과 현지 업체 비용은 필지·시설·관할에 따라 달라 확인 전 수치로 사용하지 않는다.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;p style=&quot;margin:22px 0 0;font-size:12.5px;color:var(--muted)&quot;&gt;
    원문 링크 연결 — 공식 자료와 제도의 연결 수준을 뜻하며 자료의 현행·운영 상태는 위 원문 대장의 상태와 확인일로, 개별 사업 적용판정은 ODA 적용 확인사항으로 따로 관리합니다.
  &lt;/p&gt;
&lt;/section&gt;
&lt;/div&gt;

function draw(){

  if(!board||!svg)return;

  svg.setAttribute(&#x27;width&#x27;,board.scrollWidth); svg.setAttribute(&#x27;height&#x27;,board.scrollHeight);
  var cs=getComputedStyle(document.documentElement);
  var C={sequence:cs.getPropertyValue(&#x27;--muted&#x27;).trim(),
         message:cs.getPropertyValue(&#x27;--info&#x27;).trim(),
         loop:cs.getPropertyValue(&#x27;--back&#x27;).trim()};
  var BG=cs.getPropertyValue(&#x27;--bg&#x27;).trim();
  var d=&#x27;&lt;defs&gt;&#x27;;
  [&#x27;sequence&#x27;,&#x27;message&#x27;,&#x27;loop&#x27;].forEach(function(t){
    d+=&#x27;&lt;marker id=&quot;m-&#x27;+t+&#x27;&quot; viewBox=&quot;0 0 8 8&quot; refX=&quot;7&quot; refY=&quot;4&quot; markerWidth=&quot;6&quot; markerHeight=&quot;6&quot; orient=&quot;auto&quot;&gt;&#x27;
      +&#x27;&lt;path d=&quot;M0 0 L8 4 L0 8 z&quot; fill=&quot;&#x27;+C[t]+&#x27;&quot;/&gt;&lt;/marker&gt;&#x27;;
  });
  d+=&#x27;&lt;/defs&gt;&#x27;;
  var GAP=5;
  function rel(rc){return {x:rc.left-bb.left+board.scrollLeft, y:rc.top-bb.top+board.scrollTop,
                            r:rc.right-bb.left+board.scrollLeft, b:rc.bottom-bb.top+board.scrollTop,
                            w:rc.width, h:rc.height};}
  function box(id){
    var el=Array.prototype.find.call(
      board.querySelectorAll(&#x27;.node&#x27;),function(node){return node.dataset.id===id;}
    );
    if(!el)return null; return rel(el.getBoundingClientRect());
  }

  /* 라우팅은 korea100studio의 거터 라우팅을 우리 그리드에 이식한 것이다.
     핵심: 카드를 지나야 하는 선은 카드가 없는 거터(행 하단·열 측면)로 우회한다.

  // 장애물(모든 노드)과 거터(노드 없는 띠) 실측
  var OB=[];
  board.querySelectorAll(&#x27;.node&#x27;).forEach(function(el){ var r=box(el.dataset.id); r.id=el.dataset.id; OB.push(r); });
  // 단계 머리글과 각 행의 행위주체 셀도 텍스트 장애물이다. 카드만 피하면

  board.querySelectorAll(&#x27;.brow.head .bcell,.brow:not(.head) .bcell:first-child&#x27;).forEach(function(el){
    TB.push(rel(el.getBoundingClientRect()));
  });
  var rowGut=[], colGut=[];
  board.querySelectorAll(&#x27;.brow:not(.head)&#x27;).forEach(function(el){ var r=rel(el.getBoundingClientRect());
    rowGut.push(r.y+9); rowGut.push(r.b-9); });
  var hc=board.querySelectorAll(&#x27;.brow.head .bcell&#x27;);
  for(var i=1;i&lt;hc.length;i++){ var r=rel(hc[i].getBoundingClientRect()); colGut.push(r.x+11); colGut.push(r.r-11); }

  function segHit(ax,ay,bx,by,e1,e2){
    var n=0, M=3;
    for(var i=0;i&lt;OB.length;i++){ var o=OB[i]; if(o.id===e1||o.id===e2) continue;
      var L=o.x+M,R=o.r-M,T=o.y+M,B=o.b-M;
      if(Math.abs(ay-by)&lt;0.5){ if(ay&gt;T&amp;&amp;ay&lt;B &amp;&amp; Math.max(ax,bx)&gt;L &amp;&amp; Math.min(ax,bx)&lt;R) n++; }

  function uniq(pts){ return pts.filter(function(p,i){ return i===0 || Math.abs(p.x-pts[i-1].x)&gt;0.5 || Math.abs(p.y-pts[i-1].y)&gt;0.5; }); }

  function route(a,b,ed){
    var acx=a.x+a.w/2,acy=a.y+a.h/2,bcx=b.x+b.w/2,bcy=b.y+b.h/2, e1=ed.source,e2=ed.target, cs=[];
    // 보완 회귀는 source 오른쪽 거터로 빠진 뒤 target 행의 위·아래 여백을

    // 관통할 수 있으므로, 실측한 행 거터 후보를 장애물 수·길이로 비교한다.
    if(ed.type===&#x27;loop&#x27;&amp;&amp;ed.label){
      var maxRight=Math.max(a.r,b.r), gx0=Math.min(board.scrollWidth-4,maxRight+28);
      var gxVals=[gx0,board.scrollWidth-4], loopCandidates=[];
      colGut.forEach(function(gx){if(gx&gt;maxRight+10)gxVals.push(gx);});
      gxVals=gxVals.filter(function(gx,i){return gx&gt;maxRight+6&amp;&amp;gxVals.indexOf(gx)===i;});
      var gyVals=rowGut.filter(function(gy){return gy&lt;b.y-6||gy&gt;b.b+6;});
      gxVals.forEach(function(gx){
        gyVals.forEach(function(gy){
          var above=gy&lt;b.y;
          var tp={x:bcx,y:above?b.y:b.b};
          var pre={x:bcx,y:tp.y+(above?-GAP:GAP)};
          loopCandidates.push(score([
            {x:a.r,y:acy},{x:gx,y:acy},{x:gx,y:gy},{x:bcx,y:gy},pre,tp
          ],e1,e2));
        });
      });
      // 극단적으로 거터 후보가 없는 단일 행 보드에서도 선은 계속 표시한다.
      loopCandidates.push(score([
        {x:a.r,y:acy},{x:gx0,y:acy},{x:gx0,y:bcy},{x:b.r+GAP,y:bcy},{x:b.r,y:bcy}

      return loopCandidates[0];
    }
    // 세로 계열 — a의 위/아래 변에서 나가 b의 위/아래 변으로
    var below=bcy&gt;acy, sp={x:acx,y:below?a.b:a.y}, tp={x:bcx,y:below?b.y:b.b}, tg={x:tp.x,y:tp.y+(below?-GAP:GAP)};
    cs.push(score([sp,{x:sp.x,y:tg.y},tg,tp],e1,e2));                                   // 직선/L
    rowGut.forEach(function(my){ if(my&gt;Math.min(sp.y,tp.y)+6&amp;&amp;my&lt;Math.max(sp.y,tp.y)-6)   // 행 거터 크로스
      cs.push(score([sp,{x:sp.x,y:my},{x:tp.x,y:my},tg,tp],e1,e2)); });
    colGut.forEach(function(gx){                                                          // 열 측면 탈출
      var as={x:gx&gt;acx?a.r:a.x,y:acy};
      cs.push(score([as,{x:gx,y:acy},{x:gx,y:tg.y},tg,tp],e1,e2)); });
    // 가로 계열 — a의 좌/우 변에서 나가 b의 좌/우 변으로
    var right=bcx&gt;acx, sp2={x:right?a.r:a.x,y:acy}, tp2={x:right?b.x:b.r,y:bcy}, tg2={x:tp2.x+(right?-GAP:GAP),y:tp2.y};
    cs.push(score([sp2,{x:tg2.x,y:sp2.y},tg2,tp2],e1,e2));
    colGut.forEach(function(mx){ if(mx&gt;Math.min(sp2.x,tp2.x)+6&amp;&amp;mx&lt;Math.max(sp2.x,tp2.x)-6)
      cs.push(score([sp2,{x:mx,y:sp2.y},{x:mx,y:tp2.y},tg2,tp2],e1,e2)); });
    rowGut.forEach(function(gy){                                                          // 행 거터 우회
      var as={x:acx,y:gy&gt;acy?a.b:a.y};
      cs.push(score([as,{x:acx,y:gy},{x:tp2.x,y:gy},tg2,tp2],e1,e2)); });
    cs=cs.filter(function(c){return c.pts.length&gt;=2;});
    cs.sort(function(x,y){ return x.p-y.p || x.l-y.l; });
    return cs[0];
  }

  function rnd(v){return Math.round(v*10)/10;}
  function orthPath(pts){                    // 직교 경로 + 모서리 라운딩
    pts=uniq(pts); if(pts.length&lt;2)return &#x27;&#x27;;
    var d=&#x27;M&#x27;+rnd(pts[0].x)+&#x27; &#x27;+rnd(pts[0].y);
    for(var i=1;i&lt;pts.length-1;i++){
      var p=pts[i-1],c=pts[i],n=pts[i+1];
      var d1=Math.hypot(c.x-p.x,c.y-p.y)||1, d2=Math.hypot(n.x-c.x,n.y-c.y)||1, r=Math.min(7,d1/2,d2/2);
      d+=&#x27; L&#x27;+rnd(c.x-(c.x-p.x)/d1*r)+&#x27; &#x27;+rnd(c.y-(c.y-p.y)/d1*r);
      d+=&#x27; Q&#x27;+rnd(c.x)+&#x27; &#x27;+rnd(c.y)+&#x27; &#x27;+rnd(c.x+(n.x-c.x)/d2*r)+&#x27; &#x27;+rnd(c.y+(n.y-c.y)/d2*r);

    var e=pts[pts.length-1]; return d+&#x27; L&#x27;+rnd(e.x)+&#x27; &#x27;+rnd(e.y);
  }

  var labelJobs=[],pathSegs=[],allArrows=[];
  EDGES.forEach(function(ed){
    var a=box(ed.source),b=box(ed.target); if(!a||!b)return;
    var t=ed.type||&#x27;sequence&#x27;, rt=route(a,b,ed), pts=uniq(rt.pts);
    /* 라벨 배경이 남의 연결선을 덮어 선이 끊겨 보이는 것을 막으려면 모든
       연결선의 위치를 알아야 한다. 라벨 없는 엣지도 덮이면 똑같이 끊겨

    for(var si=0;si&lt;pts.length-1;si++)
      pathSegs.push({x1:pts[si].x,y1:pts[si].y,x2:pts[si+1].x,y2:pts[si+1].y,ed:ed});
    var tip=pts[pts.length-1];

    d+=&#x27;&lt;path class=&quot;edge-path&quot; data-edge-id=&quot;&#x27;+ed.id+&#x27;&quot; d=&quot;&#x27;+orthPath(rt.pts)
      +&#x27;&quot; fill=&quot;none&quot; stroke=&quot;&#x27;+C[t]+&#x27;&quot; stroke-width=&quot;1.5&quot; opacity=&quot;&#x27;
      +(t===&#x27;sequence&#x27;?&#x27;.55&#x27;:&#x27;.8&#x27;)+&#x27;&quot;&#x27;+(t!==&#x27;sequence&#x27;?&#x27; stroke-dasharray=&quot;4 3&quot;&#x27;:&#x27;&#x27;)
      +&#x27; marker-end=&quot;url(#m-&#x27;+t+&#x27;)&quot;/&gt;&#x27;;

  });
  svg.innerHTML=d;

  // 한 노드에서 순차선이 두 갈래 이상 나가면 그건 전이가 아니라 결정이다.
  // 그 라벨(&quot;상세평가 면제&quot;/&quot;상세평가 요구&quot;)이 없으면 왜 선이 갈라지는지
  // 읽을 수 없으므로, 갈림길의 순차 라벨은 접지 않고 상시 표시한다.
  var seqOut={};
  EDGES.forEach(function(x){ if((x.type||&#x27;sequence&#x27;)===&#x27;sequence&#x27;) seqOut[x.source]=(seqOut[x.source]||0)+1; });
  function isBranch(ed){ return (ed.type||&#x27;sequence&#x27;)===&#x27;sequence&#x27; &amp;&amp; seqOut[ed.source]&gt;1; }

  // 보완·분기선은 긴 우회 경로를 쓰므로 먼저 라벨 자리를 확보한다.

  // 최신 엔진의 안정 정렬로 원래 상대순서는 유지된다.

    return tier(a)-tier(b);
  });

  /* 라벨은 경로와 별도 2차 배치한다. 실제 글자 폭을 잰 뒤 카드·화살촉·

  var NS=&#x27;http://www.w3.org/2000/svg&#x27;, labelBoxes=[],leaderSegments=[];
  // 라벨 없는 엣지의 화살촉도 가려지면 안 되므로 전체 엣지 기준으로 둔다.
  var arrowBoxes=allArrows;
  function overlaps(a,b){return a.x&lt;b.r&amp;&amp;a.r&gt;b.x&amp;&amp;a.y&lt;b.b&amp;&amp;a.b&gt;b.y;}
  function overlapArea(a,b){
    return Math.max(0,Math.min(a.r,b.r)-Math.max(a.x,b.x))*

  }
  function labelCandidates(rt,w,h,sourceBox,targetBox){
    var pts=uniq(rt.pts),segs=[],fractions=[.5,.33,.67,.2,.8];
    // 인접 카드 사이 거터가 좁은 경우에도 카드 한 줄 밖까지 탐색한다.
    var sideOffsets=[3,7,19,31,43,55,71,87,103,119,135,151,167,183,199,215];
    for(var i=0;i&lt;pts.length-1;i++){
      var a=pts[i],b=pts[i+1],horizontal=Math.abs(a.y-b.y)&lt;.5;
      var length=Math.abs(a.x-b.x)+Math.abs(a.y-b.y);
      if(length&gt;8) segs.push({a:a,b:b,horizontal:horizontal,length:length});
    }
    segs.sort(function(a,b){return (b.horizontal-a.horizontal)||b.length-a.length;});
    var out=[];
    if(rt.label) out.push({x:rt.label.x,y:rt.label.y,offset:0,anchor:rt.label});
    // 같은 행·열의 카드 사이 라벨은 카드 사이의 실제 연결선에 먼저 붙인다.
    // 그 자리가 막힐 때만 카드 바깥 후보를 써서 라벨이 고아처럼 멀어지지
    // 않으면서도 카드나 단계 제목 뒤에 가려지지 않게 한다.
    if(sourceBox&amp;&amp;targetBox){
      var sx=sourceBox.x+sourceBox.w/2,sy=sourceBox.y+sourceBox.h/2;
      var tx=targetBox.x+targetBox.w/2,ty=targetBox.y+targetBox.h/2;
      if(Math.abs(sy-ty)&lt;=Math.max(sourceBox.h,targetBox.h)*.45){
        var left=sx&lt;=tx?sourceBox:targetBox,right=sx&lt;=tx?targetBox:sourceBox;
        var gapX=(left.r+right.x)/2;
        var attachY=(sy+ty)/2;
        for(var hi=0;hi&lt;segs.length;hi++){
          var hs=segs[hi];
          if(hs.horizontal&amp;&amp;gapX&gt;=Math.min(hs.a.x,hs.b.x)-.5&amp;&amp;gapX&lt;=Math.max(hs.a.x,hs.b.x)+.5){
            attachY=hs.a.y; break;
          }

        out.push({x:gapX,y:Math.min(sourceBox.y,targetBox.y)-h/2-5,offset:4,anchor:hAnchor});
        out.push({x:gapX,y:Math.max(sourceBox.b,targetBox.b)+h/2+5,offset:8,anchor:hAnchor});
      }
      if(Math.abs(sx-tx)&lt;=Math.max(sourceBox.w,targetBox.w)*.45){
        var top=sy&lt;=ty?sourceBox:targetBox,bottom=sy&lt;=ty?targetBox:sourceBox;
        var gapY=(top.b+bottom.y)/2;
        var attachX=(sx+tx)/2;
        for(var vi=0;vi&lt;segs.length;vi++){
          var vs=segs[vi];
          if(!vs.horizontal&amp;&amp;gapY&gt;=Math.min(vs.a.y,vs.b.y)-.5&amp;&amp;gapY&lt;=Math.max(vs.a.y,vs.b.y)+.5){
            attachX=vs.a.x; break;
          }

        var vAnchor={x:attachX,y:gapY};
        out.push({x:attachX+w/2+7,y:gapY,offset:2,anchor:vAnchor});
        out.push({x:attachX-w/2-7,y:gapY,offset:3,anchor:vAnchor});
        out.push({x:Math.min(sourceBox.x,targetBox.x)-w/2-7,y:gapY,offset:6,anchor:vAnchor});
        out.push({x:Math.max(sourceBox.r,targetBox.r)+w/2+7,y:gapY,offset:10,anchor:vAnchor});

      fractions.forEach(function(f){

        // 소속관계가 가장 분명하고, 충돌 시에만 아래의 측면 후보로 밀린다.
        var anchor={x:x,y:y};
        out.push({x:x,y:y,offset:0,anchor:anchor});
        if(seg.horizontal){
          sideOffsets.forEach(function(gap){

              out.push({x:x,y:y+o,offset:Math.abs(o),anchor:anchor});
            });
          });
        }else{
          sideOffsets.forEach(function(gap){
            [-(w/2+gap),w/2+gap].forEach(function(o){
              out.push({x:x+o,y:y,offset:Math.abs(o),anchor:anchor});
            });
          });
        }
      });
    });

  }
  function candidateBox(p,w,h){
    return {x:p.x-w/2,y:p.y-h/2,r:p.x+w/2,b:p.y+h/2,w:w,h:h};
  }
  function leaderSegment(box,p){
    var anchor=p.anchor;
    if(!anchor)return null;
    var x2=Math.max(box.x,Math.min(anchor.x,box.r));
    var y2=Math.max(box.y,Math.min(anchor.y,box.b));
    if(Math.hypot(anchor.x-x2,anchor.y-y2)&lt;=24)return null;
    return {x1:anchor.x,y1:anchor.y,x2:x2,y2:y2};
  }
  function segmentHitsBox(seg,o){
    // 테두리를 따라가는 선은 허용하되 카드·머리글·행위주체 셀 내부를
    // 통과하는 리더선은 source/target 구분 없이 후보 점수에 반영한다.
    var M=1.5,L=o.x+M,R=o.r-M,T=o.y+M,B=o.b-M;
    if(L&gt;=R||T&gt;=B)return false;
    var dx=seg.x2-seg.x1,dy=seg.y2-seg.y1,t0=0,t1=1;
    function clip(p,q){
      if(Math.abs(p)&lt;.000001)return q&gt;=0;
      var t=q/p;
      if(p&lt;0){if(t&gt;t1)return false;if(t&gt;t0)t0=t;}
      else {if(t&lt;t0)return false;if(t&lt;t1)t1=t;}
      return true;
    }
    return clip(-dx,seg.x1-L)&amp;&amp;clip(dx,R-seg.x1)
      &amp;&amp;clip(-dy,seg.y1-T)&amp;&amp;clip(dy,B-seg.y1)&amp;&amp;t1&gt;=t0;
  }
  function segmentCoverLength(s,box){
    // 직교 세그먼트가 라벨 박스에 가려지는 길이. route()의 점은 전부 직교라
    // 나눗셈 없이 겹친 구간 길이만 재면 된다. 테두리에 스치는 선은 제외한다.
    var M=1;
    if(Math.abs(s.y1-s.y2)&lt;.5){
      if(s.y1&lt;=box.y+M||s.y1&gt;=box.b-M)return 0;
      return Math.max(0,Math.min(Math.max(s.x1,s.x2),box.r)-Math.max(Math.min(s.x1,s.x2),box.x));
    }
    if(Math.abs(s.x1-s.x2)&lt;.5){
      if(s.x1&lt;=box.x+M||s.x1&gt;=box.r-M)return 0;
      return Math.max(0,Math.min(Math.max(s.y1,s.y2),box.b)-Math.max(Math.min(s.y1,s.y2),box.y));
    }
    return 0;
  }
  function labelPenalty(box,p,own,limit){
    var score=p.offset||0;
    if(limit===undefined)limit=Infinity;
    if(box.x&lt;4)score+=(4-box.x)*100000;
    if(box.y&lt;4)score+=(4-box.y)*100000;
    if(box.r&gt;board.scrollWidth-4)score+=(box.r-board.scrollWidth+4)*100000;
    if(box.b&gt;board.scrollHeight-4)score+=(box.b-board.scrollHeight+4)*100000;
    if(score&gt;=limit)return score;
    OB.forEach(function(o){
      var padded={x:o.x-6,y:o.y-6,r:o.r+6,b:o.b+6};
      if(overlaps(box,padded))score+=1000000+overlapArea(box,padded)*1000;
    });
    if(score&gt;=limit)return score;
    TB.forEach(function(o){
      var padded={x:o.x-4,y:o.y-4,r:o.r+4,b:o.b+4};
      if(overlaps(box,padded))score+=1000000+overlapArea(box,padded)*1000;
    });
    if(score&gt;=limit)return score;
    /* 남의 연결선을 덮으면 그 선이 끊어져 보인다. 가린 길이에 비례해 매긴다 —
       수직 교차는 라벨 높이(~18px)만 가려 점선처럼 보이지만, 평행하게 얹히면
       라벨 폭 전체가 사라져 &quot;선이 끊겼다&quot;로 읽힌다. 자기 경로 위에 얹는 것은
       라벨과 선의 소속을 분명히 하려는 의도된 배치이므로 제외한다. */
    pathSegs.forEach(function(s){
      if(s.ed===own)return;
      var cov=segmentCoverLength(s,box);
      if(cov&gt;2)score+=80000+cov*5000;
    });
    if(score&gt;=limit)return score;
    arrowBoxes.forEach(function(o){if(overlaps(box,o))score+=250000+overlapArea(box,o)*100;});
    labelBoxes.forEach(function(o){if(overlaps(box,o))score+=750000+overlapArea(box,o)*1000;});
    var leader=leaderSegment(box,p);
    if(leader){
      // 일반 거리 점수와 화살촉 패널티보다 크게 두되 라벨·카드 겹침보다는
      // 낮게 두어, 카드 내부를 가로지르는 리더선보다 빈 거터를 우선한다.
      OB.forEach(function(o){if(segmentHitsBox(leader,o))score+=500000;});
      TB.forEach(function(o){if(segmentHitsBox(leader,o))score+=500000;});
      labelBoxes.forEach(function(o){if(segmentHitsBox(leader,o))score+=500000;});
    }
    // 현재 라벨도 앞서 확정된 리더선을 덮지 않게 하여 어느 연결선의
    // 설명인지 시각적으로 뒤바뀌는 일을 막는다.
    leaderSegments.forEach(function(seg){if(segmentHitsBox(seg,box))score+=500000;});
    return score;
  }
  labelJobs.forEach(function(job){
    var group=document.createElementNS(NS,&#x27;g&#x27;); group.setAttribute(&#x27;class&#x27;,&#x27;edge-label-group&#x27;);
    group.setAttribute(&#x27;data-edge-id&#x27;,job.ed.id);
    group.setAttribute(&#x27;data-edge-kind&#x27;,isBranch(job.ed)?&#x27;sequence-branch&#x27;:(job.ed.type||&#x27;sequence&#x27;));
    group.setAttribute(&#x27;data-edge-source&#x27;,job.ed.source);
    group.setAttribute(&#x27;data-edge-target&#x27;,job.ed.target);
    var bg=document.createElementNS(NS,&#x27;rect&#x27;); bg.setAttribute(&#x27;class&#x27;,&#x27;edge-label-bg&#x27;);
    bg.setAttribute(&#x27;rx&#x27;,&#x27;4&#x27;); bg.setAttribute(&#x27;fill&#x27;,BG); bg.setAttribute(&#x27;fill-opacity&#x27;,&#x27;.96&#x27;);
    var txt=document.createElementNS(NS,&#x27;text&#x27;); txt.setAttribute(&#x27;class&#x27;,&#x27;edge-label&#x27;);
    txt.setAttribute(&#x27;x&#x27;,&#x27;0&#x27;); txt.setAttribute(&#x27;y&#x27;,&#x27;0&#x27;); txt.setAttribute(&#x27;text-anchor&#x27;,&#x27;middle&#x27;);
    txt.setAttribute(&#x27;dominant-baseline&#x27;,&#x27;central&#x27;); txt.setAttribute(&#x27;fill&#x27;,job.color);
    txt.setAttribute(&#x27;font-size&#x27;,&#x27;10&#x27;); txt.setAttribute(&#x27;font-weight&#x27;,&#x27;700&#x27;);
    txt.style.visibility=&#x27;hidden&#x27;; txt.textContent=job.ed.label;
    var title=document.createElementNS(NS,&#x27;title&#x27;); title.textContent=txt.textContent;
    group.appendChild(bg); group.appendChild(txt); group.appendChild(title); svg.appendChild(group);
    var measured=txt.getBBox(),w=Math.max(measured.width,txt.getComputedTextLength())+7;
    var h=Math.max(measured.height,12)+5;
    var candidates=labelCandidates(job.rt,w,h,job.sourceBox,job.targetBox);
    /* 점수는 offset에 음이 아닌 패널티만 더하므로 score &gt;= offset 이 늘 성립한다.
       offset 오름차순으로 보면 bestScore &lt;= 현재 offset 인 순간 남은 후보는
       전부 개선 불가다. 후보 수백 개 중 대개 수십 개만 평가하고 끝난다. */
    candidates.sort(function(x,y){return (x.offset||0)-(y.offset||0);});
    var best=null,bestScore=Infinity;
    for(var ci=0;ci&lt;candidates.length;ci++){
      var p=candidates[ci];
      if(bestScore&lt;=(p.offset||0))break;
      var b=candidateBox(p,w,h),s=labelPenalty(b,p,job.ed,bestScore);
      if(s&lt;bestScore){best={p:p,box:b};bestScore=s;}
    }
    if(!best){
      var first=uniq(job.rt.pts)[0]; best={p:{x:first.x,y:first.y,anchor:first},box:candidateBox(first,w,h)};
    }
    var lead=leaderSegment(best.box,best.p);
    if(lead){
      var leader=document.createElementNS(NS,&#x27;line&#x27;);
      leader.setAttribute(&#x27;class&#x27;,&#x27;edge-label-leader&#x27;);
      leader.setAttribute(&#x27;x1&#x27;,rnd(lead.x1)); leader.setAttribute(&#x27;y1&#x27;,rnd(lead.y1));
      leader.setAttribute(&#x27;x2&#x27;,rnd(lead.x2)); leader.setAttribute(&#x27;y2&#x27;,rnd(lead.y2));
      leader.setAttribute(&#x27;stroke&#x27;,job.color); leader.setAttribute(&#x27;stroke-width&#x27;,&#x27;1&#x27;);
      leader.setAttribute(&#x27;stroke-dasharray&#x27;,&#x27;2 2&#x27;); leader.setAttribute(&#x27;opacity&#x27;,&#x27;.55&#x27;);
      group.insertBefore(leader,bg);
      leaderSegments.push(lead);
    }
    labelBoxes.push(best.box);
    bg.setAttribute(&#x27;x&#x27;,rnd(best.box.x)); bg.setAttribute(&#x27;y&#x27;,rnd(best.box.y));
    bg.setAttribute(&#x27;width&#x27;,rnd(w)); bg.setAttribute(&#x27;height&#x27;,rnd(h));
    bg.setAttribute(&#x27;stroke&#x27;,job.color); bg.setAttribute(&#x27;stroke-opacity&#x27;,&#x27;.18&#x27;);
    txt.setAttribute(&#x27;x&#x27;,rnd(best.p.x)); txt.setAttribute(&#x27;y&#x27;,rnd(best.p.y));
    /* 패널티로도 못 피한 겹침이 남으면 불투명 사각형을 고집하지 않는다.
       배경을 낮추고 글자 획 주변만 배경색으로 둘러(헤일로) 선이 라벨 뒤로
       이어져 보이게 한다. 지도 라벨의 표준 기법이며, 가리는 면적이 사각형
       전체에서 글자 윤곽으로 줄어 &quot;선이 끊겼다&quot;로 읽히지 않는다. */
    var residual=0;
    pathSegs.forEach(function(s){ if(s.ed!==job.ed) residual+=segmentCoverLength(s,best.box); });
    if(residual&gt;2){
      bg.setAttribute(&#x27;fill-opacity&#x27;,&#x27;.55&#x27;);
      txt.setAttribute(&#x27;paint-order&#x27;,&#x27;stroke&#x27;);
      txt.setAttribute(&#x27;stroke&#x27;,BG); txt.setAttribute(&#x27;stroke-width&#x27;,&#x27;3&#x27;);
      txt.setAttribute(&#x27;stroke-linejoin&#x27;,&#x27;round&#x27;);
      group.setAttribute(&#x27;data-covers&#x27;,rnd(residual));
    }
    txt.style.visibility=&#x27;visible&#x27;;
  });
}

function openNode(id){
  var n=NODES[id]; if(!n)return;
  var h=&#x27;&lt;span class=&quot;badge plain muted&quot;&gt;&#x27;+(n.display_id||n.id)+&#x27;&lt;/span&gt; &#x27;
       +&#x27;&lt;span class=&quot;badge plain muted&quot;&gt;&#x27;+n.lane+&#x27;&lt;/span&gt; &#x27;
       +&#x27;&lt;span class=&quot;badge plain muted&quot;&gt;&#x27;+n.stage+&#x27;&lt;/span&gt;&#x27;
       +(n.workflow_kind_label?&#x27; &lt;span class=&quot;badge info&quot;&gt;&#x27;+n.workflow_kind_label+&#x27;&lt;/span&gt;&#x27;:&#x27;&#x27;);
  h+=&#x27;&lt;h3&gt;&#x27;+n.name+&#x27;&lt;/h3&gt;&#x27;;
  h+=&#x27;&lt;dl class=&quot;kv&quot;&gt;&#x27;;
  h+=&#x27;&lt;dt&gt;담당&lt;/dt&gt;&lt;dd&gt;&#x27;+n.actor+&#x27;&lt;/dd&gt;&#x27;;
  if(n.consulted_authorities) h+=&#x27;&lt;dt&gt;협의·관할기관&lt;/dt&gt;&lt;dd&gt;&#x27;+n.consulted_authorities+&#x27;&lt;/dd&gt;&#x27;;
  if(n.action) h+=&#x27;&lt;dt&gt;내용&lt;/dt&gt;&lt;dd&gt;&#x27;+n.action+&#x27;&lt;/dd&gt;&#x27;;
  if(n.applicability) h+=&#x27;&lt;dt&gt;적용 조건&lt;/dt&gt;&lt;dd&gt;&#x27;+n.applicability+&#x27;&lt;/dd&gt;&#x27;;
  if(n.deadline) h+=&#x27;&lt;dt&gt;기한&lt;/dt&gt;&lt;dd&gt;&#x27;+n.deadline+&#x27;&lt;/dd&gt;&#x27;;
  if(n.output_documents&amp;&amp;n.output_documents.length)
    h+=&#x27;&lt;dt&gt;산출 문서&lt;/dt&gt;&lt;dd&gt;&#x27;+n.output_documents.join(&#x27; · &#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  if(n.blocker) h+=&#x27;&lt;dt&gt;병목&lt;/dt&gt;&lt;dd style=&quot;color:var(--warn)&quot;&gt;&#x27;+n.blocker+&#x27;&lt;/dd&gt;&#x27;;
  if(n.legal_basis&amp;&amp;n.legal_basis.length){
    var basisLabel=n.basis_scope===&#x27;axis&#x27;?&#x27;축 전체 관련 제도 근거&#x27;
      :(n.workflow_kind===&#x27;statutory&#x27;?&#x27;근거 조문&#x27;:&#x27;관련 제도 근거&#x27;);
    h+=&#x27;&lt;dt&gt;&#x27;+basisLabel+&#x27;&lt;/dt&gt;&lt;dd&gt;&#x27;+n.legal_basis.map(function(l){
      var nm=l.url?&#x27;&lt;a class=&quot;ref&quot; href=&quot;&#x27;+l.url+&#x27;&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;&#x27;+l.law+&#x27;&lt;/a&gt;&#x27;:l.law;
      var meta=(l.kind?&#x27; &lt;span class=&quot;badge plain muted&quot;&gt;&#x27;+l.kind+&#x27;&lt;/span&gt;&#x27;:&#x27;&#x27;)
        +(l.scope_label?&#x27; &lt;span class=&quot;badge info&quot;&gt;&#x27;+l.scope_label+&#x27;&lt;/span&gt;&#x27;:&#x27;&#x27;)
        +(l.verification?&#x27; &lt;span class=&quot;badge &#x27;+l.verification_tone+&#x27;&quot;&gt;&#x27;+l.verification+&#x27;&lt;/span&gt;&#x27;:&#x27;&#x27;);
      return &#x27;&lt;div style=&quot;margin-bottom:9px&quot;&gt;&#x27;+nm+&#x27; &lt;code&gt;&#x27;+l.article+&#x27;&lt;/code&gt;&#x27;+meta
        +(l.note?&#x27;&lt;div style=&quot;margin-top:3px;color:var(--muted)&quot;&gt;&#x27;+l.note+&#x27;&lt;/div&gt;&#x27;:&#x27;&#x27;)+&#x27;&lt;/div&gt;&#x27;;}).join(&#x27;&#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  }
  if(typeof n.confidence===&#x27;number&#x27;){
    h+=&#x27;&lt;dt&gt;법령 근거 확신도&lt;/dt&gt;&lt;dd&gt;&#x27;+n.confidence.toFixed(2)
      +(n.confidence&lt;0.8?&#x27; &lt;span class=&quot;badge warn&quot;&gt;현장 검증 필요&lt;/span&gt;&#x27;:&#x27;&#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  }
  if(n.confidence_reason) h+=&#x27;&lt;dt&gt;확신도 산정 근거&lt;/dt&gt;&lt;dd&gt;&#x27;+n.confidence_reason+&#x27;&lt;/dd&gt;&#x27;;
  if(n.evidence_status) h+=&#x27;&lt;dt&gt;근거 상태&lt;/dt&gt;&lt;dd&gt;&#x27;+n.evidence_status+&#x27;&lt;/dd&gt;&#x27;;
  if(n.report_use) h+=&#x27;&lt;dt&gt;보고서 반영&lt;/dt&gt;&lt;dd&gt;&#x27;+n.report_use+&#x27;&lt;/dd&gt;&#x27;;
  if(n.permit_gates&amp;&amp;n.permit_gates.length){
    h+=&#x27;&lt;dt&gt;연결 인허가 절차&lt;/dt&gt;&lt;dd&gt;&#x27;+n.permit_gates.map(function(g){
      var dep=g.depends_on&amp;&amp;g.depends_on.length?&#x27; · 선행 절차 &#x27;+g.depends_on.map(function(x){return &#x27;P&#x27;+x;}).join(&#x27;, &#x27;):&#x27;&#x27;;
      return &#x27;&lt;div style=&quot;margin-bottom:8px&quot;&gt;&lt;b&gt;P&#x27;+g.order+&#x27; &#x27;+g.gate+&#x27;&lt;/b&gt;&#x27;+dep
        +&#x27;&lt;div&gt;&#x27;+g.decision+&#x27;&lt;/div&gt;&lt;div style=&quot;color:var(--muted)&quot;&gt;산출물 · &#x27;+g.output+&#x27;&lt;/div&gt;&lt;/div&gt;&#x27;;}).join(&#x27;&#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  }
  if(n.open_questions&amp;&amp;n.open_questions.length){
    h+=&#x27;&lt;dt&gt;현장 확인질문&lt;/dt&gt;&lt;dd&gt;&#x27;+n.open_questions.map(function(q){
      return &#x27;&lt;div style=&quot;margin-bottom:10px&quot;&gt;&lt;span class=&quot;badge &#x27;+(q.blocking?&#x27;bad&#x27;:&#x27;muted&#x27;)+&#x27;&quot;&gt;&#x27;
        +(q.blocking?&#x27;Gate 차단&#x27;:&#x27;추가 확인&#x27;)+&#x27;&lt;/span&gt; &lt;code&gt;&#x27;+q.id+&#x27;&lt;/code&gt;&lt;div&gt;&#x27;+q.question+&#x27;&lt;/div&gt;&#x27;
        +&#x27;&lt;div style=&quot;color:var(--muted)&quot;&gt;영향 · &#x27;+q.why+&#x27;&lt;/div&gt;&#x27;
        +&#x27;&lt;div style=&quot;color:var(--muted)&quot;&gt;확인기관 · &#x27;+q.confirm_with.join(&#x27; · &#x27;)+&#x27;&lt;/div&gt;&#x27;
        +&#x27;&lt;div style=&quot;color:var(--muted)&quot;&gt;증빙 · &#x27;+q.evidence.join(&#x27; · &#x27;)+&#x27;&lt;/div&gt;&lt;/div&gt;&#x27;;}).join(&#x27;&#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  }
  var ins=EDGES.filter(function(x){return x.target===id}),
      outs=EDGES.filter(function(x){return x.source===id});
  /* 보드에서 순차 라벨을 접어 두므로 여기가 전이 문구를 빠짐없이 보는 자리다.
     한 줄로 이어붙이면 묻히므로 연결 종류별 배지로 세워 준다. */
  function edgeLine(otherId,x){
    var tone=x.type===&#x27;loop&#x27;?&#x27;back&#x27;:(x.type===&#x27;message&#x27;?&#x27;info&#x27;:&#x27;muted&#x27;);
    return &#x27;&lt;div style=&quot;margin-bottom:5px&quot;&gt;&#x27;+(NODES[otherId]?NODES[otherId].name:otherId)

  }
  if(ins.length) h+=&#x27;&lt;dt&gt;선행&lt;/dt&gt;&lt;dd&gt;&#x27;+ins.map(function(x){
    return edgeLine(x.source,x);}).join(&#x27;&#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  if(outs.length) h+=&#x27;&lt;dt&gt;후속&lt;/dt&gt;&lt;dd&gt;&#x27;+outs.map(function(x){
    return edgeLine(x.target,x);}).join(&#x27;&#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  h+=&#x27;&lt;/dl&gt;&#x27;;
  document.getElementById(&#x27;dbody&#x27;).innerHTML=h;

/* 인접 카드 강조와 숨긴 순차 라벨 노출을 한 곳에서 처리한다. focus·blur를 함께
   걸어 마우스 없이 Tab만으로도 같은 정보에 닿게 한다 — 카드는 button이라 원래
   포커스를 받는데 지금까지 hover에만 반응해 키보드에서는 강조가 동작하지 않았다. */
function peek(id,on){
  var rel={};rel[id]=1;
  EDGES.forEach(function(x){if(x.source===id)rel[x.target]=1;if(x.target===id)rel[x.source]=1;});
  document.querySelectorAll(&#x27;.node&#x27;).forEach(function(o){o.classList.toggle(&#x27;dim&#x27;,on&amp;&amp;!rel[o.dataset.id])});
  var sv=document.getElementById(&#x27;edges&#x27;); if(!sv)return;
  sv.querySelectorAll(&#x27;.edge-label-group&#x27;).forEach(function(g){
    g.classList.toggle(&#x27;lit&#x27;, on &amp;&amp; (g.getAttribute(&#x27;data-edge-source&#x27;)===id
                                   ||g.getAttribute(&#x27;data-edge-target&#x27;)===id));
  });
}
document.querySelectorAll(&#x27;.node&#x27;).forEach(function(b){
  b.addEventListener(&#x27;click&#x27;,function(){openNode(b.dataset.id)});
  b.addEventListener(&#x27;mouseenter&#x27;,function(){peek(b.dataset.id,true)});
  b.addEventListener(&#x27;focus&#x27;,function(){peek(b.dataset.id,true)});
  b.addEventListener(&#x27;mouseleave&#x27;,function(){peek(b.dataset.id,false)});
  b.addEventListener(&#x27;blur&#x27;,function(){peek(b.dataset.id,false)});
});
