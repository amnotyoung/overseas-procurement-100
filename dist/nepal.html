&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;한 장 캔버스&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;국가개발계획 우선순위에 따라 원조사업을 선정하고, 재무부를 단일 창구로 삼아 공여기관과의 접촉·협상·협정 체결을 일원화함으로써 수원국의 주인의식과 재원관리 책무성을 확보한다.&lt;/p&gt;
  &lt;div class=&quot;cards&quot;&gt;
    &lt;div class=&quot;card span2&quot;&gt;&lt;h3&gt;절차&lt;/h3&gt;&lt;ol class=&quot;steps&quot;&gt;&lt;li&gt;수원기관이 공여기관과 접촉하기 전 재무부의 사전 승인을 받는다 — 요청·제안·협상·정보제공·개념서 서신교환·MoU 체결 모두 포함 (FAMP §3.3.2(k))&lt;/li&gt;&lt;li&gt;공여기관도 원조 동원에 앞서 재무부 승인을 받는다 (FAMP §3.3.5(b))&lt;/li&gt;&lt;li&gt;수원기관이 사업 준비성 체크리스트에 따라 재무부에 사업제안서 제출 — KOICA 사업은 PCP를 N-2년 기준으로 작성 (FAMP §3.3.2(b))&lt;/li&gt;&lt;li&gt;수원기관 상급부처 및 재무부 검토&lt;/li&gt;&lt;li&gt;재무부 공한과 함께 PCP를 KOICA 네팔사무소에 제출&lt;/li&gt;&lt;li&gt;KOICA 본부 PCP 검토위원회 심사 → 통과 시 예비조사 실시&lt;/li&gt;&lt;li&gt;예비조사 결과로 사업제안서 최종 승인 시 기획조사 실시&lt;/li&gt;&lt;li&gt;기획조사 산출물인 PD(Project Document) 도출 후 PD 심사위원회 심사&lt;/li&gt;&lt;li&gt;위원회 통과 시 대한민국 재정당국에 예산요구&lt;/li&gt;&lt;li&gt;소관부처와 협의의사록(RoD) 체결&lt;/li&gt;&lt;li&gt;주네팔 대한민국대사관 ↔ 네팔 재무부 간 양해각서(MoU) 체결 — 재무부가 정부를 대표해 서명 (FAMP §3.3.1(d))&lt;/li&gt;&lt;li&gt;MoU에 근거해 PMC 파견인력 비자·노동허가 지원, 조세면제는 개별 협정과 현행법에 따름 (FAMP §3.6.1)&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;적용 대상&lt;/h3&gt;&lt;p style=&quot;margin:0;font-size:13.5px;line-height:1.7&quot;&gt;네팔 정부가 수원하는 대외원조 전반에 적용된다. 무상원조는 원칙적으로 세금 납부에 사용할 수 없고, 차관 재원 사업에는 조세면제 조항을 원칙적으로 넣지 않으며, 국내에서 충분히 생산되는 물품의 수입에는 면제를 부여하지 않는다(FAMP §3.6.1). 현물 지원은 소관부처 추천을 받아 재무부가 현행법에 따라 조세면제를 부여할 수 있다. 2019년 정책의 &amp;#x27;양허성 차관은 사업당 1천만 달러 초과만 수용&amp;#x27; 문턱은 2025년 정책에서 삭제됐다.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;법적 근거&lt;/h3&gt;&lt;div class=&quot;law&quot;&gt;&lt;span class=&quot;nm&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://mof.gov.np/divisions/ierd/content/1564/foreign-aid-mobilization-policy--2025/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Foreign Aid Mobilization Policy, 2025&lt;/a&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;§3.2, §3.3.1, §3.3.2, §3.3.5, §3.6.1, §3.7&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:auto&quot;&gt;지침·정책&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;law&quot;&gt;&lt;span class=&quot;nm&quot;&gt;Public Debt Management Act, 2079 (2022)&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:auto&quot;&gt;법률&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;law&quot;&gt;&lt;span class=&quot;nm&quot;&gt;Financial Procedure and Fiscal Accountability Act, 2076 (2019)&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:auto&quot;&gt;법률&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;law&quot;&gt;&lt;span class=&quot;nm&quot;&gt;협의의사록(Record of Discussion, RoD)&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:auto&quot;&gt;양자합의&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;law&quot;&gt;&lt;span class=&quot;nm&quot;&gt;양해각서(Memorandum of Understanding, MoU) — 주네팔 대한민국대사관 ↔ 네팔 재무부&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:auto&quot;&gt;양자합의&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;law&quot;&gt;&lt;span class=&quot;nm&quot;&gt;KOICA 사업심사 가이드라인 및 PCP·PD 심사 일정&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:auto&quot;&gt;공여기관 규정&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;권한 기관&lt;/h3&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;&lt;a class=&quot;ref&quot; href=&quot;https://mof.gov.np/divisions/ierd/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;재무부(MoF) 국제경제관계국&lt;/a&gt;&lt;/b&gt;&lt;span&gt;대외원조 동원의 단일 창구(focal point). 개발파트너와의 서신·요청·협상·재정협정 서명을 정부를 대표해 수행. 차관 협상 전 내각의 원칙적 동의와 협상 권한을 확보하고 현물 지원의 조세면제를 승인&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;수원기관 및 상급 소관부처&lt;/b&gt;&lt;span&gt;사업 발굴, 사업 준비성 체크리스트에 따른 제안서 제출, 협상 대표 지명, 사업책임자 임명, RoD 체결 당사자. 공여기관 접촉 전 재무부 사전 승인 필요&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;&lt;a class=&quot;ref&quot; href=&quot;https://npc.gov.np/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;국가계획위원회(NPC)&lt;/a&gt;&lt;/b&gt;&lt;span&gt;개발협력 조정기구의 위원으로 참여. 2019년 정책에 있던 &amp;#x27;사업 제안 시 NPC 동의&amp;#x27; 요건은 2025년 정책에서 삭제됨&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;&lt;a class=&quot;ref&quot; href=&quot;https://koica.go.kr/sites/nepal_kr/index.do&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;KOICA 네팔사무소&lt;/a&gt;&lt;/b&gt;&lt;span&gt;PCP 접수, 현지 협의, 사업 형성 지원&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.koica.go.kr/sites/koica_kr/index.do&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;KOICA 본부&lt;/a&gt;&lt;/b&gt;&lt;span&gt;PCP 검토위원회·PD 심사위원회 운영, 예비조사·기획조사 실시 결정&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;&lt;a class=&quot;ref&quot; href=&quot;https://np.mofa.go.kr/np-ko/index.do&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;주네팔 대한민국대사관&lt;/a&gt;&lt;/b&gt;&lt;span&gt;네팔 재무부와 MoU 체결 당사자&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;주·지방정부&lt;/b&gt;&lt;span&gt;관할 구역 사업 발굴 및 소관부처를 거쳐 재무부에 제안. 협상 대표 지명, 현물 지원은 재무부 승인 필요&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;이해관계자&lt;/h3&gt;&lt;p style=&quot;margin:0;font-size:13.5px;line-height:1.7&quot;&gt;네팔 재무부(MoF) 국제경제관계국, 수원기관 및 상급 소관부처, 주·지방정부, 국가계획위원회(NPC), KOICA 네팔사무소, KOICA 본부, 주네팔 대한민국대사관, 대한민국 재정당국, 사업수행 PMC&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;제출서류&lt;/h3&gt;&lt;div class=&quot;docset&quot;&gt;&lt;b&gt;수원기관·소관부처&lt;/b&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;재무부 사전 승인 (공여기관 접촉·제안·협상·서신·MoU 체결 전, FAMP §3.3.2(k))&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;사업 준비성 체크리스트에 따른 사업제안서 (FAMP §3.3.2(b))&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;사업제안서(Project Concept Paper, PCP) — KOICA 사업&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;협상 대표 지명서 (FAMP §3.3.2(c))&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;docset&quot;&gt;&lt;b&gt;네팔 재무부&lt;/b&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;PCP 송부 공한&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;재정협정(financing agreement) (FAMP §3.3.1(d))&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;차관 협상 전 내각 원칙동의·협상권한 (FAMP §3.3.1(e))&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;현물 지원 조세면제 승인 (FAMP §3.6.1(d))&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;docset&quot;&gt;&lt;b&gt;공여기관(개발파트너)&lt;/b&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;원조 동원 전 재무부 승인 (FAMP §3.3.5(b))&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;향후 3~5년 지원 규모·중점분야 통보 (FAMP §3.3.5(c))&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;대외원조정보시스템 보고 (FAMP §3.3.5(i))&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;docset&quot;&gt;&lt;b&gt;KOICA&lt;/b&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;PCP 검토위원회 결과&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;예비조사 보고서&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;기획조사 결과&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;사업기획문서(Project Document, PD)&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;PD 심사위원회 결과&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;docset&quot;&gt;&lt;b&gt;양국 정부&lt;/b&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;협의의사록(RoD)&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;양해각서(MoU)&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;유의사항 · 병목&lt;/h3&gt;&lt;ul class=&quot;plain&quot;&gt;&lt;li&gt;재무부 사전 승인 없이 수원기관과 먼저 접촉하면 정책 위반이 된다. 공여기관 역시 원조 동원에 앞서 재무부 승인을 받아야 한다 (FAMP §3.3.2(k), §3.3.5(b))&lt;/li&gt;&lt;li&gt;조세면제가 2019년 정책보다 좁아졌다. 무상원조는 원칙적으로 세금 납부에 쓸 수 없고, 국내에서 충분히 생산되는 물품 수입에는 면제가 없다 — 기자재 조달 시 원산지와 세부담을 사업비에 반영해야 한다 (FAMP §3.6.1(a)(c))&lt;/li&gt;&lt;li&gt;N-2년 PCP 제출 구조라 사업 착수까지 최소 2년 이상의 리드타임이 필요하다&lt;/li&gt;&lt;li&gt;PCP 검토위원회와 PD 심사위원회 두 개의 게이트를 모두 통과해야 예산요구로 넘어간다&lt;/li&gt;&lt;li&gt;연방제 시행·확산으로 사업 추진 책임과 권한이 지방으로 분산되면서 과도기적 비효율과 혼선이 발생. 재무부뿐 아니라 관련 중앙부처와 지방부처 모두와 협의해야 한다&lt;/li&gt;&lt;li&gt;기술협력 재원으로 차량·장비를 구매하거나 해외 연수·훈련에 참가하려면 재무부 사전 승인이 필요하다 (FAMP §3.3.2(j))&lt;/li&gt;&lt;li&gt;행정절차 지연, 환율 변동, 보수적인 비자 발급 운영&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;진입장벽&lt;/h3&gt;&lt;ul class=&quot;plain&quot;&gt;&lt;li&gt;기업 진출 시 현지 파트너 협력이 사실상 필수 요건&lt;/li&gt;&lt;li&gt;2022년 부패인식지수(CPI) 35점/100점, 180개국 중 108위&lt;/li&gt;&lt;li&gt;연방제 전환에 따른 협의 대상 다변화로 이해관계자 파악 부담 증가&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;현장 검증 필요&lt;/h3&gt;&lt;ul class=&quot;plain&quot;&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;관련 제도&lt;/h3&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;네팔 공공조달 입찰제도&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;네팔 조달 거버넌스·감독체계&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;법령 원문&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;현장에서 발주처에 그대로 제시할 수 있는 조문 원문입니다. 우리 요약이 아니라 verbatim이며,
    조문 번호를 누르면 원문 문서로 이동합니다. 한국어 요지 아래로 직역(참고용)을 펼칠 수 있습니다.&lt;/p&gt;
  &lt;div class=&quot;quotes&quot;&gt;&lt;div class=&quot;qc&quot;&gt;
  &lt;div class=&quot;qhd&quot;&gt;
    &lt;span class=&quot;qart&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://mof.gov.np/divisions/ierd/content/1564/foreign-aid-mobilization-policy--2025/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;§3.7.1&lt;/a&gt;&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;Foreign Aid Mobilization Policy, 2025&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;qtext&quot;&gt;International Development Cooperation Policy, 2076 (2019 AD) has been repealed.&lt;/div&gt;
  &lt;p class=&quot;qgist&quot;&gt;대외원조 동원 절차의 현행 근거는 Foreign Aid Mobilization Policy 2025이다.&lt;/p&gt;
  &lt;details&gt;&lt;summary&gt;한국어 직역(참고 — 공식 번역 아님)&lt;/summary&gt;&lt;p class=&quot;qko&quot;&gt;국제개발협력정책 2076(2019년)은 폐지됐다.&lt;/p&gt;&lt;/details&gt;
&lt;/div&gt;&lt;div class=&quot;qc&quot;&gt;
  &lt;div class=&quot;qhd&quot;&gt;
    &lt;span class=&quot;qart&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://mof.gov.np/divisions/ierd/content/1564/foreign-aid-mobilization-policy--2025/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;§3.3.2(k)&lt;/a&gt;&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;Foreign Aid Mobilization Policy, 2025&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;qtext&quot;&gt;All government agencies at any level, constitutional bodies, state owned enterprises, and institutions or foundations operating under full or partial government grants must obtain prior approval from the Ministry before seeking foreign aid, making formal requests, presenting proposals, engaging in negotiations, sharing any information, corresponding with development partners with concept papers and proposals, or signing memorandums of understanding or agreements.&lt;/div&gt;
  &lt;p class=&quot;qgist&quot;&gt;정부기관은 원조 제안·협상·정보제공·개념서 서신교환·MoU 체결에 앞서 재무부 사전 승인을 받아야 한다.&lt;/p&gt;
  &lt;details&gt;&lt;summary&gt;한국어 직역(참고 — 공식 번역 아님)&lt;/summary&gt;&lt;p class=&quot;qko&quot;&gt;모든 수준의 정부기관·헌법기관·공기업 및 정부 전액·일부 보조로 운영되는 기관·재단은, 대외원조를 구하거나 공식 요청·제안·협상·정보제공, 개발파트너와의 개념서·제안서 서신교환, MoU·협정 체결에 앞서 재무부의 사전 승인을 받아야 한다.&lt;/p&gt;&lt;/details&gt;
&lt;/div&gt;&lt;div class=&quot;qc&quot;&gt;
  &lt;div class=&quot;qhd&quot;&gt;
    &lt;span class=&quot;qart&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://mof.gov.np/divisions/ierd/content/1564/foreign-aid-mobilization-policy--2025/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;§3.3.5(b)&lt;/a&gt;&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;Foreign Aid Mobilization Policy, 2025&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;qtext&quot;&gt;Obtain approval from the Ministry before mobilizing any kind of foreign aid.&lt;/div&gt;
  &lt;p class=&quot;qgist&quot;&gt;개발파트너(공여기관)도 어떤 형태의 원조를 동원하기 전에 재무부 승인을 받아야 한다.&lt;/p&gt;
  &lt;details&gt;&lt;summary&gt;한국어 직역(참고 — 공식 번역 아님)&lt;/summary&gt;&lt;p class=&quot;qko&quot;&gt;어떤 형태의 대외원조든 동원하기 전에 재무부의 승인을 받는다.&lt;/p&gt;&lt;/details&gt;
&lt;/div&gt;&lt;div class=&quot;qc&quot;&gt;
  &lt;div class=&quot;qhd&quot;&gt;
    &lt;span class=&quot;qart&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://mof.gov.np/divisions/ierd/content/1564/foreign-aid-mobilization-policy--2025/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;§3.6.1&lt;/a&gt;&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;Foreign Aid Mobilization Policy, 2025&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;qtext&quot;&gt;(a) Foreign aid received as grants shall generally not be used for tax payments. (b) Tax exemption provisions shall generally not be included in loan-funded projects. (c) No tax exemptions shall be granted for the import of goods that are sufficiently produced within the country.&lt;/div&gt;
  &lt;p class=&quot;qgist&quot;&gt;조세면제가 좁아졌다 — 무상원조는 세금 납부에 못 쓰고, 차관사업엔 면제 조항이 없으며, 국내 생산이 충분한 물품 수입엔 면제가 없다.&lt;/p&gt;
  &lt;details&gt;&lt;summary&gt;한국어 직역(참고 — 공식 번역 아님)&lt;/summary&gt;&lt;p class=&quot;qko&quot;&gt;(a) 무상으로 받은 대외원조는 원칙적으로 세금 납부에 사용하지 않는다. (b) 차관 재원 사업에는 원칙적으로 조세면제 조항을 포함하지 않는다. (c) 국내에서 충분히 생산되는 물품의 수입에는 조세면제를 부여하지 않는다.&lt;/p&gt;&lt;/details&gt;
&lt;/div&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;현행 기준 반영 4건&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;공식 법령·기관 원문으로 확인한 현행 기준과 실무 확인사항입니다.
    출처는 각 항목에 연결했으며.&lt;/p&gt;
  &lt;div class=&quot;disc&quot; data-sev=&quot;high&quot;&gt;
  &lt;div class=&quot;top&quot;&gt;
    &lt;span class=&quot;badge bad&quot;&gt;필수 확인&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;네팔&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;D01&lt;/span&gt;
  &lt;/div&gt;
  &lt;h3&gt;canvas.procedure / 사업 발굴 착수 지점&lt;/h3&gt;
  &lt;div class=&quot;quote act&quot;&gt;&lt;b&gt;현행 기준&lt;/b&gt;FAMP 2025 §3.3.2(k) — 모든 수준의 정부기관·헌법기관·공기업과 정부 출연·보조 기관은 대외원조를 구하거나, 공식 요청·제안, 협상, 정보 제공, 개념서와 제안서에 관한 서신교환, MoU 또는 협정 체결에 앞서 재무부의 사전 승인을 받아야 한다. §3.3.5(b) — 개발파트너는 어떤 형태의 대외원조를 동원하기 전에도 재무부의 승인을 받아야 한다.&lt;/div&gt;
  &lt;p class=&quot;cite&quot;&gt;확인 출처 · &lt;a class=&quot;ref&quot; href=&quot;https://mof.gov.np/divisions/ierd/content/1564/foreign-aid-mobilization-policy--2025/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Foreign Aid Mobilization Policy, 2025&lt;/a&gt; §3.3.2(k), §3.3.5(b)&lt;/p&gt;
  &lt;div class=&quot;todo&quot;&gt;&lt;b&gt;실무 확인&lt;/b&gt;사업 발굴을 위해 수원기관 부처에 먼저 연락하지 않는다. 재무부 국제경제관계국을 통한 접촉 경로를 먼저 확인하고, 수원기관이 재무부 사전 승인을 받았는지 확인한 뒤 협의를 진행한다. 공여기관 자신도 원조 동원 전 재무부 승인 대상이다.&lt;/div&gt;
  &lt;details class=&quot;review&quot;&gt;
  &lt;summary&gt;Field verification (English)&lt;/summary&gt;
  &lt;div class=&quot;rv&quot;&gt;
    &lt;p&gt;&lt;b&gt;Current legal basis&lt;/b&gt; — Foreign Aid Mobilization Policy 2025 §3.3.2(k) requires government agencies to obtain prior Ministry of Finance approval before seeking aid, making proposals, negotiating, sharing information, corresponding on concept papers, or signing MoUs; §3.3.5(b) requires development partners to obtain Ministry approval before mobilizing any aid.&lt;/p&gt;
    &lt;p class=&quot;rv-verify&quot;&gt;&lt;b&gt;✔ Verify&lt;/b&gt; — Confirm the MoF (International Economic Relations Division) approval route before contacting a line ministry, and check the recipient agency has prior MoF approval. This applies to the donor agency itself too (§3.3.5(b)).&lt;/p&gt;
  &lt;/div&gt;
&lt;/details&gt;

  &lt;p class=&quot;act-row&quot;&gt;산출물 반영 — procedure 1~2단계에 재무부 사전 승인을 명시하고 근거를 현행 FAMP §3.3.2(k)·§3.3.5(b)로 반영했다.&lt;/p&gt;
&lt;/div&gt;&lt;div class=&quot;disc&quot; data-sev=&quot;medium&quot;&gt;
  &lt;div class=&quot;top&quot;&gt;
    &lt;span class=&quot;badge warn&quot;&gt;추가 확인&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;네팔&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;D03&lt;/span&gt;
  &lt;/div&gt;
  &lt;h3&gt;canvas.procedure / PCP 작성 주체&lt;/h3&gt;
  &lt;div class=&quot;quote act&quot;&gt;&lt;b&gt;현행 기준&lt;/b&gt;FAMP 2025 §3.3.2(a)(b)는 소관부처가 대외원조 대상 사업 목록을 작성하고 사업 준비성 체크리스트에 따라 재무부에 제안서를 제출하도록 규정한다. 제안서 작성 주체는 소관부처이고 재무부는 접수·검토·송부 창구다.&lt;/div&gt;
  &lt;p class=&quot;cite&quot;&gt;확인 출처 · &lt;a class=&quot;ref&quot; href=&quot;https://mof.gov.np/divisions/ierd/content/1564/foreign-aid-mobilization-policy--2025/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Foreign Aid Mobilization Policy, 2025&lt;/a&gt; §3.3.2(a), §3.3.2(b), §3.3.1(a)&lt;/p&gt;
  &lt;div class=&quot;todo&quot;&gt;&lt;b&gt;실무 확인&lt;/b&gt;PCP 작성·협의 상대는 수원기관(소관부처)으로 보되, 송부는 재무부 공한을 거친다. 착수 시 KOICA 네팔사무소에 해당 사업의 준비성 체크리스트 서식과 제출 경로를 확인한다.&lt;/div&gt;
  &lt;details class=&quot;review&quot;&gt;
  &lt;summary&gt;Field verification (English)&lt;/summary&gt;
  &lt;div class=&quot;rv&quot;&gt;
    &lt;p&gt;&lt;b&gt;Current legal basis&lt;/b&gt; — FAMP 2025 §3.3.2(a)(b) has line ministries prepare a project list and submit proposals to the Ministry per a project readiness checklist; the Ministry receives, reviews and forwards. The preparer is the line ministry.&lt;/p&gt;
    &lt;p class=&quot;rv-verify&quot;&gt;&lt;b&gt;✔ Verify&lt;/b&gt; — Treat the line ministry as the PCP preparer; forwarding goes through a MoF letter. Confirm the readiness-checklist form and submission route with the KOICA Nepal office.&lt;/p&gt;
  &lt;/div&gt;
&lt;/details&gt;

  &lt;p class=&quot;act-row&quot;&gt;산출물 반영 — 절차상 정합적인 Ⅱ-1 서술(수원기관 작성 → 상급부처·재무부 검토 → 재무부 공한 첨부 송부)을 채택했다. 2025년 정책 §3.3.2(b)가 소관부처의 제안서 제출을 명시해 이 해석을 뒷받침한다.&lt;/p&gt;
&lt;/div&gt;&lt;div class=&quot;disc&quot; data-sev=&quot;medium&quot;&gt;
  &lt;div class=&quot;top&quot;&gt;
    &lt;span class=&quot;badge warn&quot;&gt;추가 확인&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;네팔&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;D04&lt;/span&gt;
  &lt;/div&gt;
  &lt;h3&gt;canvas.bottlenecks / 조세·관세 면제 범위&lt;/h3&gt;
  &lt;div class=&quot;quote act&quot;&gt;&lt;b&gt;현행 기준&lt;/b&gt;FAMP 2025 §3.6.1 — (a) 무상으로 받은 대외원조는 원칙적으로 세금 납부에 사용하지 않는다. (b) 차관 재원 사업에는 원칙적으로 조세면제 조항을 포함하지 않는다. (c) 국내에서 충분히 생산되는 물품의 수입에는 조세면제를 부여하지 않는다. (d) 현물 지원의 경우 소관부처 추천에 따라 재무부가 현행법에 따라 면제를 부여할 수 있다.&lt;/div&gt;
  &lt;p class=&quot;cite&quot;&gt;확인 출처 · &lt;a class=&quot;ref&quot; href=&quot;https://mof.gov.np/divisions/ierd/content/1564/foreign-aid-mobilization-policy--2025/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Foreign Aid Mobilization Policy, 2025&lt;/a&gt; §3.6.1(a)(b)(c)(d)&lt;/p&gt;
  &lt;div class=&quot;todo&quot;&gt;&lt;b&gt;실무 확인&lt;/b&gt;기자재 목록을 짤 때 네팔 국내에서 충분히 생산되는 품목인지 먼저 확인한다. 해당하면 면제를 전제로 예산을 잡지 않는다. 차관 연계 사업이면 면제 조항 자체가 없을 수 있으므로 협정문에서 확인한다.&lt;/div&gt;
  &lt;details class=&quot;review&quot;&gt;
  &lt;summary&gt;Field verification (English)&lt;/summary&gt;
  &lt;div class=&quot;rv&quot;&gt;
    &lt;p&gt;&lt;b&gt;Current legal basis&lt;/b&gt; — FAMP 2025 §3.6.1: (a) grants shall generally not be used for tax payments; (b) loan-funded projects shall generally not include tax-exemption provisions; (c) no exemption for importing goods sufficiently produced within Nepal.&lt;/p&gt;
    &lt;p class=&quot;rv-verify&quot;&gt;&lt;b&gt;✔ Verify&lt;/b&gt; — When listing equipment, check whether items are sufficiently produced in Nepal (no exemption). For loan-linked projects, check the financing agreement for any exemption clause.&lt;/p&gt;
  &lt;/div&gt;
&lt;/details&gt;

  &lt;p class=&quot;act-row&quot;&gt;산출물 반영 — applicability와 bottlenecks에 면제 제한을 반영하고, 마스터리스트 소요기간(약 3개월)은 2019년 정책 시기 실무 경험치로 fieldVerification에 남겼다.&lt;/p&gt;
&lt;/div&gt;&lt;div class=&quot;disc&quot; data-sev=&quot;low&quot;&gt;
  &lt;div class=&quot;top&quot;&gt;
    &lt;span class=&quot;badge muted&quot;&gt;참고&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;네팔&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;D05&lt;/span&gt;
  &lt;/div&gt;
  &lt;h3&gt;canvas.bottlenecks / 누락된 실무 제약&lt;/h3&gt;
  &lt;div class=&quot;quote act&quot;&gt;&lt;b&gt;현행 기준&lt;/b&gt;FAMP 2025 §3.3.2(j) — 소관부처는 기술협력 재원을 차량·장비 구매나 해외 연수·훈련 참가에 사용하려면 재무부의 사전 승인을 받아야 한다.&lt;/div&gt;
  &lt;p class=&quot;cite&quot;&gt;확인 출처 · &lt;a class=&quot;ref&quot; href=&quot;https://mof.gov.np/divisions/ierd/content/1564/foreign-aid-mobilization-policy--2025/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Foreign Aid Mobilization Policy, 2025&lt;/a&gt; §3.3.2(j)&lt;/p&gt;
  &lt;div class=&quot;todo&quot;&gt;&lt;b&gt;실무 확인&lt;/b&gt;기술협력 재원으로 차량·장비를 사거나 연수·훈련 해외 파견을 계획하면 재무부 사전 승인 절차를 일정에 반영한다.&lt;/div&gt;


  &lt;p class=&quot;act-row&quot;&gt;산출물 반영 — bottlenecks에 기술협력 재원 차량·장비 구매 및 해외 연수의 재무부 사전승인 요건을 반영했다.&lt;/p&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;검증&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;네팔 재무부의 Foreign Aid Mobilization Policy 2025와 의회·PPMO가 게시한 2026년 현행 조달법·시행규칙을 함께 대조했다. 원조사업 형성 절차와 이후 공공조달에 적용되는 금액 기준·기간·보증·불복·예외를 조문별로 분리 확인했다.&lt;/p&gt;
  &lt;div class=&quot;cards&quot;&gt;
    &lt;div class=&quot;card span2&quot;&gt;&lt;h3&gt;검증 범위&lt;/h3&gt;
      &lt;p style=&quot;margin:0;font-size:13.5px;line-height:1.7&quot;&gt;FAMP 2025 §3.1.3, §3.2, §3.3.1, §3.3.2, §3.3.5, §3.6.1, §3.7과 Public Procurement Act 현행 §§8, 14, 20~21, 41~46, 47~52A, 59, 65~67, Public Procurement Rules 현행 rr.53, 84~85, 104, 110, 120A, 129를 확인했다.&lt;/p&gt;
      &lt;p style=&quot;margin:12px 0 0;font-size:12.5px;color:var(--muted)&quot;&gt;확인일 2026-07-23 · 자료집 기준일 2026-02-23&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;대조에 쓴 원문&lt;/h3&gt;&lt;ul class=&quot;srcs&quot; style=&quot;padding-left:16px;margin:0&quot;&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://mof.gov.np/divisions/ierd/content/1564/foreign-aid-mobilization-policy--2025/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Foreign Aid Mobilization Policy, 2025 (वैदेशिक सहायता परिचालन नीति, २०८२) — English Translation&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;지침·정책&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;대조 조문 §3.1.3, §3.2, §3.3.1(a)(d)(e), §3.3.2(b)(c)(j)(k), §3.3.5(b)(c)(i), §3.6.1(a)~(g), §3.7.1, §3.7.2&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-23 · Government of Nepal, Ministry of Finance&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://giwmscdntwo.gov.np/media/pdf_upload/print_copy_IDCMP-2019_Eng-fullpage_20191107071739_ku6pxnl.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;International Development Cooperation Policy, 2019 — FAMP 2025 §3.7.1로 폐지됨&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;지침·정책&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;대조 조문 §3.2.11, §3.3.1, §3.4.2, §4.1.1, §5.2.1~§5.2.4 (대조 이력 보존용)&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-22 · Government of Nepal, Ministry of Finance&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://hr.parliament.gov.np/en/bills/TqsiRdta&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Public Procurement (Second Amendment) Act, 2083 — Parliament authentication record&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;법률&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;대조 조문 §§8, 14, 20~21, 23, 25~27, 30, 36, 40~46, 47~52A, 54, 59, 61A~62A, 65~67, 74&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-28 · Federal Parliament of Nepal&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://ppmo.gov.np/content/13300/public-procurement--second-amendment--ordinance--2083/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Public Procurement (Second Amendment) Ordinance, 2083 — official Gazette text used for article-by-article amendment comparison&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;명령·조례&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;대조 조문 Amending §§1~31; amended PPA §§2, 8, 10~14, 23, 25~27, 30, 36, 40~46, 50, 52A, 54, 58A~59, 61A~62A, 65~67, 74&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-28 · Public Procurement Monitoring Office, Government of Nepal&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://ppmo.gov.np/content/13339/public-procurement--fifteenth-amendment--rules--2083/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Public Procurement (Fifteenth Amendment) Rules, 2083&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;시행규칙&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;대조 조문 rr.31, 52~53, 70, 84~85, 104, 110, 120A, 129; Fifteenth Amendment rr.1~2&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-28 · Public Procurement Monitoring Office, Government of Nepal&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://pefa.gov.np/public/uploads/97716822-NP-Gandaki-Apr2025-PFMPR-SN-Public%20with%20PEFA%20Check.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Electronic Procurement System Operation Directive, 2023 — §5 application summarized in official PEFA assessment&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;지침·정책&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;대조 조문 §5; PPR rr.31, 70, 84~85 threshold application&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-28 · Government of Nepal / PEFA Secretariat&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://mof.gov.np/divisions/ierd/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;네팔 재무부 국제경제관계국 부서 페이지&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;지침·정책&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-23 · Ministry of Finance, Government of Nepal&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card span2&quot;&gt;&lt;h3&gt;주의&lt;/h3&gt;&lt;p class=&quot;note&quot;&gt;2026년판 기준자료가 Foreign Aid Mobilization Policy 2025를 수원체계 근거로 반영한 것을 확인했다. 본 레코드는 정책 원문 §3.3·§3.6·§3.7을 기준으로 세부 절차와 조세 범위를 정리했다.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;승계된 것 — 재무부 단일 창구(§3.3.1(a)), 정부기관의 접촉 전 재무부 사전승인(§3.3.2(k), 종전 §5.2.2와 문언 거의 동일), 공여기관의 재무부 경유 의무(§3.3.5(b), 종전 §5.2.3 전단), 재무부의 협상·재정협정 서명(§3.3.1(d)).&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;삭제된 것 — 정부기관 사업 제안 시 국가계획위원회(NPC) 동의 요건(종전 §5.2.3 후단), 양허성 차관 사업당 1천만 달러 문턱(종전 §3.4.2).&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;축소된 것 — 조세면제. 종전에는 협정상 면제를 전제로 부담 주체를 정했으나, 2025년 정책은 무상원조를 세금 납부에 쓰지 않고 차관 사업에 면제 조항을 넣지 않으며 국내 생산이 충분한 물품 수입에 면제를 부여하지 않는다(§3.6.1(a)(b)(c)).&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;신설된 것 — 차관 협상 전 내각(각료회의)의 원칙적 동의와 협상 권한 확보(§3.3.1(e)), 사업 준비성 체크리스트에 따른 제안서 제출(§3.3.2(b)), 외국인 근로자·자원봉사자 비자 및 노동허가 근거(§3.6.1(f)(g)).&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;영문본은 번역본이며, 원문에 &amp;#x27;영문본과 네팔어본이 충돌하면 네팔어본이 유효하다&amp;#x27;는 단서가 붙어 있다.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;FAMP는 사업 형성·정부 승인 체계를 규율하지만 입찰보증률이나 조달방법 금액 기준을 직접 정하지 않는다. 네팔 공공기관이 공공재원으로 조달하는 단계의 수치는 현행 PPA/PPR에서 별도로 확인했다.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;PPMO의 제15차 시행규칙 개정은 2026-07-14부터 효력이 발생했으며 r.120A의 특별 계약기간 연장 절차를 바꿨다. 조달방법 문턱·보증·불복 기준은 함께 대조한 현행 조문을 적용했다.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;p style=&quot;margin:22px 0 0;font-size:12.5px;color:var(--muted)&quot;&gt;
    조문 대조 완료 — 조문의 존재와 문언 일치만 뜻합니다. 법적 해석·적용 타당성·개정 반영 여부는 별도 검토 대상입니다.
  &lt;/p&gt;

  var C={sequence:cs.getPropertyValue(&#x27;--muted&#x27;).trim(),
         message:cs.getPropertyValue(&#x27;--back&#x27;).trim(),
         loop:cs.getPropertyValue(&#x27;--warn&#x27;).trim()};
  var d=&#x27;&lt;defs&gt;&#x27;;
  [&#x27;sequence&#x27;,&#x27;message&#x27;,&#x27;loop&#x27;].forEach(function(t){
    d+=&#x27;&lt;marker id=&quot;m-&#x27;+t+&#x27;&quot; viewBox=&quot;0 0 8 8&quot; refX=&quot;7&quot; refY=&quot;4&quot; markerWidth=&quot;6&quot; markerHeight=&quot;6&quot; orient=&quot;auto&quot;&gt;&#x27;
      +&#x27;&lt;path d=&quot;M0 0 L8 4 L0 8 z&quot; fill=&quot;&#x27;+C[t]+&#x27;&quot;/&gt;&lt;/marker&gt;&#x27;;
  });
  d+=&#x27;&lt;/defs&gt;&#x27;;
  var GAP=5;
  function rel(rc){return {x:rc.left-bb.left+board.scrollLeft, y:rc.top-bb.top+board.scrollTop,
                            r:rc.right-bb.left+board.scrollLeft, b:rc.bottom-bb.top+board.scrollTop,
                            w:rc.width, h:rc.height};}
  function box(id){
    var el=board.querySelector(&#x27;.node[data-id=&quot;&#x27;+id+&#x27;&quot;]&#x27;);
    if(!el)return null; return rel(el.getBoundingClientRect());
  }

  /* 라우팅은 korea100studio의 거터 라우팅을 우리 그리드에 이식한 것이다.
     핵심: 카드를 지나야 하는 선은 카드가 없는 거터(행 하단·열 측면)로 우회한다.
     DOM에서 노드·행·열을 실측할 수 있어, 여러 직교 경로 후보를 만들고
     무관한 카드를 가장 적게 관통하는(동수면 가장 짧은) 것을 고른다. */

  // 장애물(모든 노드)과 거터(노드 없는 띠) 실측
  var OB=[];
  board.querySelectorAll(&#x27;.node&#x27;).forEach(function(el){ var r=box(el.dataset.id); r.id=el.dataset.id; OB.push(r); });
  var rowGut=[], colGut=[];
  board.querySelectorAll(&#x27;.brow:not(.head)&#x27;).forEach(function(el){ var r=rel(el.getBoundingClientRect());
    rowGut.push(r.y+9); rowGut.push(r.b-9); });
  var hc=board.querySelectorAll(&#x27;.brow.head .bcell&#x27;);
  for(var i=1;i&lt;hc.length;i++){ var r=rel(hc[i].getBoundingClientRect()); colGut.push(r.x+11); colGut.push(r.r-11); }

  function segHit(ax,ay,bx,by,e1,e2){
    var n=0, M=3;
    for(var i=0;i&lt;OB.length;i++){ var o=OB[i]; if(o.id===e1||o.id===e2) continue;
      var L=o.x+M,R=o.r-M,T=o.y+M,B=o.b-M;
      if(Math.abs(ay-by)&lt;0.5){ if(ay&gt;T&amp;&amp;ay&lt;B &amp;&amp; Math.max(ax,bx)&gt;L &amp;&amp; Math.min(ax,bx)&lt;R) n++; }
      else { if(ax&gt;L&amp;&amp;ax&lt;R &amp;&amp; Math.max(ay,by)&gt;T &amp;&amp; Math.min(ay,by)&lt;B) n++; }
    } return n;
  }
  function uniq(pts){ return pts.filter(function(p,i){ return i===0 || Math.abs(p.x-pts[i-1].x)&gt;0.5 || Math.abs(p.y-pts[i-1].y)&gt;0.5; }); }
  function score(pts,e1,e2){ pts=uniq(pts); var p=0,l=0;
    for(var i=0;i&lt;pts.length-1;i++){ p+=segHit(pts[i].x,pts[i].y,pts[i+1].x,pts[i+1].y,e1,e2);
      l+=Math.abs(pts[i].x-pts[i+1].x)+Math.abs(pts[i].y-pts[i+1].y); }
    return {pts:pts,p:p,l:l}; }

  function route(a,b,ed){
    var acx=a.x+a.w/2,acy=a.y+a.h/2,bcx=b.x+b.w/2,bcy=b.y+b.h/2, e1=ed.source,e2=ed.target, cs=[];
    // 세로 계열 — a의 위/아래 변에서 나가 b의 위/아래 변으로
    var below=bcy&gt;acy, sp={x:acx,y:below?a.b:a.y}, tp={x:bcx,y:below?b.y:b.b}, tg={x:tp.x,y:tp.y+(below?-GAP:GAP)};
    cs.push(score([sp,{x:sp.x,y:tg.y},tg,tp],e1,e2));                                   // 직선/L
    rowGut.forEach(function(my){ if(my&gt;Math.min(sp.y,tp.y)+6&amp;&amp;my&lt;Math.max(sp.y,tp.y)-6)   // 행 거터 크로스
      cs.push(score([sp,{x:sp.x,y:my},{x:tp.x,y:my},tg,tp],e1,e2)); });
    colGut.forEach(function(gx){                                                          // 열 측면 탈출
      var as={x:gx&gt;acx?a.r:a.x,y:acy};
      cs.push(score([as,{x:gx,y:acy},{x:gx,y:tg.y},tg,tp],e1,e2)); });
    // 가로 계열 — a의 좌/우 변에서 나가 b의 좌/우 변으로
    var right=bcx&gt;acx, sp2={x:right?a.r:a.x,y:acy}, tp2={x:right?b.x:b.r,y:bcy}, tg2={x:tp2.x+(right?-GAP:GAP),y:tp2.y};
    cs.push(score([sp2,{x:tg2.x,y:sp2.y},tg2,tp2],e1,e2));
    colGut.forEach(function(mx){ if(mx&gt;Math.min(sp2.x,tp2.x)+6&amp;&amp;mx&lt;Math.max(sp2.x,tp2.x)-6)
      cs.push(score([sp2,{x:mx,y:sp2.y},{x:mx,y:tp2.y},tg2,tp2],e1,e2)); });
    rowGut.forEach(function(gy){                                                          // 행 거터 우회
      var as={x:acx,y:gy&gt;acy?a.b:a.y};
      cs.push(score([as,{x:acx,y:gy},{x:tp2.x,y:gy},tg2,tp2],e1,e2)); });
    // 회귀선 — 아래로 크게 우회 (되돌아가는 흐름을 시각적으로 구분)
    if(ed.type===&#x27;loop&#x27;){ var gy=Math.max(a.b,b.b)+26;
      cs.push(score([{x:acx,y:a.b},{x:acx,y:gy},{x:bcx,y:gy},{x:bcx,y:b.b+GAP},{x:bcx,y:b.b}],e1,e2)); }
    cs=cs.filter(function(c){return c.pts.length&gt;=2;});
    cs.sort(function(x,y){ return x.p-y.p || x.l-y.l; });
    return cs[0];
  }

  function rnd(v){return Math.round(v*10)/10;}
  function orthPath(pts){                    // 직교 경로 + 모서리 라운딩
    pts=uniq(pts); if(pts.length&lt;2)return &#x27;&#x27;;
    var d=&#x27;M&#x27;+rnd(pts[0].x)+&#x27; &#x27;+rnd(pts[0].y);
    for(var i=1;i&lt;pts.length-1;i++){
      var p=pts[i-1],c=pts[i],n=pts[i+1];
      var d1=Math.hypot(c.x-p.x,c.y-p.y)||1, d2=Math.hypot(n.x-c.x,n.y-c.y)||1, r=Math.min(7,d1/2,d2/2);
      d+=&#x27; L&#x27;+rnd(c.x-(c.x-p.x)/d1*r)+&#x27; &#x27;+rnd(c.y-(c.y-p.y)/d1*r);
      d+=&#x27; Q&#x27;+rnd(c.x)+&#x27; &#x27;+rnd(c.y)+&#x27; &#x27;+rnd(c.x+(n.x-c.x)/d2*r)+&#x27; &#x27;+rnd(c.y+(n.y-c.y)/d2*r);
    }
    var e=pts[pts.length-1]; return d+&#x27; L&#x27;+rnd(e.x)+&#x27; &#x27;+rnd(e.y);
  }

  EDGES.forEach(function(ed){
    var a=box(ed.source),b=box(ed.target); if(!a||!b)return;
    var t=ed.type||&#x27;sequence&#x27;, rt=route(a,b,ed);
    d+=&#x27;&lt;path d=&quot;&#x27;+orthPath(rt.pts)+&#x27;&quot; fill=&quot;none&quot; stroke=&quot;&#x27;+C[t]+&#x27;&quot; stroke-width=&quot;1.5&quot; opacity=&quot;&#x27;
      +(t===&#x27;sequence&#x27;?&#x27;.55&#x27;:&#x27;.8&#x27;)+&#x27;&quot;&#x27;+(t!==&#x27;sequence&#x27;?&#x27; stroke-dasharray=&quot;4 3&quot;&#x27;:&#x27;&#x27;)
      +&#x27; marker-end=&quot;url(#m-&#x27;+t+&#x27;)&quot;/&gt;&#x27;;
  });
  svg.innerHTML=d;
}

var KIND={&quot;act&quot;: &quot;법률&quot;, &quot;regulation&quot;: &quot;시행규칙&quot;, &quot;ordinance&quot;: &quot;명령·조례&quot;, &quot;directive&quot;: &quot;지침·정책&quot;, &quot;standard-document&quot;: &quot;표준문서&quot;, &quot;treaty-agreement&quot;: &quot;양자합의&quot;, &quot;donor-rule&quot;: &quot;공여기관 규정&quot;, &quot;practice&quot;: &quot;현장 관행&quot;};
function openNode(id){
  var n=NODES[id]; if(!n)return;
  var h=&#x27;&lt;span class=&quot;badge plain muted&quot;&gt;&#x27;+n.id+&#x27;&lt;/span&gt; &#x27;
       +&#x27;&lt;span class=&quot;badge plain muted&quot;&gt;&#x27;+n.lane+&#x27;&lt;/span&gt; &#x27;
       +&#x27;&lt;span class=&quot;badge plain muted&quot;&gt;&#x27;+n.stage+&#x27;&lt;/span&gt;&#x27;;
  h+=&#x27;&lt;h3&gt;&#x27;+n.name+&#x27;&lt;/h3&gt;&#x27;;
  h+=&#x27;&lt;dl class=&quot;kv&quot;&gt;&#x27;;
  h+=&#x27;&lt;dt&gt;담당&lt;/dt&gt;&lt;dd&gt;&#x27;+n.actor+&#x27;&lt;/dd&gt;&#x27;;
  if(n.action) h+=&#x27;&lt;dt&gt;내용&lt;/dt&gt;&lt;dd&gt;&#x27;+n.action+&#x27;&lt;/dd&gt;&#x27;;
  if(n.deadline) h+=&#x27;&lt;dt&gt;기한&lt;/dt&gt;&lt;dd&gt;&#x27;+n.deadline+&#x27;&lt;/dd&gt;&#x27;;
  if(n.output_documents&amp;&amp;n.output_documents.length)
    h+=&#x27;&lt;dt&gt;산출 문서&lt;/dt&gt;&lt;dd&gt;&#x27;+n.output_documents.join(&#x27; · &#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  if(n.blocker) h+=&#x27;&lt;dt&gt;병목&lt;/dt&gt;&lt;dd style=&quot;color:var(--warn)&quot;&gt;&#x27;+n.blocker+&#x27;&lt;/dd&gt;&#x27;;
  if(n.legal_basis&amp;&amp;n.legal_basis.length){
    h+=&#x27;&lt;dt&gt;근거 조문&lt;/dt&gt;&lt;dd&gt;&#x27;+n.legal_basis.map(function(l){
      var nm=l.url?&#x27;&lt;a class=&quot;ref&quot; href=&quot;&#x27;+l.url+&#x27;&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;&#x27;+l.law+&#x27;&lt;/a&gt;&#x27;:l.law;
      return &#x27;&lt;div style=&quot;margin-bottom:4px&quot;&gt;&#x27;+nm+&#x27; &lt;code&gt;&#x27;+l.article+&#x27;&lt;/code&gt;&lt;/div&gt;&#x27;;}).join(&#x27;&#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  }
  if(typeof n.confidence===&#x27;number&#x27;){
    h+=&#x27;&lt;dt&gt;법령 근거 확신도&lt;/dt&gt;&lt;dd&gt;&#x27;+n.confidence.toFixed(2)
      +(n.confidence&lt;0.8?&#x27; &lt;span class=&quot;badge warn&quot;&gt;현장 검증 필요&lt;/span&gt;&#x27;:&#x27;&#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  }
  if(n.confidence_reason) h+=&#x27;&lt;dt&gt;확신도 산정 근거&lt;/dt&gt;&lt;dd&gt;&#x27;+n.confidence_reason+&#x27;&lt;/dd&gt;&#x27;;
  var ins=EDGES.filter(function(x){return x.target===id}),
      outs=EDGES.filter(function(x){return x.source===id});
  if(ins.length) h+=&#x27;&lt;dt&gt;선행&lt;/dt&gt;&lt;dd&gt;&#x27;+ins.map(function(x){
    return (NODES[x.source]?NODES[x.source].name:x.source)+(x.label?&#x27; (&#x27;+x.label+&#x27;)&#x27;:&#x27;&#x27;);}).join(&#x27; · &#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  if(outs.length) h+=&#x27;&lt;dt&gt;후속&lt;/dt&gt;&lt;dd&gt;&#x27;+outs.map(function(x){
    return (NODES[x.target]?NODES[x.target].name:x.target)+(x.label?&#x27; (&#x27;+x.label+&#x27;)&#x27;:&#x27;&#x27;);}).join(&#x27; · &#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  h+=&#x27;&lt;/dl&gt;&#x27;;
  document.getElementById(&#x27;dbody&#x27;).innerHTML=h;
  document.getElementById(&#x27;dlg&#x27;).showModal();
}

document.querySelectorAll(&#x27;.node&#x27;).forEach(function(b){
  b.addEventListener(&#x27;click&#x27;,function(){openNode(b.dataset.id)});
  b.addEventListener(&#x27;mouseenter&#x27;,function(){
    var id=b.dataset.id;
    var rel={};rel[id]=1;
    EDGES.forEach(function(x){if(x.source===id)rel[x.target]=1;if(x.target===id)rel[x.source]=1;});
    document.querySelectorAll(&#x27;.node&#x27;).forEach(function(o){o.classList.toggle(&#x27;dim&#x27;,!rel[o.dataset.id])});
  });
  b.addEventListener(&#x27;mouseleave&#x27;,function(){
    document.querySelectorAll(&#x27;.node&#x27;).forEach(function(o){o.classList.remove(&#x27;dim&#x27;)});
  });
});
document.getElementById(&#x27;dlg&#x27;).addEventListener(&#x27;click&#x27;,function(ev){
  if(ev.target===this) this.close();
});

addEventListener(&#x27;load&#x27;,draw); addEventListener(&#x27;resize&#x27;,draw);
new MutationObserver(draw).observe(document.documentElement,{attributes:true,attributeFilter:[&#x27;data-theme&#x27;]});
&lt;/script&gt;
&lt;/body&gt;&lt;/html&gt;"></iframe></div>
<div class="foot">
  자료집 기준일 기준으로 작성된 참고자료입니다. 법률 자문이나 해당국 정부·KOICA의 공식 해석이 아닙니다.
  조달법은 개정이 잦으므로 실제 입찰 전 발주처 공고문과 현행 법령을 확인해야 합니다.
</div>
<script>
function fit(fr){ try{ fr.style.height=(fr.contentWindow.document.body.scrollHeight+20)+'px'; }catch(e){} }
function showTab(i){
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.toggle('active', +t.dataset.i===i); });
  document.querySelectorAll('.fr').forEach(function(fr){
    var on=+fr.dataset.i===i; fr.classList.toggle('active', on);
    if(on){ try{ fr.contentWindow.draw && fr.contentWindow.draw(); }catch(e){} setTimeout(function(){fit(fr);},60); }
  });
}
document.querySelectorAll('.fr').forEach(function(fr){
  fr.addEventListener('load', function(){
    // iframe 안의 테마 토글·업무구조도가 부모 테마를 따르도록, 그리고 높이를 맞춘다
    fit(fr);
    if(fr.classList.contains('active')) setTimeout(function(){ try{fr.contentWindow.draw&&fr.contentWindow.draw();}catch(e){} fit(fr); },80);
  });
});
addEventListener('resize', function(){ var a=document.querySelector('.fr.active'); if(a) fit(a); });
</script>
