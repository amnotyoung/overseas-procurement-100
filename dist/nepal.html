&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;한 장 캔버스&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;설계·시공 자격, 기술검사와 공사보험, 착공·중간검사·변경관리, 준공·소방·사용승인과 운영 인계조건을 확인하는 제도축&lt;/p&gt;
  &lt;div class=&quot;cards&quot;&gt;
    &lt;div class=&quot;card span2&quot;&gt;&lt;h3&gt;국가별 건축 인허가 절차 · 10단계&lt;/h3&gt;&lt;p class=&quot;workflow-disclosure&quot;&gt;해당 국가의 법령·관할기관 공식자료에서 확인한 신청·심사·보완·결정 절차를 표시한다. 업무구조도와 노드 상세에는 국가 절차만 두고, ODA 조사팀의 사업별 확인질문은 페이지 하단의 별도 접이식 목록으로 분리한다.&lt;/p&gt;&lt;p class=&quot;workflow-disclosure&quot;&gt;&lt;b&gt;적용 범위&lt;/b&gt; · 제1단계(Stage I) 기단부 허가, 공사감독·지방검사, 부적합 시 시정, 완공 현장검사와 준공증명서(Building Completion Certificate)의 법정 흐름이다.&lt;/p&gt;&lt;ol class=&quot;steps&quot;&gt;&lt;li&gt;B01 제1단계 임시허가로 기단부까지 착공 — 소유자가 제1단계 임시건축허가(Stage I Temporary Building Permit)와 승인도면을 받은 뒤 허가범위인 기단부 연결보 수준(plinth tie-beam level)까지 공사를 진행한다. / 산출물: 제1단계 허가·기단부 시공기록&lt;/li&gt;&lt;li&gt;B02 등록 전문자의 승인도면·NBC 감독 — 설계자 또는 동급 자격의 기술전문자가 승인도면과 NBC 수준에 따라 시공을 감독하고 공사·품질기록을 유지한다. / 산출물: 전문가 감독·품질·시공기록&lt;/li&gt;&lt;li&gt;B03 기단부·방습층 현장검사·승인도면 대조 — 지방정부 기술담당자가 기단부 위치·치수·이격과 승인도면·국가건축기준 적합성을 현장에서 확인해 다음 공정 진행 여부를 기록한다. / 산출물: 기단부·방습층 현장검사보고서·지적사항&lt;/li&gt;&lt;li&gt;B04 방습층·기단부 증명·상부공사 허용 — 기단부 공사가 승인도면에 적합하면 지방정부가 해당 단계 증명을 발급해 상부구조 공사를 허용한다. / 산출물: 방습층·기단부 증명서(Certificate)·상부공사 조건&lt;/li&gt;&lt;li&gt;B05 공사 중 위험기반 현장검사·법준수 감독 — 지방정부 또는 도시개발건축국이 공사 중 현장검사로 국가건축기준·승인도면 준수를 감독하고 위반 시 지시를 발행한다. / 산출물: 중간검사기록·준수지시&lt;/li&gt;&lt;li&gt;B06 위반공사 시정·재검사 — 승인도면·NBC 위반이 확인되면 소유자와 시공자가 감독지시에 따라 공사를 중지·시정하고 필요한 수정승인을 받아 재검사를 요청한다. / 산출물: 시정·수정승인·재검사 기록&lt;/li&gt;&lt;li&gt;B07 준공증명서 신청 — 공사완료 후 소유자가 준공신청, 승인·준공도면과 전문가 확인자료를 지방정부에 제출한다. / 산출물: 준공증명 신청·준공도면·전문가 확인자료&lt;/li&gt;&lt;li&gt;B08 준공 현장검사·기술검토 — 지방정부 검사자가 완성건축물을 승인도면·허가조건·건축기준과 대조해 현장보고서를 작성하고 담당 기술자가 검토한다. / 산출물: 준공 현장검사보고서·사진·기술권고&lt;/li&gt;&lt;li&gt;B09 준공 불일치·도서 보완 재검사 — 현장이나 준공도서가 승인도면·법규와 어긋나면 소유자와 전문가가 시정 또는 적법한 변경절차를 마치고 보완자료를 내 재검사를 받는다. / 산출물: 현장시정·수정도서·재검사 결과&lt;/li&gt;&lt;li&gt;B10 준공증명서 공식결정 — 권한 있는 지방정부 책임자가 기술검토 결과를 승인해 준공증명을 발급하거나 보완·거부를 통지한다. / 산출물: 준공증명서 또는 보완·거부통지&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
    &lt;div class=&quot;card span2&quot;&gt;&lt;h3&gt;공식 결정 Gate · 1개&lt;/h3&gt;&lt;p class=&quot;workflow-disclosure&quot;&gt;위 절차 중 관할기관이 공식 문서를 발급하거나 처분하는 결정 지점만 분리했습니다. Gate 1/N은 이 페이지 안의 표시번호이며, 관할·사업별 적용조건과 근거 수준은 각 Gate에서 확인합니다.&lt;/p&gt;&lt;ol class=&quot;official-gates&quot;&gt;&lt;li class=&quot;official-gate&quot; data-source-order=&quot;4&quot;&gt;&lt;div class=&quot;gate-title&quot;&gt;&lt;span class=&quot;badge info&quot;&gt;Gate 1/1&lt;/span&gt;&lt;b&gt;지방정부의 준공증명 공식결정&lt;/b&gt;&lt;/div&gt;&lt;p&gt;관할 지방정부가 완성건축물의 승인도면·허가조건·국가건축기준 적합성을 확인해 준공을 공식 결정한다.&lt;/p&gt;&lt;dl class=&quot;gate-meta&quot;&gt;&lt;dt&gt;결정기관&lt;/dt&gt;&lt;dd&gt;관할 지방정부&lt;/dd&gt;&lt;dt&gt;적용 관할·조건&lt;/dt&gt;&lt;dd&gt;국가 건축법·NBC 적용대상 건축물과 지방정부의 검사·준공절차 대상 공사&lt;/dd&gt;&lt;dt&gt;산출물&lt;/dt&gt;&lt;dd&gt;준공증명서 또는 보완·거부통지&lt;/dd&gt;&lt;dt&gt;근거 수준&lt;/dt&gt;&lt;dd&gt;노드 직접근거&lt;/dd&gt;&lt;dt&gt;연결 근거&lt;/dt&gt;&lt;dd&gt;&lt;span class=&quot;gate-basis&quot;&gt;&lt;span class=&quot;law-name&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://plgsp.gov.np/sites/default/files/2023-09/Resource_Book_on_Building_Bylaws%20and%20Building%20Permit%20System%20in_Nepal.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;네팔 건축조례·건축허가제도 자료집&lt;/a&gt;&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot;&gt;공식 안내&lt;/span&gt;&lt;span class=&quot;badge info&quot;&gt;공식자료 연결&lt;/span&gt;&lt;/span&gt;&lt;/dd&gt;&lt;/dl&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;적용 대상&lt;/h3&gt;&lt;p style=&quot;margin:0;font-size:13.5px;line-height:1.7&quot;&gt;국가 건축법·NBC 적용대상 건축물과 지방정부의 검사·준공절차 대상 공사&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;법적 근거&lt;/h3&gt;&lt;div class=&quot;law&quot;&gt;&lt;div class=&quot;law-copy&quot;&gt;&lt;span class=&quot;nm&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.lawcommission.gov.np/content/12187/12187-building-act-2055/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;건축법 2055(1998, 개정 포함)&lt;/a&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;law-meta&quot;&gt;&lt;span class=&quot;badge plain muted&quot;&gt;법률&lt;/span&gt;&lt;span class=&quot;badge info&quot;&gt;원문 링크 연결&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;운영 중 공식자료&lt;/h3&gt;&lt;div class=&quot;law&quot;&gt;&lt;div class=&quot;law-copy&quot;&gt;&lt;span class=&quot;nm&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://dudbc.gov.np/pages/24231978/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;네팔 국가건축기준 공식 대장&lt;/a&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;law-meta&quot;&gt;&lt;span class=&quot;badge plain muted&quot;&gt;공식 안내&lt;/span&gt;&lt;span class=&quot;badge info&quot;&gt;공식자료 연결&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;law&quot;&gt;&lt;div class=&quot;law-copy&quot;&gt;&lt;span class=&quot;nm&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://plgsp.gov.np/sites/default/files/2023-09/Resource_Book_on_Building_Bylaws%20and%20Building%20Permit%20System%20in_Nepal.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;네팔 건축조례·건축허가제도 자료집&lt;/a&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;law-meta&quot;&gt;&lt;span class=&quot;badge plain muted&quot;&gt;공식 안내&lt;/span&gt;&lt;span class=&quot;badge info&quot;&gt;공식자료 연결&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;

    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;권한 기관&lt;/h3&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;&lt;a class=&quot;ref&quot; href=&quot;https://mofaga.gov.np/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;관할 지방정부&lt;/a&gt;&lt;/b&gt;&lt;span&gt;지방정부 관할구역의 토지이용·건축도면 승인과 건축허가 집행기관 &lt;span class=&quot;badge info&quot;&gt;공식자료 연결&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;&lt;a class=&quot;ref&quot; href=&quot;https://dudbc.gov.np/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;도시개발·건축건설국(DUDBC)&lt;/a&gt;&lt;/b&gt;&lt;span&gt;국가 건축법·건축기준과 관할 밖 기술지원을 담당하는 중앙 전문기관 &lt;span class=&quot;badge info&quot;&gt;공식자료 연결&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;이해관계자&lt;/h3&gt;&lt;p style=&quot;margin:0;font-size:13.5px;line-height:1.7&quot;&gt;관할 지방정부, 도시개발·건축건설국(DUDBC)&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;제출서류&lt;/h3&gt;&lt;div class=&quot;docset&quot;&gt;&lt;b&gt;04 지방정부의 준공증명 공식결정&lt;/b&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;준공증명서 또는 보완·거부통지&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;


    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;관련 제도&lt;/h3&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;네팔 공공조달 입찰제도&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;네팔 조달 거버넌스·감독체계&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;네팔 ODA 사업 발굴·형성 절차&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;네팔 도시계획·부지규제&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;네팔 건축허가·환경심사&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;details class=&quot;card field-application&quot;&gt;&lt;summary&gt;&lt;span&gt;ODA 사업별 적용 확인사항&lt;/span&gt;&lt;small&gt;법정절차 외 체크리스트 · 6개&lt;/small&gt;&lt;/summary&gt;&lt;div class=&quot;field-application-body&quot;&gt;&lt;p class=&quot;workflow-disclosure&quot;&gt;아래 항목은 해당 국가의 법정 절차가 아니라 대상 사업의 관할·필지·시설 조건을 확정하기 위한 조사 체크리스트입니다. 업무구조도와 공식 결정 Gate에는 포함하지 않습니다.&lt;/p&gt;&lt;ul class=&quot;plain&quot;&gt;&lt;li&gt;시장조사: 현지 등록 설계자·시공자·검사기관·보험사의 자격과 유효기간을 감독기관에서 대조한다. → 적격기관·보험 대장&lt;/li&gt;&lt;li&gt;기관협의: 착공통지, 중간검사, 준공도서, 소방·사용승인과 개장 조건을 순서대로 확인한다. → 검사·준공·개장 Hold Point 표&lt;/li&gt;&lt;li&gt;보고서 반영: 기술검사·보험·준공제도의 확인·미확인·조건부 항목을 분리하고 근거문서 번호와 설계·일정·예산 영향을 연결한다. → 기술검사·보험·준공제도 근거대장·보고서 반영표&lt;/li&gt;&lt;li&gt;어떤 NBC 판과 전문자격·현장검사·준공 또는 사용승인 절차가 본 사업에 적용되는가? — 영향: 조달 패키지, 품질책임, 보험료, 검사 Hold Point와 개장 가능일을 결정한다.; 담당 수원기관·현지 건축전문가; 확인기관 관할 지방정부, 도시개발·건축건설국(DUDBC); 필요 증빙 적용 NBC 목록과 설계기준서, 현지 기술자·시공자 등록증, 검사·시험계획, 준공도서·사용승인 체크리스트와 보험 견적&lt;/li&gt;&lt;li&gt;현지 설계자·시공자·검사기관의 자격, 의무보험, 중간검사와 준공·소방·사용승인 절차는 무엇인가? — 영향: 조달 패키지, 품질책임, 보험료, 검사 Hold Point와 개장 가능일을 결정한다.; 담당 수원기관·현지 건축전문가; 확인기관 관할 지방정부, 도시개발·건축건설국(DUDBC); 필요 증빙 전문가·시공자·검사기관 등록증과 보험증권, 검사계획·시험성적서·변경승인 기록, 준공·소방·사용승인 체크리스트와 실제 견적&lt;/li&gt;&lt;li&gt;네팔 건축법의 사업별 적용조건을 어떤 원본·공문·현장기록으로 입증할 것인가? — 영향: 공개된 국가 기본경로와 실제 필지·시설·관할의 적용판정을 분리해 보고서의 과단정을 막는다.; 담당 현지 건축전문가·조사총괄; 확인기관 관할 지방정부, 도시개발·건축건설국(DUDBC); 필요 증빙 적용 NBC 목록과 설계기준서, 현지 기술자·시공자 등록증, 검사·시험계획, 준공도서·사용승인 체크리스트와 보험 견적&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;핵심 적용판단&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;확인된 법령 사실과 사업별 조건부·미확정 판단을 분리해 표시합니다.&lt;/p&gt;
  &lt;div class=&quot;decision-list&quot;&gt;&lt;div class=&quot;decision&quot; data-state=&quot;conditional&quot;&gt;&lt;span class=&quot;badge warn&quot;&gt;조건부&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;NPL-BLD-C-003&lt;/span&gt;&lt;p&gt;네팔은 NBC 문서가 계속 개정되고 지방 집행이 결합되므로, 설계기준 목록과 검사·준공 책임을 입찰문서에 고정하기 전에 DUDBC와 관할 지방정부의 서면 확인이 필요하다.&lt;/p&gt;&lt;div class=&quot;sources&quot;&gt;근거 · 건축법 2055(1998, 개정 포함) · 네팔 국가건축기준 공식 대장&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/section&gt;







&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;검증&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;네팔 건축조례·건축허가제도 자료집·건축법 2055(1998, 개정 포함)·환경보호법 2019(2076)·네팔 국가건축기준 공식 대장의 공식 법령·정부 서비스 페이지에서 제도 존재, 담당기관과 적용범위를 확인했다.&lt;/p&gt;
  &lt;div class=&quot;cards&quot;&gt;
    &lt;div class=&quot;card span2&quot;&gt;&lt;h3&gt;검증 범위&lt;/h3&gt;
      &lt;p style=&quot;margin:0;font-size:13.5px;line-height:1.7&quot;&gt;단계별 검사와 준공증명은 전국 3단계 허가체계와 건축법의 감독·시정 조문이 정한다. 단계 명칭과 검사시점은 관할 지방정부 조례로 확정한다.&lt;/p&gt;
      &lt;p style=&quot;margin:12px 0 0;font-size:12.5px;color:var(--muted)&quot;&gt;확인일 2026-08-07 · 자료집 기준일 2026-08-07&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;대조에 쓴 원문&lt;/h3&gt;&lt;ul class=&quot;srcs&quot; style=&quot;padding-left:16px;margin:0&quot;&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.lawcommission.gov.np/content/12187/12187-building-act-2055/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Building Act, 2055 (1998), as amended&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;법률&lt;/span&gt;&lt;span class=&quot;badge ok&quot; style=&quot;margin-left:6px&quot;&gt;현행 확인&lt;/span&gt;&lt;span class=&quot;badge info&quot; style=&quot;margin-left:6px&quot;&gt;원문 링크 연결&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;원문 확인 2026-08-07&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;상태 확인 2026-08-07 · 네팔 법률위원회 현행법 대장에서 개정이 반영된 Building Act 2055와 Sections 10-14, 17-19를 확인&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;네팔 법률위원회의 현행법 페이지가 법률 원문과 개정 이력을 제공한다.&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://dudbc.gov.np/pages/24231978/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Nepal National Building Code official collection&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;공식 안내&lt;/span&gt;&lt;span class=&quot;badge info&quot; style=&quot;margin-left:6px&quot;&gt;운영 중 공식 안내&lt;/span&gt;&lt;span class=&quot;badge info&quot; style=&quot;margin-left:6px&quot;&gt;공식자료 연결&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;원문 확인 2026-08-07&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;상태 확인 2026-08-07 · DUDBC 공식 대장이 NBC 105:2020, NBC 206 및 분야별 국가건축기준을 현재 게시&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;DUDBC가 NBC 문서와 최신 개정본을 게시한다. 적용판은 사업 시점에 재확인한다.&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://plgsp.gov.np/sites/default/files/2023-09/Resource_Book_on_Building_Bylaws%20and%20Building%20Permit%20System%20in_Nepal.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Resource Book on Building Bylaws and Building Permit System in Nepal&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;공식 안내&lt;/span&gt;&lt;span class=&quot;badge info&quot; style=&quot;margin-left:6px&quot;&gt;운영 중 공식 안내&lt;/span&gt;&lt;span class=&quot;badge info&quot; style=&quot;margin-left:6px&quot;&gt;공식자료 연결&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;원문 확인 2026-08-07&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;상태 확인 2026-08-07 · 연방·일반행정부 산하 PLGSP가 지방정부 건축조례·허가시스템의 단계별 공식 자료집으로 현재 게시&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;연방정부 지방행정 지원 프로그램의 건축허가 집행 자료집이다. 지방별 조례 원본을 추가 확보해야 한다.&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card span2&quot;&gt;&lt;h3&gt;주의&lt;/h3&gt;&lt;p class=&quot;note&quot;&gt;비공식 한국어 요약이며 법률자문이나 관할기관의 유권해석을 대신하지 않는다.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;자료의 현행·운영 상태는 사이트가 자료별 상태·확인일·판단근거로 관리한다. 최신 개정 추적이 끝나지 않은 자료만 검증 예외로 별도 표시한다.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;건폐율·용적률·높이·이격·주차, 환경평가 유형, 수수료·실제 기간과 현지 업체 비용은 필지·시설·관할에 따라 달라 확인 전 수치로 사용하지 않는다.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;p style=&quot;margin:22px 0 0;font-size:12.5px;color:var(--muted)&quot;&gt;
    원문 링크 연결 — 공식 자료와 제도의 연결 수준을 뜻하며 자료의 현행·운영 상태는 위 원문 대장의 상태와 확인일로, 개별 사업 적용판정은 ODA 적용 확인사항으로 따로 관리합니다.
  &lt;/p&gt;
&lt;/section&gt;

ot;:&quot;&quot;,&quot;output_documents&quot;:[&quot;준공증명서 또는 보완·거부통지&quot;],&quot;legal_basis&quot;:[{&quot;law&quot;:&quot;네팔 건축조례·건축허가제도 자료집&quot;,&quot;article&quot;:&quot;authority approval and issue of the building completion certificate&quot;,&quot;url&quot;:&quot;https://plgsp.gov.np/sites/default/files/2023-09/Resource_Book_on_Building_Bylaws%20and%20Building%20Permit%20System%20in_Nepal.pdf&quot;,&quot;kind&quot;:&quot;공식 안내&quot;,&quot;scope_label&quot;:&quot;&quot;,&quot;verification&quot;:&quot;공식자료 연결&quot;,&quot;verification_tone&quot;:&quot;info&quot;,&quot;note&quot;:&quot;연방정부 지방행정 지원 프로그램의 건축허가 집행 자료집이다. 지방별 조례 원본을 추가 확보해야 한다.&quot;}],&quot;applicability&quot;:&quot;국가 건축법·NBC 적용대상 건축물과 지방정부의 검사·준공절차 대상 공사&quot;,&quot;permit_gates&quot;:[{&quot;order&quot;:4,&quot;gate&quot;:&quot;지방정부의 준공증명 공식결정&quot;,&quot;decision&quot;:&quot;관할 지방정부가 완성건축물의 승인도면·허가조건·국가건축기준 적합성을 확인해 준공을 공식 결정한다.&quot;,&quot;depends_on&quot;:[],&quot;output&quot;:&quot;준공증명서 또는 보완·거부통지&quot;}],&quot;requirement_ids&quot;:[&quot;NPL-BLD-REQ-006&quot;],&quot;gate_orders&quot;:[4]}};

/* 엣지 그리기 — 노드 DOM 위치를 재서 SVG로 연결 */
function draw(){
  var board=document.getElementById(&#x27;board&#x27;),svg=document.getElementById(&#x27;edges&#x27;);
  if(!board||!svg)return;
  var bb=board.getBoundingClientRect();
  svg.setAttribute(&#x27;viewBox&#x27;,&#x27;0 0 &#x27;+board.scrollWidth+&#x27; &#x27;+board.scrollHeight);
  svg.setAttribute(&#x27;width&#x27;,board.scrollWidth); svg.setAttribute(&#x27;height&#x27;,board.scrollHeight);
  var cs=getComputedStyle(document.documentElement);
  var C={sequence:cs.getPropertyValue(&#x27;--muted&#x27;).trim(),
         message:cs.getPropertyValue(&#x27;--info&#x27;).trim(),
         loop:cs.getPropertyValue(&#x27;--back&#x27;).trim()};
  var BG=cs.getPropertyValue(&#x27;--bg&#x27;).trim();
  var d=&#x27;&lt;defs&gt;&#x27;;
  [&#x27;sequence&#x27;,&#x27;message&#x27;,&#x27;loop&#x27;].forEach(function(t){
    d+=&#x27;&lt;marker id=&quot;m-&#x27;+t+&#x27;&quot; viewBox=&quot;0 0 8 8&quot; refX=&quot;7&quot; refY=&quot;4&quot; markerWidth=&quot;6&quot; markerHeight=&quot;6&quot; orient=&quot;auto&quot;&gt;&#x27;
      +&#x27;&lt;path d=&quot;M0 0 L8 4 L0 8 z&quot; fill=&quot;&#x27;+C[t]+&#x27;&quot;/&gt;&lt;/marker&gt;&#x27;;
  });
  d+=&#x27;&lt;/defs&gt;&#x27;;
  var GAP=5;
  function rel(rc){return {x:rc.left-bb.left+board.scrollLeft, y:rc.top-bb.top+board.scrollTop,
                            r:rc.right-bb.left+board.scrollLeft, b:rc.bottom-bb.top+board.scrollTop,
                            w:rc.width, h:rc.height};}
  function box(id){
    var el=Array.prototype.find.call(
      board.querySelectorAll(&#x27;.node&#x27;),function(node){return node.dataset.id===id;}
    );
    if(!el)return null; return rel(el.getBoundingClientRect());
  }

  /* 라우팅은 korea100studio의 거터 라우팅을 우리 그리드에 이식한 것이다.
     핵심: 카드를 지나야 하는 선은 카드가 없는 거터(행 하단·열 측면)로 우회한다.
     DOM에서 노드·행·열을 실측할 수 있어, 여러 직교 경로 후보를 만들고
     무관한 카드를 가장 적게 관통하는(동수면 가장 짧은) 것을 고른다. */

  // 장애물(모든 노드)과 거터(노드 없는 띠) 실측
  var OB=[];
  board.querySelectorAll(&#x27;.node&#x27;).forEach(function(el){ var r=box(el.dataset.id); r.id=el.dataset.id; OB.push(r); });
  // 단계 머리글과 각 행의 행위주체 셀도 텍스트 장애물이다. 카드만 피하면
  // 긴 회귀 라벨이 머리글 뒤로 올라가거나 행위주체명을 가릴 수 있다.
  var TB=[];
  board.querySelectorAll(&#x27;.brow.head .bcell,.brow:not(.head) .bcell:first-child&#x27;).forEach(function(el){
    TB.push(rel(el.getBoundingClientRect()));
  });
  var rowGut=[], colGut=[];
  board.querySelectorAll(&#x27;.brow:not(.head)&#x27;).forEach(function(el){ var r=rel(el.getBoundingClientRect());
    rowGut.push(r.y+9); rowGut.push(r.b-9); });
  var hc=board.querySelectorAll(&#x27;.brow.head .bcell&#x27;);
  for(var i=1;i&lt;hc.length;i++){ var r=rel(hc[i].getBoundingClientRect()); colGut.push(r.x+11); colGut.push(r.r-11); }

  function segHit(ax,ay,bx,by,e1,e2){
    var n=0, M=3;
    for(var i=0;i&lt;OB.length;i++){ var o=OB[i]; if(o.id===e1||o.id===e2) continue;
      var L=o.x+M,R=o.r-M,T=o.y+M,B=o.b-M;
      if(Math.abs(ay-by)&lt;0.5){ if(ay&gt;T&amp;&amp;ay&lt;B &amp;&amp; Math.max(ax,bx)&gt;L &amp;&amp; Math.min(ax,bx)&lt;R) n++; }
      else { if(ax&gt;L&amp;&amp;ax&lt;R &amp;&amp; Math.max(ay,by)&gt;T &amp;&amp; Math.min(ay,by)&lt;B) n++; }
    } return n;
  }
  function uniq(pts){ return pts.filter(function(p,i){ return i===0 || Math.abs(p.x-pts[i-1].x)&gt;0.5 || Math.abs(p.y-pts[i-1].y)&gt;0.5; }); }
  function score(pts,e1,e2){ pts=uniq(pts); var p=0,l=0;
    for(var i=0;i&lt;pts.length-1;i++){ p+=segHit(pts[i].x,pts[i].y,pts[i+1].x,pts[i+1].y,e1,e2);
      l+=Math.abs(pts[i].x-pts[i+1].x)+Math.abs(pts[i].y-pts[i+1].y); }
    return {pts:pts,p:p,l:l}; }

  function route(a,b,ed){
    var acx=a.x+a.w/2,acy=a.y+a.h/2,bcx=b.x+b.w/2,bcy=b.y+b.h/2, e1=ed.source,e2=ed.target, cs=[];
    // 보완 회귀는 source 오른쪽 거터로 빠진 뒤 target 행의 위·아래 여백을
    // 거쳐 진입한다. target 중심 높이로 곧장 되돌리면 같은 행의 중간 카드를
    // 관통할 수 있으므로, 실측한 행 거터 후보를 장애물 수·길이로 비교한다.
    if(ed.type===&#x27;loop&#x27;&amp;&amp;ed.label){
      var maxRight=Math.max(a.r,b.r), gx0=Math.min(board.scrollWidth-4,maxRight+28);
      var gxVals=[gx0,board.scrollWidth-4], loopCandidates=[];
      colGut.forEach(function(gx){if(gx&gt;maxRight+10)gxVals.push(gx);});
      gxVals=gxVals.filter(function(gx,i){return gx&gt;maxRight+6&amp;&amp;gxVals.indexOf(gx)===i;});
      var gyVals=rowGut.filter(function(gy){return gy&lt;b.y-6||gy&gt;b.b+6;});
      gxVals.forEach(function(gx){
        gyVals.forEach(function(gy){
          var above=gy&lt;b.y;
          var tp={x:bcx,y:above?b.y:b.b};
          var pre={x:bcx,y:tp.y+(above?-GAP:GAP)};
          loopCandidates.push(score([
            {x:a.r,y:acy},{x:gx,y:acy},{x:gx,y:gy},{x:bcx,y:gy},pre,tp
          ],e1,e2));
        });
      });
      // 극단적으로 거터 후보가 없는 단일 행 보드에서도 선은 계속 표시한다.
      loopCandidates.push(score([
        {x:a.r,y:acy},{x:gx0,y:acy},{x:gx0,y:bcy},{x:b.r+GAP,y:bcy},{x:b.r,y:bcy}
      ],e1,e2));
      loopCandidates.sort(function(x,y){return x.p-y.p||x.l-y.l;});
      return loopCandidates[0];
    }
    // 세로 계열 — a의 위/아래 변에서 나가 b의 위/아래 변으로
    var below=bcy&gt;acy, sp={x:acx,y:below?a.b:a.y}, tp={x:bcx,y:below?b.y:b.b}, tg={x:tp.x,y:tp.y+(below?-GAP:GAP)};
    cs.push(score([sp,{x:sp.x,y:tg.y},tg,tp],e1,e2));                                   // 직선/L
    rowGut.forEach(function(my){ if(my&gt;Math.min(sp.y,tp.y)+6&amp;&amp;my&lt;Math.max(sp.y,tp.y)-6)   // 행 거터 크로스
      cs.push(score([sp,{x:sp.x,y:my},{x:tp.x,y:my},tg,tp],e1,e2)); });
    colGut.forEach(function(gx){                                                          // 열 측면 탈출
      var as={x:gx&gt;acx?a.r:a.x,y:acy};
      cs.push(score([as,{x:gx,y:acy},{x:gx,y:tg.y},tg,tp],e1,e2)); });
    // 가로 계열 — a의 좌/우 변에서 나가 b의 좌/우 변으로
    var right=bcx&gt;acx, sp2={x:right?a.r:a.x,y:acy}, tp2={x:right?b.x:b.r,y:bcy}, tg2={x:tp2.x+(right?-GAP:GAP),y:tp2.y};
    cs.push(score([sp2,{x:tg2.x,y:sp2.y},tg2,tp2],e1,e2));
    colGut.forEach(function(mx){ if(mx&gt;Math.min(sp2.x,tp2.x)+6&amp;&amp;mx&lt;Math.max(sp2.x,tp2.x)-6)
      cs.push(score([sp2,{x:mx,y:sp2.y},{x:mx,y:tp2.y},tg2,tp2],e1,e2)); });
    rowGut.forEach(function(gy){                                                          // 행 거터 우회
      var as={x:acx,y:gy&gt;acy?a.b:a.y};
      cs.push(score([as,{x:acx,y:gy},{x:tp2.x,y:gy},tg2,tp2],e1,e2)); });
    cs=cs.filter(function(c){return c.pts.length&gt;=2;});
    cs.sort(function(x,y){ return x.p-y.p || x.l-y.l; });
    return cs[0];
  }

  function rnd(v){return Math.round(v*10)/10;}
  function orthPath(pts){                    // 직교 경로 + 모서리 라운딩
    pts=uniq(pts); if(pts.length&lt;2)return &#x27;&#x27;;
    var d=&#x27;M&#x27;+rnd(pts[0].x)+&#x27; &#x27;+rnd(pts[0].y);
    for(var i=1;i&lt;pts.length-1;i++){

      leader.setAttribute(&#x27;x2&#x27;,rnd(lead.x2)); leader.setAttribute(&#x27;y2&#x27;,rnd(lead.y2));
      leader.setAttribute(&#x27;stroke&#x27;,job.color); leader.setAttribute(&#x27;stroke-width&#x27;,&#x27;1&#x27;);

      txt.setAttribute(&#x27;stroke-linejoin&#x27;,&#x27;round&#x27;);

function openNode(id){
  var n=NODES[id]; if(!n)return;
  var h=&#x27;&lt;span class=&quot;badge plain muted&quot;&gt;&#x27;+(n.display_id||n.id)+&#x27;&lt;/span&gt; &#x27;
       +&#x27;&lt;span class=&quot;badge plain muted&quot;&gt;&#x27;+n.lane+&#x27;&lt;/span&gt; &#x27;
       +&#x27;&lt;span class=&quot;badge plain muted&quot;&gt;&#x27;+n.stage+&#x27;&lt;/span&gt;&#x27;
       +(n.workflow_kind_label?&#x27; &lt;span class=&quot;badge info&quot;&gt;&#x27;+n.workflow_kind_label+&#x27;&lt;/span&gt;&#x27;:&#x27;&#x27;);
  h+=&#x27;&lt;h3&gt;&#x27;+n.name+&#x27;&lt;/h3&gt;&#x27;;
  h+=&#x27;&lt;dl class=&quot;kv&quot;&gt;&#x27;;
  h+=&#x27;&lt;dt&gt;담당&lt;/dt&gt;&lt;dd&gt;&#x27;+n.actor+&#x27;&lt;/dd&gt;&#x27;;
  if(n.consulted_authorities) h+=&#x27;&lt;dt&gt;협의·관할기관&lt;/dt&gt;&lt;dd&gt;&#x27;+n.consulted_authorities+&#x27;&lt;/dd&gt;&#x27;;
  if(n.action) h+=&#x27;&lt;dt&gt;내용&lt;/dt&gt;&lt;dd&gt;&#x27;+n.action+&#x27;&lt;/dd&gt;&#x27;;
  if(n.applicability) h+=&#x27;&lt;dt&gt;적용 조건&lt;/dt&gt;&lt;dd&gt;&#x27;+n.applicability+&#x27;&lt;/dd&gt;&#x27;;
  if(n.deadline) h+=&#x27;&lt;dt&gt;기한&lt;/dt&gt;&lt;dd&gt;&#x27;+n.deadline+&#x27;&lt;/dd&gt;&#x27;;
  if(n.output_documents&amp;&amp;n.output_documents.length)
    h+=&#x27;&lt;dt&gt;산출 문서&lt;/dt&gt;&lt;dd&gt;&#x27;+n.output_documents.join(&#x27; · &#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  if(n.blocker) h+=&#x27;&lt;dt&gt;병목&lt;/dt&gt;&lt;dd style=&quot;color:var(--warn)&quot;&gt;&#x27;+n.blocker+&#x27;&lt;/dd&gt;&#x27;;
  if(n.legal_basis&amp;&amp;n.legal_basis.length){
    var basisLabel=n.basis_scope===&#x27;axis&#x27;?&#x27;축 전체 관련 제도 근거&#x27;
      :(n.workflow_kind===&#x27;statutory&#x27;?&#x27;근거 조문&#x27;:&#x27;관련 제도 근거&#x27;);
    h+=&#x27;&lt;dt&gt;&#x27;+basisLabel+&#x27;&lt;/dt&gt;&lt;dd&gt;&#x27;+n.legal_basis.map(function(l){
      var nm=l.url?&#x27;&lt;a class=&quot;ref&quot; href=&quot;&#x27;+l.url+&#x27;&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;&#x27;+l.law+&#x27;&lt;/a&gt;&#x27;:l.law;
      var meta=(l.kind?&#x27; &lt;span class=&quot;badge plain muted&quot;&gt;&#x27;+l.kind+&#x27;&lt;/span&gt;&#x27;:&#x27;&#x27;)
        +(l.scope_label?&#x27; &lt;span class=&quot;badge info&quot;&gt;&#x27;+l.scope_label+&#x27;&lt;/span&gt;&#x27;:&#x27;&#x27;)
        +(l.verification?&#x27; &lt;span class=&quot;badge &#x27;+l.verification_tone+&#x27;&quot;&gt;&#x27;+l.verification+&#x27;&lt;/span&gt;&#x27;:&#x27;&#x27;);
      return &#x27;&lt;div style=&quot;margin-bottom:9px&quot;&gt;&#x27;+nm+&#x27; &lt;code&gt;&#x27;+l.article+&#x27;&lt;/code&gt;&#x27;+meta
        +(l.note?&#x27;&lt;div style=&quot;margin-top:3px;color:var(--muted)&quot;&gt;&#x27;+l.note+&#x27;&lt;/div&gt;&#x27;:&#x27;&#x27;)+&#x27;&lt;/div&gt;&#x27;;}).join(&#x27;&#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  }
  if(typeof n.confidence===&#x27;number&#x27;){
    h+=&#x27;&lt;dt&gt;법령 근거 확신도&lt;/dt&gt;&lt;dd&gt;&#x27;+n.confidence.toFixed(2)
      +(n.confidence&lt;0.8?&#x27; &lt;span class=&quot;badge warn&quot;&gt;현장 검증 필요&lt;/span&gt;&#x27;:&#x27;&#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  }
  if(n.confidence_reason) h+=&#x27;&lt;dt&gt;확신도 산정 근거&lt;/dt&gt;&lt;dd&gt;&#x27;+n.confidence_reason+&#x27;&lt;/dd&gt;&#x27;;
  if(n.evidence_status) h+=&#x27;&lt;dt&gt;근거 상태&lt;/dt&gt;&lt;dd&gt;&#x27;+n.evidence_status+&#x27;&lt;/dd&gt;&#x27;;
  if(n.report_use) h+=&#x27;&lt;dt&gt;보고서 반영&lt;/dt&gt;&lt;dd&gt;&#x27;+n.report_use+&#x27;&lt;/dd&gt;&#x27;;
  if(n.permit_gates&amp;&amp;n.permit_gates.length){
    h+=&#x27;&lt;dt&gt;연결 인허가 절차&lt;/dt&gt;&lt;dd&gt;&#x27;+n.permit_gates.map(function(g){
      var dep=g.depends_on&amp;&amp;g.depends_on.length?&#x27; · 선행 절차 &#x27;+g.depends_on.map(function(x){return &#x27;P&#x27;+x;}).join(&#x27;, &#x27;):&#x27;&#x27;;
      return &#x27;&lt;div style=&quot;margin-bottom:8px&quot;&gt;&lt;b&gt;P&#x27;+g.order+&#x27; &#x27;+g.gate+&#x27;&lt;/b&gt;&#x27;+dep
        +&#x27;&lt;div&gt;&#x27;+g.decision+&#x27;&lt;/div&gt;&lt;div style=&quot;color:var(--muted)&quot;&gt;산출물 · &#x27;+g.output+&#x27;&lt;/div&gt;&lt;/div&gt;&#x27;;}).join(&#x27;&#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  }
  if(n.open_questions&amp;&amp;n.open_questions.length){
    h+=&#x27;&lt;dt&gt;현장 확인질문&lt;/dt&gt;&lt;dd&gt;&#x27;+n.open_questions.map(function(q){
      return &#x27;&lt;div style=&quot;margin-bottom:10px&quot;&gt;&lt;span class=&quot;badge &#x27;+(q.blocking?&#x27;bad&#x27;:&#x27;muted&#x27;)+&#x27;&quot;&gt;&#x27;
        +(q.blocking?&#x27;Gate 차단&#x27;:&#x27;추가 확인&#x27;)+&#x27;&lt;/span&gt; &lt;code&gt;&#x27;+q.id+&#x27;&lt;/code&gt;&lt;div&gt;&#x27;+q.question+&#x27;&lt;/div&gt;&#x27;
        +&#x27;&lt;div style=&quot;color:var(--muted)&quot;&gt;영향 · &#x27;+q.why+&#x27;&lt;/div&gt;&#x27;
        +&#x27;&lt;div style=&quot;color:var(--muted)&quot;&gt;확인기관 · &#x27;+q.confirm_with.join(&#x27; · &#x27;)+&#x27;&lt;/div&gt;&#x27;
        +&#x27;&lt;div style=&quot;color:var(--muted)&quot;&gt;증빙 · &#x27;+q.evidence.join(&#x27; · &#x27;)+&#x27;&lt;/div&gt;&lt;/div&gt;&#x27;;}).join(&#x27;&#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  }
  var ins=EDGES.filter(function(x){return x.target===id}),
      outs=EDGES.filter(function(x){return x.source===id});
  /* 보드에서 순차 라벨을 접어 두므로 여기가 전이 문구를 빠짐없이 보는 자리다.
     한 줄로 이어붙이면 묻히므로 연결 종류별 배지로 세워 준다. */
  function edgeLine(otherId,x){
    var tone=x.type===&#x27;loop&#x27;?&#x27;back&#x27;:(x.type===&#x27;message&#x27;?&#x27;info&#x27;:&#x27;muted&#x27;);
    return &#x27;&lt;div style=&quot;margin-bottom:5px&quot;&gt;&#x27;+(NODES[otherId]?NODES[otherId].name:otherId)
      +(x.label?&#x27; &lt;span class=&quot;badge &#x27;+tone+&#x27;&quot;&gt;&#x27;+x.label+&#x27;&lt;/span&gt;&#x27;:&#x27;&#x27;)+&#x27;&lt;/div&gt;&#x27;;
  }
  if(ins.length) h+=&#x27;&lt;dt&gt;선행&lt;/dt&gt;&lt;dd&gt;&#x27;+ins.map(function(x){
    return edgeLine(x.source,x);}).join(&#x27;&#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  if(outs.length) h+=&#x27;&lt;dt&gt;후속&lt;/dt&gt;&lt;dd&gt;&#x27;+outs.map(function(x){
    return edgeLine(x.target,x);}).join(&#x27;&#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  h+=&#x27;&lt;/dl&gt;&#x27;;
  document.getElementById(&#x27;dbody&#x27;).innerHTML=h;
  document.getElementById(&#x27;dlg&#x27;).showModal();
}

/* 인접 카드 강조와 숨긴 순차 라벨 노출을 한 곳에서 처리한다. focus·blur를 함께
   걸어 마우스 없이 Tab만으로도 같은 정보에 닿게 한다 — 카드는 button이라 원래
   포커스를 받는데 지금까지 hover에만 반응해 키보드에서는 강조가 동작하지 않았다. */
function peek(id,on){
  var rel={};rel[id]=1;
  EDGES.forEach(function(x){if(x.source===id)rel[x.target]=1;if(x.target===id)rel[x.source]=1;});
  document.querySelectorAll(&#x27;.node&#x27;).forEach(function(o){o.classList.toggle(&#x27;dim&#x27;,on&amp;&amp;!rel[o.dataset.id])});
  var sv=document.getElementById(&#x27;edges&#x27;); if(!sv)return;
  sv.querySelectorAll(&#x27;.edge-label-group&#x27;).forEach(function(g){
    g.classList.toggle(&#x27;lit&#x27;, on &amp;&amp; (g.getAttribute(&#x27;data-edge-source&#x27;)===id
                                   ||g.getAttribute(&#x27;data-edge-target&#x27;)===id));
  });
}
document.querySelectorAll(&#x27;.node&#x27;).forEach(function(b){
  b.addEventListener(&#x27;click&#x27;,function(){openNode(b.dataset.id)});
  b.addEventListener(&#x27;mouseenter&#x27;,function(){peek(b.dataset.id,true)});
  b.addEventListener(&#x27;focus&#x27;,function(){peek(b.dataset.id,true)});
  b.addEventListener(&#x27;mouseleave&#x27;,function(){peek(b.dataset.id,false)});
  b.addEventListener(&#x27;blur&#x27;,function(){peek(b.dataset.id,false)});
});
var _all=document.getElementById(&#x27;labelall&#x27;);
if(_all) _all.addEventListener(&#x27;change&#x27;,function(){
  var bd=document.getElementById(&#x27;board&#x27;);
  if(bd) bd.classList.toggle(&#x27;show-all-labels&#x27;,this.checked);
});
document.getElementById(&#x27;dlg&#x27;).addEventListener(&#x27;click&#x27;,function(ev){
  if(ev.target===this) this.close();
});

// 리사이즈는 연속으로 쏟아지므로 프레임당 한 번으로 모은다.
var _raf=0;
function redraw(){ if(_raf)return; _raf=requestAnimationFrame(function(){_raf=0;draw();}); }
addEventListener(&#x27;load&#x27;,draw); addEventListener(&#x27;resize&#x27;,redraw);
if(document.fonts&amp;&amp;document.fonts.ready) document.fonts.ready.then(draw);
new MutationObserver(redraw).observe(document.documentElement,{attributes:true,attributeFilter:[&#x27;data-theme&#x27;]});
&lt;/script&gt;
&lt;/body&gt;&lt;/html&gt;"></iframe></div>
<div class="foot">
  자료집 기준일 기준으로 작성된 참고자료입니다. 법률 자문이나 해당국 정부·KOICA의 공식 해석이 아닙니다.
  조달·건축 법령은 개정이 잦으므로 실제 입찰·설계·인허가 전 발주처 공고문과 현행 법령을 확인해야 합니다.
</div>
<script>
function fit(fr){ try{ fr.style.height=(fr.contentWindow.document.body.scrollHeight+20)+'px'; }catch(e){} }
function showTab(i){
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.toggle('active', +t.dataset.i===i); });
  document.querySelectorAll('.fr').forEach(function(fr){
    var on=+fr.dataset.i===i; fr.classList.toggle('active', on);
    if(on){ try{ fr.contentWindow.draw && fr.contentWindow.draw(); }catch(e){} setTimeout(function(){fit(fr);},60); }
  });
}
document.querySelectorAll('.fr').forEach(function(fr){
  fr.addEventListener('load', function(){
    // iframe 안의 테마 토글·업무구조도가 부모 테마를 따르도록, 그리고 높이를 맞춘다
    fit(fr);
    if(fr.classList.contains('active')) setTimeout(function(){ try{fr.contentWindow.draw&&fr.contentWindow.draw();}catch(e){} fit(fr); },80);
  });
});
addEventListener('resize', function(){ var a=document.querySelector('.fr.active'); if(a) fit(a); });
</script>
</body></html>
