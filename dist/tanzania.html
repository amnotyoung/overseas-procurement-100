&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;한 장 캔버스&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;재정기획부를 원조 총괄·조화 창구로 삼아 개발협력을 체계화하되, 실질적인 사업 수원과 수행은 원조를 직접 받는 개별 부처가 담당하도록 역할을 나누어 원조 투명성·예측가능성·상호책무성을 확보한다.&lt;/p&gt;
  &lt;div class=&quot;cards&quot;&gt;
    &lt;div class=&quot;card span2&quot;&gt;&lt;h3&gt;절차&lt;/h3&gt;&lt;ol class=&quot;steps&quot;&gt;&lt;li&gt;국별협력·다자지원사업은 개별 부처·지방정부와 직접 사업발굴 가능, 단 재정기획부의 최종 원조사업요청 승인 필요&lt;/li&gt;&lt;li&gt;(연수사업) 대통령 직속 공공행정서비스실의 총괄 조정으로 연수생 추천&lt;/li&gt;&lt;li&gt;(민관협력사업) 후원기관과 약정·계약 체결 후 NGO 등록청에 제출하여 공식화&lt;/li&gt;&lt;li&gt;KOICA 수요가 있는 개별 부처가 사업요청서(PCP)를 KOICA에 제출&lt;/li&gt;&lt;li&gt;PCP를 근거로 사업수행부처 지원 하에 예비조사 실시 및 예비조사 보고서 작성&lt;/li&gt;&lt;li&gt;예비조사에서 타당성이 인정되면 사업수행부처와 기획조사 실시 및 사업집행계획서 고도화&lt;/li&gt;&lt;li&gt;사업수행부처 및 재정기획부(수원총괄기관)와 협의&lt;/li&gt;&lt;li&gt;재정기획부와 협의의사록(RD) 체결로 공식화&lt;/li&gt;&lt;li&gt;사업 수행 — 개별 부처가 실무 총괄·행정지원·예산 확보&lt;/li&gt;&lt;li&gt;관세·부가세 면세·환급은 재정기획부 승인 + 국세청(TRA) 협조로 진행&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;적용 대상&lt;/h3&gt;&lt;p style=&quot;margin:0;font-size:13.5px;line-height:1.7&quot;&gt;탄자니아 정부가 수원하는 개발협력사업에 적용된다. 무상원조의 경우 재정기획부는 정보·실적 관리 역할을 하고 실질 수원체계는 원조를 직접 받는 개별 부처가 담당한다. 사업 유형별로 경로가 다르다 — 국별협력·다자지원(부처 직접 발굴 + 재정기획부 승인), 연수(공공행정서비스실 조정), 민관협력(NGO 등록청 공식화), WFK 봉사단(개별부처 승인 + 고용노동부 노동허가 + 이민청 비자).&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;법적 근거&lt;/h3&gt;&lt;div class=&quot;law&quot;&gt;&lt;span class=&quot;nm&quot;&gt;협의의사록(Record of Discussion, RoD) — KOICA·재정기획부&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:auto&quot;&gt;양자합의&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;law&quot;&gt;&lt;span class=&quot;nm&quot;&gt;개발협력포럼(Development Cooperation Framework, DCF) 정책대화 체계&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:auto&quot;&gt;지침·정책&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;law&quot;&gt;&lt;span class=&quot;nm&quot;&gt;원조관리플랫폼(Aid Management Platform, AMP) 운영&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:auto&quot;&gt;지침·정책&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;law&quot;&gt;&lt;span class=&quot;nm&quot;&gt;KOICA 사업심사 가이드라인 및 PCP·예비조사·기획조사 절차&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:auto&quot;&gt;공여기관 규정&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;law&quot;&gt;&lt;span class=&quot;nm&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.mof.go.tz/uploads/documents/en-1747807046-Development%20Cooperation%20Framework%20%28DCF%29.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Development Cooperation Framework 2017/18–2029/30 (revised 2022/23)&lt;/a&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:auto&quot;&gt;지침·정책&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;law&quot;&gt;&lt;span class=&quot;nm&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://mof.go.tz/divisions&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;External Finance Division and Debt Management Division official mandates&lt;/a&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:auto&quot;&gt;지침·정책&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;law&quot;&gt;&lt;span class=&quot;nm&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://repository.mof.go.tz/items/49afd5c3-5fc9-45a4-98d1-fcb99a9fe01d&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Guidelines for Project Planning and Negotiations for Raising Loans, Issuing Guarantees and Receiving Grants&lt;/a&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:auto&quot;&gt;지침·정책&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;권한 기관&lt;/h3&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;재무부 대외금융국(External Finance Division)&lt;/b&gt;&lt;span&gt;무상원조·양허성차관 등 외부재원을 동원하고 개발협력 정책·협정·ODA 기록·사업모니터링을 담당한다.&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;재무부 부채관리국&lt;/b&gt;&lt;span&gt;외부차입·보증·채무전략과 부채 데이터베이스를 담당한다.&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;부문부처·실행기관&lt;/b&gt;&lt;span&gt;국가계획과 예산에 맞춰 사업을 제안·준비·집행·보고한다.&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;정부·개발파트너 협의체&lt;/b&gt;&lt;span&gt;Development Cooperation Framework 아래 정책대화·공여조정을 수행한다.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;이해관계자&lt;/h3&gt;&lt;p style=&quot;margin:0;font-size:13.5px;line-height:1.7&quot;&gt;재정기획부(MoF) 원조조화부서(External Finance Department), 개별 소관부처(사업 수행기관), 대통령 직속 공공행정서비스실(연수 총괄), 개발협력포럼(DCF)·개발파트너그룹(DPG), KOICA 탄자니아사무소, KOICA 본부, 주탄자니아 대한민국대사관, 국세청(TRA), NGO 등록청&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;제출서류&lt;/h3&gt;&lt;div class=&quot;docset&quot;&gt;&lt;b&gt;개별 소관부처&lt;/b&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;사업요청서(Project Concept Paper, PCP)&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;원조사업요청(재정기획부 승인 대상)&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;타당성조사 자료&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;docset&quot;&gt;&lt;b&gt;재정기획부&lt;/b&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;원조사업요청 승인&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;협의의사록(RD)&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;면세·환급 승인&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;docset&quot;&gt;&lt;b&gt;KOICA&lt;/b&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;예비조사 보고서&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;기획조사 결과&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;사업집행계획서&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;docset&quot;&gt;&lt;b&gt;민관협력 후원기관&lt;/b&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;약정서·계약서(NGO 등록청 제출)&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;유의사항 · 병목&lt;/h3&gt;&lt;ul class=&quot;plain&quot;&gt;&lt;li&gt;개별 부처와 직접 사업을 발굴하더라도 재정기획부의 최종 원조사업요청 승인이 없으면 진행되지 않는다&lt;/li&gt;&lt;li&gt;재정기획부는 총괄·조화 창구이나 실질 수원은 개별 부처라, 사업마다 소관부처와 재정기획부 양쪽과 협의해야 한다&lt;/li&gt;&lt;li&gt;면세·환급이 재정기획부 승인 + 국세청(TRA) 협조 이중 절차라 시간이 소요된다&lt;/li&gt;&lt;li&gt;본토와 잔지바르 자치정부의 이원 행정으로 관할·협의 대상이 갈릴 수 있다&lt;/li&gt;&lt;li&gt;탄자니아의 다소 느린 행정처리로 승인·조사 단계에 시간 여유가 필요하다&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;진입장벽&lt;/h3&gt;&lt;ul class=&quot;plain&quot;&gt;&lt;li&gt;WFK 봉사단은 총괄 중앙부처가 없어 파견분야별 개별부처 승인 + 고용노동부 노동허가 + 이민청 비자를 각각 받아야 함&lt;/li&gt;&lt;li&gt;사업 예산 확보가 개별 부처 책임이라 부처 재정 여건에 좌우됨&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;현장 검증 필요&lt;/h3&gt;&lt;ul class=&quot;plain&quot;&gt;&lt;li&gt;{&amp;#x27;item&amp;#x27;: &amp;#x27;현행 기관·기본규정·핵심 적용경로&amp;#x27;, &amp;#x27;question&amp;#x27;: &amp;#x27;공식 원문이 모델의 핵심 경로와 일치하는가?&amp;#x27;, &amp;#x27;status&amp;#x27;: &amp;#x27;confirmed&amp;#x27;}&lt;/li&gt;&lt;li&gt;{&amp;#x27;item&amp;#x27;: &amp;#x27;현행 ODA 조달·정량요건·공여자 예외&amp;#x27;, &amp;#x27;question&amp;#x27;: &amp;#x27;DCF와 현행 PPA/PPR에서 조달 기준·기한·보증·이의·공여협정 예외를 확인했는가?&amp;#x27;, &amp;#x27;status&amp;#x27;: &amp;#x27;confirmed&amp;#x27;}&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;관련 제도&lt;/h3&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;탄자니아 공공조달 입찰제도&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;탄자니아 조달 거버넌스·감독체계&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;



&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;현행 기준 반영 1건&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;공식 법령·기관 원문으로 확인한 현행 기준과 실무 확인사항입니다.
    출처는 각 항목에 연결했으며.&lt;/p&gt;
  &lt;div class=&quot;disc&quot; data-sev=&quot;high&quot;&gt;
  &lt;div class=&quot;top&quot;&gt;
    &lt;span class=&quot;badge bad&quot;&gt;필수 확인&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;탄자니아&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;D01&lt;/span&gt;
  &lt;/div&gt;
  &lt;h3&gt;canvas.authorities·legalBasis / 현행 기관·법령&lt;/h3&gt;
  &lt;div class=&quot;quote act&quot;&gt;&lt;b&gt;현행 기준&lt;/b&gt;재무부 External Finance Division이 외부재원·협력정책·협정·ODA 기록·모니터링을, Debt Management Division이 차입·보증·채무를 담당하며 DCF가 공통 틀이다.&lt;/div&gt;
  &lt;p class=&quot;cite&quot;&gt;확인 출처 · MoF divisions; revised DCF; financing guidelines&lt;/p&gt;
  &lt;div class=&quot;todo&quot;&gt;&lt;b&gt;실무 확인&lt;/b&gt;Classify grant or loan and confirm External Finance, debt review, budget inclusion, agreement and tax treatment.&lt;/div&gt;
  &lt;details class=&quot;review&quot;&gt;
  &lt;summary&gt;Field verification (English)&lt;/summary&gt;
  &lt;div class=&quot;rv&quot;&gt;

&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;검증&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;재무부 DCF 원문과 공식 PPA 2023·PPR 2024 공표본에서 ODA의 예산·조달 적용경로, 시행·개정·폐지 상태, 정량요건·보증·이의·공여자 예외를 조문과 부속표 단위로 대조했다.&lt;/p&gt;
  &lt;div class=&quot;cards&quot;&gt;
    &lt;div class=&quot;card span2&quot;&gt;&lt;h3&gt;검증 범위&lt;/h3&gt;
      &lt;p style=&quot;margin:0;font-size:13.5px;line-height:1.7&quot;&gt;DCF Ch.2 및 Ch.4 §§4.1–4.6, PPA 2023 §§1–5, 49–86, 119–125, 131, PPR 2024 regs.1, 9–11, 23–30, 107–109, 150–166, 238과 Sixth·Tenth·Eleventh Schedules를 확인했다.&lt;/p&gt;
      &lt;p style=&quot;margin:12px 0 0;font-size:12.5px;color:var(--muted)&quot;&gt;확인일 2026-07-28 · 자료집 기준일 2026-02-23&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;대조에 쓴 원문&lt;/h3&gt;&lt;ul class=&quot;srcs&quot; style=&quot;padding-left:16px;margin:0&quot;&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.mof.go.tz/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;재정기획부(원조조화·External Finance) 공식 사이트&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;지침·정책&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-23 · Ministry of Finance, Tanzania&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://overseas.mofa.go.kr/tz-ko/index.do&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;주탄자니아 대한민국대사관&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;지침·정책&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-23 · 주탄자니아 대한민국대사관&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.mof.go.tz/uploads/documents/en-1747807046-Development%20Cooperation%20Framework%20%28DCF%29.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Development Cooperation Framework 2017/18–2029/30 (revised 2022/23)&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;지침·정책&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;대조 조문 Ch.2 §§2.1–2.4; Ch.4 §§4.1–4.6; Ch.5 roles and responsibilities&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-28 · Ministry of Finance&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://mof.go.tz/divisions&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;External Finance Division and Debt Management Division official mandates&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;지침·정책&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-28 · Ministry of Finance&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://repository.mof.go.tz/items/49afd5c3-5fc9-45a4-98d1-fcb99a9fe01d&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Guidelines for Project Planning and Negotiations for Raising Loans, Issuing Guarantees and Receiving Grants&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;지침·정책&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-28 · Ministry of Finance&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.ppra.go.tz/uploads/documents/en-1736861173-THE%20PUBLIC%20PROCUREMENT%20ACT.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Public Procurement Act, No. 10 of 2023&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;법률&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;대조 조문 §§1–5, 49–86, 112–125, 131(1)–(3)&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-28 · Public Procurement Regulatory Authority&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.mof.go.tz/uploads/documents/en-1758539549-GN%20No.%20261%20OF%202025%20-%20THE%20PUBLIC%20PROCUREMENT%20REGULATIONS%20%20-%20ENGLISH%20VERSION.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Public Procurement Regulations, 2024 (English version: GN No. 261 of 2025)&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;시행규칙&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;대조 조문 regs.1, 9–11, 23–30, 107–109, 150–166, 238; Sixth, Tenth and Eleventh Schedules&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-28 · Ministry of Finance&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card span2&quot;&gt;&lt;h3&gt;주의&lt;/h3&gt;&lt;p class=&quot;note&quot;&gt;DCF는 2022/23 개정되어 FY 2029/30까지 적용되는 정책틀이다. §4.6이 정부 조달시스템 사용을 정하지만 2011년법 인용은 PPA 2023 §131에 따라 현행법으로 대체해 읽어야 한다.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;PPA §4와 PPR reg.9에 따라 공여협정과 국내법이 충돌하는 범위에서는 협정이 우선하고, 충돌하지 않는 내부 승인과 국내 절차는 계속 적용된다.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;p style=&quot;margin:22px 0 0;font-size:12.5px;color:var(--muted)&quot;&gt;
    조문 대조 완료 — 조문의 존재와 문언 일치만 뜻합니다. 법적 해석·적용 타당성·개정 반영 여부는 별도 검토 대상입니다.
  &lt;/p&gt;

      +(n.confidence&lt;0.8?&#x27; &lt;span class=&quot;badge warn&quot;&gt;현장 검증 필요&lt;/span&gt;&#x27;:&#x27;&#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  }
  if(n.confidence_reason) h+=&#x27;&lt;dt&gt;확신도 산정 근거&lt;/dt&gt;&lt;dd&gt;&#x27;+n.confidence_reason+&#x27;&lt;/dd&gt;&#x27;;
  var ins=EDGES.filter(function(x){return x.target===id}),
      outs=EDGES.filter(function(x){return x.source===id});
  if(ins.length) h+=&#x27;&lt;dt&gt;선행&lt;/dt&gt;&lt;dd&gt;&#x27;+ins.map(function(x){
    return (NODES[x.source]?NODES[x.source].name:x.source)+(x.label?&#x27; (&#x27;+x.label+&#x27;)&#x27;:&#x27;&#x27;);}).join(&#x27; · &#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  if(outs.length) h+=&#x27;&lt;dt&gt;후속&lt;/dt&gt;&lt;dd&gt;&#x27;+outs.map(function(x){
    return (NODES[x.target]?NODES[x.target].name:x.target)+(x.label?&#x27; (&#x27;+x.label+&#x27;)&#x27;:&#x27;&#x27;);}).join(&#x27; · &#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  h+=&#x27;&lt;/dl&gt;&#x27;;
  document.getElementById(&#x27;dbody&#x27;).innerHTML=h;
  document.getElementById(&#x27;dlg&#x27;).showModal();
}

document.querySelectorAll(&#x27;.node&#x27;).forEach(function(b){
  b.addEventListener(&#x27;click&#x27;,function(){openNode(b.dataset.id)});
  b.addEventListener(&#x27;mouseenter&#x27;,function(){
    var id=b.dataset.id;
    var rel={};rel[id]=1;
    EDGES.forEach(function(x){if(x.source===id)rel[x.target]=1;if(x.target===id)rel[x.source]=1;});
    document.querySelectorAll(&#x27;.node&#x27;).forEach(function(o){o.classList.toggle(&#x27;dim&#x27;,!rel[o.dataset.id])});
  });
  b.addEventListener(&#x27;mouseleave&#x27;,function(){
    document.querySelectorAll(&#x27;.node&#x27;).forEach(function(o){o.classList.remove(&#x27;dim&#x27;)});
  });
});
document.getElementById(&#x27;dlg&#x27;).addEventListener(&#x27;click&#x27;,function(ev){
  if(ev.target===this) this.close();
});

addEventListener(&#x27;load&#x27;,draw); addEventListener(&#x27;resize&#x27;,draw);
new MutationObserver(draw).observe(document.documentElement,{attributes:true,attributeFilter:[&#x27;data-theme&#x27;]});
&lt;/script&gt;
&lt;/body&gt;&lt;/html&gt;"></iframe></div>
<div class="foot">
  자료집 기준일 기준으로 작성된 참고자료입니다. 법률 자문이나 해당국 정부·KOICA의 공식 해석이 아닙니다.
  조달법은 개정이 잦으므로 실제 입찰 전 발주처 공고문과 현행 법령을 확인해야 합니다.
</div>
<script>
function fit(fr){ try{ fr.style.height=(fr.contentWindow.document.body.scrollHeight+20)+'px'; }catch(e){} }
function showTab(i){
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.toggle('active', +t.dataset.i===i); });
  document.querySelectorAll('.fr').forEach(function(fr){
    var on=+fr.dataset.i===i; fr.classList.toggle('active', on);
    if(on){ try{ fr.contentWindow.draw && fr.contentWindow.draw(); }catch(e){} setTimeout(function(){fit(fr);},60); }
  });
}
document.querySelectorAll('.fr').forEach(function(fr){
  fr.addEventListener('load', function(){
    // iframe 안의 테마 토글·업무구조도가 부모 테마를 따르도록, 그리고 높이를 맞춘다
    fit(fr);
    if(fr.classList.contains('active')) setTimeout(function(){ try{fr.contentWindow.draw&&fr.contentWindow.draw();}catch(e){} fit(fr); },80);
  });
});
addEventListener('resize', function(){ var a=document.querySelector('.fr.active'); if(a) fit(a); });
</script>
