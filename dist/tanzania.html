  &lt;span class=&quot;id&quot;&gt;&lt;span&gt;B07&lt;/span&gt;&lt;span class=&quot;tags&quot;&gt;&lt;span class=&quot;kind-tag&quot;&gt;공식경로&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;유의&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;
  &lt;span class=&quot;nm&quot;&gt;건축검사관(Building inspector) 단계검사&lt;/span&gt;&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;bcell&quot; data-lane=&quot;환경·소방·검사기관&quot; data-stage=&quot;G3 시정·재검사&quot;&gt;&lt;/div&gt;&lt;div class=&quot;bcell&quot; data-lane=&quot;환경·소방·검사기관&quot; data-stage=&quot;G4 완료검사&quot;&gt;&lt;button class=&quot;node&quot; data-id=&quot;B33&quot; data-tone=&quot;warn&quot;&gt;
  &lt;span class=&quot;id&quot;&gt;&lt;span&gt;B11&lt;/span&gt;&lt;span class=&quot;tags&quot;&gt;&lt;span class=&quot;kind-tag&quot;&gt;공식경로&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;유의&lt;/span&gt;&lt;/span&gt;&lt;/span&gt;
  &lt;span class=&quot;nm&quot;&gt;최종 구조·위생·거주적합 검사&lt;/span&gt;&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;bcell&quot; data-lane=&quot;환경·소방·검사기관&quot; data-stage=&quot;G5 제10호 서식·시공자등록위원회 종결&quot;&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;decision-branches&quot;&gt;&lt;div class=&quot;branch-hd&quot;&gt;&lt;b&gt;공식 결정 결과 분기&lt;/b&gt;&lt;span&gt;보완 회귀는 위 절차에 근거가 있는 경우만 표시합니다. 불복·재신청 경로와 기한은 별도 근거가 없으면 추정하지 않습니다.&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;decision-branch-grid&quot;&gt;&lt;div class=&quot;decision-branch&quot; data-state=&quot;success&quot;&gt;&lt;span class=&quot;branch-arrow&quot; aria-hidden=&quot;true&quot;&gt;→&lt;/span&gt;&lt;span class=&quot;badge ok&quot;&gt;진행&lt;/span&gt;&lt;b&gt;제10호 서식 발급&lt;/b&gt;&lt;span&gt;점유증명 수령 후 시설을 인계·사용하고 시공자등록위원회 등록부 종결&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;decision-branch&quot; data-state=&quot;rework&quot;&gt;&lt;span class=&quot;branch-arrow&quot; aria-hidden=&quot;true&quot;&gt;↺&lt;/span&gt;&lt;span class=&quot;badge back&quot;&gt;보완 회귀&lt;/span&gt;&lt;b&gt;등록·검사 보완&lt;/b&gt;&lt;span&gt;시공자등록위원회 미비 또는 현장·준공 부적합을 시정해 해당 심사로 복귀&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;decision-branch&quot; data-state=&quot;reject&quot;&gt;&lt;span class=&quot;branch-arrow&quot; aria-hidden=&quot;true&quot;&gt;×&lt;/span&gt;&lt;span class=&quot;badge bad&quot;&gt;중단·재검토&lt;/span&gt;&lt;b&gt;등록거부·공사중지·점유불가&lt;/b&gt;&lt;span&gt;등록·허가 위반을 해소하고 필요한 재허가·철거·재시공 뒤 다시 검사&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;한 장 캔버스&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;설계·시공 자격, 기술검사와 공사보험, 착공·중간검사·변경관리, 준공·소방·사용승인과 운영 인계조건을 확인하는 제도축&lt;/p&gt;
  &lt;div class=&quot;cards&quot;&gt;
    &lt;div class=&quot;card span2&quot;&gt;&lt;h3&gt;국가별 건축 인허가 절차 · 14단계&lt;/h3&gt;&lt;p class=&quot;workflow-disclosure&quot;&gt;해당 국가의 법령·관할기관 공식자료에서 확인한 신청·심사·보완·결정 절차를 표시한다. 업무구조도와 노드 상세에는 국가 절차만 두고, ODA 조사팀의 사업별 확인질문은 페이지 하단의 별도 접이식 목록으로 분리한다.&lt;/p&gt;&lt;p class=&quot;workflow-disclosure&quot;&gt;&lt;b&gt;적용 범위&lt;/b&gt; · 등록 전문가·시공자와 시공자등록위원회 프로젝트 등록부터 계획기관(planning authority) 단계검사·시정·점유증명까지를 표시한다.&lt;/p&gt;&lt;ol class=&quot;steps&quot;&gt;&lt;li&gt;B01 등록 전문가·시공자등록위원회 시공자 계약 — 건축주가 건축·수량전문가등록위원회(AQRB)·기술사등록위원회(ERB) 등록 설계·감리자와 공사종류·금액에 맞는 시공자등록위원회 등록 시공자를 계약한다. / 산출물: 전문자격·시공자등록위원회 등록·계약 증빙&lt;/li&gt;&lt;li&gt;B02 시공자등록위원회 프로젝트 온라인 등록 — 1천만 탄자니아 실링(TSh) 이상 프로젝트의 시공자·하도급자가 계약수락 후 21일 이내이면서 착공 전에 온라인 등록과 수수료납부를 완료한다. / 산출물: 시공자등록위원회 신청·납부 관리번호(control number)&lt;/li&gt;&lt;li&gt;B03 시공자등록위원회 등록번호 발급·보완결정 — 시공자등록위원회가 납부 후 신청을 처리해 프로젝트 등록번호를 발급하거나 불승인 사유와 14일 보완기한을 통지한다. / 산출물: 프로젝트 등록번호(Project Registration Number) 또는 보완통지&lt;/li&gt;&lt;li&gt;B04 시공자등록위원회 미비 보완·재신청 — 불승인 사유를 14일 안에 보완해 시공자등록위원회 심사에 재제출한다. / 산출물: 보완 시공자등록위원회 신청&lt;/li&gt;&lt;li&gt;B05 현장표지·안전시설 설치·착공통지 — 프로젝트 등록번호를 현장표지에 표시하고 가설울타리·개인보호구(PPE)·소화·위생시설을 갖춘 뒤 계획기관에 신축 착공을 통지한다. / 산출물: 현장표지·안전준비·착공통지&lt;/li&gt;&lt;li&gt;B06 기초·배수 은폐 전 통지 — 하수·배수·기초를 덮기 전에 계획기관에 통지해 검사 가능상태로 유지한다. / 산출물: 은폐 전 검사통지·접수기록&lt;/li&gt;&lt;li&gt;B07 건축검사관(Building inspector) 단계검사 — 건축검사관이 허가도서·구조·기초·배수·위생을 검사하고 필요하면 은폐부를 열거나 철거해 확인한다. / 산출물: 단계검사 기록·적합 또는 위반통지&lt;/li&gt;&lt;li&gt;B08 공사계속·시정·중지 판정 — 계획기관이 규칙·허가도서 위반을 확인해 계속공사 또는 시정·철거·중지를 명한다. / 산출물: 단계 적합확인 또는 시정·중지명령&lt;/li&gt;&lt;li&gt;B09 위반시정 완료통지·재검사 — 시공자가 위반사항을 바로잡고 시정완료통지(rectification completion notice)를 제출해 재검사를 받는다. / 산출물: 시정완료 통지·재검사 기록&lt;/li&gt;&lt;li&gt;B10 공사완료 통지·점유검사 신청 — 공사완료 후 건축주가 계획기관에 완료를 통지하고 신축건물 점유검사를 신청한다. / 산출물: 완료통지·제10호 서식 검사신청&lt;/li&gt;&lt;li&gt;B11 최종 구조·위생·거주적합 검사 — 계획기관이 완공건물이 허가도서·구조·배수·위생·인간거주 요건에 맞는지 최종 검사하고 보완사항을 통지한다. / 산출물: 최종검사 보고·적합 또는 보완통지&lt;/li&gt;&lt;li&gt;B12 준공부적합 시정·재검사 — 최종검사 지적을 시정하고 수정도서·시험자료와 함께 재검사를 신청한다. / 산출물: 시정 준공자료·재검사 보고&lt;/li&gt;&lt;li&gt;B13 제10호 서식 점유증명서(Occupation Certificate) 발급 — 계획기관이 건물이 모든 면에서 점유·인간거주에 적합하다고 판단하면 제10호 서식을 발급한다. / 산출물: 제10호 서식 점유증명 또는 미발급통지&lt;/li&gt;&lt;li&gt;B14 시공자등록위원회 완료 피드백·등록부 갱신 — 시공자가 프로젝트 완료 피드백(completion feedback)을 시공자등록위원회에 서면 제출해 프로젝트 등록부 상태를 갱신한다. / 산출물: 시공자등록위원회 완료 피드백·등록부 갱신&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
    &lt;div class=&quot;card span2&quot;&gt;&lt;h3&gt;공식 결정 Gate · 3개&lt;/h3&gt;&lt;p class=&quot;workflow-disclosure&quot;&gt;위 절차 중 관할기관이 공식 문서를 발급하거나 처분하는 결정 지점만 분리했습니다. Gate 1/N은 이 페이지 안의 표시번호이며, 관할·사업별 적용조건과 근거 수준은 각 Gate에서 확인합니다.&lt;/p&gt;&lt;ol class=&quot;official-gates&quot;&gt;&lt;li class=&quot;official-gate&quot; data-source-order=&quot;5&quot;&gt;&lt;div class=&quot;gate-title&quot;&gt;&lt;span class=&quot;badge info&quot;&gt;Gate 1/3&lt;/span&gt;&lt;b&gt;시공자등록위원회 프로젝트 등록 공식결정&lt;/b&gt;&lt;/div&gt;&lt;p&gt;시공자등록위원회가 시공자·계약·프로젝트 신청을 심사해 등록번호를 발급하거나 보완·불승인을 결정한다.&lt;/p&gt;&lt;dl class=&quot;gate-meta&quot;&gt;&lt;dt&gt;결정기관&lt;/dt&gt;&lt;dd&gt;시공자등록위원회&lt;/dd&gt;&lt;dt&gt;적용 관할·조건&lt;/dt&gt;&lt;dd&gt;등록 전문가와 시공자가 수행하며 검사·점유승인이 필요한 건축공사&lt;/dd&gt;&lt;dt&gt;산출물&lt;/dt&gt;&lt;dd&gt;프로젝트 등록번호 또는 이유부 보완·불승인&lt;/dd&gt;&lt;dt&gt;근거 수준&lt;/dt&gt;&lt;dd&gt;제도축 공통근거 · 세부 조문 미대조&lt;/dd&gt;&lt;dt&gt;연결 근거&lt;/dt&gt;&lt;dd&gt;&lt;span class=&quot;gate-basis&quot;&gt;&lt;span class=&quot;law-name&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.crb.go.tz/CoreFunction/DevelopmentOfContractors&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;CRB 현행 건설프로젝트 등록 서비스&lt;/a&gt;&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot;&gt;공식 안내&lt;/span&gt;&lt;span class=&quot;badge info&quot;&gt;공식자료 연결&lt;/span&gt;&lt;/span&gt;&lt;/dd&gt;&lt;/dl&gt;&lt;/li&gt;&lt;li class=&quot;official-gate&quot; data-source-order=&quot;6&quot;&gt;&lt;div class=&quot;gate-title&quot;&gt;&lt;span class=&quot;badge info&quot;&gt;Gate 2/3&lt;/span&gt;&lt;b&gt;계획기관 시공단계 적합판정&lt;/b&gt;&lt;/div&gt;&lt;p&gt;건축검사관과 계획기관이 허가·기술규칙 적합성을 판정해 계속공사 또는 시정·중지를 결정한다.&lt;/p&gt;&lt;dl class=&quot;gate-meta&quot;&gt;&lt;dt&gt;결정기관&lt;/dt&gt;&lt;dd&gt;건축검사관과 계획기관&lt;/dd&gt;&lt;dt&gt;적용 관할·조건&lt;/dt&gt;&lt;dd&gt;등록 전문가와 시공자가 수행하며 검사·점유승인이 필요한 건축공사&lt;/dd&gt;&lt;dt&gt;산출물&lt;/dt&gt;&lt;dd&gt;단계 적합확인 또는 시정·중지명령&lt;/dd&gt;&lt;dt&gt;근거 수준&lt;/dt&gt;&lt;dd&gt;제도축 공통근거 · 세부 조문 미대조&lt;/dd&gt;&lt;dt&gt;연결 근거&lt;/dt&gt;&lt;dd&gt;&lt;span class=&quot;gate-basis&quot;&gt;&lt;span class=&quot;law-name&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.lands.go.tz/uploads/documents/sw-1732795157-GN.%2080%20URBAN%20PLANNING%20%20BUILDING.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;도시계획(건축)규칙 2018(정부고시 제80호)&lt;/a&gt;&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot;&gt;시행규칙&lt;/span&gt;&lt;span class=&quot;badge info&quot;&gt;원문 링크 연결&lt;/span&gt;&lt;/span&gt;&lt;/dd&gt;&lt;/dl&gt;&lt;/li&gt;&lt;li class=&quot;official-gate&quot; data-source-order=&quot;7&quot;&gt;&lt;div class=&quot;gate-title&quot;&gt;&lt;span class=&quot;badge info&quot;&gt;Gate 3/3&lt;/span&gt;&lt;b&gt;제10호 서식 점유증명 공식결정&lt;/b&gt;&lt;/div&gt;&lt;p&gt;계획기관이 완공건물의 구조·위생·거주 적합성을 확인해 제10호 서식 발급·보완 또는 거부를 결정한다.&lt;/p&gt;&lt;dl class=&quot;gate-meta&quot;&gt;&lt;dt&gt;결정기관&lt;/dt&gt;&lt;dd&gt;계획기관&lt;/dd&gt;&lt;dt&gt;적용 관할·조건&lt;/dt&gt;&lt;dd&gt;등록 전문가와 시공자가 수행하며 검사·점유승인이 필요한 건축공사&lt;/dd&gt;&lt;dt&gt;산출물&lt;/dt&gt;&lt;dd&gt;제10호 서식 점유증명서 또는 보완·거부통지&lt;/dd&gt;&lt;dt&gt;근거 수준&lt;/dt&gt;&lt;dd&gt;제도축 공통근거 · 세부 조문 미대조&lt;/dd&gt;&lt;dt&gt;연결 근거&lt;/dt&gt;&lt;dd&gt;&lt;span class=&quot;gate-basis&quot;&gt;&lt;span class=&quot;law-name&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.lands.go.tz/uploads/documents/sw-1732795157-GN.%2080%20URBAN%20PLANNING%20%20BUILDING.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;도시계획(건축)규칙 2018(정부고시 제80호)&lt;/a&gt;&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot;&gt;시행규칙&lt;/span&gt;&lt;span class=&quot;badge info&quot;&gt;원문 링크 연결&lt;/span&gt;&lt;/span&gt;&lt;/dd&gt;&lt;/dl&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;적용 대상&lt;/h3&gt;&lt;p style=&quot;margin:0;font-size:13.5px;line-height:1.7&quot;&gt;등록 전문가와 시공자가 수행하며 검사·점유승인이 필요한 건축공사&lt;/p&gt;&lt;/div&gt;

    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;운영 중 공식자료&lt;/h3&gt;&lt;div class=&quot;law&quot;&gt;&lt;div class=&quot;law-copy&quot;&gt;&lt;span class=&quot;nm&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.crb.go.tz/CoreFunction/DevelopmentOfContractors&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;CRB 현행 건설프로젝트 등록 서비스&lt;/a&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;law-meta&quot;&gt;&lt;span class=&quot;badge plain muted&quot;&gt;공식 안내&lt;/span&gt;&lt;span class=&quot;badge info&quot;&gt;공식자료 연결&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;law&quot;&gt;&lt;div class=&quot;law-copy&quot;&gt;&lt;span class=&quot;nm&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.crb.go.tz/CoreFunction/RegulationOfContractors&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;CRB 현행 시공자·현장 준수규칙&lt;/a&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;law-meta&quot;&gt;&lt;span class=&quot;badge plain muted&quot;&gt;공식 안내&lt;/span&gt;&lt;span class=&quot;badge info&quot;&gt;공식자료 연결&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;

    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;권한 기관&lt;/h3&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.tausi.tamisemi.go.tz/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;관할 도시계획기관·지방정부(LGA)&lt;/a&gt;&lt;/b&gt;&lt;span&gt;개발동의, 건축허가, 현장검사와 신축건물 점유증명서를 처리 &lt;span class=&quot;badge info&quot;&gt;원문 링크 연결&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.crb.go.tz/ProjectRegistration&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;건축사·적산사등록원(AQRB)·기술사등록원(ERB)·시공자등록원(CRB)&lt;/a&gt;&lt;/b&gt;&lt;span&gt;전문가·업체 등록과 법정대상 건설프로젝트 등록·현장 스티커를 관리 &lt;span class=&quot;badge info&quot;&gt;공식자료 연결&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;이해관계자&lt;/h3&gt;&lt;p style=&quot;margin:0;font-size:13.5px;line-height:1.7&quot;&gt;관할 도시계획기관·지방정부(LGA), 건축사·적산사등록원(AQRB)·기술사등록원(ERB)·시공자등록원(CRB)&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;제출서류&lt;/h3&gt;&lt;div class=&quot;docset&quot;&gt;&lt;b&gt;05 시공자등록위원회 프로젝트 등록 공식결정&lt;/b&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;프로젝트 등록번호 또는 이유부 보완·불승인&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;docset&quot;&gt;&lt;b&gt;06 계획기관 시공단계 적합판정&lt;/b&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;단계 적합확인 또는 시정·중지명령&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;docset&quot;&gt;&lt;b&gt;07 제10호 서식 점유증명 공식결정&lt;/b&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;제10호 서식 점유증명서 또는 보완·거부통지&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;


    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;관련 제도&lt;/h3&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;탄자니아 공공조달 입찰제도&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;탄자니아 조달 거버넌스·감독체계&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;탄자니아 ODA 사업 발굴·형성 절차&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;탄자니아 도시계획·부지규제&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;탄자니아 건축허가·환경심사&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;details class=&quot;card field-application&quot;&gt;&lt;summary&gt;&lt;span&gt;ODA 사업별 적용 확인사항&lt;/span&gt;&lt;small&gt;법정절차 외 체크리스트 · 6개&lt;/small&gt;&lt;/summary&gt;&lt;div class=&quot;field-application-body&quot;&gt;&lt;p class=&quot;workflow-disclosure&quot;&gt;아래 항목은 해당 국가의 법정 절차가 아니라 대상 사업의 관할·필지·시설 조건을 확정하기 위한 조사 체크리스트입니다. 업무구조도와 공식 결정 Gate에는 포함하지 않습니다.&lt;/p&gt;&lt;ul class=&quot;plain&quot;&gt;&lt;li&gt;시장조사: 현지 등록 설계자·시공자·검사기관·보험사의 자격과 유효기간을 감독기관에서 대조한다. → 적격기관·보험 대장&lt;/li&gt;&lt;li&gt;기관협의: 착공통지, 중간검사, 준공도서, 소방·사용승인과 개장 조건을 순서대로 확인한다. → 검사·준공·개장 Hold Point 표&lt;/li&gt;&lt;li&gt;보고서 반영: 기술검사·보험·준공제도의 확인·미확인·조건부 항목을 분리하고 근거문서 번호와 설계·일정·예산 영향을 연결한다. → 기술검사·보험·준공제도 근거대장·보고서 반영표&lt;/li&gt;&lt;li&gt;현지 전문가·시공자 등급, CRB 프로젝트 등록과 단계검사·Form 10 발급의 실제 비용·기간은 무엇인가? — 영향: 조달 패키지, 품질책임, 보험료, 검사 Hold Point와 개장 가능일을 결정한다.; 담당 수원기관·현지 건축전문가; 확인기관 관할 도시계획기관·지방정부(LGA), 건축사·적산사등록원(AQRB)·기술사등록원(ERB)·시공자등록원(CRB); 필요 증빙 AQRB·ERB 등록 설계자·감리자, CRB 시공자 등급·프로젝트 등록번호·현장 스티커, 착공·기초·배수·은폐·완료 검사기록과 시험성적, 준공도면·소방·유틸리티 승인·Form 10 점유증명서&lt;/li&gt;&lt;li&gt;현지 설계자·시공자·검사기관의 자격, 의무보험, 중간검사와 준공·소방·사용승인 절차는 무엇인가? — 영향: 조달 패키지, 품질책임, 보험료, 검사 Hold Point와 개장 가능일을 결정한다.; 담당 수원기관·현지 건축전문가; 확인기관 관할 도시계획기관·지방정부(LGA), 건축사·적산사등록원(AQRB)·기술사등록원(ERB)·시공자등록원(CRB); 필요 증빙 전문가·시공자·검사기관 등록증과 보험증권, 검사계획·시험성적서·변경승인 기록, 준공·소방·사용승인 체크리스트와 실제 견적&lt;/li&gt;&lt;li&gt;전문가·CRB 등록·Form 10의 사업별 적용조건을 어떤 원본·공문·현장기록으로 입증할 것인가? — 영향: 공개된 국가 기본경로와 실제 필지·시설·관할의 적용판정을 분리해 보고서의 과단정을 막는다.; 담당 현지 건축전문가·조사총괄; 확인기관 관할 도시계획기관·지방정부(LGA), 건축사·적산사등록원(AQRB)·기술사등록원(ERB)·시공자등록원(CRB); 필요 증빙 AQRB·ERB 등록 설계자·감리자, CRB 시공자 등급·프로젝트 등록번호·현장 스티커, 착공·기초·배수·은폐·완료 검사기록과 시험성적, 준공도면·소방·유틸리티 승인·Form 10 점유증명서&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;핵심 적용판단&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;확인된 법령 사실과 사업별 조건부·미확정 판단을 분리해 표시합니다.&lt;/p&gt;
  &lt;div class=&quot;decision-list&quot;&gt;&lt;div class=&quot;decision&quot; data-state=&quot;conditional&quot;&gt;&lt;span class=&quot;badge warn&quot;&gt;조건부&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;TZA-BLD-C-003&lt;/span&gt;&lt;p&gt;등록·검사·점유증명서를 입찰조건과 공정표의 지급·인계 Gate로 명시해야 무허가 사용과 재시공 위험을 줄일 수 있다.&lt;/p&gt;&lt;div class=&quot;sources&quot;&gt;근거 · 도시계획(건축)규칙 2018(정부고시 제80호) · 건축사·적산사 등록법 2010 및 CRB 프로젝트 등록요건&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/section&gt;







&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;검증&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;도시계획법 2007(법률 제8호)·도시계획(계획·공간기준)규칙 2018(정부고시 제93호)·도시계획(건축)규칙 2018(정부고시 제80호)·환경영향평가·감사규칙 2005 및 2018년 개정·건축사·적산사 등록법 2010 및 CRB 프로젝트 등록요건의 공식 법령·정부 서비스 페이지에서 제도 존재, 담당기관과 적용범위를 확인했다.&lt;/p&gt;
  &lt;div class=&quot;cards&quot;&gt;
    &lt;div class=&quot;card span2&quot;&gt;&lt;h3&gt;검증 범위&lt;/h3&gt;
      &lt;p style=&quot;margin:0;font-size:13.5px;line-height:1.7&quot;&gt;GN 80 제10~21조의 착공·은폐 전 통지·검사·시정·완료·Form 10과 CRB의 현행 21일 내/착공 전 프로젝트 등록·14일 보완·번호 표지·완료 피드백을 연결했다.&lt;/p&gt;
      &lt;p style=&quot;margin:12px 0 0;font-size:12.5px;color:var(--muted)&quot;&gt;확인일 2026-08-07 · 자료집 기준일 2026-08-07&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;대조에 쓴 원문&lt;/h3&gt;&lt;ul class=&quot;srcs&quot; style=&quot;padding-left:16px;margin:0&quot;&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.lands.go.tz/uploads/documents/sw-1732795157-GN.%2080%20URBAN%20PLANNING%20%20BUILDING.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Urban Planning (Building) Regulations, 2018 — Government Notice No. 80&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;시행규칙&lt;/span&gt;&lt;span class=&quot;badge ok&quot; style=&quot;margin-left:6px&quot;&gt;현행 확인&lt;/span&gt;&lt;span class=&quot;badge info&quot; style=&quot;margin-left:6px&quot;&gt;원문 링크 연결&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;원문 확인 2026-08-07&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;상태 확인 2026-08-07 · The Ministry of Lands currently publishes GN 80 of 2018, including Forms 1, 2 and 10, in its official document repository.&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;계획구역의 건축허가·검사·Form 10 점유증명서를 규정한다. Zanzibar는 별도 법체계를 확인한다.&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.aqrb.go.tz/uploads/documents/sw-1744871859-ACT%202010.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Architects and Quantity Surveyors (Registration) Act, 2010 and CRB project-registration requirements&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;법률&lt;/span&gt;&lt;span class=&quot;badge ok&quot; style=&quot;margin-left:6px&quot;&gt;현행 확인&lt;/span&gt;&lt;span class=&quot;badge info&quot; style=&quot;margin-left:6px&quot;&gt;원문 링크 연결&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;원문 확인 2026-08-07&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;상태 확인 2026-08-07 · AQRB and CRB continue to publish the governing Act and active professional, contractor and project-registration services.&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;CRB는 현재 공식 안내에서 TSh 1천만 이상 공공·민간 프로젝트의 착공 전 등록을 요구한다. 금액·수수료는 계약 시점에 재확인한다.&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.crb.go.tz/CoreFunction/DevelopmentOfContractors&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;CRB current project-registration service&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;공식 안내&lt;/span&gt;&lt;span class=&quot;badge info&quot; style=&quot;margin-left:6px&quot;&gt;운영 중 공식 안내&lt;/span&gt;&lt;span class=&quot;badge info&quot; style=&quot;margin-left:6px&quot;&gt;공식자료 연결&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;원문 확인 2026-08-07&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;상태 확인 2026-08-07 · CRB&amp;#x27;s current official service states the registration threshold, online submission, rectification, project number and completion-feedback procedure.&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.crb.go.tz/CoreFunction/RegulationOfContractors&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;CRB current contractor and site rules&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;공식 안내&lt;/span&gt;&lt;span class=&quot;badge info&quot; style=&quot;margin-left:6px&quot;&gt;운영 중 공식 안내&lt;/span&gt;&lt;span class=&quot;badge info&quot; style=&quot;margin-left:6px&quot;&gt;공식자료 연결&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;원문 확인 2026-08-07&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;상태 확인 2026-08-07 · CRB&amp;#x27;s current regulation page lists registered-contractor, signboard, project-registration, enclosure, PPE, fire and hygiene duties.&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card span2&quot;&gt;&lt;h3&gt;주의&lt;/h3&gt;&lt;p class=&quot;note&quot;&gt;비공식 한국어 요약이며 법률자문이나 관할기관의 유권해석을 대신하지 않는다.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;자료의 현행·운영 상태는 사이트가 자료별 상태·확인일·판단근거로 관리한다. 최신 개정 추적이 끝나지 않은 자료만 검증 예외로 별도 표시한다.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;건폐율·용적률·높이·이격·주차, 환경평가 유형, 수수료·실제 기간과 현지 업체 비용은 필지·시설·관할에 따라 달라 확인 전 수치로 사용하지 않는다.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;p style=&quot;margin:22px 0 0;font-size:12.5px;color:var(--muted)&quot;&gt;
    원문 링크 연결 — 공식 자료와 제도의 연결 수준을 뜻하며 자료의 현행·운영 상태는 위 원문 대장의 상태와 확인일로, 개별 사업 적용판정은 ODA 적용 확인사항으로 따로 관리합니다.
  &lt;/p&gt;

var EDGES=[{&quot;id&quot;:&quot;M06-E01&quot;,&quot;source&quot;:&quot;B23&quot;,&quot;target&quot;:&quot;B24&quot;,&quot;type&quot;:&quot;sequence&quot;},{&quot;id&quot;:&quot;M06-E02&quot;,&quot;source&quot;:&quot;B24&quot;,&quot;target&quot;:&quot;B25&quot;,&quot;type&quot;:&quot;sequence&quot;},{&quot;id&quot;:&quot;M06-E03&quot;,&quot;source&quot;:&quot;B25&quot;,&quot;target&quot;:&quot;B27&quot;,&quot;type&quot;:&quot;sequence&quot;,&quot;label&quot;:&quot;등록번호&quot;},{&quot;id&quot;:&quot;M06-E04&quot;,&quot;source&quot;:&quot;B25&quot;,&quot;target&quot;:&quot;B26&quot;,&quot;type&quot;:&quot;message&quot;,&quot;label&quot;:&quot;14일 보완&quot;},{&quot;id&quot;:&quot;M06-E05&quot;,&quot;source&quot;:&quot;B26&quot;,&quot;target&quot;:&quot;B25&quot;,&quot;type&quot;:&quot;loop&quot;,&quot;label&quot;:&quot;시공자등록위원회 재심&quot;},{&quot;id&quot;:&quot;M06-E06&quot;,&quot;source&quot;:&quot;B27&quot;,&quot;target&quot;:&quot;B28&quot;,&quot;type&quot;:&quot;sequence&quot;},{&quot;id&quot;:&quot;M06-E07&quot;,&quot;source&quot;:&quot;B28&quot;,&quot;target&quot;:&quot;B29&quot;,&quot;type&quot;:&quot;sequence&quot;},{&quot;id&quot;:&quot;M06-E08&quot;,&quot;source&quot;:&quot;B29&quot;,&quot;target&quot;:&quot;B30&quot;,&quot;type&quot;:&quot;sequence&quot;},{&quot;id&quot;:&quot;M06-E09&quot;,&quot;source&quot;:&quot;B30&quot;,&quot;target&quot;:&quot;B32&quot;,&quot;type&quot;:&quot;sequence&quot;,&quot;label&quot;:&quot;공사완료&quot;},{&quot;id&quot;:&quot;M06-E10&quot;,&quot;source&quot;:&quot;B30&quot;,&quot;target&quot;:&quot;B31&quot;,&quot;type&quot;:&quot;message&quot;,&quot;label&quot;:&quot;시정명령&quot;},{&quot;id&quot;:&quot;M06-E11&quot;,&quot;source&quot;:&quot;B31&quot;,&quot;target&quot;:&quot;B29&quot;,&quot;type&quot;:&quot;loop&quot;,&quot;label&quot;:&quot;단계 재검사&quot;},{&quot;id&quot;:&quot;M06-E12&quot;,&quot;source&quot;:&quot;B32&quot;,&quot;target&quot;:&quot;B33&quot;,&quot;type&quot;:&quot;sequence&quot;},{&quot;id&quot;:&quot;M06-E13&quot;,&quot;source&quot;:&quot;B33&quot;,&quot;target&quot;:&quot;B35&quot;,&quot;type&quot;:&quot;sequence&quot;,&quot;label&quot;:&quot;점유적합&quot;},{&quot;id&quot;:&quot;M06-E14&quot;,&quot;source&quot;:&quot;B33&quot;,&quot;target&quot;:&quot;B34&quot;,&quot;type&quot;:&quot;message&quot;,&quot;label&quot;:&quot;준공보완&quot;},{&quot;id&quot;:&quot;M06-E15&quot;,&quot;source&quot;:&quot;B34&quot;,&quot;target&quot;:&quot;B33&quot;,&quot;type&quot;:&quot;loop&quot;,&quot;label&quot;:&quot;최종 재검사&quot;},{&quot;id&quot;:&quot;M06-E16&quot;,&quot;source&quot;:&quot;B35&quot;,&quot;target&quot;:&quot;B36&quot;,&quot;type&quot;:&quot;sequence&quot;}];

var _sel=document.getElementById(&#x27;sel&#x27;);
if(_sel) _sel.addEventListener(&#x27;change&#x27;,function(){ location.href=&#x27;../&#x27;+this.value+&#x27;/index.html&#x27;; });

/* 엣지 그리기 — 노드 DOM 위치를 재서 SVG로 연결 */
function draw(){
  var board=document.getElementById(&#x27;board&#x27;),svg=document.getElementById(&#x27;edges&#x27;);
  if(!board||!svg)return;
  var bb=board.getBoundingClientRect();
  svg.setAttribute(&#x27;viewBox&#x27;,&#x27;0 0 &#x27;+board.scrollWidth+&#x27; &#x27;+board.scrollHeight);
  svg.setAttribute(&#x27;width&#x27;,board.scrollWidth); svg.setAttribute(&#x27;height&#x27;,board.scrollHeight);
  var cs=getComputedStyle(document.documentElement);
  var C={sequence:cs.getPropertyValue(&#x27;--muted&#x27;).trim(),
         message:cs.getPropertyValue(&#x27;--info&#x27;).trim(),
         loop:cs.getPropertyValue(&#x27;--back&#x27;).trim()};
  var BG=cs.getPropertyValue(&#x27;--bg&#x27;).trim();
  var d=&#x27;&lt;defs&gt;&#x27;;
  [&#x27;sequence&#x27;,&#x27;message&#x27;,&#x27;loop&#x27;].forEach(function(t){
    d+=&#x27;&lt;marker id=&quot;m-&#x27;+t+&#x27;&quot; viewBox=&quot;0 0 8 8&quot; refX=&quot;7&quot; refY=&quot;4&quot; markerWidth=&quot;6&quot; markerHeight=&quot;6&quot; orient=&quot;auto&quot;&gt;&#x27;
      +&#x27;&lt;path d=&quot;M0 0 L8 4 L0 8 z&quot; fill=&quot;&#x27;+C[t]+&#x27;&quot;/&gt;&lt;/marker&gt;&#x27;;
  });
  d+=&#x27;&lt;/defs&gt;&#x27;;
  var GAP=5;
  function rel(rc){return {x:rc.left-bb.left+board.scrollLeft, y:rc.top-bb.top+board.scrollTop,
                            r:rc.right-bb.left+board.scrollLeft, b:rc.bottom-bb.top+board.scrollTop,
                            w:rc.width, h:rc.height};}
  function box(id){
    var el=Array.prototype.find.call(
      board.querySelectorAll(&#x27;.node&#x27;),function(node){return node.dataset.id===id;}
    );
    if(!el)return null; return rel(el.getBoundingClientRect());
  }

  /* 라우팅은 korea100studio의 거터 라우팅을 우리 그리드에 이식한 것이다.
     핵심: 카드를 지나야 하는 선은 카드가 없는 거터(행 하단·열 측면)로 우회한다.
     DOM에서 노드·행·열을 실측할 수 있어, 여러 직교 경로 후보를 만들고
     무관한 카드를 가장 적게 관통하는(동수면 가장 짧은) 것을 고른다. */

  // 장애물(모든 노드)과 거터(노드 없는 띠) 실측
  var OB=[];
  board.querySelectorAll(&#x27;.node&#x27;).forEach(function(el){ var r=box(el.dataset.id); r.id=el.dataset.id; OB.push(r); });
  // 단계 머리글과 각 행의 행위주체 셀도 텍스트 장애물이다. 카드만 피하면
  // 긴 회귀 라벨이 머리글 뒤로 올라가거나 행위주체명을 가릴 수 있다.
  var TB=[];
  board.querySelectorAll(&#x27;.brow.head .bcell,.brow:not(.head) .bcell:first-child&#x27;).forEach(function(el){
    TB.push(rel(el.getBoundingClientRect()));
  });
  var rowGut=[], colGut=[];
  board.querySelectorAll(&#x27;.brow:not(.head)&#x27;).forEach(function(el){ var r=rel(el.getBoundingClientRect());
    rowGut.push(r.y+9); rowGut.push(r.b-9); });
  var hc=board.querySelectorAll(&#x27;.brow.head .bcell&#x27;);
  for(var i=1;i&lt;hc.length;i++){ var r=rel(hc[i].getBoundingClientRect()); colGut.push(r.x+11); colGut.push(r.r-11); }

  function segHit(ax,ay,bx,by,e1,e2){
    var n=0, M=3;
    for(var i=0;i&lt;OB.length;i++){ var o=OB[i]; if(o.id===e1||o.id===e2) continue;
      var L=o.x+M,R=o.r-M,T=o.y+M,B=o.b-M;
      if(Math.abs(ay-by)&lt;0.5){ if(ay&gt;T&amp;&amp;ay&lt;B &amp;&amp; Math.max(ax,bx)&gt;L &amp;&amp; Math.min(ax,bx)&lt;R) n++; }
      else { if(ax&gt;L&amp;&amp;ax&lt;R &amp;&amp; Math.max(ay,by)&gt;T &amp;&amp; Math.min(ay,by)&lt;B) n++; }
    } return n;
  }
  function uniq(pts){ return pts.filter(function(p,i){ return i===0 || Math.abs(p.x-pts[i-1].x)&gt;0.5 || Math.abs(p.y-pts[i-1].y)&gt;0.5; }); }
  function score(pts,e1,e2){ pts=uniq(pts); var p=0,l=0;
    for(var i=0;i&lt;pts.length-1;i++){ p+=segHit(pts[i].x,pts[i].y,pts[i+1].x,pts[i+1].y,e1,e2);
      l+=Math.abs(pts[i].x-pts[i+1].x)+Math.abs(pts[i].y-pts[i+1].y); }
    return {pts:pts,p:p,l:l}; }

  function route(a,b,ed){
    var acx=a.x+a.w/2,acy=a.y+a.h/2,bcx=b.x+b.w/2,bcy=b.y+b.h/2, e1=ed.source,e2=ed.target, cs=[];
    // 보완 회귀는 source 오른쪽 거터로 빠진 뒤 target 행의 위·아래 여백을
    // 거쳐 진입한다. target 중심 높이로 곧장 되돌리면 같은 행의 중간 카드를
    // 관통할 수 있으므로, 실측한 행 거터 후보를 장애물 수·길이로 비교한다.
    if(ed.type===&#x27;loop&#x27;&amp;&amp;ed.label){
      var maxRight=Math.max(a.r,b.r), gx0=Math.min(board.scrollWidth-4,maxRight+28);
      var gxVals=[gx0,board.scrollWidth-4], loopCandidates=[];
      colGut.forEach(function(gx){if(gx&gt;maxRight+10)gxVals.push(gx);});
      gxVals=gxVals.filter(function(gx,i){return gx&gt;maxRight+6&amp;&amp;gxVals.indexOf(gx)===i;});
      var gyVals=rowGut.filter(function(gy){return gy&lt;b.y-6||gy&gt;b.b+6;});
      gxVals.forEach(function(gx){
        gyVals.forEach(function(gy){
          var above=gy&lt;b.y;
          var tp={x:bcx,y:above?b.y:b.b};
          var pre={x:bcx,y:tp.y+(above?-GAP:GAP)};
          loopCandidates.push(score([
            {x:a.r,y:acy},{x:gx,y:acy},{x:gx,y:gy},{x:bcx,y:gy},pre,tp
          ],e1,e2));
        });
      });
      // 극단적으로 거터 후보가 없는 단일 행 보드에서도 선은 계속 표시한다.
      loopCandidates.push(score([
        {x:a.r,y:acy},{x:gx0,y:acy},{x:gx0,y:bcy},{x:b.r+GAP,y:bcy},{x:b.r,y:bcy}
      ],e1,e2));
      loopCandidates.sort(function(x,y){return x.p-y.p||x.l-y.l;});
      return loopCandidates[0];
    }
    // 세로 계열 — a의 위/아래 변에서 나가 b의 위/아래 변으로
    var below=bcy&gt;acy, sp={x:acx,y:below?a.b:a.y}, tp={x:bcx,y:below?b.y:b.b}, tg={x:tp.x,y:tp.y+(below?-GAP:GAP)};
    cs.push(score([sp,{x:sp.x,y:tg.y},tg,tp],e1,e2));                                   // 직선/L
    rowGut.forEach(function(my){ if(my&gt;Math.min(sp.y,tp.y)+6&amp;&amp;my&lt;Math.max(sp.y,tp.y)-6)   // 행 거터 크로스
      cs.push(score([sp,{x:sp.x,y:my},{x:tp.x,y:my},tg,tp],e1,e2)); });
    colGut.forEach(function(gx){                                                          // 열 측면 탈출
      var as={x:gx&gt;acx?a.r:a.x,y:acy};
      cs.push(score([as,{x:gx,y:acy},{x:gx,y:tg.y},tg,tp],e1,e2)); });
    // 가로 계열 — a의 좌/우 변에서 나가 b의 좌/우 변으로
    var right=bcx&gt;acx, sp2={x:right?a.r:a.x,y:acy}, tp2={x:right?b.x:b.r,y:bcy}, tg2={x:tp2.x+(right?-GAP:GAP),y:tp2.y};
    cs.push(score([sp2,{x:tg2.x,y:sp2.y},tg2,tp2],e1,e2));
    colGut.forEach(function(mx){ if(mx&gt;Math.min(sp2.x,tp2.x)+6&amp;&amp;mx&lt;Math.max(sp2.x,tp2.x)-6)
      cs.push(score([sp2,{x:mx,y:sp2.y},{x:mx,y:tp2.y},tg2,tp2],e1,e2)); });
    rowGut.forEach(function(gy){                                                          // 행 거터 우회
      var as={x:acx,y:gy&gt;acy?a.b:a.y};
      cs.push(score([as,{x:acx,y:gy},{x:tp2.x,y:gy},tg2,tp2],e1,e2)); });
    cs=cs.filter(function(c){return c.pts.length&gt;=2;});
    cs.sort(function(x,y){ return x.p-y.p || x.l-y.l; });
    return cs[0];
  }

  function rnd(v){return Math.round(v*10)/10;}
  function orthPath(pts){                    // 직교 경로 + 모서리 라운딩
    pts=uniq(pts); if(pts.length&lt;2)return &#x27;&#x27;;
    var d=&#x27;M&#x27;+rnd(pts[0].x)+&#x27; &#x27;+rnd(pts[0].y);
    for(var i=1;i&lt;pts.length-1;i++){
      var p=pts[i-1],c=pts[i],n=pts[i+1];
      var d1=Math.hypot(c.x-p.x,c.y-p.y)||1, d2=Math.hypot(n.x-c.x,n.y-c.y)||1, r=Math.min(7,d1/2,d2/2);
      d+=&#x27; L&#x27;+rnd(c.x-(c.x-p.x)/d1*r)+&#x27; &#x27;+rnd(c.y-(c.y-p.y)/d1*r);
      d+=&#x27; Q&#x27;+rnd(c.x)+&#x27; &#x27;+rnd(c.y)+&#x27; &#x27;+rnd(c.x+(n.x-c.x)/d2*r)+&#x27; &#x27;+rnd(c.y+(n.y-c.y)/d2*r);
    }
    var e=pts[pts.length-1]; return d+&#x27; L&#x27;+rnd(e.x)+&#x27; &#x27;+rnd(e.y);
  }

  var labelJobs=[],pathSegs=[],allArrows=[];
  EDGES.forEach(function(ed){
    var a=box(ed.source),b=box(ed.target); if(!a||!b)return;
    var t=ed.type||&#x27;sequence&#x27;, rt=route(a,b,ed), pts=uniq(rt.pts);
    /* 라벨 배경이 남의 연결선을 덮어 선이 끊겨 보이는 것을 막으려면 모든
       연결선의 위치를 알아야 한다. 라벨 없는 엣지도 덮이면 똑같이 끊겨
       보이므로 전부 모은다. 엣지 객체 참조를 그대로 담아 자기 경로인지
       판정한다 — id 문자열 비교는 id가 없을 때 전부 자기 것이 된다. */
    for(var si=0;si&lt;pts.length-1;si++)

  labelJobs.forEach(function(job){

    group.setAttribute(&#x27;data-edge-source&#x27;,job.ed.source);
    group.setAttribute(&#x27;data-edge-target&#x27;,job.ed.target);
    var bg=document.createElementNS(NS,&#x27;rect&#x27;); bg.setAttribute(&#x27;class&#x27;,&#x27;edge-label-bg&#x27;);
    bg.setAttribute(&#x27;rx&#x27;,&#x27;4&#x27;); bg.setAttribute(&#x27;fill&#x27;,BG); bg.setAttribute(&#x27;fill-opacity&#x27;,&#x27;.96&#x27;);
    var txt=document.createElementNS(NS,&#x27;text&#x27;); txt.setAttribute(&#x27;class&#x27;,&#x27;edge-label&#x27;);

    txt.setAttribute(&#x27;dominant-baseline&#x27;,&#x27;central&#x27;); txt.setAttribute(&#x27;fill&#x27;,job.color);
    txt.setAttribute(&#x27;font-size&#x27;,&#x27;10&#x27;); txt.setAttribute(&#x27;font-weight&#x27;,&#x27;700&#x27;);

    /* 점수는 offset에 음이 아닌 패널티만 더하므로 score &gt;= offset 이 늘 성립한다.

      txt.setAttribute(&#x27;stroke&#x27;,BG); txt.setAttribute(&#x27;stroke-width&#x27;,&#x27;3&#x27;);
      txt.setAttribute(&#x27;stroke-linejoin&#x27;,&#x27;round&#x27;);

}

  if(n.deadline) h+=&#x27;&lt;dt&gt;기한&lt;/dt&gt;&lt;dd&gt;&#x27;+n.deadline+&#x27;&lt;/dd&gt;&#x27;;
  if(n.output_documents&amp;&amp;n.output_documents.length)
    h+=&#x27;&lt;dt&gt;산출 문서&lt;/dt&gt;&lt;dd&gt;&#x27;+n.output_documents.join(&#x27; · &#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  if(n.blocker) h+=&#x27;&lt;dt&gt;병목&lt;/dt&gt;&lt;dd style=&quot;color:var(--warn)&quot;&gt;&#x27;+n.blocker+&#x27;&lt;/dd&gt;&#x27;;
  if(n.legal_basis&amp;&amp;n.legal_basis.length){
    var basisLabel=n.basis_scope===&#x27;axis&#x27;?&#x27;축 전체 관련 제도 근거&#x27;
      :(n.workflow_kind===&#x27;statutory&#x27;?&#x27;근거 조문&#x27;:&#x27;관련 제도 근거&#x27;);
    h+=&#x27;&lt;dt&gt;&#x27;+basisLabel+&#x27;&lt;/dt&gt;&lt;dd&gt;&#x27;+n.legal_basis.map(function(l){
      var nm=l.url?&#x27;&lt;a class=&quot;ref&quot; href=&quot;&#x27;+l.url+&#x27;&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;&#x27;+l.law+&#x27;&lt;/a&gt;&#x27;:l.law;
      var meta=(l.kind?&#x27; &lt;span class=&quot;badge plain muted&quot;&gt;&#x27;+l.kind+&#x27;&lt;/span&gt;&#x27;:&#x27;&#x27;)
        +(l.scope_label?&#x27; &lt;span class=&quot;badge info&quot;&gt;&#x27;+l.scope_label+&#x27;&lt;/span&gt;&#x27;:&#x27;&#x27;)
        +(l.verification?&#x27; &lt;span class=&quot;badge &#x27;+l.verification_tone+&#x27;&quot;&gt;&#x27;+l.verification+&#x27;&lt;/span&gt;&#x27;:&#x27;&#x27;);
      return &#x27;&lt;div style=&quot;margin-bottom:9px&quot;&gt;&#x27;+nm+&#x27; &lt;code&gt;&#x27;+l.article+&#x27;&lt;/code&gt;&#x27;+meta
        +(l.note?&#x27;&lt;div style=&quot;margin-top:3px;color:var(--muted)&quot;&gt;&#x27;+l.note+&#x27;&lt;/div&gt;&#x27;:&#x27;&#x27;)+&#x27;&lt;/div&gt;&#x27;;}).join(&#x27;&#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  }
  if(typeof n.confidence===&#x27;number&#x27;){
    h+=&#x27;&lt;dt&gt;법령 근거 확신도&lt;/dt&gt;&lt;dd&gt;&#x27;+n.confidence.toFixed(2)
      +(n.confidence&lt;0.8?&#x27; &lt;span class=&quot;badge warn&quot;&gt;현장 검증 필요&lt;/span&gt;&#x27;:&#x27;&#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  }
  if(n.confidence_reason) h+=&#x27;&lt;dt&gt;확신도 산정 근거&lt;/dt&gt;&lt;dd&gt;&#x27;+n.confidence_reason+&#x27;&lt;/dd&gt;&#x27;;
  if(n.evidence_status) h+=&#x27;&lt;dt&gt;근거 상태&lt;/dt&gt;&lt;dd&gt;&#x27;+n.evidence_status+&#x27;&lt;/dd&gt;&#x27;;
  if(n.report_use) h+=&#x27;&lt;dt&gt;보고서 반영&lt;/dt&gt;&lt;dd&gt;&#x27;+n.report_use+&#x27;&lt;/dd&gt;&#x27;;
  if(n.permit_gates&amp;&amp;n.permit_gates.length){
    h+=&#x27;&lt;dt&gt;연결 인허가 절차&lt;/dt&gt;&lt;dd&gt;&#x27;+n.permit_gates.map(function(g){
      var dep=g.depends_on&amp;&amp;g.depends_on.length?&#x27; · 선행 절차 &#x27;+g.depends_on.map(function(x){return &#x27;P&#x27;+x;}).join(&#x27;, &#x27;):&#x27;&#x27;;
      return &#x27;&lt;div style=&quot;margin-bottom:8px&quot;&gt;&lt;b&gt;P&#x27;+g.order+&#x27; &#x27;+g.gate+&#x27;&lt;/b&gt;&#x27;+dep
        +&#x27;&lt;div&gt;&#x27;+g.decision+&#x27;&lt;/div&gt;&lt;div style=&quot;color:var(--muted)&quot;&gt;산출물 · &#x27;+g.output+&#x27;&lt;/div&gt;&lt;/div&gt;&#x27;;}).join(&#x27;&#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  }
  if(n.open_questions&amp;&amp;n.open_questions.length){
    h+=&#x27;&lt;dt&gt;현장 확인질문&lt;/dt&gt;&lt;dd&gt;&#x27;+n.open_questions.map(function(q){
      return &#x27;&lt;div style=&quot;margin-bottom:10px&quot;&gt;&lt;span class=&quot;badge &#x27;+(q.blocking?&#x27;bad&#x27;:&#x27;muted&#x27;)+&#x27;&quot;&gt;&#x27;
        +(q.blocking?&#x27;Gate 차단&#x27;:&#x27;추가 확인&#x27;)+&#x27;&lt;/span&gt; &lt;code&gt;&#x27;+q.id+&#x27;&lt;/code&gt;&lt;div&gt;&#x27;+q.question+&#x27;&lt;/div&gt;&#x27;
        +&#x27;&lt;div style=&quot;color:var(--muted)&quot;&gt;영향 · &#x27;+q.why+&#x27;&lt;/div&gt;&#x27;
        +&#x27;&lt;div style=&quot;color:var(--muted)&quot;&gt;확인기관 · &#x27;+q.confirm_with.join(&#x27; · &#x27;)+&#x27;&lt;/div&gt;&#x27;
        +&#x27;&lt;div style=&quot;color:var(--muted)&quot;&gt;증빙 · &#x27;+q.evidence.join(&#x27; · &#x27;)+&#x27;&lt;/div&gt;&lt;/div&gt;&#x27;;}).join(&#x27;&#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  }
  var ins=EDGES.filter(function(x){return x.target===id}),
      outs=EDGES.filter(function(x){return x.source===id});
  /* 보드에서 순차 라벨을 접어 두므로 여기가 전이 문구를 빠짐없이 보는 자리다.
     한 줄로 이어붙이면 묻히므로 연결 종류별 배지로 세워 준다. */
  function edgeLine(otherId,x){
    var tone=x.type===&#x27;loop&#x27;?&#x27;back&#x27;:(x.type===&#x27;message&#x27;?&#x27;info&#x27;:&#x27;muted&#x27;);
    return &#x27;&lt;div style=&quot;margin-bottom:5px&quot;&gt;&#x27;+(NODES[otherId]?NODES[otherId].name:otherId)
      +(x.label?&#x27; &lt;span class=&quot;badge &#x27;+tone+&#x27;&quot;&gt;&#x27;+x.label+&#x27;&lt;/span&gt;&#x27;:&#x27;&#x27;)+&#x27;&lt;/div&gt;&#x27;;
  }
  if(ins.length) h+=&#x27;&lt;dt&gt;선행&lt;/dt&gt;&lt;dd&gt;&#x27;+ins.map(function(x){
    return edgeLine(x.source,x);}).join(&#x27;&#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  if(outs.length) h+=&#x27;&lt;dt&gt;후속&lt;/dt&gt;&lt;dd&gt;&#x27;+outs.map(function(x){
    return edgeLine(x.target,x);}).join(&#x27;&#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  h+=&#x27;&lt;/dl&gt;&#x27;;
  document.getElementById(&#x27;dbody&#x27;).innerHTML=h;
  document.getElementById(&#x27;dlg&#x27;).showModal();
}

/* 인접 카드 강조와 숨긴 순차 라벨 노출을 한 곳에서 처리한다. focus·blur를 함께
   걸어 마우스 없이 Tab만으로도 같은 정보에 닿게 한다 — 카드는 button이라 원래
   포커스를 받는데 지금까지 hover에만 반응해 키보드에서는 강조가 동작하지 않았다. */
function peek(id,on){
  var rel={};rel[id]=1;
  EDGES.forEach(function(x){if(x.source===id)rel[x.target]=1;if(x.target===id)rel[x.source]=1;});
  document.querySelectorAll(&#x27;.node&#x27;).forEach(function(o){o.classList.toggle(&#x27;dim&#x27;,on&amp;&amp;!rel[o.dataset.id])});
  var sv=document.getElementById(&#x27;edges&#x27;); if(!sv)return;
  sv.querySelectorAll(&#x27;.edge-label-group&#x27;).forEach(function(g){
    g.classList.toggle(&#x27;lit&#x27;, on &amp;&amp; (g.getAttribute(&#x27;data-edge-source&#x27;)===id
                                   ||g.getAttribute(&#x27;data-edge-target&#x27;)===id));
  });
}
document.querySelectorAll(&#x27;.node&#x27;).forEach(function(b){
  b.addEventListener(&#x27;click&#x27;,function(){openNode(b.dataset.id)});
  b.addEventListener(&#x27;mouseenter&#x27;,function(){peek(b.dataset.id,true)});
  b.addEventListener(&#x27;focus&#x27;,function(){peek(b.dataset.id,true)});
  b.addEventListener(&#x27;mouseleave&#x27;,function(){peek(b.dataset.id,false)});
  b.addEventListener(&#x27;blur&#x27;,function(){peek(b.dataset.id,false)});
});
var _all=document.getElementById(&#x27;labelall&#x27;);
if(_all) _all.addEventListener(&#x27;change&#x27;,function(){
  var bd=document.getElementById(&#x27;board&#x27;);
  if(bd) bd.classList.toggle(&#x27;show-all-labels&#x27;,this.checked);
});
document.getElementById(&#x27;dlg&#x27;).addEventListener(&#x27;click&#x27;,function(ev){
  if(ev.target===this) this.close();
});

// 리사이즈는 연속으로 쏟아지므로 프레임당 한 번으로 모은다.
var _raf=0;
function redraw(){ if(_raf)return; _raf=requestAnimationFrame(function(){_raf=0;draw();}); }
addEventListener(&#x27;load&#x27;,draw); addEventListener(&#x27;resize&#x27;,redraw);
if(document.fonts&amp;&amp;document.fonts.ready) document.fonts.ready.then(draw);
new MutationObserver(redraw).observe(document.documentElement,{attributes:true,attributeFilter:[&#x27;data-theme&#x27;]});
&lt;/script&gt;
&lt;/body&gt;&lt;/html&gt;"></iframe></div>
<div class="foot">
  자료집 기준일 기준으로 작성된 참고자료입니다. 법률 자문이나 해당국 정부·KOICA의 공식 해석이 아닙니다.
  조달·건축 법령은 개정이 잦으므로 실제 입찰·설계·인허가 전 발주처 공고문과 현행 법령을 확인해야 합니다.
</div>
<script>
function fit(fr){ try{ fr.style.height=(fr.contentWindow.document.body.scrollHeight+20)+'px'; }catch(e){} }
function showTab(i){
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.toggle('active', +t.dataset.i===i); });
  document.querySelectorAll('.fr').forEach(function(fr){
    var on=+fr.dataset.i===i; fr.classList.toggle('active', on);
    if(on){ try{ fr.contentWindow.draw && fr.contentWindow.draw(); }catch(e){} setTimeout(function(){fit(fr);},60); }
  });
}
document.querySelectorAll('.fr').forEach(function(fr){
  fr.addEventListener('load', function(){
    // iframe 안의 테마 토글·업무구조도가 부모 테마를 따르도록, 그리고 높이를 맞춘다
    fit(fr);
    if(fr.classList.contains('active')) setTimeout(function(){ try{fr.contentWindow.draw&&fr.contentWindow.draw();}catch(e){} fit(fr); },80);
  });
});
addEventListener('resize', function(){ var a=document.querySelector('.fr.active'); if(a) fit(a); });
</script>
