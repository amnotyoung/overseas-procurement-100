&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;한 장 캔버스&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;공공기관(procuring entity)의 조달을 경쟁입찰 원칙으로 수행하고, 입찰·이행·선금·하자 보증으로 계약이행을 담보하며, 전 조달을 국가전자조달시스템(NeST)으로 처리해 투명성과 지역업체 참여를 높인다.&lt;/p&gt;
  &lt;div class=&quot;cards&quot;&gt;
    &lt;div class=&quot;card span2&quot;&gt;&lt;h3&gt;절차&lt;/h3&gt;&lt;ol class=&quot;steps&quot;&gt;&lt;li&gt;발주기관 조달계획 수립 및 조달방식 선택 — 경쟁입찰 원칙, force account는 법정 문턱 내에서만 (PPA §76, §81)&lt;/li&gt;&lt;li&gt;입찰공고 및 표준입찰서류 발행 — NeST를 통한 전자조달 (PPA §83, §84)&lt;/li&gt;&lt;li&gt;입찰서류에 보증 금액·형태·조건 명시 (PPR 2024 reg.23(6))&lt;/li&gt;&lt;li&gt;입찰서 제출 시 입찰보증(bid security) 또는 입찰보증선언(bid securing declaration) 동봉 (PPR 2024 reg.23)&lt;/li&gt;&lt;li&gt;개찰 및 입찰서 접수 (PPA §88)&lt;/li&gt;&lt;li&gt;평가기준에 따른 평가·비교 — 지역업체·현지생산품 우대 반영 (PPA §87, §89)&lt;/li&gt;&lt;li&gt;낙찰 결정 및 통지&lt;/li&gt;&lt;li&gt;낙찰자 이행보증(performance security) 제출 후 계약 체결 (PPR 2024 reg.29)&lt;/li&gt;&lt;li&gt;선금 지급 시 선금보증 확보 (PPR 2024)&lt;/li&gt;&lt;li&gt;하자담보기간 동안 하자보증 유지&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;적용 대상&lt;/h3&gt;&lt;p style=&quot;margin:0;font-size:13.5px;line-height:1.7&quot;&gt;탄자니아 공공기관의 물품(goods)·용역(services)·공사(works) 조달에 적용된다. 경쟁입찰이 원칙이며, force account(직영)는 PPA 2023 §76이 정한 범위 안에서 허용된다. 전 조달은 국가전자조달시스템(NeST)으로 처리한다. 입찰보증(reg.23(6))·이행보증(reg.29(2))의 금액·형태는 입찰서류가 정하고, 하자보증은 계약상 유보금 방식(reg.329(2)), 하자담보기간은 계약별 기간(reg.329(7))을 따른다. 규정상 확정 수치는 선금 30% 상한(reg.315(2))과 지체상금 물품 0.10~0.20%/일·공사 0.10~0.15%/일(reg.318(2))이다.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;법적 근거&lt;/h3&gt;&lt;div class=&quot;law&quot;&gt;&lt;span class=&quot;nm&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.ppra.go.tz/uploads/documents/en-1736861173-THE%20PUBLIC%20PROCUREMENT%20ACT.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Public Procurement Act, No. 10 of 2023&lt;/a&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;§74(price cap), §76(force account), §81(competitive tendering), §83~§86(입찰공고·서류·보증), §131(폐지)&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:auto&quot;&gt;법률&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;law&quot;&gt;&lt;span class=&quot;nm&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.mof.go.tz/uploads/documents/en-1758539549-GN%20No.%20261%20OF%202025%20-%20THE%20PUBLIC%20PROCUREMENT%20REGULATIONS%20%20-%20ENGLISH%20VERSION.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Public Procurement Regulations, 2024 (English version: GN No. 261 of 2025)&lt;/a&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;reg.23~29(보증), reg.5&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:auto&quot;&gt;시행규칙&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;law&quot;&gt;&lt;span class=&quot;nm&quot;&gt;Public Procurement Regulations, 2013 (연혁 참고)&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:auto&quot;&gt;시행규칙&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;law&quot;&gt;&lt;span class=&quot;nm&quot;&gt;PPRA 표준입찰서류(Standard Tender Documents)&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:auto&quot;&gt;표준문서&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;권한 기관&lt;/h3&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.ppra.go.tz/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;공공조달규제청(PPRA)&lt;/a&gt;&lt;/b&gt;&lt;span&gt;조달 가이드라인·표준입찰서류 제정, 법 이행 모니터링, 가격상한(price cap) 설정, 부당행위 조사, NeST 운영 감독&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;발주 공공기관(procuring entity)&lt;/b&gt;&lt;span&gt;입찰공고·서류작성·개찰·평가·낙찰·계약, 보증 금액·형태를 입찰서류에 명시&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;재정기획부(MoF)&lt;/b&gt;&lt;span&gt;PPRA 소관 부처. 조달 규정 제정&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;은행·보험사&lt;/b&gt;&lt;span&gt;입찰보증·이행보증·선금보증·하자보증 발행. 외국 발행분도 입찰서류 요건 충족 시 거부 불가&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;이해관계자&lt;/h3&gt;&lt;p style=&quot;margin:0;font-size:13.5px;line-height:1.7&quot;&gt;발주 공공기관(procuring entity), 국내외 입찰자, 공공조달규제청(PPRA), 재정기획부, 입찰·이행 보증을 발행하는 은행·보험사, 산업별 발주 공기업(TANESCO·TANROADS·TPDC 등), 탄자니아투자청(TIC), 기업등록청(BRELA)&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;제출서류&lt;/h3&gt;&lt;div class=&quot;docset&quot;&gt;&lt;b&gt;입찰자(공통)&lt;/b&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;입찰서(NeST 전자제출)&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;입찰보증(bid security) 또는 입찰보증선언 — 인증수표·신용장·은행지급보증·보험증서 (PPR 2024 reg.23(5), Third Schedule)&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;사업자등록(BRELA) 규정준수 인증서&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;납세자식별번호(TIN) 인증서&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;유효한 세금공제 인증서&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;TIC 서비스 이용료 지불 영수증&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;docset&quot;&gt;&lt;b&gt;낙찰자&lt;/b&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;이행보증(performance security) (reg.29)&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;선금보증(선금 수령 시)&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;하자보증(하자담보기간)&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;docset&quot;&gt;&lt;b&gt;발주 공공기관&lt;/b&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;표준입찰서류&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;입찰공고&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;평가보고서&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;낙찰통지서&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;조달계약서&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;유의사항 · 병목&lt;/h3&gt;&lt;ul class=&quot;plain&quot;&gt;&lt;li&gt;현행 PPA 2023과 PPR 2024를 기준으로 입찰방법·전자조달·보증 요건을 확인해야 한다&lt;/li&gt;&lt;li&gt;보증 금액은 규정에 고정되지 않고 입찰서류와 계약에 위임되므로(reg.23(6), reg.29(2), reg.329), 발주 건별 확인이 필요하다&lt;/li&gt;&lt;li&gt;전 조달의 NeST(국가전자조달시스템) 처리가 의무화돼, 시스템 등록·전자입찰 역량이 없으면 참여 자체가 막힌다&lt;/li&gt;&lt;li&gt;PPA 2023이 지역업체·현지생산품 우대를 강화해, 외국 기업은 현지 파트너십 없이는 평가에서 불리할 수 있다&lt;/li&gt;&lt;li&gt;탄자니아의 다소 느린 행정처리로 인허가·등록에 시간 여유가 필요하다&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;진입장벽&lt;/h3&gt;&lt;ul class=&quot;plain&quot;&gt;&lt;li&gt;지사의 모든 주주·발기인이 탄자니아 국적이어도 외국 기업으로 분류 — 외국인 조달 규율 적용&lt;/li&gt;&lt;li&gt;선적 전 적합성 확인(PVoC) 제도로 수입 기자재에 CoC(적합성인증서) 필요, 검사비 FOB의 0.25~0.50%&lt;/li&gt;&lt;li&gt;낮은 노동 생산성&lt;/li&gt;&lt;li&gt;본토와 잔지바르 자치정부의 이원 행정&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;현장 검증 필요&lt;/h3&gt;&lt;ul class=&quot;plain&quot;&gt;&lt;li&gt;{&amp;#x27;item&amp;#x27;: &amp;#x27;현행 법령·정량요건·이의·예외&amp;#x27;, &amp;#x27;question&amp;#x27;: &amp;#x27;PPA 2023과 PPR 2024의 현행 조문·부속표에서 확인했는가?&amp;#x27;, &amp;#x27;status&amp;#x27;: &amp;#x27;confirmed&amp;#x27;}&lt;/li&gt;&lt;li&gt;{&amp;#x27;item&amp;#x27;: &amp;#x27;NeST 전자조달 의무&amp;#x27;, &amp;#x27;question&amp;#x27;: &amp;#x27;PPR reg.11에서 전자조달시스템 사용 의무를 확인했는가?&amp;#x27;, &amp;#x27;status&amp;#x27;: &amp;#x27;confirmed&amp;#x27;}&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;관련 제도&lt;/h3&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;탄자니아 조달 거버넌스·감독체계&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;탄자니아 ODA 사업 발굴·형성 절차&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;법령 원문&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;현장에서 발주처에 그대로 제시할 수 있는 조문 원문입니다. 우리 요약이 아니라 verbatim이며,
    조문 번호를 누르면 원문 문서로 이동합니다. 한국어 요지 아래로 직역(참고용)을 펼칠 수 있습니다.&lt;/p&gt;
  &lt;div class=&quot;quotes&quot;&gt;&lt;div class=&quot;qc&quot;&gt;
  &lt;div class=&quot;qhd&quot;&gt;
    &lt;span class=&quot;qart&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.ppra.go.tz/uploads/documents/en-1736861173-THE%20PUBLIC%20PROCUREMENT%20ACT.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;§131(1)&lt;/a&gt;&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;Public Procurement Act, No. 10 of 2023&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;qtext&quot;&gt;The Public Procurement Act of 2011 is hereby repealed.&lt;/div&gt;
  &lt;p class=&quot;qgist&quot;&gt;현행 근거 법률은 Public Procurement Act 2023이며 2011년 법을 대체한다.&lt;/p&gt;
  &lt;details&gt;&lt;summary&gt;한국어 직역(참고 — 공식 번역 아님)&lt;/summary&gt;&lt;p class=&quot;qko&quot;&gt;2011년 공공조달법은 이로써 폐지된다.&lt;/p&gt;&lt;/details&gt;
&lt;/div&gt;&lt;div class=&quot;qc&quot;&gt;
  &lt;div class=&quot;qhd&quot;&gt;
    &lt;span class=&quot;qart&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.mof.go.tz/uploads/documents/en-1758539549-GN%20No.%20261%20OF%202025%20-%20THE%20PUBLIC%20PROCUREMENT%20REGULATIONS%20%20-%20ENGLISH%20VERSION.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;reg.23(6)&lt;/a&gt;&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;Public Procurement Regulations, 2024 (English version: GN No. 261 of 2025)&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;qtext&quot;&gt;The procuring entity shall specify, in the tender documents, any requirements with respect to the issuer and the nature, form, amount and other principal terms and conditions of the required tender security.&lt;/div&gt;
  &lt;p class=&quot;qgist&quot;&gt;입찰보증의 금액·형태·조건은 발주기관이 입찰서류에 정한다.&lt;/p&gt;
  &lt;details&gt;&lt;summary&gt;한국어 직역(참고 — 공식 번역 아님)&lt;/summary&gt;&lt;p class=&quot;qko&quot;&gt;발주기관은 요구되는 입찰보증의 발행인, 성격·형태·금액과 그 밖의 주요 조건을 입찰서류에 명시한다.&lt;/p&gt;&lt;/details&gt;
&lt;/div&gt;&lt;div class=&quot;qc&quot;&gt;
  &lt;div class=&quot;qhd&quot;&gt;
    &lt;span class=&quot;qart&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.mof.go.tz/uploads/documents/en-1758539549-GN%20No.%20261%20OF%202025%20-%20THE%20PUBLIC%20PROCUREMENT%20REGULATIONS%20%20-%20ENGLISH%20VERSION.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;reg.29(2)&lt;/a&gt;&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;Public Procurement Regulations, 2024 (English version: GN No. 261 of 2025)&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;qtext&quot;&gt;The procuring entity shall specify in the tender documents any requirement with respect to the issuer and the nature, form, amount and other principal terms and conditions of the required performance security.&lt;/div&gt;
  &lt;p class=&quot;qgist&quot;&gt;이행보증 금액도 발주기관이 입찰서류에서 정한다.&lt;/p&gt;
  &lt;details&gt;&lt;summary&gt;한국어 직역(참고 — 공식 번역 아님)&lt;/summary&gt;&lt;p class=&quot;qko&quot;&gt;발주기관은 요구되는 이행보증의 발행인, 성격·형태·금액과 그 밖의 주요 조건을 입찰서류에 명시한다.&lt;/p&gt;&lt;/details&gt;
&lt;/div&gt;&lt;div class=&quot;qc&quot;&gt;
  &lt;div class=&quot;qhd&quot;&gt;
    &lt;span class=&quot;qart&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.mof.go.tz/uploads/documents/en-1758539549-GN%20No.%20261%20OF%202025%20-%20THE%20PUBLIC%20PROCUREMENT%20REGULATIONS%20%20-%20ENGLISH%20VERSION.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;reg.315(2)&lt;/a&gt;&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;Public Procurement Regulations, 2024 (English version: GN No. 261 of 2025)&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;qtext&quot;&gt;The agreed amount of advance payment shall be specified in the contract documents and under no circumstances, shall it exceed thirty percent of the contract value.&lt;/div&gt;
  &lt;p class=&quot;qgist&quot;&gt;선금은 계약가의 30%를 초과할 수 없다(초과 시 PPRA 승인).&lt;/p&gt;
  &lt;details&gt;&lt;summary&gt;한국어 직역(참고 — 공식 번역 아님)&lt;/summary&gt;&lt;p class=&quot;qko&quot;&gt;합의된 선금 금액은 계약서류에 명시되며, 어떤 경우에도 계약가치의 30%를 초과할 수 없다.&lt;/p&gt;&lt;/details&gt;
&lt;/div&gt;&lt;div class=&quot;qc&quot;&gt;
  &lt;div class=&quot;qhd&quot;&gt;
    &lt;span class=&quot;qart&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.mof.go.tz/uploads/documents/en-1758539549-GN%20No.%20261%20OF%202025%20-%20THE%20PUBLIC%20PROCUREMENT%20REGULATIONS%20%20-%20ENGLISH%20VERSION.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;reg.318(2)&lt;/a&gt;&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;Public Procurement Regulations, 2024 (English version: GN No. 261 of 2025)&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;qtext&quot;&gt;The rates of liquidated damages per day shall be- (a) for procurement of goods or materials, 0.10 to 0.20 percent of the contract value per day of delay, up to a sum equivalent to the amount of the performance guarantee; (b) for procurement of works, 0.10 to 0.15 percent of the contract value per day of delay, up to a sum equivalent to the amount of the performance guarantee; and (c) for consultancy services, 0.10 to 0.20 percent of the contract value per day of delay, up to a sum equivalent to the amount of the performance guarantee.&lt;/div&gt;
  &lt;p class=&quot;qgist&quot;&gt;지체상금은 물품 0.10~0.20%·공사 0.10~0.15%·컨설팅 0.10~0.20%/일이며 각 이행보증을 한도로 한다.&lt;/p&gt;
  &lt;details&gt;&lt;summary&gt;한국어 직역(참고 — 공식 번역 아님)&lt;/summary&gt;&lt;p class=&quot;qko&quot;&gt;일일 지체상금률은 (a) 물품·자재 0.10~0.20%, (b) 공사 0.10~0.15%, (c) 컨설팅 용역 0.10~0.20%로 하며, 각각 이행보증 금액을 한도로 한다.&lt;/p&gt;&lt;/details&gt;
&lt;/div&gt;&lt;div class=&quot;qc&quot;&gt;
  &lt;div class=&quot;qhd&quot;&gt;
    &lt;span class=&quot;qart&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.mof.go.tz/uploads/documents/en-1758539549-GN%20No.%20261%20OF%202025%20-%20THE%20PUBLIC%20PROCUREMENT%20REGULATIONS%20%20-%20ENGLISH%20VERSION.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Third Schedule, FORM No. 1 (Bid Securing Declaration)&lt;/a&gt;&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;Public Procurement Regulations, 2024 (English version: GN No. 261 of 2025)&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;qtext&quot;&gt;We understand this bid securing declaration shall expire if we are not the successful tenderer, immediately upon- (i) receipt of your notification of the name of the successful tenderer; or (ii) twenty-eight days after the expiry of our tender.&lt;/div&gt;
  &lt;p class=&quot;qgist&quot;&gt;입찰보증선언은 낙찰 통지 수령 또는 입찰 만료 후 28일에 만료된다.&lt;/p&gt;
  &lt;details&gt;&lt;summary&gt;한국어 직역(참고 — 공식 번역 아님)&lt;/summary&gt;&lt;p class=&quot;qko&quot;&gt;본 입찰보증선언은 당사가 낙찰자가 아닌 경우 (i) 낙찰자 명단 통지 수령, 또는 (ii) 입찰 만료 후 28일에 즉시 소멸한다.&lt;/p&gt;&lt;/details&gt;
&lt;/div&gt;&lt;div class=&quot;qc&quot;&gt;
  &lt;div class=&quot;qhd&quot;&gt;
    &lt;span class=&quot;qart&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.ppra.go.tz/uploads/documents/en-1736861173-THE%20PUBLIC%20PROCUREMENT%20ACT.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;§76(1)&lt;/a&gt;&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;Public Procurement Act, No. 10 of 2023&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;qtext&quot;&gt;For the purpose of this Act, &amp;quot;force account&amp;quot; means a process where works are carried out by a public or semi-public entities by making recourse to its officers and equipment or in collaborating with a local technician or another public body.&lt;/div&gt;
  &lt;p class=&quot;qgist&quot;&gt;force account(직영)는 공공기관이 자체 인력·장비로 공사를 수행하는 방식이며, §76(2)의 정당화 사유·문턱 내에서만 허용된다.&lt;/p&gt;
  &lt;details&gt;&lt;summary&gt;한국어 직역(참고 — 공식 번역 아님)&lt;/summary&gt;&lt;p class=&quot;qko&quot;&gt;이 법의 목적상 &amp;#x27;force account(직영)&amp;#x27;란 공공 또는 준공공기관이 자체 인력·장비 또는 현지 기술자·타 공공기관과 협력해 공사를 수행하는 절차를 말한다.&lt;/p&gt;&lt;/details&gt;
&lt;/div&gt;&lt;div class=&quot;qc&quot;&gt;
  &lt;div class=&quot;qhd&quot;&gt;
    &lt;span class=&quot;qart&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.ppra.go.tz/uploads/documents/en-1736861173-THE%20PUBLIC%20PROCUREMENT%20ACT.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;§74 (definition)&lt;/a&gt;&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;Public Procurement Act, No. 10 of 2023&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;qtext&quot;&gt;&amp;quot;price cap&amp;quot; means an established minimum and maximum price which shall be charged for particular goods, works or services;&lt;/div&gt;
  &lt;p class=&quot;qgist&quot;&gt;PPRA는 특정 물품·공사·용역의 최소·최대 가격을 정할 수 있다.&lt;/p&gt;
  &lt;details&gt;&lt;summary&gt;한국어 직역(참고 — 공식 번역 아님)&lt;/summary&gt;&lt;p class=&quot;qko&quot;&gt;&amp;#x27;가격상한(price cap)&amp;#x27;이란 특정 물품·공사·용역에 부과되는, 정해진 최소·최대 가격을 말한다.&lt;/p&gt;&lt;/details&gt;
&lt;/div&gt;&lt;div class=&quot;qc&quot;&gt;
  &lt;div class=&quot;qhd&quot;&gt;
    &lt;span class=&quot;qart&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.mof.go.tz/uploads/documents/en-1758539549-GN%20No.%20261%20OF%202025%20-%20THE%20PUBLIC%20PROCUREMENT%20REGULATIONS%20%20-%20ENGLISH%20VERSION.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;reg.329(2)&lt;/a&gt;&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;Public Procurement Regulations, 2024 (English version: GN No. 261 of 2025)&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;qtext&quot;&gt;The procuring entity shall authorise payments by measurement and certification of work completed, at the intervals or stages specified in the contract, provided that a percentage of each payment may be withheld as retention money if so stated in the contract.&lt;/div&gt;
  &lt;p class=&quot;qgist&quot;&gt;하자보증은 유보금(retention money) 방식으로, 계약에 명시된 경우 각 지급금의 일정 비율을 유보한다.&lt;/p&gt;
  &lt;details&gt;&lt;summary&gt;한국어 직역(참고 — 공식 번역 아님)&lt;/summary&gt;&lt;p class=&quot;qko&quot;&gt;발주기관은 계약에 정한 간격·단계에서 완료된 작업을 측정·확인해 대금을 지급하되, 계약에 그렇게 정한 경우 각 지급금의 일정 비율을 유보금으로 유보할 수 있다.&lt;/p&gt;&lt;/details&gt;
&lt;/div&gt;&lt;div class=&quot;qc&quot;&gt;
  &lt;div class=&quot;qhd&quot;&gt;
    &lt;span class=&quot;qart&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.mof.go.tz/uploads/documents/en-1758539549-GN%20No.%20261%20OF%202025%20-%20THE%20PUBLIC%20PROCUREMENT%20REGULATIONS%20%20-%20ENGLISH%20VERSION.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;reg.329(7)&lt;/a&gt;&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;Public Procurement Regulations, 2024 (English version: GN No. 261 of 2025)&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;qtext&quot;&gt;Where the procuring entity is satisfied as to the non-consultancy services provided or works completed, and after any period specified in the contract has elapsed, it shall authorise the final payment to the service provider or contractor on his application, and release any performance guarantee, provided the service provider or contractor has rectified all the defects identified.&lt;/div&gt;
  &lt;p class=&quot;qgist&quot;&gt;하자담보기간은 계약에 정한 기간이며, 하자를 모두 시정하고 그 기간이 지나면 최종 대금 지급과 이행보증 해제가 이뤄진다.&lt;/p&gt;
  &lt;details&gt;&lt;summary&gt;한국어 직역(참고 — 공식 번역 아님)&lt;/summary&gt;&lt;p class=&quot;qko&quot;&gt;발주기관은 비컨설팅 용역·공사 완료에 만족하고 계약에 정한 기간이 경과하면, 시공자의 신청에 따라 최종 대금을 지급하고 이행보증을 해제한다 — 다만 확인된 하자를 모두 시정한 경우에 한한다.&lt;/p&gt;&lt;/details&gt;
&lt;/div&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;현행 기준 반영 3건&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;공식 법령·기관 원문으로 확인한 현행 기준과 실무 확인사항입니다.
    출처는 각 항목에 연결했으며.&lt;/p&gt;
  &lt;div class=&quot;disc&quot; data-sev=&quot;high&quot;&gt;
  &lt;div class=&quot;top&quot;&gt;
    &lt;span class=&quot;badge bad&quot;&gt;필수 확인&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;탄자니아&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;D01&lt;/span&gt;
  &lt;/div&gt;
  &lt;h3&gt;canvas.legalBasis / 근거 법령의 현행 여부&lt;/h3&gt;
  &lt;div class=&quot;quote act&quot;&gt;&lt;b&gt;현행 기준&lt;/b&gt;PPA 2023 §131(1)은 Public Procurement Act 2011을 폐지한다. 새 법은 2024-06-17 시행(GN 455)됐고, 현행 하위규정은 Public Procurement Regulations 2024다. 공식 영문본은 GN No. 261(2025-04-25)로 공표됐으며 reg.23(6)은 보증 금액을 입찰서류에 위임한다.&lt;/div&gt;
  &lt;p class=&quot;cite&quot;&gt;확인 출처 · &lt;a class=&quot;ref&quot; href=&quot;https://www.ppra.go.tz/uploads/documents/en-1736861173-THE%20PUBLIC%20PROCUREMENT%20ACT.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Public Procurement Act, No. 10 of 2023&lt;/a&gt; §131(1); &lt;a class=&quot;ref&quot; href=&quot;https://www.mof.go.tz/uploads/documents/en-1758539549-GN%20No.%20261%20OF%202025%20-%20THE%20PUBLIC%20PROCUREMENT%20REGULATIONS%20%20-%20ENGLISH%20VERSION.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Public Procurement Regulations, 2024 (English version: GN No. 261 of 2025)&lt;/a&gt;&lt;/p&gt;
  &lt;div class=&quot;todo&quot;&gt;&lt;b&gt;실무 확인&lt;/b&gt;발주 건의 입찰서류에서 보증 금액·형태를 직접 확인하고, NeST 등록과 지역업체 우대 요건을 사전에 점검한다.&lt;/div&gt;
  &lt;details class=&quot;review&quot;&gt;
  &lt;summary&gt;Field verification (English)&lt;/summary&gt;
  &lt;div class=&quot;rv&quot;&gt;
    &lt;p&gt;&lt;b&gt;Current legal basis&lt;/b&gt; — Public Procurement Act No. 10 of 2023 §131(1) repealed the 2011 Act; the new Act took effect on 17 June 2024 (GN 455). The current regulations are the Public Procurement Regulations 2024; their official English version was published as GN No. 261 of 2025.&lt;/p&gt;
    &lt;p class=&quot;rv-verify&quot;&gt;&lt;b&gt;✔ Verify&lt;/b&gt; — Apply PPA 2023 and PPR 2024. Confirm surety amounts in each tender&amp;#x27;s documents, and check NeST registration and local-preference requirements before bidding.&lt;/p&gt;
  &lt;/div&gt;
&lt;/details&gt;

  &lt;p class=&quot;act-row&quot;&gt;산출물 반영 — PPA 2023과 PPR 2024를 기준으로 입찰 절차와 보증 요건을 반영하고, 공식 영문본의 공표번호(GN 261/2025)를 함께 표시했다.&lt;/p&gt;
&lt;/div&gt;&lt;div class=&quot;disc&quot; data-sev=&quot;medium&quot;&gt;
  &lt;div class=&quot;top&quot;&gt;
    &lt;span class=&quot;badge warn&quot;&gt;추가 확인&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;탄자니아&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;D02&lt;/span&gt;
  &lt;/div&gt;
  &lt;h3&gt;canvas.applicability / 전자조달 시스템&lt;/h3&gt;
  &lt;div class=&quot;quote act&quot;&gt;&lt;b&gt;현행 기준&lt;/b&gt;PPA 2023은 전 조달을 국가전자조달시스템(NeST, National e-Procurement System of Tanzania)으로 처리하도록 의무화했다. 종전 TANePS를 대체하는 통합 시스템이다.&lt;/div&gt;
  &lt;p class=&quot;cite&quot;&gt;확인 출처 · &lt;a class=&quot;ref&quot; href=&quot;https://www.ppra.go.tz/uploads/documents/en-1736861173-THE%20PUBLIC%20PROCUREMENT%20ACT.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Public Procurement Act, No. 10 of 2023&lt;/a&gt; (전자조달 규정) — PPRA 시행 공지&lt;/p&gt;
  &lt;div class=&quot;todo&quot;&gt;&lt;b&gt;실무 확인&lt;/b&gt;탄자니아 입찰 참여 전 NeST(국가전자조달시스템) 등록을 완료하고 전자입찰 역량을 갖춘다. 종이 기반 절차를 전제로 준비하지 않는다.&lt;/div&gt;
  &lt;details class=&quot;review&quot;&gt;
  &lt;summary&gt;Field verification (English)&lt;/summary&gt;
  &lt;div class=&quot;rv&quot;&gt;
    &lt;p&gt;&lt;b&gt;Current legal basis&lt;/b&gt; — PPA 2023 mandates the National e-Procurement System of Tanzania (NeST) for all procurement, replacing the former TANePS.&lt;/p&gt;
    &lt;p class=&quot;rv-verify&quot;&gt;&lt;b&gt;✔ Verify&lt;/b&gt; — Confirm NeST registration is complete before any tender, and that the procuring entity runs the tender through NeST.&lt;/p&gt;
  &lt;/div&gt;
&lt;/details&gt;

  &lt;p class=&quot;act-row&quot;&gt;산출물 반영 — applicability와 procedure에 NeST 전자조달 의무를 반영했다.&lt;/p&gt;
&lt;/div&gt;&lt;div class=&quot;disc&quot; data-sev=&quot;medium&quot;&gt;
  &lt;div class=&quot;top&quot;&gt;
    &lt;span class=&quot;badge warn&quot;&gt;추가 확인&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;탄자니아&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;D03&lt;/span&gt;
  &lt;/div&gt;
  &lt;h3&gt;canvas.applicability / 보증률&lt;/h3&gt;
  &lt;div class=&quot;quote act&quot;&gt;&lt;b&gt;현행 기준&lt;/b&gt;PPR 2024는 보증 비율을 규정에 고정하지 않고 위임한다 — 입찰보증(reg.23(6))·이행보증(reg.29(2))은 입찰서류에, 하자보증은 유보금(retention money) 방식으로 계약에(reg.329(2)), 하자담보기간도 &amp;#x27;계약에 정한 기간&amp;#x27;에(reg.329(7)) 맡긴다. 확정 값이 있는 것은 선금 30% 상한(reg.315(2))과 지체상금 물품 0.10~0.20%·공사 0.10~0.15%/일(reg.318(2))뿐이며, 지체상금에 &amp;#x27;운송·보관&amp;#x27; 항목은 없다.&lt;/div&gt;
  &lt;p class=&quot;cite&quot;&gt;확인 출처 · &lt;a class=&quot;ref&quot; href=&quot;https://www.mof.go.tz/uploads/documents/en-1758539549-GN%20No.%20261%20OF%202025%20-%20THE%20PUBLIC%20PROCUREMENT%20REGULATIONS%20%20-%20ENGLISH%20VERSION.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Public Procurement Regulations, 2024 (English version: GN No. 261 of 2025)&lt;/a&gt; reg.23(6), reg.29(2), reg.315(2), reg.318(2), reg.329(2)(7), Third Schedule&lt;/p&gt;
  &lt;div class=&quot;todo&quot;&gt;&lt;b&gt;실무 확인&lt;/b&gt;입찰·이행보증 금액은 입찰서류에서, 하자보증(유보금)과 하자담보기간은 계약서에서 확인한다. 선금은 계약가 30% 상한, 지체상금은 물품 0.10~0.20%·공사 0.10~0.15%/일을 적용하며 운송·보관 관련 항목은 계약 특약 여부를 따로 확인한다.&lt;/div&gt;
  &lt;details class=&quot;review&quot;&gt;
  &lt;summary&gt;Field verification (English)&lt;/summary&gt;
  &lt;div class=&quot;rv&quot;&gt;
    &lt;p&gt;&lt;b&gt;Current legal basis&lt;/b&gt; — PPR 2024 delegates the amounts rather than fixing them: bid security (reg.23(6)) and performance security (reg.29(2)) are set in the tender documents; the defect surety is retention money set by the contract (reg.329(2)); the defects-liability period is &amp;#x27;the period specified in the contract&amp;#x27; (reg.329(7)). The only fixed values are the advance-payment cap of 30% (reg.315(2)) and liquidated damages of 0.10-0.20% (goods), 0.10-0.15% (works), 0.10-0.20% (consultancy) per day (reg.318(2)). There is no &amp;#x27;transport/storage&amp;#x27; liquidated-damages category.&lt;/p&gt;
    &lt;p class=&quot;rv-verify&quot;&gt;&lt;b&gt;✔ Verify&lt;/b&gt; — Read the bid and performance security amounts from each tender&amp;#x27;s documents; read retention money and the defects-liability period from the contract. Do not assume 5% / 10% / 3% / 1-2 years. Check whether any &amp;#x27;transport/storage&amp;#x27; liquidated damages exist as a contract-specific special term.&lt;/p&gt;
  &lt;/div&gt;
&lt;/details&gt;

  &lt;p class=&quot;act-row&quot;&gt;산출물 반영 — 입찰·이행보증에 더해 하자보증(유보금 reg.329(2))·하자담보기간(reg.329(7))도 계약 위임임을 원문으로 확인해 applicability·notes·sourceQuotes에 반영했다. 확정된 값과 대응 없는 항목(운송 지체상금)을 구분해 명시하고, verification.status를 article-verified로 유지한다.&lt;/p&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;검증&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;PPRA·재정기획부 공식 사이트에서 현행 법령을 확인하고, Public Procurement Act 2023(103쪽)과 Public Procurement Regulations 2024 공식 영문본(GN 261/2025, 292쪽)을 확보해 폐지 조항(§131), 보증 조항(reg.23·29), 선금(reg.315), 지체상금(reg.318), Third Schedule 보증 서식, 조달방식·전자조달·가격상한 조항을 조문 단위로 대조했다.&lt;/p&gt;
  &lt;div class=&quot;cards&quot;&gt;
    &lt;div class=&quot;card span2&quot;&gt;&lt;h3&gt;검증 범위&lt;/h3&gt;
      &lt;p style=&quot;margin:0;font-size:13.5px;line-height:1.7&quot;&gt;현행 법률·규정(PPA 2023, PPR 2024)의 시행·폐지 상태, Sixth Schedule 조달방식별 금액, Tenth·Eleventh Schedules 최소기간, 보증(regs.23–30), 이의·상소(PPA §§119–125; PPR regs.107–109, 238), 공여자·단일공급·긴급 예외를 조문 단위로 대조했다.&lt;/p&gt;
      &lt;p style=&quot;margin:12px 0 0;font-size:12.5px;color:var(--muted)&quot;&gt;확인일 2026-07-23 · 자료집 기준일 2026-02-23&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;대조에 쓴 원문&lt;/h3&gt;&lt;ul class=&quot;srcs&quot; style=&quot;padding-left:16px;margin:0&quot;&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.ppra.go.tz/uploads/documents/en-1736861173-THE%20PUBLIC%20PROCUREMENT%20ACT.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;The Public Procurement Act, 2023 (Act No. 10 of 2023) — English Version&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;법률&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;대조 조문 §§1–5, 8–10, 38, 49–86, 112–125, 131(1)–(3)&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-28 · Public Procurement Regulatory Authority (PPRA)&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.mof.go.tz/uploads/documents/en-1758539549-GN%20No.%20261%20OF%202025%20-%20THE%20PUBLIC%20PROCUREMENT%20REGULATIONS%20%20-%20ENGLISH%20VERSION.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;The Public Procurement Regulations, 2024 — English Version (GN No. 261 of 2025)&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;시행규칙&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;대조 조문 regs.1, 9–11, 23–30, 64–65, 78, 107–109, 115, 125, 150–166, 238, 315, 318, 329; Sixth, Ninth–Eleventh Schedules; Third Schedule forms&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-28 · Ministry of Finance, United Republic of Tanzania&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.ppra.go.tz/news/new-public-procurement-law-to-take-effect-on-june-17-2024&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PPRA 새 조달법 시행 공지 (2024-06-17)&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;지침·정책&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-28 · PPRA&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card span2&quot;&gt;&lt;h3&gt;주의&lt;/h3&gt;&lt;p class=&quot;note&quot;&gt;현행 근거인 Public Procurement Act 2023은 2023-09-29 대통령 재가 후 GN 455(2024-06-07)에 따라 2024-06-17 시행됐고, §131(1)이 2011년 법을 대체한다.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;PPA 2023 §131(3)은 새 법과 배치되지 않는 기존 하위규정은 대체·폐지 전까지 유효하게 남긴다. 현행 규정은 Public Procurement Regulations 2024이며 공식 영문본은 GN 261/2025로 공표됐다.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;PPR 2024는 입찰보증(reg.23(6))·이행보증(reg.29(2))을 입찰서류에, 하자보증 유보금(reg.329(2))·하자담보기간(reg.329(7))을 계약에 맡긴다. 규정상 확정 수치는 선금 30% 상한(reg.315(2))과 지체상금 범위(reg.318(2))이며, Third Schedule은 보증 서식을 정한다.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;새 법의 주요 변경 — 조달 소요기간 단축, force account 사용 조건 강화(문턱 설정, §76), PPRA의 가격상한 설정 권한 신설(§74), 국가전자조달시스템(NeST) 전 조달 의무화, 지역업체·현지생산품 우대 강화.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;새 법은 스와힐리어로 제정됐고 영문본은 공식 번역이다. 해석이 갈리면 스와힐리어본이 우선한다.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;p style=&quot;margin:22px 0 0;font-size:12.5px;color:var(--muted)&quot;&gt;
    조문 대조 완료 — 조문의 존재와 문언 일치만 뜻합니다. 법적 해석·적용 타당성·개정 반영 여부는 별도 검토 대상입니다.
  &lt;/p&gt;
&lt;/section&gt;
&lt;/div&gt;

&lt;footer class=&quot;site&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;

function draw(){

      +&#x27;&lt;path d=&quot;M0 0 L8 4 L0 8 z&quot; fill=&quot;&#x27;+C[t]+&#x27;&quot;/&gt;&lt;/marker&gt;&#x27;;
  });

                            r:rc.right-bb.left+board.scrollLeft, b:rc.bottom-bb.top+board.scrollTop,

  function box(id){

  /* 라우팅은 korea100studio의 거터 라우팅을 우리 그리드에 이식한 것이다.

     DOM에서 노드·행·열을 실측할 수 있어, 여러 직교 경로 후보를 만들고
     무관한 카드를 가장 적게 관통하는(동수면 가장 짧은) 것을 고른다. */

  var rowGut=[], colGut=[];
  board.querySelectorAll(&#x27;.brow:not(.head)&#x27;).forEach(function(el){ var r=rel(el.getBoundingClientRect());
    rowGut.push(r.y+9); rowGut.push(r.b-9); });
  var hc=board.querySelectorAll(&#x27;.brow.head .bcell&#x27;);
  for(var i=1;i&lt;hc.length;i++){ var r=rel(hc[i].getBoundingClientRect()); colGut.push(r.x+11); colGut.push(r.r-11); }

  function segHit(ax,ay,bx,by,e1,e2){
    var n=0, M=3;
    for(var i=0;i&lt;OB.length;i++){ var o=OB[i]; if(o.id===e1||o.id===e2) continue;
      var L=o.x+M,R=o.r-M,T=o.y+M,B=o.b-M;
      if(Math.abs(ay-by)&lt;0.5){ if(ay&gt;T&amp;&amp;ay&lt;B &amp;&amp; Math.max(ax,bx)&gt;L &amp;&amp; Math.min(ax,bx)&lt;R) n++; }
      else { if(ax&gt;L&amp;&amp;ax&lt;R &amp;&amp; Math.max(ay,by)&gt;T &amp;&amp; Math.min(ay,by)&lt;B) n++; }
    } return n;
  }
  function uniq(pts){ return pts.filter(function(p,i){ return i===0 || Math.abs(p.x-pts[i-1].x)&gt;0.5 || Math.abs(p.y-pts[i-1].y)&gt;0.5; }); }

.node{position:relative;z-index:2;background:var(--bg);border:1px solid var(--line);
  border-radius:9px;padding:10px 12px;cursor:pointer;text-align:left;font:inherit;color:inherit;
  width:100%;display:block;transition:box-shadow .12s,border-color .12s}
.node:hover{border-color:var(--muted);box-shadow:0 2px 10px rgba(0,0,0,.07)}
.node .id{font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.04em;
  display:flex;justify-content:space-between;align-items:center;gap:8px}
.node .nm{font-size:13px;font-weight:700;margin-top:3px;letter-spacing:-.01em;line-height:1.4}
.node .tag{font-size:10px;font-weight:700;padding:1px 6px;border-radius:999px}
.node[data-tone=&quot;key&quot;]{border-color:var(--key);background:var(--key-bg)}
.node[data-tone=&quot;key&quot;] .tag{background:var(--key);color:var(--bg)}
.node[data-tone=&quot;warn&quot;]{border-color:var(--warn);background:var(--warn-bg)}
.node[data-tone=&quot;warn&quot;] .tag{background:var(--warn);color:var(--bg)}
.node[data-tone=&quot;back&quot;]{border-color:var(--back);background:var(--back-bg)}
.node[data-tone=&quot;back&quot;] .tag{background:var(--back);color:var(--bg)}
.node.dim{opacity:.34}

.drawer{position:fixed;inset:0;z-index:100;display:none;width:100vw;height:100vh;
  max-width:100vw;max-height:100vh;margin:0;padding:0;border:0;background:transparent;overflow:hidden}
.drawer[open]{display:block}
.drawer::backdrop{background:rgba(0,0,0,.34)}
.drawer .pane{position:absolute;right:0;top:0;bottom:0;width:min(440px,92vw);background:var(--bg);
  border-left:1px solid var(--line);padding:24px;overflow:auto}
.drawer h3{margin:10px 0 4px;font-size:19px;letter-spacing:-.02em}
.drawer .close{position:absolute;right:18px;top:18px;background:none;border:0;color:var(--muted);
  font-size:22px;cursor:pointer;line-height:1;padding:4px}
.kv{margin:18px 0 0;font-size:13.5px}
.kv dt{font-size:11.5px;color:var(--muted);font-weight:700;margin-top:14px}
.kv dd{margin:3px 0 0}
.kv code{font-size:12.5px;background:var(--soft);padding:1px 6px;border-radius:4px}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}
.card{border:1px solid var(--line);border-radius:11px;padding:17px 19px}
.card h3{margin:0 0 11px;font-size:13.5px;letter-spacing:.01em}
.card.span2{grid-column:span 2}
@media (max-width:820px){.card.span2{grid-column:span 1}}
ol.steps{margin:0;padding-left:20px;font-size:13.5px;line-height:1.75}
ol.steps li{margin-bottom:5px}
ul.plain{margin:0;padding-left:18px;font-size:13.5px;line-height:1.7}
ul.plain li{margin-bottom:6px}
.law{display:flex;gap:9px;align-items:baseline;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.law:last-child{border-bottom:0}
.law .nm{font-weight:600}
.law .ar{color:var(--muted);font-size:12.5px}
.docset{margin-bottom:13px}
.docset b{font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:12px;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:3px 8px}
.auth{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.auth:last-child{border-bottom:0}
.auth b{flex:none;max-width:42%;font-size:13px}
.auth span{color:var(--muted);font-size:12.5px}

.disc{border:1px solid var(--line);border-left-width:4px;border-radius:10px;padding:17px 19px;margin-bottom:15px}
.disc[data-sev=&quot;high&quot;]{border-left-color:var(--bad)}
.disc[data-sev=&quot;medium&quot;]{border-left-color:var(--warn)}
.disc[data-sev=&quot;low&quot;]{border-left-color:var(--muted)}
.disc .top{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:9px}
.disc .top .badge{white-space:normal;max-width:100%;overflow-wrap:anywhere}
.disc h3{margin:0;font-size:14.5px;letter-spacing:-.01em}
.disc .quote{font-size:13px;margin:9px 0;padding:10px 13px;border-radius:8px;background:var(--soft);line-height:1.65}
.disc .quote b{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;letter-spacing:.02em}
.disc .quote.src{border-left:2px solid var(--muted)}
.disc .quote.act{border-left:2px solid var(--key)}
.disc .cite{font-size:12px;color:var(--muted);margin:8px 0 0}
.disc .impact{font-size:13.5px;margin:11px 0 0;line-height:1.7}
.disc .act-row{font-size:13px;margin:11px 0 0;padding-top:11px;border-top:1px dashed var(--line);color:var(--muted)}
.review{margin:11px 0 0;border:1px solid var(--info);border-radius:8px;background:var(--info-bg)}
.review summary{cursor:pointer;padding:9px 13px;font-size:12px;font-weight:700;color:var(--info);list-style:none}
.review summary::-webkit-details-marker{display:none}
.review summary::before{content:&quot;▸ &quot;;font-size:10px}
.review[open] summary::before{content:&quot;▾ &quot;}
.review .rv{padding:2px 13px 13px}
.review .rv p{font-size:13px;line-height:1.65;margin:8px 0 0}
.review .rv-topic{font-weight:700;font-size:13.5px}
.review .rv-verify{padding:9px 11px;border-radius:6px;background:var(--bg);border:1px dashed var(--info)}
.fieldcheck{margin:11px 0 0;padding:11px 13px;border-radius:8px;background:var(--soft);border:1px solid var(--line)}
.fieldcheck .fc-hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.fieldcheck .fc-find{font-size:13px;line-height:1.7;margin:0}
.todo{margin:13px 0 0;padding:12px 14px;border-radius:9px;background:var(--key-bg);
  border:1px solid var(--key);font-size:13.5px;line-height:1.7}
.todo b{display:block;font-size:11px;color:var(--key);letter-spacing:.03em;margin-bottom:4px}
.up{margin:11px 0 0;padding:12px 14px;border-radius:9px;background:var(--soft);border:1px solid var(--line)}
.up .hd{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:7px}
.up .hd b{font-size:11px;color:var(--muted);letter-spacing:.03em}
.up .txt{font-size:13px;line-height:1.7;padding:9px 12px;border-radius:7px;background:var(--bg);
  border:1px dashed var(--line)}
.up .txt i{display:block;font-style:normal;font-size:10.5px;color:var(--muted);margin-bottom:3px}

.quotes{display:flex;flex-direction:column;gap:14px}
.qc{border:1px solid var(--line);border-left:3px solid var(--info);border-radius:9px;padding:15px 17px}
.qc .qhd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:9px}
.qc .qart{font-weight:700;font-size:13px}
.qc .qtext{font-family:ui-monospace,&quot;SF Mono&quot;,Menlo,monospace;font-size:12.5px;line-height:1.7;
  background:var(--soft);border-radius:7px;padding:11px 13px;white-space:pre-wrap;word-break:break-word}
.qc .qgist{font-size:13.5px;line-height:1.7;margin:10px 0 0}
.qc details{margin:8px 0 0}
.qc summary{font-size:12px;color:var(--muted);cursor:pointer;list-style:none}
.qc summary::-webkit-details-marker{display:none}
.qc summary::before{content:&quot;▸ &quot;;font-size:10px}
.qc details[open] summary::before{content:&quot;▾ &quot;}
.qc .qko{font-size:13px;line-height:1.7;color:var(--muted);margin:7px 0 0;padding-left:12px;border-left:1px solid var(--line)}
.srcs{font-size:13.5px}
.srcs li{margin-bottom:9px}
.srcs a{color:var(--info)}
.srcs .ar{display:block;color:var(--muted);font-size:12px;margin-top:1px}
.note{font-size:13.5px;line-height:1.7;color:var(--muted);margin:0 0 8px;padding-left:15px;position:relative}
.note::before{content:&quot;·&quot;;position:absolute;left:4px}

footer.site{border-top:1px solid var(--line);padding:28px 0 46px;color:var(--muted);font-size:12.5px;line-height:1.8}
footer.site a{color:var(--muted)}

&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;한 장 캔버스&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;공공조달 정책·표준을 중앙에서 통일하고 법 이행을 모니터링하되, 규제기관(PPRA)이 개별 발주기관의 집행과 분리돼 자문·감독·데이터공표·점검을 수행함으로써 조달의 투명성과 책무성을 확보한다.&lt;/p&gt;
  &lt;div class=&quot;cards&quot;&gt;
    &lt;div class=&quot;card span2&quot;&gt;&lt;h3&gt;절차&lt;/h3&gt;&lt;ol class=&quot;steps&quot;&gt;&lt;li&gt;PPRA가 조달·공급 원칙을 정부·지방정부·법정기관에 자문 (§10(a))&lt;/li&gt;&lt;li&gt;법무장관실·전문기관과 협력해 표준입찰서류·양식 제정·갱신·발급 (§10(d))&lt;/li&gt;&lt;li&gt;법 시행 가이드라인 발급 (§10(f))&lt;/li&gt;&lt;li&gt;국가전자조달시스템(NeST) 운영 — 조달기회·낙찰 데이터 공표 (§10(g))&lt;/li&gt;&lt;li&gt;발주기관이 NeST를 통해 조달 집행, 회계책임관이 결정 책임 (§38)&lt;/li&gt;&lt;li&gt;PPRA가 발주기관 기록·절차 정기 점검 (§10(h))&lt;/li&gt;&lt;li&gt;PPRA가 낙찰·이행을 모니터링해 공정·적법성 확보 (§10(i))&lt;/li&gt;&lt;li&gt;가격상한(price cap) 설정·적용 — 신설 권한 (§74)&lt;/li&gt;&lt;li&gt;입찰자 이의는 발주기관 → 공공조달상소청(PPAA) 경로로 상소&lt;/li&gt;&lt;li&gt;PPRA가 조달 성과를 정부에 보고, 개선 자문 (§10(b))&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;적용 대상&lt;/h3&gt;&lt;p style=&quot;margin:0;font-size:13.5px;line-height:1.7&quot;&gt;탄자니아의 모든 공공기관 조달에 적용된다. PPRA는 규제·감독기관이며, 개별 조달의 집행은 발주기관과 회계책임관이 담당한다. PPRA의 운영지원·역량강화자문·모니터링컴플라이언스·정보시스템·법무공보 부서가 관련 기능을 나눠 수행한다.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;법적 근거&lt;/h3&gt;&lt;div class=&quot;law&quot;&gt;&lt;span class=&quot;nm&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.ppra.go.tz/uploads/documents/en-1736861173-THE%20PUBLIC%20PROCUREMENT%20ACT.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Public Procurement Act, No. 10 of 2023&lt;/a&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;§8(PPRA 설립), §9(목적), §10(기능), §38(회계책임관), §74(가격상한), §131(폐지)&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:auto&quot;&gt;법률&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;law&quot;&gt;&lt;span class=&quot;nm&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.mof.go.tz/uploads/documents/en-1758539549-GN%20No.%20261%20OF%202025%20-%20THE%20PUBLIC%20PROCUREMENT%20REGULATIONS%20%20-%20ENGLISH%20VERSION.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Public Procurement Regulations, 2024 (English version: GN No. 261 of 2025)&lt;/a&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:auto&quot;&gt;시행규칙&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;law&quot;&gt;&lt;span class=&quot;nm&quot;&gt;국가전자조달시스템(NeST) 운영 근거&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:auto&quot;&gt;지침·정책&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;권한 기관&lt;/h3&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.ppra.go.tz/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;공공조달규제청(PPRA)&lt;/a&gt;&lt;/b&gt;&lt;span&gt;정부·지방정부·법정기관에 조달원칙 자문(§10(a)), 조달시스템 성과 모니터링·보고(§10(b)), 표준입찰서류 제정·발급(§10(d)), 가이드라인 발급(§10(f)), 조달기회·낙찰 데이터 공표(§10(g)), 발주기관 정기 점검(§10(h)), 낙찰·이행 모니터링(§10(i)), 가격상한 설정(§74)&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.mof.go.tz/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;재정기획부(MoF)&lt;/a&gt;&lt;/b&gt;&lt;span&gt;PPRA 소관 부처. 조달 규정(PPR 2024) 제정&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;발주 공공기관·회계책임관&lt;/b&gt;&lt;span&gt;조달 집행 책임. 회계책임관(accounting officer)이 조달 결정 책임 (§38)&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;공공조달상소청(PPAA)&lt;/b&gt;&lt;span&gt;조달 관련 이의·상소 심리 (독립 상소기구)&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;이해관계자&lt;/h3&gt;&lt;p style=&quot;margin:0;font-size:13.5px;line-height:1.7&quot;&gt;공공조달규제청(PPRA), 재정기획부(MoF), 발주 공공기관(procuring entity)과 회계책임관(accounting officer), 산업별 발주 공기업(TANESCO·TANROADS·TPDC·DAWASA 등), 입찰자, 공공조달상소청(PPAA)&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;제출서류&lt;/h3&gt;&lt;div class=&quot;docset&quot;&gt;&lt;b&gt;PPRA&lt;/b&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;표준입찰서류(standardised tendering documents, §10(d))&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;조달 가이드라인(guidelines, §10(f))&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;조달 성과 보고서(performance report, §10(b))&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;가격상한 고시(price cap, §74)&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;점검 결과(inspection findings, §10(h))&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;docset&quot;&gt;&lt;b&gt;발주 공공기관&lt;/b&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;조달계획&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;조달 기록·절차 문서(정기 점검 대상)&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;NeST 등록 조달 데이터&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;docset&quot;&gt;&lt;b&gt;입찰자&lt;/b&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;이의신청서(발주기관)&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;상소신청서(PPAA)&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;유의사항 · 병목&lt;/h3&gt;&lt;ul class=&quot;plain&quot;&gt;&lt;li&gt;PPRA의 현행 근거는 2024-06-17 시행된 Public Procurement Act 2023이다&lt;/li&gt;&lt;li&gt;PPRA는 개별 조달절차의 집행·분쟁해결 기관이 아니라 감독·자문기관이다. 개별 입찰 이의는 발주기관 → 공공조달상소청(PPAA) 경로로 다뤄진다&lt;/li&gt;&lt;li&gt;PPRA는 §74에 따라 특정 물품·공사·용역의 가격상한(price cap)을 설정할 수 있다&lt;/li&gt;&lt;li&gt;전 조달의 NeST 처리가 의무화돼, 발주기관·입찰자 모두 시스템 등록·운영 역량이 필요하다&lt;/li&gt;&lt;li&gt;본토와 잔지바르 자치정부의 이원 행정으로 관할 확인이 필요하다&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;진입장벽&lt;/h3&gt;&lt;ul class=&quot;plain&quot;&gt;&lt;li&gt;PPRA 데이터 공표 시스템(NeST)이 조달기회 파악의 단일 창구 — 등록·모니터링 역량 필요&lt;/li&gt;&lt;li&gt;산업별 발주 공기업이 분산돼 있어(TANESCO·TANROADS·TPDC 등) 공고 채널을 개별 파악해야 함&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;현장 검증 필요&lt;/h3&gt;&lt;ul class=&quot;plain&quot;&gt;&lt;li&gt;{&amp;#x27;item&amp;#x27;: &amp;#x27;PPRA·PPAA 권한과 현행 법령&amp;#x27;, &amp;#x27;question&amp;#x27;: &amp;#x27;PPA 2023의 감독·이의·상소 조문과 폐지조항을 확인했는가?&amp;#x27;, &amp;#x27;status&amp;#x27;: &amp;#x27;confirmed&amp;#x27;}&lt;/li&gt;&lt;li&gt;{&amp;#x27;item&amp;#x27;: &amp;#x27;NeST·정량요건·보증·예외&amp;#x27;, &amp;#x27;question&amp;#x27;: &amp;#x27;PPR 2024의 전자조달 의무, 부속표, 보증과 예외를 확인했는가?&amp;#x27;, &amp;#x27;status&amp;#x27;: &amp;#x27;confirmed&amp;#x27;}&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;관련 제도&lt;/h3&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;탄자니아 공공조달 입찰제도&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;탄자니아 ODA 사업 발굴·형성 절차&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;법령 원문&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;현장에서 발주처에 그대로 제시할 수 있는 조문 원문입니다. 우리 요약이 아니라 verbatim이며,
    조문 번호를 누르면 원문 문서로 이동합니다. 한국어 요지 아래로 직역(참고용)을 펼칠 수 있습니다.&lt;/p&gt;
  &lt;div class=&quot;quotes&quot;&gt;&lt;div class=&quot;qc&quot;&gt;
  &lt;div class=&quot;qhd&quot;&gt;
    &lt;span class=&quot;qart&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.ppra.go.tz/uploads/documents/en-1736861173-THE%20PUBLIC%20PROCUREMENT%20ACT.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;§8(1)&lt;/a&gt;&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;Public Procurement Act, No. 10 of 2023&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;qtext&quot;&gt;There shall continue to exist an Authority known as the Public Procurement Regulatory Authority.&lt;/div&gt;
  &lt;p class=&quot;qgist&quot;&gt;PPRA는 PPA 2023 아래 계속 존속하며 현행 법정 기능을 수행한다.&lt;/p&gt;
  &lt;details&gt;&lt;summary&gt;한국어 직역(참고 — 공식 번역 아님)&lt;/summary&gt;&lt;p class=&quot;qko&quot;&gt;공공조달규제청(PPRA)이라는 기관을 계속 존속시킨다.&lt;/p&gt;&lt;/details&gt;
&lt;/div&gt;&lt;div class=&quot;qc&quot;&gt;
  &lt;div class=&quot;qhd&quot;&gt;
    &lt;span class=&quot;qart&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.ppra.go.tz/uploads/documents/en-1736861173-THE%20PUBLIC%20PROCUREMENT%20ACT.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;§10(g)&lt;/a&gt;&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;Public Procurement Act, No. 10 of 2023&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;qtext&quot;&gt;organise and maintain a system for the publication of data on public procurement opportunities, awards and any other information of public interest as may be determined by the Authority;&lt;/div&gt;
  &lt;p class=&quot;qgist&quot;&gt;PPRA는 조달기회·낙찰 데이터를 공표하는 시스템(NeST)을 운영한다.&lt;/p&gt;
  &lt;details&gt;&lt;summary&gt;한국어 직역(참고 — 공식 번역 아님)&lt;/summary&gt;&lt;p class=&quot;qko&quot;&gt;PPRA가 정하는 바에 따라 공공조달 기회·낙찰 및 그 밖의 공익 정보를 공표하는 시스템을 조직·운영한다.&lt;/p&gt;&lt;/details&gt;
&lt;/div&gt;&lt;div class=&quot;qc&quot;&gt;
  &lt;div class=&quot;qhd&quot;&gt;
    &lt;span class=&quot;qart&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.ppra.go.tz/uploads/documents/en-1736861173-THE%20PUBLIC%20PROCUREMENT%20ACT.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;§10(h)&lt;/a&gt;&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;Public Procurement Act, No. 10 of 2023&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;qtext&quot;&gt;conduct periodic inspections of the records and proceedings of procuring entities to ensure full and correct application of this Act;&lt;/div&gt;
  &lt;p class=&quot;qgist&quot;&gt;PPRA는 발주기관의 기록·절차를 정기 점검한다 — 감독기관이지 집행기관이 아니다.&lt;/p&gt;
  &lt;details&gt;&lt;summary&gt;한국어 직역(참고 — 공식 번역 아님)&lt;/summary&gt;&lt;p class=&quot;qko&quot;&gt;이 법의 완전하고 정확한 적용을 보장하기 위해 발주기관의 기록과 절차를 정기적으로 점검한다.&lt;/p&gt;&lt;/details&gt;
&lt;/div&gt;&lt;div class=&quot;qc&quot;&gt;
  &lt;div class=&quot;qhd&quot;&gt;
    &lt;span class=&quot;qart&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.ppra.go.tz/uploads/documents/en-1736861173-THE%20PUBLIC%20PROCUREMENT%20ACT.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;§74 (definition)&lt;/a&gt;&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;Public Procurement Act, No. 10 of 2023&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;qtext&quot;&gt;&amp;quot;price cap&amp;quot; means an established minimum and maximum price which shall be charged for particular goods, works or services;&lt;/div&gt;
  &lt;p class=&quot;qgist&quot;&gt;가격상한은 PPRA가 특정 물품·공사·용역의 최소·최대 가격을 정하는 제도다.&lt;/p&gt;
  &lt;details&gt;&lt;summary&gt;한국어 직역(참고 — 공식 번역 아님)&lt;/summary&gt;&lt;p class=&quot;qko&quot;&gt;&amp;#x27;가격상한(price cap)&amp;#x27;이란 특정 물품·공사·용역에 부과되는, 정해진 최소·최대 가격을 말한다.&lt;/p&gt;&lt;/details&gt;
&lt;/div&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;현행 기준 반영 1건&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;공식 법령·기관 원문으로 확인한 현행 기준과 실무 확인사항입니다.
    출처는 각 항목에 연결했으며.&lt;/p&gt;
  &lt;div class=&quot;disc&quot; data-sev=&quot;high&quot;&gt;
  &lt;div class=&quot;top&quot;&gt;
    &lt;span class=&quot;badge bad&quot;&gt;필수 확인&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;탄자니아&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;D01&lt;/span&gt;
  &lt;/div&gt;
  &lt;h3&gt;canvas.legalBasis / PPRA 근거 법령의 현행 여부&lt;/h3&gt;
  &lt;div class=&quot;quote act&quot;&gt;&lt;b&gt;현행 기준&lt;/b&gt;PPRA의 근거 법률이 PPA 2011에서 PPA 2023(2024-06-17 시행)으로 교체됐다. §8은 PPRA를 승계하되, §74(가격상한)·NeST 의무 등 새 권한·의무를 부여한다. PPA 2011은 §131(1)로 폐지됐다.&lt;/div&gt;
  &lt;p class=&quot;cite&quot;&gt;확인 출처 · &lt;a class=&quot;ref&quot; href=&quot;https://www.ppra.go.tz/uploads/documents/en-1736861173-THE%20PUBLIC%20PROCUREMENT%20ACT.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Public Procurement Act, No. 10 of 2023&lt;/a&gt; §8, §74, §131(1)&lt;/p&gt;
  &lt;div class=&quot;todo&quot;&gt;&lt;b&gt;실무 확인&lt;/b&gt;탄자니아 조달 감독체계를 확인할 때 PPA 2023을 기준으로 삼는다. 특히 발주 예정가가 PPRA 가격상한에 걸리는지, NeST 등록이 됐는지를 사전에 점검한다.&lt;/div&gt;
  &lt;details class=&quot;review&quot;&gt;
  &lt;summary&gt;Field verification (English)&lt;/summary&gt;
  &lt;div class=&quot;rv&quot;&gt;
    &lt;p&gt;&lt;b&gt;Current legal basis&lt;/b&gt; — PPA 2023 §8 keeps PPRA in existence but under the new Act; it adds the power to set price caps (§74) and mandatory NeST e-procurement. The 2011 Act was repealed by §131(1).&lt;/p&gt;
    &lt;p class=&quot;rv-verify&quot;&gt;&lt;b&gt;✔ Verify&lt;/b&gt; — Use PPA 2023 as the reference. Check whether the estimated price is subject to a PPRA price cap, and whether the procuring entity is registered/operating on NeST.&lt;/p&gt;
  &lt;/div&gt;
&lt;/details&gt;

  &lt;p class=&quot;act-row&quot;&gt;산출물 반영 — PPA 2023과 PPR 2024를 기준으로 PPRA 기능을 §10에 맞춰 정리하고 가격상한(§74)과 NeST 전자조달 요건을 반영했다.&lt;/p&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;검증&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;PPRA·재무부 공식 공표본에서 PPA 2023과 PPR 2024의 시행·개정·폐지 상태, PPRA·PPAA 권한, NeST 의무, 정량요건·보증·이의·예외를 조문과 부속표 단위로 대조했다.&lt;/p&gt;
  &lt;div class=&quot;cards&quot;&gt;
    &lt;div class=&quot;card span2&quot;&gt;&lt;h3&gt;검증 범위&lt;/h3&gt;
      &lt;p style=&quot;margin:0;font-size:13.5px;line-height:1.7&quot;&gt;PPA 2023 §§1–5, 8–10, 38, 49–86, 112–125, 131과 PPR 2024 regs.1, 9–11, 23–30, 64–65, 78, 107–109, 150–166, 238 및 Sixth·Ninth–Eleventh Schedules를 확인했다.&lt;/p&gt;
      &lt;p style=&quot;margin:12px 0 0;font-size:12.5px;color:var(--muted)&quot;&gt;확인일 2026-07-23 · 자료집 기준일 2026-02-23&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;대조에 쓴 원문&lt;/h3&gt;&lt;ul class=&quot;srcs&quot; style=&quot;padding-left:16px;margin:0&quot;&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.ppra.go.tz/uploads/documents/en-1736861173-THE%20PUBLIC%20PROCUREMENT%20ACT.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;The Public Procurement Act, 2023 (Act No. 10 of 2023) — English Version&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;법률&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;대조 조문 §§1–5, 8–10, 38, 49–86, 112–125, 131(1)–(3)&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-28 · Public Procurement Regulatory Authority (PPRA)&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.mof.go.tz/uploads/documents/en-1758539549-GN%20No.%20261%20OF%202025%20-%20THE%20PUBLIC%20PROCUREMENT%20REGULATIONS%20%20-%20ENGLISH%20VERSION.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;The Public Procurement Regulations, 2024 — English Version&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;시행규칙&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;대조 조문 regs.1, 9–11, 23–30, 64–65, 78, 107–109, 115, 125, 150–166, 238; Sixth, Ninth–Eleventh Schedules&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-28 · Ministry of Finance, United Republic of Tanzania&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.ppra.go.tz/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;PPRA 공식 사이트&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;지침·정책&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-28 · Public Procurement Regulatory Authority&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.mof.go.tz/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;재정기획부 공식 사이트&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;지침·정책&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-28 · Ministry of Finance, Tanzania&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card span2&quot;&gt;&lt;h3&gt;주의&lt;/h3&gt;&lt;p class=&quot;note&quot;&gt;PPRA는 PPA 2011에서 설립됐고 PPA 2023 §8은 &amp;#x27;계속 존속한다(continue to exist)&amp;#x27;로 승계했다. 근거 법률이 교체됐으나 기관 자체는 연속된다.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;PPA 2023 §10은 PPRA 기능을 (a)~(다수) 호로 규정하며, 5개 부서가 관련 기능을 조직적으로 나눠 수행한다.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;가격상한(§74)은 PPRA가 특정 물품·서비스의 최소·최대 가격을 정하는 제도다.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;새 법은 스와힐리어 제정이지만 GN 813/2024는 Interpretation of Laws Act §84(4)에 따른 공식 영문 공표본이다.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;p style=&quot;margin:22px 0 0;font-size:12.5px;color:var(--muted)&quot;&gt;
    조문 대조 완료 — 조문의 존재와 문언 일치만 뜻합니다. 법적 해석·적용 타당성·개정 반영 여부는 별도 검토 대상입니다.
  &lt;/p&gt;
&lt;/section&gt;

/* 엣지 그리기 — 노드 DOM 위치를 재서 SVG로 연결 */
function draw(){
  var board=document.getElementById(&#x27;board&#x27;),svg=document.getElementById(&#x27;edges&#x27;);
  if(!board||!svg)return;
  var bb=board.getBoundingClientRect();
  svg.setAttribute(&#x27;viewBox&#x27;,&#x27;0 0 &#x27;+board.scrollWidth+&#x27; &#x27;+board.scrollHeight);
  svg.setAttribute(&#x27;width&#x27;,board.scrollWidth); svg.setAttribute(&#x27;height&#x27;,board.scrollHeight);
  var cs=getComputedStyle(document.documentElement);
  var C={sequence:cs.getPropertyValue(&#x27;--muted&#x27;).trim(),
         message:cs.getPropertyValue(&#x27;--back&#x27;).trim(),
         loop:cs.getPropertyValue(&#x27;--warn&#x27;).trim()};
  var d=&#x27;&lt;defs&gt;&#x27;;
  [&#x27;sequence&#x27;,&#x27;message&#x27;,&#x27;loop&#x27;].forEach(function(t){
    d+=&#x27;&lt;marker id=&quot;m-&#x27;+t+&#x27;&quot; viewBox=&quot;0 0 8 8&quot; refX=&quot;7&quot; refY=&quot;4&quot; markerWidth=&quot;6&quot; markerHeight=&quot;6&quot; orient=&quot;auto&quot;&gt;&#x27;
      +&#x27;&lt;path d=&quot;M0 0 L8 4 L0 8 z&quot; fill=&quot;&#x27;+C[t]+&#x27;&quot;/&gt;&lt;/marker&gt;&#x27;;
  });
  d+=&#x27;&lt;/defs&gt;&#x27;;
  var GAP=5;
  function rel(rc){return {x:rc.left-bb.left+board.scrollLeft, y:rc.top-bb.top+board.scrollTop,
                            r:rc.right-bb.left+board.scrollLeft, b:rc.bottom-bb.top+board.scrollTop,
                            w:rc.width, h:rc.height};}
  function box(id){
    var el=board.querySelector(&#x27;.node[data-id=&quot;&#x27;+id+&#x27;&quot;]&#x27;);
    if(!el)return null; return rel(el.getBoundingClientRect());
  }

  /* 라우팅은 korea100studio의 거터 라우팅을 우리 그리드에 이식한 것이다.
     핵심: 카드를 지나야 하는 선은 카드가 없는 거터(행 하단·열 측면)로 우회한다.
     DOM에서 노드·행·열을 실측할 수 있어, 여러 직교 경로 후보를 만들고
     무관한 카드를 가장 적게 관통하는(동수면 가장 짧은) 것을 고른다. */

  // 장애물(모든 노드)과 거터(노드 없는 띠) 실측
  var OB=[];
  board.querySelectorAll(&#x27;.node&#x27;).forEach(function(el){ var r=box(el.dataset.id); r.id=el.dataset.id; OB.push(r); });
  var rowGut=[], colGut=[];
  board.querySelectorAll(&#x27;.brow:not(.head)&#x27;).forEach(function(el){ var r=rel(el.getBoundingClientRect());
    rowGut.push(r.y+9); rowGut.push(r.b-9); });
  var hc=board.querySelectorAll(&#x27;.brow.head .bcell&#x27;);
  for(var i=1;i&lt;hc.length;i++){ var r=rel(hc[i].getBoundingClientRect()); colGut.push(r.x+11); colGut.push(r.r-11); }

  function segHit(ax,ay,bx,by,e1,e2){
    var n=0, M=3;
    for(var i=0;i&lt;OB.length;i++){ var o=OB[i]; if(o.id===e1||o.id===e2) continue;
      var L=o.x+M,R=o.r-M,T=o.y+M,B=o.b-M;
      if(Math.abs(ay-by)&lt;0.5){ if(ay&gt;T&amp;&amp;ay&lt;B &amp;&amp; Math.max(ax,bx)&gt;L &amp;&amp; Math.min(ax,bx)&lt;R) n++; }
      else { if(ax&gt;L&amp;&amp;ax&lt;R &amp;&amp; Math.max(ay,by)&gt;T &amp;&amp; Math.min(ay,by)&lt;B) n++; }
    } return n;
  }
  function uniq(pts){ return pts.filter(function(p,i){ return i===0 || Math.abs(p.x-pts[i-1].x)&gt;0.5 || Math.abs(p.y-pts[i-1].y)&gt;0.5; }); }
  function score(pts,e1,e2){ pts=uniq(pts); var p=0,l=0;
    for(var i=0;i&lt;pts.length-1;i++){ p+=segHit(pts[i].x,pts[i].y,pts[i+1].x,pts[i+1].y,e1,e2);
      l+=Math.abs(pts[i].x-pts[i+1].x)+Math.abs(pts[i].y-pts[i+1].y); }
    return {pts:pts,p:p,l:l}; }

  function route(a,b,ed){
    var acx=a.x+a.w/2,acy=a.y+a.h/2,bcx=b.x+b.w/2,bcy=b.y+b.h/2, e1=ed.source,e2=ed.target, cs=[];
    // 세로 계열 — a의 위/아래 변에서 나가 b의 위/아래 변으로
    var below=bcy&gt;acy, sp={x:acx,y:below?a.b:a.y}, tp={x:bcx,y:below?b.y:b.b}, tg={x:tp.x,y:tp.y+(below?-GAP:GAP)};
    cs.push(score([sp,{x:sp.x,y:tg.y},tg,tp],e1,e2));                                   // 직선/L
    rowGut.forEach(function(my){ if(my&gt;Math.min(sp.y,tp.y)+6&amp;&amp;my&lt;Math.max(sp.y,tp.y)-6)   // 행 거터 크로스
      cs.push(score([sp,{x:sp.x,y:my},{x:tp.x,y:my},tg,tp],e1,e2)); });
    colGut.forEach(function(gx){                                                          // 열 측면 탈출
      var as={x:gx&gt;acx?a.r:a.x,y:acy};
      cs.push(score([as,{x:gx,y:acy},{x:gx,y:tg.y},tg,tp],e1,e2)); });
    // 가로 계열 — a의 좌/우 변에서 나가 b의 좌/우 변으로
    var right=bcx&gt;acx, sp2={x:right?a.r:a.x,y:acy}, tp2={x:right?b.x:b.r,y:bcy}, tg2={x:tp2.x+(right?-GAP:GAP),y:tp2.y};
    cs.push(score([sp2,{x:tg2.x,y:sp2.y},tg2,tp2],e1,e2));
    colGut.forEach(function(mx){ if(mx&gt;Math.min(sp2.x,tp2.x)+6&amp;&amp;mx&lt;Math.max(sp2.x,tp2.x)-6)
      cs.push(score([sp2,{x:mx,y:sp2.y},{x:mx,y:tp2.y},tg2,tp2],e1,e2)); });
    rowGut.forEach(function(gy){                                                          // 행 거터 우회
      var as={x:acx,y:gy&gt;acy?a.b:a.y};
      cs.push(score([as,{x:acx,y:gy},{x:tp2.x,y:gy},tg2,tp2],e1,e2)); });
    // 회귀선 — 아래로 크게 우회 (되돌아가는 흐름을 시각적으로 구분)
    if(ed.type===&#x27;loop&#x27;){ var gy=Math.max(a.b,b.b)+26;
      cs.push(score([{x:acx,y:a.b},{x:acx,y:gy},{x:bcx,y:gy},{x:bcx,y:b.b+GAP},{x:bcx,y:b.b}],e1,e2)); }
    cs=cs.filter(function(c){return c.pts.length&gt;=2;});
    cs.sort(function(x,y){ return x.p-y.p || x.l-y.l; });
    return cs[0];
  }

  function rnd(v){return Math.round(v*10)/10;}
  function orthPath(pts){                    // 직교 경로 + 모서리 라운딩
    pts=uniq(pts); if(pts.length&lt;2)return &#x27;&#x27;;
    var d=&#x27;M&#x27;+rnd(pts[0].x)+&#x27; &#x27;+rnd(pts[0].y);
    for(var i=1;i&lt;pts.length-1;i++){
      var p=pts[i-1],c=pts[i],n=pts[i+1];
      var d1=Math.hypot(c.x-p.x,c.y-p.y)||1, d2=Math.hypot(n.x-c.x,n.y-c.y)||1, r=Math.min(7,d1/2,d2/2);
      d+=&#x27; L&#x27;+rnd(c.x-(c.x-p.x)/d1*r)+&#x27; &#x27;+rnd(c.y-(c.y-p.y)/d1*r);
      d+=&#x27; Q&#x27;+rnd(c.x)+&#x27; &#x27;+rnd(c.y)+&#x27; &#x27;+rnd(c.x+(n.x-c.x)/d2*r)+&#x27; &#x27;+rnd(c.y+(n.y-c.y)/d2*r);
    }
    var e=pts[pts.length-1]; return d+&#x27; L&#x27;+rnd(e.x)+&#x27; &#x27;+rnd(e.y);
  }

  EDGES.forEach(function(ed){
    var a=box(ed.source),b=box(ed.target); if(!a||!b)return;
    var t=ed.type||&#x27;sequence&#x27;, rt=route(a,b,ed);
    d+=&#x27;&lt;path d=&quot;&#x27;+orthPath(rt.pts)+&#x27;&quot; fill=&quot;none&quot; stroke=&quot;&#x27;+C[t]+&#x27;&quot; stroke-width=&quot;1.5&quot; opacity=&quot;&#x27;
      +(t===&#x27;sequence&#x27;?&#x27;.55&#x27;:&#x27;.8&#x27;)+&#x27;&quot;&#x27;+(t!==&#x27;sequence&#x27;?&#x27; stroke-dasharray=&quot;4 3&quot;&#x27;:&#x27;&#x27;)
      +&#x27; marker-end=&quot;url(#m-&#x27;+t+&#x27;)&quot;/&gt;&#x27;;
  });
  svg.innerHTML=d;
}

var KIND={&quot;act&quot;: &quot;법률&quot;, &quot;regulation&quot;: &quot;시행규칙&quot;, &quot;ordinance&quot;: &quot;명령·조례&quot;, &quot;directive&quot;: &quot;지침·정책&quot;, &quot;standard-document&quot;: &quot;표준문서&quot;, &quot;treaty-agreement&quot;: &quot;양자합의&quot;, &quot;donor-rule&quot;: &quot;공여기관 규정&quot;, &quot;practice&quot;: &quot;현장 관행&quot;};
function openNode(id){
  var n=NODES[id]; if(!n)return;
  var h=&#x27;&lt;span class=&quot;badge plain muted&quot;&gt;&#x27;+n.id+&#x27;&lt;/span&gt; &#x27;
       +&#x27;&lt;span class=&quot;badge plain muted&quot;&gt;&#x27;+n.lane+&#x27;&lt;/span&gt; &#x27;
       +&#x27;&lt;span class=&quot;badge plain muted&quot;&gt;&#x27;+n.stage+&#x27;&lt;/span&gt;&#x27;;
  h+=&#x27;&lt;h3&gt;&#x27;+n.name+&#x27;&lt;/h3&gt;&#x27;;
  h+=&#x27;&lt;dl class=&quot;kv&quot;&gt;&#x27;;
  h+=&#x27;&lt;dt&gt;담당&lt;/dt&gt;&lt;dd&gt;&#x27;+n.actor+&#x27;&lt;/dd&gt;&#x27;;
  if(n.action) h+=&#x27;&lt;dt&gt;내용&lt;/dt&gt;&lt;dd&gt;&#x27;+n.action+&#x27;&lt;/dd&gt;&#x27;;
  if(n.deadline) h+=&#x27;&lt;dt&gt;기한&lt;/dt&gt;&lt;dd&gt;&#x27;+n.deadline+&#x27;&lt;/dd&gt;&#x27;;
  if(n.output_documents&amp;&amp;n.output_documents.length)
    h+=&#x27;&lt;dt&gt;산출 문서&lt;/dt&gt;&lt;dd&gt;&#x27;+n.output_documents.join(&#x27; · &#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  if(n.blocker) h+=&#x27;&lt;dt&gt;병목&lt;/dt&gt;&lt;dd style=&quot;color:var(--warn)&quot;&gt;&#x27;+n.blocker+&#x27;&lt;/dd&gt;&#x27;;
  if(n.legal_basis&amp;&amp;n.legal_basis.length){
    h+=&#x27;&lt;dt&gt;근거 조문&lt;/dt&gt;&lt;dd&gt;&#x27;+n.legal_basis.map(function(l){
      var nm=l.url?&#x27;&lt;a class=&quot;ref&quot; href=&quot;&#x27;+l.url+&#x27;&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;&#x27;+l.law+&#x27;&lt;/a&gt;&#x27;:l.law;
      return &#x27;&lt;div style=&quot;margin-bottom:4px&quot;&gt;&#x27;+nm+&#x27; &lt;code&gt;&#x27;+l.article+&#x27;&lt;/code&gt;&lt;/div&gt;&#x27;;}).join(&#x27;&#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  }
  if(typeof n.confidence===&#x27;number&#x27;){
    h+=&#x27;&lt;dt&gt;법령 근거 확신도&lt;/dt&gt;&lt;dd&gt;&#x27;+n.confidence.toFixed(2)
      +(n.confidence&lt;0.8?&#x27; &lt;span class=&quot;badge warn&quot;&gt;현장 검증 필요&lt;/span&gt;&#x27;:&#x27;&#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  }
  if(n.confidence_reason) h+=&#x27;&lt;dt&gt;확신도 산정 근거&lt;/dt&gt;&lt;dd&gt;&#x27;+n.confidence_reason+&#x27;&lt;/dd&gt;&#x27;;
  var ins=EDGES.filter(function(x){return x.target===id}),
      outs=EDGES.filter(function(x){return x.source===id});
  if(ins.length) h+=&#x27;&lt;dt&gt;선행&lt;/dt&gt;&lt;dd&gt;&#x27;+ins.map(function(x){
    return (NODES[x.source]?NODES[x.source].name:x.source)+(x.label?&#x27; (&#x27;+x.label+&#x27;)&#x27;:&#x27;&#x27;);}).join(&#x27; · &#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  if(outs.length) h+=&#x27;&lt;dt&gt;후속&lt;/dt&gt;&lt;dd&gt;&#x27;+outs.map(function(x){
    return (NODES[x.target]?NODES[x.target].name:x.target)+(x.label?&#x27; (&#x27;+x.label+&#x27;)&#x27;:&#x27;&#x27;);}).join(&#x27; · &#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  h+=&#x27;&lt;/dl&gt;&#x27;;
  document.getElementById(&#x27;dbody&#x27;).innerHTML=h;
  document.getElementById(&#x27;dlg&#x27;).showModal();
}

document.querySelectorAll(&#x27;.node&#x27;).forEach(function(b){

table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line)}
td{padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--soft)}
td.no{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;width:44px}
td.name a{font-weight:700;text-decoration:none;letter-spacing:-.01em}
td.name a:hover{text-decoration:underline}
td.name p{margin:3px 0 0;color:var(--muted);font-size:12.5px;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{padding:40px 16px;text-align:center;color:var(--muted);font-size:14px}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;
  padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.badge::before{content:&quot;&quot;;width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.plain::before{display:none}
.badge.ok{background:var(--key-bg);color:var(--key)}
.badge.info{background:var(--info-bg);color:var(--info)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.bad{background:var(--bad-bg);color:var(--bad)}
.badge.muted{background:var(--soft);color:var(--muted)}

.subnav{border-bottom:1px solid var(--line);background:var(--soft)}
.subnav .wrap{display:flex;align-items:center;gap:12px;padding-block:12px;flex-wrap:wrap}
.subnav label{font-size:12px;color:var(--muted)}
select,.btn{font:inherit;font-size:13.5px;color:inherit;background:var(--bg);
  border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
.btn:hover{background:var(--soft)}
.btn[disabled]{opacity:.4;cursor:default}
.pos{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}

.dtl-hd{padding:26px 0 20px}
.dtl-hd .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dtl-hd h1{font-size:clamp(24px,3.4vw,36px);margin:12px 0 8px}
.dtl-hd .one{color:var(--muted);font-size:15.5px;max-width:78ch;margin:0}
.tiles{display:flex;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;
  margin-top:22px;width:fit-content;max-width:100%;flex-wrap:wrap}
.tile{padding:14px 22px;border-right:1px solid var(--line);min-width:104px}
.tile:last-child{border-right:0}
.tile b{display:block;font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.25}
.tile span{font-size:11.5px;color:var(--muted)}
.tile.ok b{color:var(--key)} .tile.warn b{color:var(--warn)} .tile.bad b{color:var(--bad)}

section.blk{padding:34px 0;border-top:1px solid var(--line)}
section.blk &gt; h2{font-size:21px;letter-spacing:-.02em;margin:0 0 6px;font-weight:800}
section.blk &gt; .desc{color:var(--muted);font-size:13.5px;margin:0 0 20px}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.hd-row{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.hd-row .legend{margin-left:auto}

.boardwrap{position:relative;border:1px solid var(--line);border-radius:12px;overflow:auto}
.board{position:relative;min-width:940px}
.board svg.edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.brow{display:grid;border-bottom:1px solid var(--line)}
.brow:last-child{border-bottom:0}
.brow.head{background:var(--soft);position:sticky;top:0;z-index:3}
/* gap은 같은 셀에 세로로 쌓인 노드 사이로 화살표가 지나갈 통로다. 좁히면 화살촉이 뭉갠다. */
.bcell{padding:14px 12px;border-right:1px solid var(--line);min-height:64px;
  display:flex;flex-direction:column;gap:26px;justify-content:center}
.bcell:last-child{border-right:0}
.brow.head .bcell{min-height:0;padding:11px 12px;justify-content:flex-start}
.stage-k{font-weight:800;font-size:12px;color:var(--key);letter-spacing:.02em}
.stage-t{font-size:13px;font-weight:700}
.lane-t{font-size:13px;font-weight:700;color:var(--muted)}
.node{position:relative;z-index:2;background:var(--bg);border:1px solid var(--line);
  border-radius:9px;padding:10px 12px;cursor:pointer;text-align:left;font:inherit;color:inherit;
  width:100%;display:block;transition:box-shadow .12s,border-color .12s}
.node:hover{border-color:var(--muted);box-shadow:0 2px 10px rgba(0,0,0,.07)}
.node .id{font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.04em;
  display:flex;justify-content:space-between;align-items:center;gap:8px}
.node .nm{font-size:13px;font-weight:700;margin-top:3px;letter-spacing:-.01em;line-height:1.4}
.node .tag{font-size:10px;font-weight:700;padding:1px 6px;border-radius:999px}
.node[data-tone=&quot;key&quot;]{border-color:var(--key);background:var(--key-bg)}
.node[data-tone=&quot;key&quot;] .tag{background:var(--key);color:var(--bg)}
.node[data-tone=&quot;warn&quot;]{border-color:var(--warn);background:var(--warn-bg)}
.node[data-tone=&quot;warn&quot;] .tag{background:var(--warn);color:var(--bg)}
.node[data-tone=&quot;back&quot;]{border-color:var(--back);background:var(--back-bg)}
.node[data-tone=&quot;back&quot;] .tag{background:var(--back);color:var(--bg)}
.node.dim{opacity:.34}

.drawer{position:fixed;inset:0;z-index:100;display:none;width:100vw;height:100vh;
  max-width:100vw;max-height:100vh;margin:0;padding:0;border:0;background:transparent;overflow:hidden}
.drawer[open]{display:block}
.drawer::backdrop{background:rgba(0,0,0,.34)}
.drawer .pane{position:absolute;right:0;top:0;bottom:0;width:min(440px,92vw);background:var(--bg);
  border-left:1px solid var(--line);padding:24px;overflow:auto}
.drawer h3{margin:10px 0 4px;font-size:19px;letter-spacing:-.02em}
.drawer .close{position:absolute;right:18px;top:18px;background:none;border:0;color:var(--muted);
  font-size:22px;cursor:pointer;line-height:1;padding:4px}
.kv{margin:18px 0 0;font-size:13.5px}
.kv dt{font-size:11.5px;color:var(--muted);font-weight:700;margin-top:14px}
.kv dd{margin:3px 0 0}
.kv code{font-size:12.5px;background:var(--soft);padding:1px 6px;border-radius:4px}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}
.card{border:1px solid var(--line);border-radius:11px;padding:17px 19px}
.card h3{margin:0 0 11px;font-size:13.5px;letter-spacing:.01em}
.card.span2{grid-column:span 2}
@media (max-width:820px){.card.span2{grid-column:span 1}}
ol.steps{margin:0;padding-left:20px;font-size:13.5px;line-height:1.75}
ol.steps li{margin-bottom:5px}
ul.plain{margin:0;padding-left:18px;font-size:13.5px;line-height:1.7}
ul.plain li{margin-bottom:6px}
.law{display:flex;gap:9px;align-items:baseline;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.law:last-child{border-bottom:0}
.law .nm{font-weight:600}
.law .ar{color:var(--muted);font-size:12.5px}
.docset{margin-bottom:13px}
.docset b{font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:12px;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:3px 8px}
.auth{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.auth:last-child{border-bottom:0}
.auth b{flex:none;max-width:42%;font-size:13px}
.auth span{color:var(--muted);font-size:12.5px}

.disc{border:1px solid var(--line);border-left-width:4px;border-radius:10px;padding:17px 19px;margin-bottom:15px}
.disc[data-sev=&quot;high&quot;]{border-left-color:var(--bad)}
.disc[data-sev=&quot;medium&quot;]{border-left-color:var(--warn)}
.disc[data-sev=&quot;low&quot;]{border-left-color:var(--muted)}
.disc .top{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:9px}
.disc .top .badge{white-space:normal;max-width:100%;overflow-wrap:anywhere}
.disc h3{margin:0;font-size:14.5px;letter-spacing:-.01em}
.disc .quote{font-size:13px;margin:9px 0;padding:10px 13px;border-radius:8px;background:var(--soft);line-height:1.65}
.disc .quote b{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;letter-spacing:.02em}
.disc .quote.src{border-left:2px solid var(--muted)}
.disc .quote.act{border-left:2px solid var(--key)}
.disc .cite{font-size:12px;color:var(--muted);margin:8px 0 0}
.disc .impact{font-size:13.5px;margin:11px 0 0;line-height:1.7}
.disc .act-row{font-size:13px;margin:11px 0 0;padding-top:11px;border-top:1px dashed var(--line);color:var(--muted)}
.review{margin:11px 0 0;border:1px solid var(--info);border-radius:8px;background:var(--info-bg)}
.review summary{cursor:pointer;padding:9px 13px;font-size:12px;font-weight:700;color:var(--info);list-style:none}
.review summary::-webkit-details-marker{display:none}
.review summary::before{content:&quot;▸ &quot;;font-size:10px}
.review[open] summary::before{content:&quot;▾ &quot;}
.review .rv{padding:2px 13px 13px}
.review .rv p{font-size:13px;line-height:1.65;margin:8px 0 0}
.review .rv-topic{font-weight:700;font-size:13.5px}
.review .rv-verify{padding:9px 11px;border-radius:6px;background:var(--bg);border:1px dashed var(--info)}
.fieldcheck{margin:11px 0 0;padding:11px 13px;border-radius:8px;background:var(--soft);border:1px solid var(--line)}
.fieldcheck .fc-hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.fieldcheck .fc-find{font-size:13px;line-height:1.7;margin:0}
.todo{margin:13px 0 0;padding:12px 14px;border-radius:9px;background:var(--key-bg);
  border:1px solid var(--key);font-size:13.5px;line-height:1.7}
.todo b{display:block;font-size:11px;color:var(--key);letter-spacing:.03em;margin-bottom:4px}
.up{margin:11px 0 0;padding:12px 14px;border-radius:9px;background:var(--soft);border:1px solid var(--line)}
.up .hd{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:7px}
.up .hd b{font-size:11px;color:var(--muted);letter-spacing:.03em}
.up .txt{font-size:13px;line-height:1.7;padding:9px 12px;border-radius:7px;background:var(--bg);
  border:1px dashed var(--line)}
.up .txt i{display:block;font-style:normal;font-size:10.5px;color:var(--muted);margin-bottom:3px}

.quotes{display:flex;flex-direction:column;gap:14px}
.qc{border:1px solid var(--line);border-left:3px solid var(--info);border-radius:9px;padding:15px 17px}
.qc .qhd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:9px}
.qc .qart{font-weight:700;font-size:13px}
.qc .qtext{font-family:ui-monospace,&quot;SF Mono&quot;,Menlo,monospace;font-size:12.5px;line-height:1.7;
  background:var(--soft);border-radius:7px;padding:11px 13px;white-space:pre-wrap;word-break:break-word}
.qc .qgist{font-size:13.5px;line-height:1.7;margin:10px 0 0}
.qc details{margin:8px 0 0}
.qc summary{font-size:12px;color:var(--muted);cursor:pointer;list-style:none}
.qc summary::-webkit-details-marker{display:none}
.qc summary::before{content:&quot;▸ &quot;;font-size:10px}
.qc details[open] summary::before{content:&quot;▾ &quot;}
.qc .qko{font-size:13px;line-height:1.7;color:var(--muted);margin:7px 0 0;padding-left:12px;border-left:1px solid var(--line)}
.srcs{font-size:13.5px}
.srcs li{margin-bottom:9px}
.srcs a{color:var(--info)}
.srcs .ar{display:block;color:var(--muted);font-size:12px;margin-top:1px}
.note{font-size:13.5px;line-height:1.7;color:var(--muted);margin:0 0 8px;padding-left:15px;position:relative}
.note::before{content:&quot;·&quot;;position:absolute;left:4px}

footer.site{border-top:1px solid var(--line);padding:28px 0 46px;color:var(--muted);font-size:12.5px;line-height:1.8}
footer.site a{color:var(--muted)}
