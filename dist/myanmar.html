&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;한 장 캔버스&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;설계·시공 자격, 기술검사와 공사보험, 착공·중간검사·변경관리, 준공·소방·사용승인과 운영 인계조건을 확인하는 제도축&lt;/p&gt;
  &lt;div class=&quot;cards&quot;&gt;
    &lt;div class=&quot;card span2&quot;&gt;&lt;h3&gt;국가별 건축 인허가 절차 · 10단계&lt;/h3&gt;&lt;p class=&quot;workflow-disclosure&quot;&gt;해당 국가의 법령·관할기관 공식자료에서 확인한 신청·심사·보완·결정 절차를 표시한다. 업무구조도와 노드 상세에는 국가 절차만 두고, ODA 조사팀의 사업별 확인질문은 페이지 하단의 별도 접이식 목록으로 분리한다.&lt;/p&gt;&lt;p class=&quot;workflow-disclosure&quot;&gt;&lt;b&gt;적용 범위&lt;/b&gt; · MNBC Part 1 Sections 1.3.4-1.3.5와 YCDC Manual Sections 9-10의 착공통지, 단계검사·부적합통지(NFA) 시정·검사승인통지, BCC-001·합동검사·BCC-002 절차다.&lt;/p&gt;&lt;ol class=&quot;steps&quot;&gt;&lt;li&gt;B01 착공·굴착·말뚝 공사통지 제출 — 허가보유자와 등록전문가가 공사유형에 맞는 NC-001, NC-002 또는 NC-003을 허가기관에 제출하고 BP-003·승인도서를 현장에 비치한다. / 산출물: 착공통지·유효 건축허가·현장 승인도서&lt;/li&gt;&lt;li&gt;B02 승인설계 시공·검사중지점(Hold Point) 통지 — 등록전문가가 승인도서에 따라 공사를 감독하고 각 법정 검사공정이 노출·접근 가능한 상태에서 NI-001 또는 관할 구 지시 NI-002로 검사를 요청한다. / 산출물: 시공감독 기록·공정검사 통지&lt;/li&gt;&lt;li&gt;B03 담당부서·승인검사기관 단계별 현장검사 — 담당부서와 위험등급상 필요한 승인검사기관이 계획·개발, 굴착·말뚝·구조·설비 등 단계별 현장을 검사하고 전자 checklist와 검사기록을 작성한다. / 산출물: 단계검사 점검표(checklist)·적합 또는 불일치 기록&lt;/li&gt;&lt;li&gt;B04 부적합통지 불일치 시정·재검사 요청 — 검사 불일치에 대한 NFA-001/002를 받으면 허가보유자·전문가가 해당 공정을 시정하고 덮거나 후속공정을 진행하기 전에 재검사를 요청한다. / 산출물: 시정공사·부적합통지 답변·재검사 기록&lt;/li&gt;&lt;li&gt;B05 검사승인통지서 NIA-001 승인·후속공정 해제 — 검사결과 적합하면 허가기관이 Notification of Inspection Approval(NIA-001)을 발행해 해당 Hold Point 이후 공사를 허용하고, 다음 검사공정까지 같은 절차를 반복한다. / 산출물: 검사승인통지서 NIA-001·공정승인·후속검사 조건&lt;/li&gt;&lt;li&gt;B06 BCC-001·준공도면·관계기관 증명 제출 — 공사완료 후 등록전문가가 BCC-001, 준공도면 건축·구조·설비도서와 해당 세무·승강기·전력·소방 등 관계기관 추천서·증명서를 허가기관에 제출한다. / 산출물: BCC-001·준공도면·관계기관 증명·접수번호&lt;/li&gt;&lt;li&gt;B07 준공증명 완비확인·검사수수료 고지 — 담당부서 담당자가 BCC 신청과 첨부의 완비성을 확인하고 완비 시 Scrutinization Fees Invoice를 전자 발행해 납부 후 합동검사를 배정한다. / 산출물: 준공증명 완비확인·수수료 납부·검사일정&lt;/li&gt;&lt;li&gt;B08 합동 준공검사 — 담당부서, 소방, 상수도·배수하수 부서와 위험등급상 필요한 기관이 현장을 방문해 준공도면, 허가조건, 화재·물·오수·구조 적합성을 합동검사한다. / 산출물: 합동 준공검사 점검표·기관증명·판정&lt;/li&gt;&lt;li&gt;B09 준공불일치 준공증명 보완·재검사 — 합동검사에서 도면·현장·증명 불일치가 확인되면 건축주와 전문자가 시정공사·수정 준공도면·추가증명을 제출해 관련 기관 재검사를 받는다. / 산출물: 시정공사·수정 준공도면·재검사 기록&lt;/li&gt;&lt;li&gt;B10 준공증명서 BCC-002 발급·사용승인 또는 거부 — 허가기관이 합동검사 적합과 완비증명을 확인해 Building Completion Certificate BCC-002에 허가번호·주소·소유자·용도·조건을 기재해 발급하며, 미시정이면 거부한다. BCC 전 사용·점유는 금지된다. / 산출물: BCC-002·승인용도·조건 또는 거부결정&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
    &lt;div class=&quot;card span2&quot;&gt;&lt;h3&gt;공식 결정 Gate · 1개&lt;/h3&gt;&lt;p class=&quot;workflow-disclosure&quot;&gt;위 절차 중 관할기관이 공식 문서를 발급하거나 처분하는 결정 지점만 분리했습니다. Gate 1/N은 이 페이지 안의 표시번호이며, 관할·사업별 적용조건과 근거 수준은 각 Gate에서 확인합니다.&lt;/p&gt;&lt;ol class=&quot;official-gates&quot;&gt;&lt;li class=&quot;official-gate&quot; data-source-order=&quot;4&quot;&gt;&lt;div class=&quot;gate-title&quot;&gt;&lt;span class=&quot;badge info&quot;&gt;Gate 1/1&lt;/span&gt;&lt;b&gt;YCDC 건축물준공증명서 공식결정&lt;/b&gt;&lt;/div&gt;&lt;p&gt;합동 준공검사와 준공도면·관계기관 증명을 확인해 BCC-002를 발급하거나 거부한다.&lt;/p&gt;&lt;dl class=&quot;gate-meta&quot;&gt;&lt;dt&gt;결정기관&lt;/dt&gt;&lt;dd&gt;관할 결정기관 확인 필요&lt;/dd&gt;&lt;dt&gt;적용 관할·조건&lt;/dt&gt;&lt;dd&gt;관할 건축허가를 받아 공사하며 검사·준공증명·점유통제를 적용받는 건축물&lt;/dd&gt;&lt;dt&gt;산출물&lt;/dt&gt;&lt;dd&gt;BCC-002·승인용도 또는 거부결정&lt;/dd&gt;&lt;dt&gt;근거 수준&lt;/dt&gt;&lt;dd&gt;노드 직접근거&lt;/dd&gt;&lt;dt&gt;연결 근거&lt;/dt&gt;&lt;dd&gt;&lt;span class=&quot;gate-basis&quot;&gt;&lt;span class=&quot;law-name&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://myanmar.gov.mm/documents/20143/0/PART%2B1%2B%26%2B2%2B%28English%29.pdf/5fd95195-d191-e6fa-a37a-61599bbbd611?t=1752644199338&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;미얀마 국가건축기준 2025 제1·2부(계획·건축행정 및 건축·도시설계)&lt;/a&gt;&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot;&gt;법전·코드&lt;/span&gt;&lt;span class=&quot;badge ok&quot;&gt;조문 대조 완료&lt;/span&gt;&lt;/span&gt;&lt;/dd&gt;&lt;/dl&gt;&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;적용 대상&lt;/h3&gt;&lt;p style=&quot;margin:0;font-size:13.5px;line-height:1.7&quot;&gt;관할 건축허가를 받아 공사하며 검사·준공증명·점유통제를 적용받는 건축물&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;법적 근거&lt;/h3&gt;&lt;div class=&quot;law&quot;&gt;&lt;div class=&quot;law-copy&quot;&gt;&lt;span class=&quot;nm&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://myanmar.gov.mm/documents/20143/0/PART%2B1%2B%26%2B2%2B%28English%29.pdf/5fd95195-d191-e6fa-a37a-61599bbbd611?t=1752644199338&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;미얀마 국가건축기준 2025 제1·2부(계획·건축행정 및 건축·도시설계)&lt;/a&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;Sections 1.3.1-1.3.5&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;law-meta&quot;&gt;&lt;span class=&quot;badge plain muted&quot;&gt;법전·코드&lt;/span&gt;&lt;span class=&quot;badge ok&quot;&gt;조문 대조 완료&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;law&quot;&gt;&lt;div class=&quot;law-copy&quot;&gt;&lt;span class=&quot;nm&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.myanmar.gov.mm/documents/20143/0/PART%2B6%2C7.pdf/2843a6c7-6d90-bec0-00a3-638202a1709d?t=1752567164166&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;미얀마 국가건축기준 2025 제6·7부(재료·시공관리·안전·유지관리)&lt;/a&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;Part 7 Sections 7.5.1.6-7.5.1.6.2&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;law-meta&quot;&gt;&lt;span class=&quot;badge plain muted&quot;&gt;법전·코드&lt;/span&gt;&lt;span class=&quot;badge ok&quot;&gt;조문 대조 완료&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;


    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;권한 기관&lt;/h3&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.myanmar.gov.mm/web/guest/construction/document&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;건설부&lt;/a&gt;&lt;/b&gt;&lt;span&gt;Myanmar National Building Code와 국가 건축·도시 기술기준을 발간 &lt;span class=&quot;badge info&quot;&gt;공식자료 연결&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;관할 개발계획·건축당국 또는 도시/개발위원회&lt;/b&gt;&lt;span&gt;지역 법에 따라 planning/development permit, 건축허가(building permit), 검사와 준공·점유증명을 집행 &lt;span class=&quot;badge info&quot;&gt;공식자료 연결&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;등록전문가 심의기관·승인검사기관·소방국&lt;/b&gt;&lt;span&gt;설계·감리 전문자격, 시험·검사와 건축물 화재안전 확인을 담당 &lt;span class=&quot;badge info&quot;&gt;공식자료 연결&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;&lt;a class=&quot;ref&quot; href=&quot;https://ycdc.gov.mm/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;양곤도시개발위원회 도시계획·건축기술 부서&lt;/a&gt;&lt;/b&gt;&lt;span&gt;양곤시 개발허가, YBPS 건축허가, 공정검사와 건축준공증명(BCC)을 집행 &lt;span class=&quot;badge info&quot;&gt;공식자료 연결&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;이해관계자&lt;/h3&gt;&lt;p style=&quot;margin:0;font-size:13.5px;line-height:1.7&quot;&gt;건설부, 관할 개발계획·건축당국 또는 도시/개발위원회, 등록전문가 심의기관·승인검사기관·소방국, 양곤도시개발위원회 도시계획·건축기술 부서&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;제출서류&lt;/h3&gt;&lt;div class=&quot;docset&quot;&gt;&lt;b&gt;04 YCDC 건축물준공증명서 공식결정&lt;/b&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;BCC-002·승인용도 또는 거부결정&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;


    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;관련 제도&lt;/h3&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;미얀마 공공조달 입찰제도&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;미얀마 조달 거버넌스·감독체계&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;미얀마 ODA 사업 발굴·형성 절차&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;미얀마 도시계획·부지규제&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;미얀마 건축허가·환경심사&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;details class=&quot;card field-application&quot;&gt;&lt;summary&gt;&lt;span&gt;ODA 사업별 적용 확인사항&lt;/span&gt;&lt;small&gt;법정절차 외 체크리스트 · 6개&lt;/small&gt;&lt;/summary&gt;&lt;div class=&quot;field-application-body&quot;&gt;&lt;p class=&quot;workflow-disclosure&quot;&gt;아래 항목은 해당 국가의 법정 절차가 아니라 대상 사업의 관할·필지·시설 조건을 확정하기 위한 조사 체크리스트입니다. 업무구조도와 공식 결정 Gate에는 포함하지 않습니다.&lt;/p&gt;&lt;ul class=&quot;plain&quot;&gt;&lt;li&gt;시장조사: 현지 등록 설계자·시공자·검사기관·보험사의 자격과 유효기간을 감독기관에서 대조한다. → 적격기관·보험 대장&lt;/li&gt;&lt;li&gt;기관협의: 착공통지, 중간검사, 준공도서, 소방·사용승인과 개장 조건을 순서대로 확인한다. → 검사·준공·개장 Hold Point 표&lt;/li&gt;&lt;li&gt;보고서 반영: 기술검사·보험·준공제도의 확인·미확인·조건부 항목을 분리하고 근거문서 번호와 설계·일정·예산 영향을 연결한다. → 기술검사·보험·준공제도 근거대장·보고서 반영표&lt;/li&gt;&lt;li&gt;현지 등록전문가·검사기관·소방·보험과 Building Completion/점유허가서의 실제 서류·비용·기간은 무엇인가? — 영향: 조달 패키지, 품질책임, 보험료, 검사 Hold Point와 개장 가능일을 결정한다.; 담당 수원기관·현지 건축전문가; 확인기관 관할 개발계획·건축당국 또는 도시/개발위원회, 등록전문가 심의기관·승인검사기관·소방국, 건설부; 필요 증빙 현지 등록 건축사·구조/설비기술자·시공자·검사기관 자격, 착공통지·검사요청·현장일지·재료/구조/MEP 시험·변경승인, 소방설계 확인·현장검사·영구 유틸리티 release, 준공도면·building completion application·Building Completion/점유허가서, 공사·전문배상 등 보험의 법적/계약 근거와 현지 전문가·검사기관·보험사 견적&lt;/li&gt;&lt;li&gt;현지 설계자·시공자·검사기관의 자격, 의무보험, 중간검사와 준공·소방·사용승인 절차는 무엇인가? — 영향: 조달 패키지, 품질책임, 보험료, 검사 Hold Point와 개장 가능일을 결정한다.; 담당 수원기관·현지 건축전문가; 확인기관 관할 개발계획·건축당국 또는 도시/개발위원회, 등록전문가 심의기관·승인검사기관·소방국, 건설부; 필요 증빙 전문가·시공자·검사기관 등록증과 보험증권, 검사계획·시험성적서·변경승인 기록, 준공·소방·사용승인 체크리스트와 실제 견적&lt;/li&gt;&lt;li&gt;MNBC 검사·준공·점유증명의 사업별 적용조건을 어떤 원본·공문·현장기록으로 입증할 것인가? — 영향: 공개된 국가 기본경로와 실제 필지·시설·관할의 적용판정을 분리해 보고서의 과단정을 막는다.; 담당 현지 건축전문가·조사총괄; 확인기관 관할 개발계획·건축당국 또는 도시/개발위원회, 등록전문가 심의기관·승인검사기관·소방국, 건설부; 필요 증빙 현지 등록 건축사·구조/설비기술자·시공자·검사기관 자격, 착공통지·검사요청·현장일지·재료/구조/MEP 시험·변경승인, 소방설계 확인·현장검사·영구 유틸리티 release, 준공도면·building completion application·Building Completion/점유허가서, 공사·전문배상 등 보험의 법적/계약 근거와 현지 전문가·검사기관·보험사 견적&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/details&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;핵심 적용판단&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;확인된 법령 사실과 사업별 조건부·미확정 판단을 분리해 표시합니다.&lt;/p&gt;
  &lt;div class=&quot;decision-list&quot;&gt;&lt;div class=&quot;decision&quot; data-state=&quot;conditional&quot;&gt;&lt;span class=&quot;badge warn&quot;&gt;조건부&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;MMR-BLD-C-003&lt;/span&gt;&lt;p&gt;MNBC의 법정검사와 준공증명 구조를 품질계획에 반영하되, 관할 지역법이 요구하는 소방·보험·유틸리티·점유조건을 최종지급과 개장 전 별도 Gate로 관리한다.&lt;/p&gt;&lt;div class=&quot;sources&quot;&gt;근거 · 미얀마 국가건축기준 2025 제1·2부(계획·건축행정 및 건축·도시설계) · 미얀마 국가건축기준 2025 제6·7부(재료·시공관리·안전·유지관리)&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/section&gt;







&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;검증&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;미얀마 국가건축기준 2025 제1·2부(계획·건축행정 및 건축·도시설계)·양곤도시개발위원회 개발허가 규정 2022·환경보전법 2012 및 환경보전규칙 고시 제50/2014호·환경영향평가절차 고시 제616/2015호·미얀마 국가건축기준 2025 제6·7부(재료·시공관리·안전·유지관리)의 공식 법령·정부 서비스 페이지에서 제도 존재, 담당기관과 적용범위를 확인했다.&lt;/p&gt;
  &lt;div class=&quot;cards&quot;&gt;
    &lt;div class=&quot;card span2&quot;&gt;&lt;h3&gt;검증 범위&lt;/h3&gt;
      &lt;p style=&quot;margin:0;font-size:13.5px;line-height:1.7&quot;&gt;단계검사·검사중지점과 준공증명은 국가건축코드 제1.3.4항이 전국 기준으로 정한다.&lt;/p&gt;
      &lt;p style=&quot;margin:12px 0 0;font-size:12.5px;color:var(--muted)&quot;&gt;확인일 2026-08-07 · 자료집 기준일 2026-08-07&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;대조에 쓴 원문&lt;/h3&gt;&lt;ul class=&quot;srcs&quot; style=&quot;padding-left:16px;margin:0&quot;&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://myanmar.gov.mm/documents/20143/0/PART%2B1%2B%26%2B2%2B%28English%29.pdf/5fd95195-d191-e6fa-a37a-61599bbbd611?t=1752644199338&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Myanmar National Building Code 2025, Parts 1 and 2 — Administration of Planning, Building and Built Environment; Architecture and Urban Design&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;법전·코드&lt;/span&gt;&lt;span class=&quot;badge ok&quot; style=&quot;margin-left:6px&quot;&gt;현행 확인&lt;/span&gt;&lt;span class=&quot;badge ok&quot; style=&quot;margin-left:6px&quot;&gt;조문 대조 완료&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;대조 조문 Sections 1.3.1-1.3.5&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;원문 확인 2026-08-07&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;상태 확인 2026-08-07 · 미얀마 정부 건설문서 포털의 MNBC 2025 Part 1·2 현행 원문에서 planning/building permit, 단계별 검사와 BCC 조항을 직접 대조&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;건설부 공식 포털의 2025 영문본이다. 제1.3.3절은 지역·주/도·연방 법을 배제하지 않으므로 관할별 채택·집행상태를 확인한다.&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.myanmar.gov.mm/documents/20143/0/PART%2B6%2C7.pdf/2843a6c7-6d90-bec0-00a3-638202a1709d?t=1752567164166&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Myanmar National Building Code 2025, Parts 6 and 7 — Building Materials; Construction Management, Practices, Safety and Maintenance&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;법전·코드&lt;/span&gt;&lt;span class=&quot;badge ok&quot; style=&quot;margin-left:6px&quot;&gt;현행 확인&lt;/span&gt;&lt;span class=&quot;badge ok&quot; style=&quot;margin-left:6px&quot;&gt;조문 대조 완료&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;대조 조문 Part 7 Sections 7.5.1.6-7.5.1.6.2&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;원문 확인 2026-08-07&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;상태 확인 2026-08-07 · 미얀마 정부 건설문서 포털의 MNBC 2025 Part 6·7 현행 원문에서 시공관리·검사 관련 절을 직접 대조&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card span2&quot;&gt;&lt;h3&gt;주의&lt;/h3&gt;&lt;p class=&quot;note&quot;&gt;비공식 한국어 요약이며 법률자문이나 관할기관의 유권해석을 대신하지 않는다.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;자료의 현행·운영 상태는 사이트가 자료별 상태·확인일·판단근거로 관리한다. 최신 개정 추적이 끝나지 않은 자료만 검증 예외로 별도 표시한다.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;건폐율·용적률·높이·이격·주차, 환경평가 유형, 수수료·실제 기간과 현지 업체 비용은 필지·시설·관할에 따라 달라 확인 전 수치로 사용하지 않는다.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;p style=&quot;margin:22px 0 0;font-size:12.5px;color:var(--muted)&quot;&gt;
    원문 링크 연결 — 공식 자료와 제도의 연결 수준을 뜻하며 자료의 현행·운영 상태는 위 원문 대장의 상태와 확인일로, 개별 사업 적용판정은 ODA 적용 확인사항으로 따로 관리합니다.
  &lt;/p&gt;

ot;decision&quot;:&quot;합동 준공검사와 준공도면·관계기관 증명을 확인해 BCC-002를 발급하거나 거부한다.&quot;,&quot;depends_on&quot;:[],&quot;output&quot;:&quot;BCC-002·승인용도 또는 거부결정&quot;}],&quot;requirement_ids&quot;:[&quot;MMR-BLD-REQ-006&quot;],&quot;gate_orders&quot;:[4]}};
var EDGES=[{&quot;id&quot;:&quot;M06-E01&quot;,&quot;source&quot;:&quot;B21&quot;,&quot;target&quot;:&quot;B22&quot;,&quot;type&quot;:&quot;sequence&quot;},{&quot;id&quot;:&quot;M06-E02&quot;,&quot;source&quot;:&quot;B22&quot;,&quot;target&quot;:&quot;B23&quot;,&quot;type&quot;:&quot;sequence&quot;},{&quot;id&quot;:&quot;M06-E03&quot;,&quot;source&quot;:&quot;B23&quot;,&quot;target&quot;:&quot;B25&quot;,&quot;type&quot;:&quot;sequence&quot;,&quot;label&quot;:&quot;공정 적합&quot;},{&quot;id&quot;:&quot;M06-E04&quot;,&quot;source&quot;:&quot;B23&quot;,&quot;target&quot;:&quot;B24&quot;,&quot;type&quot;:&quot;message&quot;,&quot;label&quot;:&quot;부적합통지 시정요구&quot;},{&quot;id&quot;:&quot;M06-E05&quot;,&quot;source&quot;:&quot;B24&quot;,&quot;target&quot;:&quot;B22&quot;,&quot;type&quot;:&quot;loop&quot;,&quot;label&quot;:&quot;시정 후 검사 재통지&quot;},{&quot;id&quot;:&quot;M06-E06&quot;,&quot;source&quot;:&quot;B25&quot;,&quot;target&quot;:&quot;B26&quot;,&quot;type&quot;:&quot;sequence&quot;},{&quot;id&quot;:&quot;M06-E07&quot;,&quot;source&quot;:&quot;B26&quot;,&quot;target&quot;:&quot;B27&quot;,&quot;type&quot;:&quot;sequence&quot;},{&quot;id&quot;:&quot;M06-E08&quot;,&quot;source&quot;:&quot;B27&quot;,&quot;target&quot;:&quot;B28&quot;,&quot;type&quot;:&quot;sequence&quot;},{&quot;id&quot;:&quot;M06-E09&quot;,&quot;source&quot;:&quot;B28&quot;,&quot;target&quot;:&quot;B30&quot;,&quot;type&quot;:&quot;sequence&quot;,&quot;label&quot;:&quot;준공 적합&quot;},{&quot;id&quot;:&quot;M06-E10&quot;,&quot;source&quot;:&quot;B28&quot;,&quot;target&quot;:&quot;B29&quot;,&quot;type&quot;:&quot;message&quot;,&quot;label&quot;:&quot;준공 보완요구&quot;},{&quot;id&quot;:&quot;M06-E11&quot;,&quot;source&quot;:&quot;B29&quot;,&quot;target&quot;:&quot;B28&quot;,&quot;type&quot;:&quot;loop&quot;,&quot;label&quot;:&quot;시정 후 합동 재검사&quot;}];

var _sel=document.getElementById(&#x27;sel&#x27;);
if(_sel) _sel.addEventListener(&#x27;change&#x27;,function(){ location.href=&#x27;../&#x27;+this.value+&#x27;/index.html&#x27;; });

/* 엣지 그리기 — 노드 DOM 위치를 재서 SVG로 연결 */
function draw(){
  var board=document.getElementById(&#x27;board&#x27;),svg=document.getElementById(&#x27;edges&#x27;);
  if(!board||!svg)return;
  var bb=board.getBoundingClientRect();
  svg.setAttribute(&#x27;viewBox&#x27;,&#x27;0 0 &#x27;+board.scrollWidth+&#x27; &#x27;+board.scrollHeight);
  svg.setAttribute(&#x27;width&#x27;,board.scrollWidth); svg.setAttribute(&#x27;height&#x27;,board.scrollHeight);
  var cs=getComputedStyle(document.documentElement);
  var C={sequence:cs.getPropertyValue(&#x27;--muted&#x27;).trim(),
         message:cs.getPropertyValue(&#x27;--info&#x27;).trim(),
         loop:cs.getPropertyValue(&#x27;--back&#x27;).trim()};
  var BG=cs.getPropertyValue(&#x27;--bg&#x27;).trim();
  var d=&#x27;&lt;defs&gt;&#x27;;
  [&#x27;sequence&#x27;,&#x27;message&#x27;,&#x27;loop&#x27;].forEach(function(t){
    d+=&#x27;&lt;marker id=&quot;m-&#x27;+t+&#x27;&quot; viewBox=&quot;0 0 8 8&quot; refX=&quot;7&quot; refY=&quot;4&quot; markerWidth=&quot;6&quot; markerHeight=&quot;6&quot; orient=&quot;auto&quot;&gt;&#x27;
      +&#x27;&lt;path d=&quot;M0 0 L8 4 L0 8 z&quot; fill=&quot;&#x27;+C[t]+&#x27;&quot;/&gt;&lt;/marker&gt;&#x27;;
  });
  d+=&#x27;&lt;/defs&gt;&#x27;;
  var GAP=5;
  function rel(rc){return {x:rc.left-bb.left+board.scrollLeft, y:rc.top-bb.top+board.scrollTop,
                            r:rc.right-bb.left+board.scrollLeft, b:rc.bottom-bb.top+board.scrollTop,
                            w:rc.width, h:rc.height};}
  function box(id){
    var el=Array.prototype.find.call(
      board.querySelectorAll(&#x27;.node&#x27;),function(node){return node.dataset.id===id;}
    );
    if(!el)return null; return rel(el.getBoundingClientRect());
  }

  /* 라우팅은 korea100studio의 거터 라우팅을 우리 그리드에 이식한 것이다.
     핵심: 카드를 지나야 하는 선은 카드가 없는 거터(행 하단·열 측면)로 우회한다.
     DOM에서 노드·행·열을 실측할 수 있어, 여러 직교 경로 후보를 만들고
     무관한 카드를 가장 적게 관통하는(동수면 가장 짧은) 것을 고른다. */

  // 장애물(모든 노드)과 거터(노드 없는 띠) 실측
  var OB=[];
  board.querySelectorAll(&#x27;.node&#x27;).forEach(function(el){ var r=box(el.dataset.id); r.id=el.dataset.id; OB.push(r); });
  // 단계 머리글과 각 행의 행위주체 셀도 텍스트 장애물이다. 카드만 피하면
  // 긴 회귀 라벨이 머리글 뒤로 올라가거나 행위주체명을 가릴 수 있다.
  var TB=[];
  board.querySelectorAll(&#x27;.brow.head .bcell,.brow:not(.head) .bcell:first-child&#x27;).forEach(function(el){
    TB.push(rel(el.getBoundingClientRect()));
  });
  var rowGut=[], colGut=[];
  board.querySelectorAll(&#x27;.brow:not(.head)&#x27;).forEach(function(el){ var r=rel(el.getBoundingClientRect());
    rowGut.push(r.y+9); rowGut.push(r.b-9); });
  var hc=board.querySelectorAll(&#x27;.brow.head .bcell&#x27;);
  for(var i=1;i&lt;hc.length;i++){ var r=rel(hc[i].getBoundingClientRect()); colGut.push(r.x+11); colGut.push(r.r-11); }

  function segHit(ax,ay,bx,by,e1,e2){
    var n=0, M=3;
    for(var i=0;i&lt;OB.length;i++){ var o=OB[i]; if(o.id===e1||o.id===e2) continue;
      var L=o.x+M,R=o.r-M,T=o.y+M,B=o.b-M;
      if(Math.abs(ay-by)&lt;0.5){ if(ay&gt;T&amp;&amp;ay&lt;B &amp;&amp; Math.max(ax,bx)&gt;L &amp;&amp; Math.min(ax,bx)&lt;R) n++; }
      else { if(ax&gt;L&amp;&amp;ax&lt;R &amp;&amp; Math.max(ay,by)&gt;T &amp;&amp; Math.min(ay,by)&lt;B) n++; }
    } return n;
  }
  function uniq(pts){ return pts.filter(function(p,i){ return i===0 || Math.abs(p.x-pts[i-1].x)&gt;0.5 || Math.abs(p.y-pts[i-1].y)&gt;0.5; }); }
  function score(pts,e1,e2){ pts=uniq(pts); var p=0,l=0;
    for(var i=0;i&lt;pts.length-1;i++){ p+=segHit(pts[i].x,pts[i].y,pts[i+1].x,pts[i+1].y,e1,e2);
      l+=Math.abs(pts[i].x-pts[i+1].x)+Math.abs(pts[i].y-pts[i+1].y); }
    return {pts:pts,p:p,l:l}; }

  function route(a,b,ed){
    var acx=a.x+a.w/2,acy=a.y+a.h/2,bcx=b.x+b.w/2,bcy=b.y+b.h/2, e1=ed.source,e2=ed.target, cs=[];
    // 보완 회귀는 source 오른쪽 거터로 빠진 뒤 target 행의 위·아래 여백을
    // 거쳐 진입한다. target 중심 높이로 곧장 되돌리면 같은 행의 중간 카드를
    // 관통할 수 있으므로, 실측한 행 거터 후보를 장애물 수·길이로 비교한다.
    if(ed.type===&#x27;loop&#x27;&amp;&amp;ed.label){
      var maxRight=Math.max(a.r,b.r), gx0=Math.min(board.scrollWidth-4,maxRight+28);
      var gxVals=[gx0,board.scrollWidth-4], loopCandidates=[];
      colGut.forEach(function(gx){if(gx&gt;maxRight+10)gxVals.push(gx);});
      gxVals=gxVals.filter(function(gx,i){return gx&gt;maxRight+6&amp;&amp;gxVals.indexOf(gx)===i;});
      var gyVals=rowGut.filter(function(gy){return gy&lt;b.y-6||gy&gt;b.b+6;});
      gxVals.forEach(function(gx){
        gyVals.forEach(function(gy){
          var above=gy&lt;b.y;
          var tp={x:bcx,y:above?b.y:b.b};
          var pre={x:bcx,y:tp.y+(above?-GAP:GAP)};
          loopCandidates.push(score([
            {x:a.r,y:acy},{x:gx,y:acy},{x:gx,y:gy},{x:bcx,y:gy},pre,tp
          ],e1,e2));
        });
      });
      // 극단적으로 거터 후보가 없는 단일 행 보드에서도 선은 계속 표시한다.
      loopCandidates.push(score([

      if(bestScore&lt;=(p.offset||0))break;

      if(s&lt;bestScore){best={p:p,box:b};bestScore=s;}
    }
    if(!best){
      var first=uniq(job.rt.pts)[0]; best={p:{x:first.x,y:first.y,anchor:first},box:candidateBox(first,w,h)};
    }
    var lead=leaderSegment(best.box,best.p);
    if(lead){
      var leader=document.createElementNS(NS,&#x27;line&#x27;);
      leader.setAttribute(&#x27;class&#x27;,&#x27;edge-label-leader&#x27;);
      leader.setAttribute(&#x27;x1&#x27;,rnd(lead.x1)); leader.setAttribute(&#x27;y1&#x27;,rnd(lead.y1));
      leader.setAttribute(&#x27;x2&#x27;,rnd(lead.x2)); leader.setAttribute(&#x27;y2&#x27;,rnd(lead.y2));
      leader.setAttribute(&#x27;stroke&#x27;,job.color); leader.setAttribute(&#x27;stroke-width&#x27;,&#x27;1&#x27;);
      leader.setAttribute(&#x27;stroke-dasharray&#x27;,&#x27;2 2&#x27;); leader.setAttribute(&#x27;opacity&#x27;,&#x27;.55&#x27;);
      group.insertBefore(leader,bg);
      leaderSegments.push(lead);
    }
    labelBoxes.push(best.box);
    bg.setAttribute(&#x27;x&#x27;,rnd(best.box.x)); bg.setAttribute(&#x27;y&#x27;,rnd(best.box.y));
    bg.setAttribute(&#x27;width&#x27;,rnd(w)); bg.setAttribute(&#x27;height&#x27;,rnd(h));
    bg.setAttribute(&#x27;stroke&#x27;,job.color); bg.setAttribute(&#x27;stroke-opacity&#x27;,&#x27;.18&#x27;);
    txt.setAttribute(&#x27;x&#x27;,rnd(best.p.x)); txt.setAttribute(&#x27;y&#x27;,rnd(best.p.y));
    /* 패널티로도 못 피한 겹침이 남으면 불투명 사각형을 고집하지 않는다.
       배경을 낮추고 글자 획 주변만 배경색으로 둘러(헤일로) 선이 라벨 뒤로
       이어져 보이게 한다. 지도 라벨의 표준 기법이며, 가리는 면적이 사각형
       전체에서 글자 윤곽으로 줄어 &quot;선이 끊겼다&quot;로 읽히지 않는다. */
    var residual=0;
    pathSegs.forEach(function(s){ if(s.ed!==job.ed) residual+=segmentCoverLength(s,best.box); });
    if(residual&gt;2){
      bg.setAttribute(&#x27;fill-opacity&#x27;,&#x27;.55&#x27;);
      txt.setAttribute(&#x27;paint-order&#x27;,&#x27;stroke&#x27;);
      txt.setAttribute(&#x27;stroke&#x27;,BG); txt.setAttribute(&#x27;stroke-width&#x27;,&#x27;3&#x27;);
      txt.setAttribute(&#x27;stroke-linejoin&#x27;,&#x27;round&#x27;);
      group.setAttribute(&#x27;data-covers&#x27;,rnd(residual));
    }
    txt.style.visibility=&#x27;visible&#x27;;
  });
}

function openNode(id){
  var n=NODES[id]; if(!n)return;
  var h=&#x27;&lt;span class=&quot;badge plain muted&quot;&gt;&#x27;+(n.display_id||n.id)+&#x27;&lt;/span&gt; &#x27;
       +&#x27;&lt;span class=&quot;badge plain muted&quot;&gt;&#x27;+n.lane+&#x27;&lt;/span&gt; &#x27;
       +&#x27;&lt;span class=&quot;badge plain muted&quot;&gt;&#x27;+n.stage+&#x27;&lt;/span&gt;&#x27;
       +(n.workflow_kind_label?&#x27; &lt;span class=&quot;badge info&quot;&gt;&#x27;+n.workflow_kind_label+&#x27;&lt;/span&gt;&#x27;:&#x27;&#x27;);
  h+=&#x27;&lt;h3&gt;&#x27;+n.name+&#x27;&lt;/h3&gt;&#x27;;
  h+=&#x27;&lt;dl class=&quot;kv&quot;&gt;&#x27;;
  h+=&#x27;&lt;dt&gt;담당&lt;/dt&gt;&lt;dd&gt;&#x27;+n.actor+&#x27;&lt;/dd&gt;&#x27;;
  if(n.consulted_authorities) h+=&#x27;&lt;dt&gt;협의·관할기관&lt;/dt&gt;&lt;dd&gt;&#x27;+n.consulted_authorities+&#x27;&lt;/dd&gt;&#x27;;
  if(n.action) h+=&#x27;&lt;dt&gt;내용&lt;/dt&gt;&lt;dd&gt;&#x27;+n.action+&#x27;&lt;/dd&gt;&#x27;;
  if(n.applicability) h+=&#x27;&lt;dt&gt;적용 조건&lt;/dt&gt;&lt;dd&gt;&#x27;+n.applicability+&#x27;&lt;/dd&gt;&#x27;;
  if(n.deadline) h+=&#x27;&lt;dt&gt;기한&lt;/dt&gt;&lt;dd&gt;&#x27;+n.deadline+&#x27;&lt;/dd&gt;&#x27;;
  if(n.output_documents&amp;&amp;n.output_documents.length)
    h+=&#x27;&lt;dt&gt;산출 문서&lt;/dt&gt;&lt;dd&gt;&#x27;+n.output_documents.join(&#x27; · &#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  if(n.blocker) h+=&#x27;&lt;dt&gt;병목&lt;/dt&gt;&lt;dd style=&quot;color:var(--warn)&quot;&gt;&#x27;+n.blocker+&#x27;&lt;/dd&gt;&#x27;;
  if(n.legal_basis&amp;&amp;n.legal_basis.length){
    var basisLabel=n.basis_scope===&#x27;axis&#x27;?&#x27;축 전체 관련 제도 근거&#x27;
      :(n.workflow_kind===&#x27;statutory&#x27;?&#x27;근거 조문&#x27;:&#x27;관련 제도 근거&#x27;);
    h+=&#x27;&lt;dt&gt;&#x27;+basisLabel+&#x27;&lt;/dt&gt;&lt;dd&gt;&#x27;+n.legal_basis.map(function(l){
      var nm=l.url?&#x27;&lt;a class=&quot;ref&quot; href=&quot;&#x27;+l.url+&#x27;&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;&#x27;+l.law+&#x27;&lt;/a&gt;&#x27;:l.law;
      var meta=(l.kind?&#x27; &lt;span class=&quot;badge plain muted&quot;&gt;&#x27;+l.kind+&#x27;&lt;/span&gt;&#x27;:&#x27;&#x27;)
        +(l.scope_label?&#x27; &lt;span class=&quot;badge info&quot;&gt;&#x27;+l.scope_label+&#x27;&lt;/span&gt;&#x27;:&#x27;&#x27;)
        +(l.verification?&#x27; &lt;span class=&quot;badge &#x27;+l.verification_tone+&#x27;&quot;&gt;&#x27;+l.verification+&#x27;&lt;/span&gt;&#x27;:&#x27;&#x27;);
      return &#x27;&lt;div style=&quot;margin-bottom:9px&quot;&gt;&#x27;+nm+&#x27; &lt;code&gt;&#x27;+l.article+&#x27;&lt;/code&gt;&#x27;+meta
        +(l.note?&#x27;&lt;div style=&quot;margin-top:3px;color:var(--muted)&quot;&gt;&#x27;+l.note+&#x27;&lt;/div&gt;&#x27;:&#x27;&#x27;)+&#x27;&lt;/div&gt;&#x27;;}).join(&#x27;&#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  }
  if(typeof n.confidence===&#x27;number&#x27;){
    h+=&#x27;&lt;dt&gt;법령 근거 확신도&lt;/dt&gt;&lt;dd&gt;&#x27;+n.confidence.toFixed(2)
      +(n.confidence&lt;0.8?&#x27; &lt;span class=&quot;badge warn&quot;&gt;현장 검증 필요&lt;/span&gt;&#x27;:&#x27;&#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  }
  if(n.confidence_reason) h+=&#x27;&lt;dt&gt;확신도 산정 근거&lt;/dt&gt;&lt;dd&gt;&#x27;+n.confidence_reason+&#x27;&lt;/dd&gt;&#x27;;
  if(n.evidence_status) h+=&#x27;&lt;dt&gt;근거 상태&lt;/dt&gt;&lt;dd&gt;&#x27;+n.evidence_status+&#x27;&lt;/dd&gt;&#x27;;
  if(n.report_use) h+=&#x27;&lt;dt&gt;보고서 반영&lt;/dt&gt;&lt;dd&gt;&#x27;+n.report_use+&#x27;&lt;/dd&gt;&#x27;;
  if(n.permit_gates&amp;&amp;n.permit_gates.length){
    h+=&#x27;&lt;dt&gt;연결 인허가 절차&lt;/dt&gt;&lt;dd&gt;&#x27;+n.permit_gates.map(function(g){
      var dep=g.depends_on&amp;&amp;g.depends_on.length?&#x27; · 선행 절차 &#x27;+g.depends_on.map(function(x){return &#x27;P&#x27;+x;}).join(&#x27;, &#x27;):&#x27;&#x27;;
      return &#x27;&lt;div style=&quot;margin-bottom:8px&quot;&gt;&lt;b&gt;P&#x27;+g.order+&#x27; &#x27;+g.gate+&#x27;&lt;/b&gt;&#x27;+dep
        +&#x27;&lt;div&gt;&#x27;+g.decision+&#x27;&lt;/div&gt;&lt;div style=&quot;color:var(--muted)&quot;&gt;산출물 · &#x27;+g.output+&#x27;&lt;/div&gt;&lt;/div&gt;&#x27;;}).join(&#x27;&#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  }
  if(n.open_questions&amp;&amp;n.open_questions.length){
    h+=&#x27;&lt;dt&gt;현장 확인질문&lt;/dt&gt;&lt;dd&gt;&#x27;+n.open_questions.map(function(q){
      return &#x27;&lt;div style=&quot;margin-bottom:10px&quot;&gt;&lt;span class=&quot;badge &#x27;+(q.blocking?&#x27;bad&#x27;:&#x27;muted&#x27;)+&#x27;&quot;&gt;&#x27;
        +(q.blocking?&#x27;Gate 차단&#x27;:&#x27;추가 확인&#x27;)+&#x27;&lt;/span&gt; &lt;code&gt;&#x27;+q.id+&#x27;&lt;/code&gt;&lt;div&gt;&#x27;+q.question+&#x27;&lt;/div&gt;&#x27;
        +&#x27;&lt;div style=&quot;color:var(--muted)&quot;&gt;영향 · &#x27;+q.why+&#x27;&lt;/div&gt;&#x27;
        +&#x27;&lt;div style=&quot;color:var(--muted)&quot;&gt;확인기관 · &#x27;+q.confirm_with.join(&#x27; · &#x27;)+&#x27;&lt;/div&gt;&#x27;
        +&#x27;&lt;div style=&quot;color:var(--muted)&quot;&gt;증빙 · &#x27;+q.evidence.join(&#x27; · &#x27;)+&#x27;&lt;/div&gt;&lt;/div&gt;&#x27;;}).join(&#x27;&#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  }
  var ins=EDGES.filter(function(x){return x.target===id}),
      outs=EDGES.filter(function(x){return x.source===id});
  /* 보드에서 순차 라벨을 접어 두므로 여기가 전이 문구를 빠짐없이 보는 자리다.
     한 줄로 이어붙이면 묻히므로 연결 종류별 배지로 세워 준다. */
  function edgeLine(otherId,x){
    var tone=x.type===&#x27;loop&#x27;?&#x27;back&#x27;:(x.type===&#x27;message&#x27;?&#x27;info&#x27;:&#x27;muted&#x27;);
    return &#x27;&lt;div style=&quot;margin-bottom:5px&quot;&gt;&#x27;+(NODES[otherId]?NODES[otherId].name:otherId)
      +(x.label?&#x27; &lt;span class=&quot;badge &#x27;+tone+&#x27;&quot;&gt;&#x27;+x.label+&#x27;&lt;/span&gt;&#x27;:&#x27;&#x27;)+&#x27;&lt;/div&gt;&#x27;;
  }
  if(ins.length) h+=&#x27;&lt;dt&gt;선행&lt;/dt&gt;&lt;dd&gt;&#x27;+ins.map(function(x){
    return edgeLine(x.source,x);}).join(&#x27;&#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  if(outs.length) h+=&#x27;&lt;dt&gt;후속&lt;/dt&gt;&lt;dd&gt;&#x27;+outs.map(function(x){
    return edgeLine(x.target,x);}).join(&#x27;&#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  h+=&#x27;&lt;/dl&gt;&#x27;;
  document.getElementById(&#x27;dbody&#x27;).innerHTML=h;
  document.getElementById(&#x27;dlg&#x27;).showModal();
}

/* 인접 카드 강조와 숨긴 순차 라벨 노출을 한 곳에서 처리한다. focus·blur를 함께
   걸어 마우스 없이 Tab만으로도 같은 정보에 닿게 한다 — 카드는 button이라 원래
   포커스를 받는데 지금까지 hover에만 반응해 키보드에서는 강조가 동작하지 않았다. */
function peek(id,on){
  var rel={};rel[id]=1;
  EDGES.forEach(function(x){if(x.source===id)rel[x.target]=1;if(x.target===id)rel[x.source]=1;});
  document.querySelectorAll(&#x27;.node&#x27;).forEach(function(o){o.classList.toggle(&#x27;dim&#x27;,on&amp;&amp;!rel[o.dataset.id])});
  var sv=document.getElementById(&#x27;edges&#x27;); if(!sv)return;
  sv.querySelectorAll(&#x27;.edge-label-group&#x27;).forEach(function(g){
    g.classList.toggle(&#x27;lit&#x27;, on &amp;&amp; (g.getAttribute(&#x27;data-edge-source&#x27;)===id
                                   ||g.getAttribute(&#x27;data-edge-target&#x27;)===id));
  });
}
document.querySelectorAll(&#x27;.node&#x27;).forEach(function(b){
  b.addEventListener(&#x27;click&#x27;,function(){openNode(b.dataset.id)});
  b.addEventListener(&#x27;mouseenter&#x27;,function(){peek(b.dataset.id,true)});
  b.addEventListener(&#x27;focus&#x27;,function(){peek(b.dataset.id,true)});
  b.addEventListener(&#x27;mouseleave&#x27;,function(){peek(b.dataset.id,false)});
  b.addEventListener(&#x27;blur&#x27;,function(){peek(b.dataset.id,false)});
});
var _all=document.getElementById(&#x27;labelall&#x27;);
if(_all) _all.addEventListener(&#x27;change&#x27;,function(){
  var bd=document.getElementById(&#x27;board&#x27;);

document.getElementById(&#x27;dlg&#x27;).addEventListener(&#x27;click&#x27;,function(ev){
  if(ev.target===this) this.close();
});

addEventListener(&#x27;load&#x27;,draw); addEventListener(&#x27;resize&#x27;,redraw);

new MutationObserver(redraw).observe(document.documentElement,{attributes:true,attributeFilter:[&#x27;data-theme&#x27;]});
&lt;/script&gt;

<script>
function fit(fr){ try{ fr.style.height=(fr.contentWindow.document.body.scrollHeight+20)+'px'; }catch(e){} }
function showTab(i){
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.toggle('active', +t.dataset.i===i); });
  document.querySelectorAll('.fr').forEach(function(fr){
    var on=+fr.dataset.i===i; fr.classList.toggle('active', on);
    if(on){ try{ fr.contentWindow.draw && fr.contentWindow.draw(); }catch(e){} setTimeout(function(){fit(fr);},60); }
  });
}
document.querySelectorAll('.fr').forEach(function(fr){
  fr.addEventListener('load', function(){
    // iframe 안의 테마 토글·업무구조도가 부모 테마를 따르도록, 그리고 높이를 맞춘다
    fit(fr);
    if(fr.classList.contains('active')) setTimeout(function(){ try{fr.contentWindow.draw&&fr.contentWindow.draw();}catch(e){} fit(fr); },80);
  });
});
addEventListener('resize', function(){ var a=document.querySelector('.fr.active'); if(a) fit(a); });
</script>
