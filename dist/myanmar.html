&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;한 장 캔버스&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;승인예산으로 수행하는 정부의 공사·재화·서비스 조달을 공개경쟁을 원칙으로 집행하되, 소액·복잡성·시장제한·긴급성에 따라 가격제안요청·제한입찰·2단계입찰·직접조달을 허용한다.&lt;/p&gt;
  &lt;div class=&quot;cards&quot;&gt;
    &lt;div class=&quot;card span2&quot;&gt;&lt;h3&gt;절차&lt;/h3&gt;&lt;ol class=&quot;steps&quot;&gt;&lt;li&gt;승인예산·사업범위 확인 및 조달계획 수립&lt;/li&gt;&lt;li&gt;입찰위원회 구성, 사양·평가기준·계약조건이 포함된 입찰서류 작성&lt;/li&gt;&lt;li&gt;조달방식 결정 — 가격제안요청·공개입찰·제한입찰·2단계입찰·직접조달&lt;/li&gt;&lt;li&gt;제한입찰·직접조달이면 금액별 승인 — 1억 짯 미만 기관 관리위원회, 1억 짯 이상 국정관리평의회 의장 또는 연방정부&lt;/li&gt;&lt;li&gt;공고 — 2천만~2억 짯은 기관·행정기관 게시판에 7일 전, 2억 짯 초과는 국영신문 2회와 부처 웹사이트에 14일 전&lt;/li&gt;&lt;li&gt;입찰서·가격제안서 접수 — 세부 자격·제출서류·유효기간은 입찰서류 확인&lt;/li&gt;&lt;li&gt;입찰위원회가 공고된 기준으로 기술·가격·자격을 평가&lt;/li&gt;&lt;li&gt;낙찰자 결정·통지 및 계약 체결&lt;/li&gt;&lt;li&gt;계약 발효부터 완료까지 이행·지급·변경·분쟁을 관리&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;적용 대상&lt;/h3&gt;&lt;p style=&quot;margin:0;font-size:13.5px;line-height:1.7&quot;&gt;연방급 기관, 연방부처, 네피도위원회, 주·지역 정부가 승인예산으로 수행하는 공사·재화·서비스 조달에 적용한다. 2022 지침 기준 — 2천만 짯 미만의 단순 공사·시판 재화·서비스는 신뢰 가능한 3개 이상 업체의 가격제안요청, 원칙적으로 그 밖의 조달은 공개입찰. 2천만~2억 짯 공개입찰은 게시판 공고 7일, 2억 짯 초과는 국영신문 2회와 부처 웹사이트 공고 14일. 제한입찰·직접조달은 1억 짯 미만 기관 관리위원회, 1억 짯 이상 국정관리평의회 의장 또는 연방정부 승인이 필요하다. 국방·국가안보 조달, 장학·연수, 공무원·임시근로자 채용, 토지·기존 건물 매입은 2022 지침 적용 제외다.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;법적 근거&lt;/h3&gt;&lt;div class=&quot;law&quot;&gt;&lt;span class=&quot;nm&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.lincolnmyanmar.com/wp-content/uploads/2023/02/SAC-Procurement-Directive.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Office of the State Administration Council Directive No. 1/2022&lt;/a&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;¶¶1-16, 25-28&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:auto&quot;&gt;지침·정책&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;law&quot;&gt;&lt;span class=&quot;nm&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.lincolnmyanmar.com/wp-content/uploads/2019/04/Tender-procedure-Presidents-Office-1-2017_NoCopy.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;President’s Office Directive No. 1/2017&lt;/a&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;¶¶16-48 (2022 지침과 충돌하지 않는 범위)&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:auto&quot;&gt;지침·정책&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;law&quot;&gt;&lt;span class=&quot;nm&quot;&gt;President’s Office Directive No. 7/2020&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:auto&quot;&gt;지침·정책&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;law&quot;&gt;&lt;span class=&quot;nm&quot;&gt;재원 제공 국제·협력기관의 조달규정&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;President’s Office Directive No. 1/2017 ¶48(g)&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:auto&quot;&gt;공여기관 규정&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;권한 기관&lt;/h3&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;발주부서·기관별 입찰위원회(Tender Committee)&lt;/b&gt;&lt;span&gt;조달방식 선택, 가격제안 요청·공개입찰 실시, 입찰서 접수·평가, 낙찰·계약 관리&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;연방급 기관·연방부처·네피도위원회·주/지역 정부 관리위원회&lt;/b&gt;&lt;span&gt;제한입찰·직접조달 금액이 1억 짯 미만인 경우 해당 방식 사용을 회의로 결정&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;국정관리평의회 의장 또는 연방정부&lt;/b&gt;&lt;span&gt;제한입찰·직접조달 금액이 1억 짯 이상인 경우 사전 승인&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;차관·무상원조 제공 국제·협력기관&lt;/b&gt;&lt;span&gt;외부재원 조달에 자체 규정이 있으면 그 규정을 적용하고, 없으면 미얀마 지침 적용&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;이해관계자&lt;/h3&gt;&lt;p style=&quot;margin:0;font-size:13.5px;line-height:1.7&quot;&gt;연방급 기관·연방부처·네피도위원회·주/지역 정부의 발주부서, 발주부서별 입찰위원회, 국내외 입찰자, 기관 관리위원회, 국정관리평의회 의장 또는 연방정부, 차관·무상원조 제공 국제·협력기관&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;제출서류&lt;/h3&gt;&lt;div class=&quot;docset&quot;&gt;&lt;b&gt;입찰자&lt;/b&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;입찰서 또는 가격제안서&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;입찰서류가 정한 기술제안·가격제안&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;입찰서류가 정한 법인·납세·경험·재무·기술능력 증빙&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;입찰보증(요구되는 경우)&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;docset&quot;&gt;&lt;b&gt;외국기업 낙찰자&lt;/b&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;계약 체결 전 미얀마 법인등록 증빙(President’s Office Directive No. 1/2017 ¶42)&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;입찰서류가 정한 이행보증&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;docset&quot;&gt;&lt;b&gt;발주부서·입찰위원회&lt;/b&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;승인예산·조달계획&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;입찰공고·초청장&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;사양·평가기준·계약조건&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;평가보고서·낙찰결정·계약서&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;유의사항 · 병목&lt;/h3&gt;&lt;ul class=&quot;plain&quot;&gt;&lt;li&gt;2022 지침이 2017 지침을 전면 폐지하지 않고 &amp;#x27;충돌 시 2022 지침 우선&amp;#x27;으로 정해 두 문서를 함께 읽어야 한다. 2017년의 1천만/1억 짯 기준을 그대로 쓰면 현행 공고방식·기간을 잘못 적용한다&lt;/li&gt;&lt;li&gt;제한입찰·직접조달은 1억 짯 이상이면 국정관리평의회 의장 또는 연방정부 승인이 필요해 조달 일정의 선행조건이 된다&lt;/li&gt;&lt;li&gt;국방·국가안보 조달은 2022 지침 적용 제외라 공개경쟁·공고 기준을 동일하게 기대할 수 없다&lt;/li&gt;&lt;li&gt;확보한 2022·2017 지침 영문본은 비공식 편의번역이다. 미얀마어 관보 원문과 의미가 다를 경우 원문이 우선한다&lt;/li&gt;&lt;li&gt;입찰보증 1%·이행보증 10%는 2017 지침의 보충 규정으로 보이지만 2022 지침이 이를 재기재하지 않아 개별 입찰서류에서 반드시 재확인해야 한다&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;진입장벽&lt;/h3&gt;&lt;ul class=&quot;plain&quot;&gt;&lt;li&gt;외국기업은 해외구매 입찰에 낙찰된 뒤 계약 체결 전에 미얀마에 등록해야 한다&lt;/li&gt;&lt;li&gt;공고 채널이 금액별 게시판·국영신문·개별 부처 웹사이트로 분산돼 단일 포털 검색만으로 공고를 놓칠 수 있다&lt;/li&gt;&lt;li&gt;제한입찰·직접조달 및 안보조달은 공개 접근이 제한될 수 있다&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;현장 검증 필요&lt;/h3&gt;&lt;ul class=&quot;plain&quot;&gt;&lt;li&gt;2022 지침의 미얀마어 관보 원문과 비공식 영문 편의번역의 문언 일치 여부&lt;/li&gt;&lt;li&gt;2017 지침의 입찰보증 1%·이행보증 10%가 2022 지침 아래 실제 입찰에서 계속 적용되는지&lt;/li&gt;&lt;li&gt;2천만/2억 짯 금액구간이 2026년 현재 후속 지침으로 개정되지 않았는지&lt;/li&gt;&lt;li&gt;외국기업의 계약 전 미얀마 등록 요건과 실제 등록 완료 시점&lt;/li&gt;&lt;li&gt;외부재원 사업에서 공여기관 규정과 미얀마 지침의 우선순위를 개별 Financing Agreement가 어떻게 정하는지&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;관련 제도&lt;/h3&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;미얀마 조달 거버넌스·감독체계&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;미얀마 ODA 사업 발굴·형성 절차&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;법령 원문&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;현장에서 발주처에 그대로 제시할 수 있는 조문 원문입니다. 우리 요약이 아니라 verbatim이며,
    조문 번호를 누르면 원문 문서로 이동합니다. 한국어 요지 아래로 직역(참고용)을 펼칠 수 있습니다.&lt;/p&gt;
  &lt;div class=&quot;quotes&quot;&gt;&lt;div class=&quot;qc&quot;&gt;
  &lt;div class=&quot;qhd&quot;&gt;
    &lt;span class=&quot;qart&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.lincolnmyanmar.com/wp-content/uploads/2023/02/SAC-Procurement-Directive.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;¶¶3-5&lt;/a&gt;&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;Office of the State Administration Council Directive No. 1/2022&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;qtext&quot;&gt;Departments and organisations of Union-level organisations, Union Ministries, the Nay Pyi Taw Council and Region and State governments shall use the following tendering methods when engaging in procurement: (a) Request for a price proposal; (b) unrestricted tendering; (c) restricted tendering; (d) two-stage tendering; (e) direct procurement. ... Procurements shall be made by the method of unrestricted tendering where anyone may submit a tender, except in the cases set forth in paragraphs 4, 6, 7 and 8 of this directive.&lt;/div&gt;
  &lt;p class=&quot;qgist&quot;&gt;5개 조달방식을 두되 공개입찰을 원칙으로 한다.&lt;/p&gt;

&lt;/div&gt;&lt;div class=&quot;qc&quot;&gt;
  &lt;div class=&quot;qhd&quot;&gt;
    &lt;span class=&quot;qart&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.lincolnmyanmar.com/wp-content/uploads/2023/02/SAC-Procurement-Directive.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;¶10(a)-(c)&lt;/a&gt;&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;Office of the State Administration Council Directive No. 1/2022&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;qtext&quot;&gt;For purchases under 20 million kyats, the tender committee may solicit price proposals from at least 3 reliable companies without having to call an unrestricted tender; unrestricted calls for tenders for purchases from 20 million kyats to 200 million kyats must be prominently announced 7 days before the tender opening date ... unrestricted calls for tenders for purchases above 200 million kyats ... [must] be advertised at least twice in state-owned newspapers at least 14 days before the tender opening date. The same shall be announced on the ministry’s website at least 14 days in advance.&lt;/div&gt;
  &lt;p class=&quot;qgist&quot;&gt;2천만/2억 짯 구간에 따라 가격제안·게시판 7일·신문과 웹 14일로 갈린다.&lt;/p&gt;

&lt;/div&gt;&lt;div class=&quot;qc&quot;&gt;
  &lt;div class=&quot;qhd&quot;&gt;
    &lt;span class=&quot;qart&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.lincolnmyanmar.com/wp-content/uploads/2023/02/SAC-Procurement-Directive.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;¶¶8-9&lt;/a&gt;&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;Office of the State Administration Council Directive No. 1/2022&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;qtext&quot;&gt;Direct procurement may be made in any of the following situations. ... When using the tendering methods in paragraphs 7 and 8 above, purchases of less than 100 million kyats may be decided by a meeting of the management committee ... and purchases above 100 million kyats may be made with the approval of the chairman of the State Administration Council or the Union government.&lt;/div&gt;
  &lt;p class=&quot;qgist&quot;&gt;제한입찰·직접조달의 1억 짯 이상 건은 상위 승인이 필요하다.&lt;/p&gt;

&lt;/div&gt;&lt;div class=&quot;qc&quot;&gt;
  &lt;div class=&quot;qhd&quot;&gt;
    &lt;span class=&quot;qart&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.lincolnmyanmar.com/wp-content/uploads/2023/02/SAC-Procurement-Directive.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;¶28&lt;/a&gt;&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;Office of the State Administration Council Directive No. 1/2022&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;qtext&quot;&gt;If there are contradictions between the directives and the notification in paragraph 27 above and this directive, this directive shall prevail.&lt;/div&gt;
  &lt;p class=&quot;qgist&quot;&gt;2017·2018·2020 지침과 충돌하면 2022 지침이 우선한다.&lt;/p&gt;

&lt;/div&gt;&lt;div class=&quot;qc&quot;&gt;
  &lt;div class=&quot;qhd&quot;&gt;
    &lt;span class=&quot;qart&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.lincolnmyanmar.com/wp-content/uploads/2019/04/Tender-procedure-Presidents-Office-1-2017_NoCopy.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;¶48(g)&lt;/a&gt;&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;President’s Office Directive No. 1/2017&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;qtext&quot;&gt;The purchasing, procurement of services and hiring of consultants shall be done in compliance with the rules and regulations specified by the international or partner organizations that provide the corresponding loan or grant; if there are no such rules and regulations, this directive shall be complied with.&lt;/div&gt;
  &lt;p class=&quot;qgist&quot;&gt;차관·무상원조 제공기관의 조달규정이 있으면 그 규정을 우선 적용한다.&lt;/p&gt;

&lt;/div&gt;&lt;/div&gt;
&lt;/section&gt;



&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;검증&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;Office of the State Administration Council Directive No. 1/2022의 비공식 영문 편의번역을 조항별로 대조하고, 2017 지침에서 충돌하지 않는 입찰서류·보증·자격·외부재원 규정을 보충했다. 2026년 동남아 인프라 조달 가이드로 2022 지침의 계속 적용을 교차 확인했다.&lt;/p&gt;
  &lt;div class=&quot;cards&quot;&gt;
    &lt;div class=&quot;card span2&quot;&gt;&lt;h3&gt;검증 범위&lt;/h3&gt;
      &lt;p style=&quot;margin:0;font-size:13.5px;line-height:1.7&quot;&gt;2022 지침의 5개 조달방식, 공개입찰 원칙, 2천만/2억 짯 공고구간, 제한·직접조달 승인, 적용 제외와 2022 지침 우선규칙을 확인했다. 2017 지침의 보증률·외국기업 등록·공여기관 규정 우선도 원문에서 확인했으나, 미얀마어 관보 원문과 후속 세부지침은 확보하지 못했다.&lt;/p&gt;
      &lt;p style=&quot;margin:12px 0 0;font-size:12.5px;color:var(--muted)&quot;&gt;확인일 2026-07-26 · 자료집 기준일 2026-07-26&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;대조에 쓴 원문&lt;/h3&gt;&lt;ul class=&quot;srcs&quot; style=&quot;padding-left:16px;margin:0&quot;&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.lincolnmyanmar.com/wp-content/uploads/2023/02/SAC-Procurement-Directive.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Directive on public procurement, and on the disposal and lease of state-owned assets&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;지침·정책&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;대조 조문 ¶¶1-16, 25-28&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-26 · Office of the State Administration Council (English convenience translation by Lincoln Legal Services)&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.lincolnmyanmar.com/wp-content/uploads/2019/04/Tender-procedure-Presidents-Office-1-2017_NoCopy.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Tender procedures to be followed by government departments and organizations in construction, purchase, procurement of services, lease and sale&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;지침·정책&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;대조 조문 ¶¶3-12, 16-25, 37-48, 50&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-26 · President’s Office (English convenience translation by Lincoln Legal Services)&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.ahp.id/clientalert/2026-05-21_Guide-to-Procurement-of-Infrastructure-Projects-in-Southeast-Asia.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Guide to Procurement of Infrastructure Projects in Southeast Asia (2026)&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;지침·정책&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;대조 조문 Myanmar chapter pp.39-44&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-26 · Rajah &amp;amp; Tann Asia&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card span2&quot;&gt;&lt;h3&gt;주의&lt;/h3&gt;&lt;p class=&quot;note&quot;&gt;미얀마는 KOICA 2026 아시아 및 태평양 자료집 미수록 보강 국가다. 1차 법규·정책 원문을 기준으로 직접 정규화했다.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;2017 지침은 1천만/1억 짯을 기준으로 했지만 2022 지침은 2천만/2억 짯으로 변경했다. 두 지침이 충돌하면 2022 지침이 우선한다(¶28).&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;2022 지침은 종전 지침을 열거한 뒤 충돌 시 우선한다고만 규정한다. 종전 지침의 비충돌 규정은 보충적으로 남는 것으로 읽되, 실제 입찰서류를 최종 기준으로 삼아야 한다.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;2022·2017 지침 영문본은 Lincoln Legal Services의 비공식 편의번역이며 &amp;#x27;accuracy not guaranteed&amp;#x27;라고 표시돼 있다.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

function draw(){
  var board=document.getElementById(&#x27;board&#x27;),svg=document.getElementById(&#x27;edges&#x27;);
  if(!board||!svg)return;
  var bb=board.getBoundingClientRect();
  svg.setAttribute(&#x27;viewBox&#x27;,&#x27;0 0 &#x27;+board.scrollWidth+&#x27; &#x27;+board.scrollHeight);
  svg.setAttribute(&#x27;width&#x27;,board.scrollWidth); svg.setAttribute(&#x27;height&#x27;,board.scrollHeight);
  var cs=getComputedStyle(document.documentElement);
  var C={sequence:cs.getPropertyValue(&#x27;--muted&#x27;).trim(),
         message:cs.getPropertyValue(&#x27;--back&#x27;).trim(),
         loop:cs.getPropertyValue(&#x27;--warn&#x27;).trim()};
  var d=&#x27;&lt;defs&gt;&#x27;;
  [&#x27;sequence&#x27;,&#x27;message&#x27;,&#x27;loop&#x27;].forEach(function(t){
    d+=&#x27;&lt;marker id=&quot;m-&#x27;+t+&#x27;&quot; viewBox=&quot;0 0 8 8&quot; refX=&quot;7&quot; refY=&quot;4&quot; markerWidth=&quot;6&quot; markerHeight=&quot;6&quot; orient=&quot;auto&quot;&gt;&#x27;
      +&#x27;&lt;path d=&quot;M0 0 L8 4 L0 8 z&quot; fill=&quot;&#x27;+C[t]+&#x27;&quot;/&gt;&lt;/marker&gt;&#x27;;
  });
  d+=&#x27;&lt;/defs&gt;&#x27;;
  var GAP=5;
  function rel(rc){return {x:rc.left-bb.left+board.scrollLeft, y:rc.top-bb.top+board.scrollTop,
                            r:rc.right-bb.left+board.scrollLeft, b:rc.bottom-bb.top+board.scrollTop,
                            w:rc.width, h:rc.height};}
  function box(id){
    var el=board.querySelector(&#x27;.node[data-id=&quot;&#x27;+id+&#x27;&quot;]&#x27;);
    if(!el)return null; return rel(el.getBoundingClientRect());
  }

  /* 라우팅은 korea100studio의 거터 라우팅을 우리 그리드에 이식한 것이다.
     핵심: 카드를 지나야 하는 선은 카드가 없는 거터(행 하단·열 측면)로 우회한다.
     DOM에서 노드·행·열을 실측할 수 있어, 여러 직교 경로 후보를 만들고
     무관한 카드를 가장 적게 관통하는(동수면 가장 짧은) 것을 고른다. */

  // 장애물(모든 노드)과 거터(노드 없는 띠) 실측
  var OB=[];
  board.querySelectorAll(&#x27;.node&#x27;).forEach(function(el){ var r=box(el.dataset.id); r.id=el.dataset.id; OB.push(r); });
  var rowGut=[], colGut=[];
  board.querySelectorAll(&#x27;.brow:not(.head)&#x27;).forEach(function(el){ var r=rel(el.getBoundingClientRect());
    rowGut.push(r.y+9); rowGut.push(r.b-9); });
  var hc=board.querySelectorAll(&#x27;.brow.head .bcell&#x27;);
  for(var i=1;i&lt;hc.length;i++){ var r=rel(hc[i].getBoundingClientRect()); colGut.push(r.x+11); colGut.push(r.r-11); }

  function segHit(ax,ay,bx,by,e1,e2){
    var n=0, M=3;
    for(var i=0;i&lt;OB.length;i++){ var o=OB[i]; if(o.id===e1||o.id===e2) continue;
      var L=o.x+M,R=o.r-M,T=o.y+M,B=o.b-M;
      if(Math.abs(ay-by)&lt;0.5){ if(ay&gt;T&amp;&amp;ay&lt;B &amp;&amp; Math.max(ax,bx)&gt;L &amp;&amp; Math.min(ax,bx)&lt;R) n++; }
      else { if(ax&gt;L&amp;&amp;ax&lt;R &amp;&amp; Math.max(ay,by)&gt;T &amp;&amp; Math.min(ay,by)&lt;B) n++; }
    } return n;
  }
  function uniq(pts){ return pts.filter(function(p,i){ return i===0 || Math.abs(p.x-pts[i-1].x)&gt;0.5 || Math.abs(p.y-pts[i-1].y)&gt;0.5; }); }
  function score(pts,e1,e2){ pts=uniq(pts); var p=0,l=0;
    for(var i=0;i&lt;pts.length-1;i++){ p+=segHit(pts[i].x,pts[i].y,pts[i+1].x,pts[i+1].y,e1,e2);
      l+=Math.abs(pts[i].x-pts[i+1].x)+Math.abs(pts[i].y-pts[i+1].y); }
    return {pts:pts,p:p,l:l}; }

  function route(a,b,ed){
    var acx=a.x+a.w/2,acy=a.y+a.h/2,bcx=b.x+b.w/2,bcy=b.y+b.h/2, e1=ed.source,e2=ed.target, cs=[];
    // 세로 계열 — a의 위/아래 변에서 나가 b의 위/아래 변으로
    var below=bcy&gt;acy, sp={x:acx,y:below?a.b:a.y}, tp={x:bcx,y:below?b.y:b.b}, tg={x:tp.x,y:tp.y+(below?-GAP:GAP)};
    cs.push(score([sp,{x:sp.x,y:tg.y},tg,tp],e1,e2));                                   // 직선/L

  &lt;p class=&quot;desc&quot;&gt;각 발주기관이 입찰위원회와 평가·품질검수 기능을 구성해 조달을 집행·기록하고, 비경쟁 방식에는 금액별 상위 승인을, 부패·담합에는 계약취소·제재를, 입찰 이의에는 기관 내부심사와 부처합동 재심을 적용한다.&lt;/p&gt;
  &lt;div class=&quot;cards&quot;&gt;
    &lt;div class=&quot;card span2&quot;&gt;&lt;h3&gt;절차&lt;/h3&gt;&lt;ol class=&quot;steps&quot;&gt;&lt;li&gt;발주기관이 입찰위원회·입찰접수평가위원회·품질평가인수위원회를 구성하고 권한을 배분&lt;/li&gt;&lt;li&gt;입찰위원회가 승인예산·조달계획·사양·평가기준·계약조건을 확정&lt;/li&gt;&lt;li&gt;공개입찰을 원칙으로 집행하되 제한·직접조달은 금액별 상위 승인&lt;/li&gt;&lt;li&gt;금액구간에 따라 게시판·국영신문·부처 웹사이트에 공고&lt;/li&gt;&lt;li&gt;입찰접수·평가위원회가 개찰·평가보고서를 작성하고 입찰위원회가 낙찰 결정&lt;/li&gt;&lt;li&gt;품질평가·인수위원회가 납품·서비스의 계약 적합성을 검사해 인수 또는 거부&lt;/li&gt;&lt;li&gt;발주기관이 입찰서·평가보고서·위원회 기록·계약·지급·영수증을 최소 3년 보관&lt;/li&gt;&lt;li&gt;담합·뇌물·부패 시 입찰·계약 취소, 직원 조치, 입찰자·공급자 참여금지&lt;/li&gt;&lt;li&gt;입찰자가 증거를 갖춰 이의를 제기하면 입찰위원회가 조사하고, 불복 시 기획재정부의 부처합동 이의해결팀이 최종 결정&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;적용 대상&lt;/h3&gt;&lt;p style=&quot;margin:0;font-size:13.5px;line-height:1.7&quot;&gt;연방급 기관, 연방부처, 네피도위원회, 주·지역 정부의 승인예산 조달에 적용하는 분권형 거버넌스다. 2022 지침은 발주기관별 입찰위원회를 정의하고 비경쟁 방식의 금액별 승인을 규정하며, 2017 지침은 위원회 구성·기록·반부패·이의처리의 보충 규칙을 둔다. 2022 지침과 종전 지침이 충돌하면 2022 지침이 우선한다. 국방·국가안보 조달 등은 2022 지침 적용 제외다.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;법적 근거&lt;/h3&gt;&lt;div class=&quot;law&quot;&gt;&lt;span class=&quot;nm&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.lincolnmyanmar.com/wp-content/uploads/2023/02/SAC-Procurement-Directive.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Office of the State Administration Council Directive No. 1/2022&lt;/a&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;¶¶2(l), 3-10, 14-16, 25-28&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:auto&quot;&gt;지침·정책&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;law&quot;&gt;&lt;span class=&quot;nm&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.lincolnmyanmar.com/wp-content/uploads/2019/04/Tender-procedure-Presidents-Office-1-2017_NoCopy.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;President’s Office Directive No. 1/2017&lt;/a&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;¶¶4, 8-15, 43-48 (2022 지침과 충돌하지 않는 범위)&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:auto&quot;&gt;지침·정책&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;law&quot;&gt;&lt;span class=&quot;nm&quot;&gt;President’s Office Directive No. 7/2020&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:auto&quot;&gt;지침·정책&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;권한 기관&lt;/h3&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;발주기관별 입찰위원회(Tender Committee)&lt;/b&gt;&lt;span&gt;조달의 중심 집행기관. 방식·공고·평가·낙찰·계약을 관리하고 이의제기의 1차 사실조사를 수행&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;입찰접수·평가위원회&lt;/b&gt;&lt;span&gt;입찰서를 접수·개찰하고 공고된 기준으로 평가해 권고가 포함된 평가보고서를 입찰위원회에 제출&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;품질평가·인수위원회&lt;/b&gt;&lt;span&gt;납품 재화·서비스의 품질과 계약 사양 충족 여부를 검사하고 인수·거부 및 영수증 발급&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;기관 관리위원회&lt;/b&gt;&lt;span&gt;1억 짯 미만 제한입찰·직접조달 방식 사용을 회의로 결정&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;국정관리평의회 의장 또는 연방정부&lt;/b&gt;&lt;span&gt;1억 짯 이상 제한입찰·직접조달 방식 사용 승인&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;기획재정부(Ministry of Planning and Finance)&lt;/b&gt;&lt;span&gt;입찰위원회 결정에 불복한 이의가 있으면 연방정부 허가를 받아 3명 이상 부처 대표로 이의해결팀 구성&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;이해관계자&lt;/h3&gt;&lt;p style=&quot;margin:0;font-size:13.5px;line-height:1.7&quot;&gt;연방급 기관·연방부처·네피도위원회·주/지역 정부, 발주기관별 입찰위원회, 입찰접수·평가위원회, 품질평가·인수위원회, 기관 관리위원회, 국정관리평의회 의장 또는 연방정부, 기획재정부, 부처합동 이의해결팀, 입찰자·공급자&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;제출서류&lt;/h3&gt;&lt;div class=&quot;docset&quot;&gt;&lt;b&gt;입찰접수·평가위원회&lt;/b&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;개찰기록&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;평가기준별 심사결과&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;낙찰 권고가 포함된 평가보고서&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;docset&quot;&gt;&lt;b&gt;품질평가·인수위원회&lt;/b&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;품질·사양 검사결과&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;인수·거부 기록&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;물품 영수증&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;docset&quot;&gt;&lt;b&gt;발주기관&lt;/b&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;접수 입찰서&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;평가보고서&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;입찰위원회 회의기록&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;계약서&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;지급정보·영수증&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;기타 관련문서 — 최소 3년 보관&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;docset&quot;&gt;&lt;b&gt;이의제기 입찰자·이의해결팀&lt;/b&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;충분한 증거가 첨부된 이의신청&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;이의 접수·심사기록&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;최종 결정&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;유의사항 · 병목&lt;/h3&gt;&lt;ul class=&quot;plain&quot;&gt;&lt;li&gt;국가 전체를 통합 감독·집행하는 단일 조달청이 지침에 지정되지 않고 발주기관별 위원회가 핵심 권한을 가져 기관별 역량·공개 수준 차이가 날 수 있다&lt;/li&gt;&lt;li&gt;공고가 기관 게시판·국영신문·개별 부처 웹사이트에 분산된다. 정부 통합 Tender 페이지가 있으나 2022 지침 자체는 단일 전자조달시스템을 의무화하지 않는다&lt;/li&gt;&lt;li&gt;이의처리는 입찰위원회가 자기 절차를 먼저 조사하고, 이후 기획재정부가 사건별 부처합동팀을 구성하는 구조다. 독립 상설심판기관·법정 처리기한이 지침에 명시되지 않았다&lt;/li&gt;&lt;li&gt;2022 지침은 2017 지침과 충돌할 때만 우선하므로 위원회·기록·이의처리 규칙의 계속 적용 범위를 해석해야 한다&lt;/li&gt;&lt;li&gt;확보한 지침 영문본은 비공식 편의번역이라 미얀마어 관보 원문 대조가 남아 있다&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;진입장벽&lt;/h3&gt;&lt;ul class=&quot;plain&quot;&gt;&lt;li&gt;공고·낙찰정보의 공개 위치가 발주기관마다 달라 상시 모니터링 채널을 기관별로 구성해야 한다&lt;/li&gt;&lt;li&gt;기관별 위원회가 평가와 1차 이의처리를 모두 맡아 발주기관별 절차·관행 확인이 중요하다&lt;/li&gt;&lt;li&gt;국가안보 조달은 일반 지침 적용 제외라 공개·이의절차가 다를 수 있다&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;현장 검증 필요&lt;/h3&gt;&lt;ul class=&quot;plain&quot;&gt;&lt;li&gt;기획재정부 부처합동 이의해결팀이 2022 지침 이후에도 실제로 구성·운영되는지와 처리기한&lt;/li&gt;&lt;li&gt;정부 통합 Tender 페이지와 개별 부처 웹사이트 사이의 공고·낙찰정보 완전성&lt;/li&gt;&lt;li&gt;발주기관별 입찰접수평가위원회·품질평가인수위원회의 실제 구성과 외부위원 참여&lt;/li&gt;&lt;li&gt;입찰·계약 기록 최소 3년 보관 규칙의 2026년 현재 적용 여부&lt;/li&gt;&lt;li&gt;국가 전체 조달정책·역량개발·모니터링을 맡는 후속 중앙기관이 지정됐는지&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;관련 제도&lt;/h3&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;미얀마 공공조달 입찰제도&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;미얀마 ODA 사업 발굴·형성 절차&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;법령 원문&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;현장에서 발주처에 그대로 제시할 수 있는 조문 원문입니다. 우리 요약이 아니라 verbatim이며,
    조문 번호를 누르면 원문 문서로 이동합니다. 한국어 요지 아래로 직역(참고용)을 펼칠 수 있습니다.&lt;/p&gt;
  &lt;div class=&quot;quotes&quot;&gt;&lt;div class=&quot;qc&quot;&gt;
  &lt;div class=&quot;qhd&quot;&gt;
    &lt;span class=&quot;qart&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.lincolnmyanmar.com/wp-content/uploads/2019/04/Tender-procedure-Presidents-Office-1-2017_NoCopy.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;¶8&lt;/a&gt;&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;President’s Office Directive No. 1/2017&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;qtext&quot;&gt;A “Tender Committee”, “Committee for Calculating the Floor Price”, “Tender Acceptance and Evaluation Committee” and “Tender Quality Assurance and Acceptance Committee“ shall be established for the Union, Region and State government departments and organizations for construction, purchases, procurement of services, lease and sales.&lt;/div&gt;
  &lt;p class=&quot;qgist&quot;&gt;발주기관별로 입찰·평가·품질인수 등 기능별 위원회를 구성한다.&lt;/p&gt;

&lt;/div&gt;&lt;div class=&quot;qc&quot;&gt;
  &lt;div class=&quot;qhd&quot;&gt;
    &lt;span class=&quot;qart&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.lincolnmyanmar.com/wp-content/uploads/2019/04/Tender-procedure-Presidents-Office-1-2017_NoCopy.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;¶43&lt;/a&gt;&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;President’s Office Directive No. 1/2017&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;qtext&quot;&gt;The purchasing department or organization shall record all tender procedures and maintain the following for at least 3 years. (a) Received bids. (b) Evaluation report. (c) Record of the Tender Committee. (d) Contracts that are signed. (e) Payment information. (f) Receipts. (g) Other related documents.&lt;/div&gt;
  &lt;p class=&quot;qgist&quot;&gt;입찰·평가·계약·지급 기록을 최소 3년 보관한다.&lt;/p&gt;

&lt;/div&gt;&lt;div class=&quot;qc&quot;&gt;
  &lt;div class=&quot;qhd&quot;&gt;
    &lt;span class=&quot;qart&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.lincolnmyanmar.com/wp-content/uploads/2019/04/Tender-procedure-Presidents-Office-1-2017_NoCopy.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;¶¶46-47&lt;/a&gt;&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;President’s Office Directive No. 1/2017&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;qtext&quot;&gt;The Tender Committee shall investigate if a bidder complains about a grievance stemming from the tender selection process with sufficient evidence. If he/she is not satisfied with the decision of the Tender Committee, the Ministry of Planning and Finance shall establish a complaint resolution team with the permission of the Union government comprising at least 3 representatives from the ministries. ... The decision of the complaint resolution team shall be final and binding.&lt;/div&gt;
  &lt;p class=&quot;qgist&quot;&gt;입찰위원회 1차 조사 뒤 기획재정부 부처합동팀이 최종·구속적 결정을 내린다.&lt;/p&gt;

&lt;/div&gt;&lt;div class=&quot;qc&quot;&gt;
  &lt;div class=&quot;qhd&quot;&gt;
    &lt;span class=&quot;qart&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.lincolnmyanmar.com/wp-content/uploads/2023/02/SAC-Procurement-Directive.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;¶9&lt;/a&gt;&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;Office of the State Administration Council Directive No. 1/2022&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;qtext&quot;&gt;When using the tendering methods in paragraphs 7 and 8 above, purchases of less than 100 million kyats may be decided by a meeting of the management committee ... and purchases above 100 million kyats may be made with the approval of the chairman of the State Administration Council or the Union government.&lt;/div&gt;
  &lt;p class=&quot;qgist&quot;&gt;제한·직접조달은 1억 짯을 기준으로 승인 수준이 갈린다.&lt;/p&gt;

&lt;/div&gt;&lt;div class=&quot;qc&quot;&gt;
  &lt;div class=&quot;qhd&quot;&gt;
    &lt;span class=&quot;qart&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.lincolnmyanmar.com/wp-content/uploads/2023/02/SAC-Procurement-Directive.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;¶28&lt;/a&gt;&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;Office of the State Administration Council Directive No. 1/2022&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;qtext&quot;&gt;If there are contradictions between the directives and the notification in paragraph 27 above and this directive, this directive shall prevail.&lt;/div&gt;
  &lt;p class=&quot;qgist&quot;&gt;거버넌스 세부규칙도 충돌하는 범위에서는 2022 지침을 우선한다.&lt;/p&gt;

&lt;/div&gt;&lt;/div&gt;
&lt;/section&gt;



&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;검증&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;2022 지침의 입찰위원회 정의·비경쟁 방식 승인·우선규칙을 조항별로 확인하고, 2017 지침의 위원회 구성·3년 기록보관·반부패 제재·2단계 이의처리를 보충 대조했다. 미얀마 정부 통합 포털의 Tender 목록과 2026년 조달 가이드로 현재 공개 구조를 교차 확인했다.&lt;/p&gt;
  &lt;div class=&quot;cards&quot;&gt;
    &lt;div class=&quot;card span2&quot;&gt;&lt;h3&gt;검증 범위&lt;/h3&gt;
      &lt;p style=&quot;margin:0;font-size:13.5px;line-height:1.7&quot;&gt;발주기관별 위원회 구조, 제한·직접조달 승인, 기록보관, 부패·담합 제재, 이의처리, 공고 채널을 확인했다. 2022년 이후 이의해결팀의 실제 운영, 단일 중앙 감독기관 지정 여부, 기관별 공고 완전성은 확인하지 못했다.&lt;/p&gt;
      &lt;p style=&quot;margin:12px 0 0;font-size:12.5px;color:var(--muted)&quot;&gt;확인일 2026-07-26 · 자료집 기준일 2026-07-26&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;대조에 쓴 원문&lt;/h3&gt;&lt;ul class=&quot;srcs&quot; style=&quot;padding-left:16px;margin:0&quot;&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.lincolnmyanmar.com/wp-content/uploads/2023/02/SAC-Procurement-Directive.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Directive on public procurement, and on the disposal and lease of state-owned assets&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;지침·정책&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;대조 조문 ¶¶2(l), 3-10, 14-16, 25-28&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-26 · Office of the State Administration Council (English convenience translation by Lincoln Legal Services)&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.lincolnmyanmar.com/wp-content/uploads/2019/04/Tender-procedure-Presidents-Office-1-2017_NoCopy.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Tender procedures to be followed by government departments and organizations in construction, purchase, procurement of services, lease and sale&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;지침·정책&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;대조 조문 ¶¶4, 8-15, 43-48, 50&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-26 · President’s Office (English convenience translation by Lincoln Legal Services)&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.myanmar.gov.mm/law-justice/tender&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Myanmar National Portal — Tender&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;지침·정책&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-26 · Government of Myanmar&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.ahp.id/clientalert/2026-05-21_Guide-to-Procurement-of-Infrastructure-Projects-in-Southeast-Asia.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Guide to Procurement of Infrastructure Projects in Southeast Asia (2026)&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;지침·정책&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;대조 조문 Myanmar chapter pp.39-44&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-26 · Rajah &amp;amp; Tann Asia&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card span2&quot;&gt;&lt;h3&gt;주의&lt;/h3&gt;&lt;p class=&quot;note&quot;&gt;미얀마는 KOICA 2026 아시아 및 태평양 자료집 미수록 보강 국가다. 현행 지침에서 직접 거버넌스 구조를 정규화했다.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;2022 지침은 발주기관별 입찰위원회를 정의하지만 국가 전체 조달을 통합 감독하는 상설 중앙조달기관을 별도로 지정하지 않는다.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;2017 지침의 이의처리(¶¶46-47)는 2022 지침에 같은 주제의 대체 규정이 없어 보충적으로 남는 것으로 정리했다. 실제 계속 적용은 현지 확인이 필요하다.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;영문 지침은 비공식 편의번역이며, 기관 명칭과 승인권자는 미얀마어 관보 원문에서 재확인해야 한다.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;h3 style=&quot;font-size:14px;margin:26px 0 12px&quot;&gt;확인하지 못한 것&lt;/h3&gt;&lt;div class=&quot;card&quot; style=&quot;margin-bottom:12px&quot;&gt;&lt;h3&gt;2022년 이후 조달 이의해결팀 운영지침·결정례 &lt;span class=&quot;badge plain muted&quot;&gt;no-public-text&lt;/span&gt;&lt;/h3&gt;&lt;p style=&quot;margin:0 0 8px;font-size:13.5px&quot;&gt;2017 지침은 사건별 이의해결팀 구성만 정하고 신청기한·처리기한·결정 공개방식의 세부규칙을 제시하지 않는다.&lt;/p&gt;&lt;p style=&quot;margin:0;font-size:13px;color:var(--muted)&quot;&gt;다음 조치 — 발주부처와 기획재정부에 현행 이의신청 창구·기한·결정 공개 여부를 확인한다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; style=&quot;margin-bottom:12px&quot;&gt;&lt;h3&gt;통합 조달감독기관 또는 후속 공공조달법 &lt;span class=&quot;badge plain muted&quot;&gt;no-public-text&lt;/span&gt;&lt;/h3&gt;&lt;p style=&quot;margin:0 0 8px;font-size:13.5px&quot;&gt;2020년까지 논의된 Public Procurement and Asset Disposal Bill의 제정 여부와 후속 중앙기관 설치를 공식 법령목록에서 확정하지 못했다.&lt;/p&gt;&lt;p style=&quot;margin:0;font-size:13px;color:var(--muted)&quot;&gt;다음 조치 — 미얀마어 관보·기획재정부 최신 법령목록에서 법 제정 및 중앙감독기관 설치 여부를 확인한다.&lt;/p&gt;&lt;/div&gt;
  &lt;p style=&quot;margin:22px 0 0;font-size:12.5px;color:var(--muted)&quot;&gt;
    원문 링크 연결 — 조문의 존재와 문언 일치만 뜻합니다. 법적 해석·적용 타당성·개정 반영 여부는 별도 검토 대상입니다.
  &lt;/p&gt;
&lt;/section&gt;
&lt;/div&gt;

function draw(){
  var board=document.getElementById(&#x27;board&#x27;),svg=document.getElementById(&#x27;edges&#x27;);
  if(!board||!svg)return;
  var bb=board.getBoundingClientRect();
  svg.setAttribute(&#x27;viewBox&#x27;,&#x27;0 0 &#x27;+board.scrollWidth+&#x27; &#x27;+board.scrollHeight);
  svg.setAttribute(&#x27;width&#x27;,board.scrollWidth); svg.setAttribute(&#x27;height&#x27;,board.scrollHeight);
  var cs=getComputedStyle(document.documentElement);
  var C={sequence:cs.getPropertyValue(&#x27;--muted&#x27;).trim(),
         message:cs.getPropertyValue(&#x27;--back&#x27;).trim(),
         loop:cs.getPropertyValue(&#x27;--warn&#x27;).trim()};
  var d=&#x27;&lt;defs&gt;&#x27;;
  [&#x27;sequence&#x27;,&#x27;message&#x27;,&#x27;loop&#x27;].forEach(function(t){
    d+=&#x27;&lt;marker id=&quot;m-&#x27;+t+&#x27;&quot; viewBox=&quot;0 0 8 8&quot; refX=&quot;7&quot; refY=&quot;4&quot; markerWidth=&quot;6&quot; markerHeight=&quot;6&quot; orient=&quot;auto&quot;&gt;&#x27;
      +&#x27;&lt;path d=&quot;M0 0 L8 4 L0 8 z&quot; fill=&quot;&#x27;+C[t]+&#x27;&quot;/&gt;&lt;/marker&gt;&#x27;;
  });
  d+=&#x27;&lt;/defs&gt;&#x27;;
  var GAP=5;
  function rel(rc){return {x:rc.left-bb.left+board.scrollLeft, y:rc.top-bb.top+board.scrollTop,
                            r:rc.right-bb.left+board.scrollLeft, b:rc.bottom-bb.top+board.scrollTop,
                            w:rc.width, h:rc.height};}
  function box(id){
    var el=board.querySelector(&#x27;.node[data-id=&quot;&#x27;+id+&#x27;&quot;]&#x27;);
    if(!el)return null; return rel(el.getBoundingClientRect());
  }

  /* 라우팅은 korea100studio의 거터 라우팅을 우리 그리드에 이식한 것이다.
     핵심: 카드를 지나야 하는 선은 카드가 없는 거터(행 하단·열 측면)로 우회한다.
     DOM에서 노드·행·열을 실측할 수 있어, 여러 직교 경로 후보를 만들고
     무관한 카드를 가장 적게 관통하는(동수면 가장 짧은) 것을 고른다. */

  // 장애물(모든 노드)과 거터(노드 없는 띠) 실측
  var OB=[];
  board.querySelectorAll(&#x27;.node&#x27;).forEach(function(el){ var r=box(el.dataset.id); r.id=el.dataset.id; OB.push(r); });
  var rowGut=[], colGut=[];
  board.querySelectorAll(&#x27;.brow:not(.head)&#x27;).forEach(function(el){ var r=rel(el.getBoundingClientRect());
    rowGut.push(r.y+9); rowGut.push(r.b-9); });
  var hc=board.querySelectorAll(&#x27;.brow.head .bcell&#x27;);
  for(var i=1;i&lt;hc.length;i++){ var r=rel(hc[i].getBoundingClientRect()); colGut.push(r.x+11); colGut.push(r.r-11); }

  function segHit(ax,ay,bx,by,e1,e2){
    var n=0, M=3;
    for(var i=0;i&lt;OB.length;i++){ var o=OB[i]; if(o.id===e1||o.id===e2) continue;
      var L=o.x+M,R=o.r-M,T=o.y+M,B=o.b-M;
      if(Math.abs(ay-by)&lt;0.5){ if(ay&gt;T&amp;&amp;ay&lt;B &amp;&amp; Math.max(ax,bx)&gt;L &amp;&amp; Math.min(ax,bx)&lt;R) n++; }
      else { if(ax&gt;L&amp;&amp;ax&lt;R &amp;&amp; Math.max(ay,by)&gt;T &amp;&amp; Math.min(ay,by)&lt;B) n++; }
    } return n;
  }
  function uniq(pts){ return pts.filter(function(p,i){ return i===0 || Math.abs(p.x-pts[i-1].x)&gt;0.5 || Math.abs(p.y-pts[i-1].y)&gt;0.5; }); }
  function score(pts,e1,e2){ pts=uniq(pts); var p=0,l=0;
    for(var i=0;i&lt;pts.length-1;i++){ p+=segHit(pts[i].x,pts[i].y,pts[i+1].x,pts[i+1].y,e1,e2);
      l+=Math.abs(pts[i].x-pts[i+1].x)+Math.abs(pts[i].y-pts[i+1].y); }
    return {pts:pts,p:p,l:l}; }

  function route(a,b,ed){
    var acx=a.x+a.w/2,acy=a.y+a.h/2,bcx=b.x+b.w/2,bcy=b.y+b.h/2, e1=ed.source,e2=ed.target, cs=[];
    // 세로 계열 — a의 위/아래 변에서 나가 b의 위/아래 변으로
    var below=bcy&gt;acy, sp={x:acx,y:below?a.b:a.y}, tp={x:bcx,y:below?b.y:b.b}, tg={x:tp.x,y:tp.y+(below?-GAP:GAP)};
    cs.push(score([sp,{x:sp.x,y:tg.y},tg,tp],e1,e2));                                   // 직선/L
    rowGut.forEach(function(my){ if(my&gt;Math.min(sp.y,tp.y)+6&amp;&amp;my&lt;Math.max(sp.y,tp.y)-6)   // 행 거터 크로스
      cs.push(score([sp,{x:sp.x,y:my},{x:tp.x,y:my},tg,tp],e1,e2)); });
    colGut.forEach(function(gx){                                                          // 열 측면 탈출
      var as={x:gx&gt;acx?a.r:a.x,y:acy};
      cs.push(score([as,{x:gx,y:acy},{x:gx,y:tg.y},tg,tp],e1,e2)); });
    // 가로 계열 — a의 좌/우 변에서 나가 b의 좌/우 변으로
    var right=bcx&gt;acx, sp2={x:right?a.r:a.x,y:acy}, tp2={x:right?b.x:b.r,y:bcy}, tg2={x:tp2.x+(right?-GAP:GAP),y:tp2.y};
    cs.push(score([sp2,{x:tg2.x,y:sp2.y},tg2,tp2],e1,e2));
    colGut.forEach(function(mx){ if(mx&gt;Math.min(sp2.x,tp2.x)+6&amp;&amp;mx&lt;Math.max(sp2.x,tp2.x)-6)
      cs.push(score([sp2,{x:mx,y:sp2.y},{x:mx,y:tp2.y},tg2,tp2],e1,e2)); });
    rowGut.forEach(function(gy){                                                          // 행 거터 우회
      var as={x:acx,y:gy&gt;acy?a.b:a.y};
      cs.push(score([as,{x:acx,y:gy},{x:tp2.x,y:gy},tg2,tp2],e1,e2)); });
    // 회귀선 — 아래로 크게 우회 (되돌아가는 흐름을 시각적으로 구분)
    if(ed.type===&#x27;loop&#x27;){ var gy=Math.max(a.b,b.b)+26;
      cs.push(score([{x:acx,y:a.b},{x:acx,y:gy},{x:bcx,y:gy},{x:bcx,y:b.b+GAP},{x:bcx,y:b.b}],e1,e2)); }
    cs=cs.filter(function(c){return c.pts.length&gt;=2;});
    cs.sort(function(x,y){ return x.p-y.p || x.l-y.l; });
    return cs[0];
  }

  function rnd(v){return Math.round(v*10)/10;}
  function orthPath(pts){                    // 직교 경로 + 모서리 라운딩
    pts=uniq(pts); if(pts.length&lt;2)return &#x27;&#x27;;
    var d=&#x27;M&#x27;+rnd(pts[0].x)+&#x27; &#x27;+rnd(pts[0].y);
    for(var i=1;i&lt;pts.length-1;i++){
      var p=pts[i-1],c=pts[i],n=pts[i+1];
      var d1=Math.hypot(c.x-p.x,c.y-p.y)||1, d2=Math.hypot(n.x-c.x,n.y-c.y)||1, r=Math.min(7,d1/2,d2/2);
      d+=&#x27; L&#x27;+rnd(c.x-(c.x-p.x)/d1*r)+&#x27; &#x27;+rnd(c.y-(c.y-p.y)/d1*r);
      d+=&#x27; Q&#x27;+rnd(c.x)+&#x27; &#x27;+rnd(c.y)+&#x27; &#x27;+rnd(c.x+(n.x-c.x)/d2*r)+&#x27; &#x27;+rnd(c.y+(n.y-c.y)/d2*r);
    }
    var e=pts[pts.length-1]; return d+&#x27; L&#x27;+rnd(e.x)+&#x27; &#x27;+rnd(e.y);
  }

  EDGES.forEach(function(ed){
    var a=box(ed.source),b=box(ed.target); if(!a||!b)return;
    var t=ed.type||&#x27;sequence&#x27;, rt=route(a,b,ed);
    d+=&#x27;&lt;path d=&quot;&#x27;+orthPath(rt.pts)+&#x27;&quot; fill=&quot;none&quot; stroke=&quot;&#x27;+C[t]+&#x27;&quot; stroke-width=&quot;1.5&quot; opacity=&quot;&#x27;
      +(t===&#x27;sequence&#x27;?&#x27;.55&#x27;:&#x27;.8&#x27;)+&#x27;&quot;&#x27;+(t!==&#x27;sequence&#x27;?&#x27; stroke-dasharray=&quot;4 3&quot;&#x27;:&#x27;&#x27;)
      +&#x27; marker-end=&quot;url(#m-&#x27;+t+&#x27;)&quot;/&gt;&#x27;;
  });
  svg.innerHTML=d;
}

var KIND={&quot;act&quot;: &quot;법률&quot;, &quot;regulation&quot;: &quot;시행규칙&quot;, &quot;ordinance&quot;: &quot;명령·조례&quot;, &quot;directive&quot;: &quot;지침·정책&quot;, &quot;standard-document&quot;: &quot;표준문서&quot;, &quot;treaty-agreement&quot;: &quot;양자합의&quot;, &quot;donor-rule&quot;: &quot;공여기관 규정&quot;, &quot;practice&quot;: &quot;현장 관행&quot;};
function openNode(id){
  var n=NODES[id]; if(!n)return;
  var h=&#x27;&lt;span class=&quot;badge plain muted&quot;&gt;&#x27;+n.id+&#x27;&lt;/span&gt; &#x27;
       +&#x27;&lt;span class=&quot;badge plain muted&quot;&gt;&#x27;+n.lane+&#x27;&lt;/span&gt; &#x27;
       +&#x27;&lt;span class=&quot;badge plain muted&quot;&gt;&#x27;+n.stage+&#x27;&lt;/span&gt;&#x27;;
  h+=&#x27;&lt;h3&gt;&#x27;+n.name+&#x27;&lt;/h3&gt;&#x27;;
  h+=&#x27;&lt;dl class=&quot;kv&quot;&gt;&#x27;;
  h+=&#x27;&lt;dt&gt;담당&lt;/dt&gt;&lt;dd&gt;&#x27;+n.actor+&#x27;&lt;/dd&gt;&#x27;;
  if(n.action) h+=&#x27;&lt;dt&gt;내용&lt;/dt&gt;&lt;dd&gt;&#x27;+n.action+&#x27;&lt;/dd&gt;&#x27;;
  if(n.deadline) h+=&#x27;&lt;dt&gt;기한&lt;/dt&gt;&lt;dd&gt;&#x27;+n.deadline+&#x27;&lt;/dd&gt;&#x27;;
  if(n.output_documents&amp;&amp;n.output_documents.length)
    h+=&#x27;&lt;dt&gt;산출 문서&lt;/dt&gt;&lt;dd&gt;&#x27;+n.output_documents.join(&#x27; · &#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  if(n.blocker) h+=&#x27;&lt;dt&gt;병목&lt;/dt&gt;&lt;dd style=&quot;color:var(--warn)&quot;&gt;&#x27;+n.blocker+&#x27;&lt;/dd&gt;&#x27;;
  if(n.legal_basis&amp;&amp;n.legal_basis.length){
    h+=&#x27;&lt;dt&gt;근거 조문&lt;/dt&gt;&lt;dd&gt;&#x27;+n.legal_basis.map(function(l){
      var nm=l.url?&#x27;&lt;a class=&quot;ref&quot; href=&quot;&#x27;+l.url+&#x27;&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;&#x27;+l.law+&#x27;&lt;/a&gt;&#x27;:l.law;
      return &#x27;&lt;div style=&quot;margin-bottom:4px&quot;&gt;&#x27;+nm+&#x27; &lt;code&gt;&#x27;+l.article+&#x27;&lt;/code&gt;&lt;/div&gt;&#x27;;}).join(&#x27;&#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  }
  if(typeof n.confidence===&#x27;number&#x27;){
    h+=&#x27;&lt;dt&gt;법령 근거 확신도&lt;/dt&gt;&lt;dd&gt;&#x27;+n.confidence.toFixed(2)
      +(n.confidence&lt;0.8?&#x27; &lt;span class=&quot;badge warn&quot;&gt;현장 검증 필요&lt;/span&gt;&#x27;:&#x27;&#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  }
  var ins=EDGES.filter(function(x){return x.target===id}),
      outs=EDGES.filter(function(x){return x.source===id});
  if(ins.length) h+=&#x27;&lt;dt&gt;선행&lt;/dt&gt;&lt;dd&gt;&#x27;+ins.map(function(x){
    return (NODES[x.source]?NODES[x.source].name:x.source)+(x.label?&#x27; (&#x27;+x.label+&#x27;)&#x27;:&#x27;&#x27;);}).join(&#x27; · &#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  if(outs.length) h+=&#x27;&lt;dt&gt;후속&lt;/dt&gt;&lt;dd&gt;&#x27;+outs.map(function(x){
    return (NODES[x.target]?NODES[x.target].name:x.target)+(x.label?&#x27; (&#x27;+x.label+&#x27;)&#x27;:&#x27;&#x27;);}).join(&#x27; · &#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  h+=&#x27;&lt;/dl&gt;&#x27;;
  document.getElementById(&#x27;dbody&#x27;).innerHTML=h;
  document.getElementById(&#x27;dlg&#x27;).showModal();
}

document.querySelectorAll(&#x27;.node&#x27;).forEach(function(b){
  b.addEventListener(&#x27;click&#x27;,function(){openNode(b.dataset.id)});
  b.addEventListener(&#x27;mouseenter&#x27;,function(){
    var id=b.dataset.id;
    var rel={};rel[id]=1;
    EDGES.forEach(function(x){if(x.source===id)rel[x.target]=1;if(x.target===id)rel[x.source]=1;});
    document.querySelectorAll(&#x27;.node&#x27;).forEach(function(o){o.classList.toggle(&#x27;dim&#x27;,!rel[o.dataset.id])});
  });
  b.addEventListener(&#x27;mouseleave&#x27;,function(){
    document.querySelectorAll(&#x27;.node&#x27;).forEach(function(o){o.classList.remove(&#x27;dim&#x27;)});
  });
});
document.getElementById(&#x27;dlg&#x27;).addEventListener(&#x27;click&#x27;,function(ev){
  if(ev.target===this) this.close();
});

addEventListener(&#x27;load&#x27;,draw); addEventListener(&#x27;resize&#x27;,draw);
new MutationObserver(draw).observe(document.documentElement,{attributes:true,attributeFilter:[&#x27;data-theme&#x27;]});

&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;한 장 캔버스&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;수원부처와 개발파트너가 국가·부문 우선순위에 맞는 사업을 발굴하고, MIFER 산하 FERD 단일창구를 통해 정부 고위 승인, 양자 협정·MoU·교환각서 협상과 서명, AIMS 등록, 이행 모니터링으로 연결한다.&lt;/p&gt;
  &lt;div class=&quot;cards&quot;&gt;
    &lt;div class=&quot;card span2&quot;&gt;&lt;h3&gt;절차&lt;/h3&gt;&lt;ol class=&quot;steps&quot;&gt;&lt;li&gt;수원부처·정부기관 또는 개발파트너가 사회경제 개발 수요와 지원 가능성을 협의&lt;/li&gt;&lt;li&gt;단일 또는 복수 수원기관 중 선도 정부기관을 정하고 국가·부문·지역 계획과 중복 여부를 검토&lt;/li&gt;&lt;li&gt;사업개념서와 관련 문서를 FERD 단일창구에 제출 — 주/지역 정부 제안은 해당 최고책임자 사전승인 확인&lt;/li&gt;&lt;li&gt;FERD가 DACU 검토와 필요한 고위 승인 절차를 조정하고, 승인된 제안을 개발파트너에 공식 전달&lt;/li&gt;&lt;li&gt;개발파트너가 자체 심사·승인을 진행하고 수원기관과 전체 사업설계·예산·조달계획을 구체화&lt;/li&gt;&lt;li&gt;FERD가 양자협정·MoU·Exchange of Notes 초안에 관계부처 법률의견을 취합하고 개발파트너와 협상&lt;/li&gt;&lt;li&gt;최종안을 경제·정부 고위 승인회의에 상정 — 현행 승인기관 명칭과 권한은 서명 전 재확인&lt;/li&gt;&lt;li&gt;권한 있는 당사자가 협정·MoU·교환각서를 서명하고 FERD·AIMS에 사업정보와 문서를 등록&lt;/li&gt;&lt;li&gt;수원부처와 개발파트너가 PMU·PSC로 사업을 이행하고 FERD가 분기보고·제약사항·중복을 모니터링&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;적용 대상&lt;/h3&gt;&lt;p style=&quot;margin:0;font-size:13.5px;line-height:1.7&quot;&gt;미얀마 정부기관과 공식 협정·MoU·교환각서 등으로 연결되는 양자·다자 무상, 양허성 차관, 기술협력 사업에 적용한다. 개발파트너가 미얀마 정부기관과 공식 협정 없이 독립적으로 재원조달·집행하는 독립사업은 2020 DAP 승인절차의 적용 제외다. 2020 DAP는 MIFER를 DACU 심의의 단일창구로 정하고 사업개념 승인→최종 설계 승인→협정 서명→FERD 보고를 규정했으나, 2021년 이후 정부구조 변화로 경제위원회·DACU·최종 승인기관의 정확한 현행 권한은 서명 전에 확인해야 한다.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;법적 근거&lt;/h3&gt;&lt;div class=&quot;law&quot;&gt;&lt;span class=&quot;nm&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://lift-fund.org/sites/lift-fund.org/files/publication/gov_myanmar-dap_2020-compressed.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Myanmar Development Assistance Policy, September 2020&lt;/a&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;§§6.1-6.4, Annex A §§10.1-10.4&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:auto&quot;&gt;지침·정책&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;law&quot;&gt;&lt;span class=&quot;nm&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://mifer.gov.mm/en/about-ferd&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;MIFER/FERD official functions and responsibilities&lt;/a&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:auto&quot;&gt;지침·정책&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;law&quot;&gt;&lt;span class=&quot;nm&quot;&gt;양자 개발협력협정·MoU·Exchange of Notes&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:auto&quot;&gt;양자합의&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;law&quot;&gt;&lt;span class=&quot;nm&quot;&gt;개발파트너별 사업형성·승인·조달 규정&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:auto&quot;&gt;공여기관 규정&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;law&quot;&gt;&lt;span class=&quot;nm&quot;&gt;MIFER/FERD current official functions and approval route&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:auto&quot;&gt;지침·정책&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;권한 기관&lt;/h3&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;투자대외경제관계부(MIFER) 대외경제관계국(FERD)&lt;/b&gt;&lt;span&gt;외부 무상·차관·기술지원의 정부 초점기관으로 제안 상신·협상·협정·정부 간 조정·AIMS와 사업모니터링을 담당한다.&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;개발원조조정단위(DACU)&lt;/b&gt;&lt;span&gt;FERD를 사무국으로 두고 개발원조 정책·효과성 조정을 수행한다.&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;경제위원회·국가행정평의회 관련 승인회의&lt;/b&gt;&lt;span&gt;MIFER 현행 공식 페이지에 따라 서명 전 협정안 등 고위 승인을 담당한다.&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;수원부처·주·지역정부·실행기관&lt;/b&gt;&lt;span&gt;사업을 제안·준비하고 예산·PMU/PSC·분기보고를 통해 실행한다.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;이해관계자&lt;/h3&gt;&lt;p style=&quot;margin:0;font-size:13.5px;line-height:1.7&quot;&gt;투자대외경제관계부(MIFER), 대외경제관계국(FERD), 개발원조조정단위(DACU), 관련 수원부처·주/지역 정부, 고위 승인기관, 경제위원회, 개발파트너(PID), 프로젝트관리단(PMU)·운영위원회(PSC), 기획부서·사업평가진도보고부서&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;제출서류&lt;/h3&gt;&lt;div class=&quot;docset&quot;&gt;&lt;b&gt;선도 수원부처·정부기관&lt;/b&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;Concept Proposal Form 또는 사업개념서&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;사업/프로그램 설계문서&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;재원·예산계획&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;예비 조달계획&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;협정·MoU 초안&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;주/지역 정부 제안의 최고책임자 사전승인&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;docset&quot;&gt;&lt;b&gt;FERD·DACU·고위 승인기관&lt;/b&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;관계기관 검토의견&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;DACU 검토·승인 또는 고위 승인 상신안&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;법률의견 취합본&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;최종 협정·MoU·Exchange of Notes 승인안&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;docset&quot;&gt;&lt;b&gt;개발파트너·수원부처&lt;/b&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;서명된 Grant/Concessional Loan Agreement·MoU·Exchange of Notes&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;AIMS 사업등록 정보&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;PMU·PSC 회의록&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;분기 이행보고서&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;유의사항 · 병목&lt;/h3&gt;&lt;ul class=&quot;plain&quot;&gt;&lt;li&gt;2020 DAP는 국가고문·의회·경제위원회를 전제로 작성됐고 2021년 이후 정부구조가 바뀌었다. 현재 MIFER 페이지도 국정관리평의회 회의를 적고 있어 2026년 현재 최종 승인기관 명칭·권한을 그대로 적용할 수 없다&lt;/li&gt;&lt;li&gt;사업개념 승인과 최종 설계 승인을 FERD 단일창구·DACU 검토로 두 단계 진행해 문서 품질·번역·관계기관 의견 취합이 일정에 직접 영향을 준다&lt;/li&gt;&lt;li&gt;개발파트너 자체 승인과 미얀마 정부 승인이 병렬로 필요하며, 협정안 법률의견·고위 승인이 끝나기 전에는 공식화할 수 없다&lt;/li&gt;&lt;li&gt;외부재원 조달은 개발파트너 규정이 우선할 수 있어 사업형성 단계에서 재원협정의 조달 우선순위를 확정해야 한다&lt;/li&gt;&lt;li&gt;MIFER 공식 기능 페이지와 2020 DAP는 AIMS 등록·분기보고·PMU/PSC 모니터링을 요구하나 공개 시스템의 현재 운영상태는 확인하지 못했다&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;진입장벽&lt;/h3&gt;&lt;ul class=&quot;plain&quot;&gt;&lt;li&gt;FERD 단일창구와 수원부처를 모두 거쳐야 하므로 초기에 선도 정부기관과 공식 연락경로를 확정해야 한다&lt;/li&gt;&lt;li&gt;영문 문서 품질과 미얀마어 번역 정확성이 승인 지연 요인으로 DAP에 명시돼 있다&lt;/li&gt;&lt;li&gt;현행 고위 승인기관과 서명권자를 협정 협상 초기에 서면 확인하지 않으면 최종 단계에서 재상신될 수 있다&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;현장 검증 필요&lt;/h3&gt;&lt;ul class=&quot;plain&quot;&gt;&lt;li&gt;{&amp;#x27;item&amp;#x27;: &amp;#x27;현행 기관·기본규정·핵심 적용경로&amp;#x27;, &amp;#x27;question&amp;#x27;: &amp;#x27;공식 원문이 모델의 핵심 경로와 일치하는가?&amp;#x27;, &amp;#x27;status&amp;#x27;: &amp;#x27;confirmed&amp;#x27;}&lt;/li&gt;&lt;li&gt;{&amp;#x27;item&amp;#x27;: &amp;#x27;하위규정·정량요건·개별 협정·공고&amp;#x27;, &amp;#x27;question&amp;#x27;: &amp;#x27;실제 사업 시점의 세부요건과 예외가 동일하게 적용되는가?&amp;#x27;, &amp;#x27;status&amp;#x27;: &amp;#x27;pending&amp;#x27;}&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;관련 제도&lt;/h3&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;미얀마 공공조달 입찰제도&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;미얀마 조달 거버넌스·감독체계&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;법령 원문&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;현장에서 발주처에 그대로 제시할 수 있는 조문 원문입니다. 우리 요약이 아니라 verbatim이며,
    조문 번호를 누르면 원문 문서로 이동합니다. 한국어 요지 아래로 직역(참고용)을 펼칠 수 있습니다.&lt;/p&gt;
  &lt;div class=&quot;quotes&quot;&gt;&lt;div class=&quot;qc&quot;&gt;
  &lt;div class=&quot;qhd&quot;&gt;
    &lt;span class=&quot;qart&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://lift-fund.org/sites/lift-fund.org/files/publication/gov_myanmar-dap_2020-compressed.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;§6.1 — MIFER as a Single Window&lt;/a&gt;&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;Myanmar Development Assistance Policy, September 2020&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;qtext&quot;&gt;The Ministry of Investment and Foreign Economic Relations shall be the single window for the submission of all cases requiring the DACU’s consideration prior to submission to the Economic Committee.&lt;/div&gt;
  &lt;p class=&quot;qgist&quot;&gt;개발원조 안건은 MIFER가 DACU·경제위원회 심의의 단일창구다.&lt;/p&gt;

&lt;/div&gt;&lt;div class=&quot;qc&quot;&gt;
  &lt;div class=&quot;qhd&quot;&gt;
    &lt;span class=&quot;qart&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://lift-fund.org/sites/lift-fund.org/files/publication/gov_myanmar-dap_2020-compressed.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;§6.3 — Phase 2: Project/Programme Concept Approval&lt;/a&gt;&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;Myanmar Development Assistance Policy, September 2020&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;qtext&quot;&gt;Once a project/programme concept has been agreed, the Government Entity shall submit all relevant documentation to FERD who shall prepare the case for submission to the DACU. The DACU will review the proposal and may either offer an endorsement, allowing for full Project/Programme development to begin, or convey the case to the Economic Committee for further review and approval.&lt;/div&gt;
  &lt;p class=&quot;qgist&quot;&gt;합의된 사업개념은 FERD를 통해 DACU가 검토하고 승인 또는 상위 심의로 보낸다.&lt;/p&gt;

&lt;/div&gt;&lt;div class=&quot;qc&quot;&gt;
  &lt;div class=&quot;qhd&quot;&gt;
    &lt;span class=&quot;qart&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://lift-fund.org/sites/lift-fund.org/files/publication/gov_myanmar-dap_2020-compressed.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Annex A §10.3 Step 3&lt;/a&gt;&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;Myanmar Development Assistance Policy, September 2020&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;qtext&quot;&gt;By now, the Lead Government Entity shall have gathered sufficient information to prepare the following documents (or documents comparable in nature): a draft Project/Programme/Concessional Loan Design; a draft Financing Plan; an Indicative Procurement Plan; and a draft Agreement/MoU.&lt;/div&gt;
  &lt;p class=&quot;qgist&quot;&gt;최종 승인 단계에는 설계·재원·조달계획·협정 초안을 함께 준비한다.&lt;/p&gt;

&lt;/div&gt;&lt;div class=&quot;qc&quot;&gt;
  &lt;div class=&quot;qhd&quot;&gt;
    &lt;span class=&quot;qart&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://lift-fund.org/sites/lift-fund.org/files/publication/gov_myanmar-dap_2020-compressed.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Annex A §10.3 Step 8&lt;/a&gt;&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;Myanmar Development Assistance Policy, September 2020&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;qtext&quot;&gt;Within two weeks of a Grant Agreement/MoU or Concessional Loan Agreement being signed, the Lead Government Entity shall submit to FERD for its records a copy of that Agreement/MoU and any other relevant documentation.&lt;/div&gt;
  &lt;p class=&quot;qgist&quot;&gt;협정 서명 후 2주 이내 FERD에 문서 사본을 제출한다는 2020 정책 기준이다.&lt;/p&gt;

&lt;/div&gt;&lt;div class=&quot;qc&quot;&gt;
  &lt;div class=&quot;qhd&quot;&gt;
    &lt;span class=&quot;qart&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://mifer.gov.mm/en/about-ferd&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Duties and Responsibilities of the Asia and America Division&lt;/a&gt;&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;MIFER/FERD official functions and responsibilities&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;qtext&quot;&gt;Responsibility to submit the projects proposal proposed by the relevant ministries in order to get the approval of the higher level organizations and after that, sending the project proposals to PIDs for their approval and assistance officially; Initiating and coordinating for the signing of Memorandum of Understanding (MOU), Exchange of Letters and Exchange of Notes between the two countries after the proposed projects approved by PIDs’ side;&lt;/div&gt;
  &lt;p class=&quot;qgist&quot;&gt;FERD는 수원부처 제안을 고위 승인에 상신하고 PID 승인 뒤 양자 문서 서명을 조정한다.&lt;/p&gt;

&lt;/div&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;현행 기준 반영 1건&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;공식 법령·기관 원문으로 확인한 현행 기준과 실무 확인사항입니다.
    출처는 각 항목에 연결했으며.&lt;/p&gt;
  &lt;div class=&quot;disc&quot; data-sev=&quot;high&quot;&gt;
  &lt;div class=&quot;top&quot;&gt;
    &lt;span class=&quot;badge bad&quot;&gt;필수 확인&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;미얀마&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;D01&lt;/span&gt;
  &lt;/div&gt;
  &lt;h3&gt;canvas.authorities·legalBasis / 현행 기관·법령&lt;/h3&gt;
  &lt;div class=&quot;quote act&quot;&gt;&lt;b&gt;현행 기준&lt;/b&gt;현행 MIFER/FERD 공식 페이지는 FERD의 초점기관 역할과 제안 상신, 협정안의 경제위원회·국가행정평의회 승인회의 제출, AIMS·PMU/PSC 기능을 구체적으로 명시한다. 다만 국제적 승인·대표성 문제와 비공개 SOP는 별도 법률검토가 필요하다.&lt;/div&gt;
  &lt;p class=&quot;cite&quot;&gt;확인 출처 · MIFER/FERD current official functions; 2020 DAP&lt;/p&gt;
  &lt;div class=&quot;todo&quot;&gt;&lt;b&gt;실무 확인&lt;/b&gt;Obtain written FERD confirmation for the grant/loan approval authority and signatory, and separately assess recognition and sanctions constraints.&lt;/div&gt;
  &lt;details class=&quot;review&quot;&gt;
  &lt;summary&gt;Field verification (English)&lt;/summary&gt;
  &lt;div class=&quot;rv&quot;&gt;
    &lt;p&gt;&lt;b&gt;Current legal basis&lt;/b&gt; — 현행 MIFER/FERD 공식 페이지는 FERD의 초점기관 역할과 제안 상신, 협정안의 경제위원회·국가행정평의회 승인회의 제출, AIMS·PMU/PSC 기능을 구체적으로 명시한다. 다만 국제적 승인·대표성 문제와 비공개 SOP는 별도 법률검토가 필요하다.&lt;/p&gt;
    &lt;p class=&quot;rv-verify&quot;&gt;&lt;b&gt;✔ Verify&lt;/b&gt; — Obtain written FERD confirmation for the grant/loan approval authority and signatory, and separately assess recognition and sanctions constraints.&lt;/p&gt;
  &lt;/div&gt;
&lt;/details&gt;

  &lt;p class=&quot;act-row&quot;&gt;산출물 반영 — 현재 운영기관의 공식 공개 경로를 우선 반영하고 2020 정책과의 제도변경 및 법률적 불확실성을 명시했다.&lt;/p&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;검증&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;공식 정부·법령·조달·대외재원 기관의 현행 원문에서 기본규정, 시행시점, 기관 권한과 적용경로를 확인해 구조화본과 대조했다.&lt;/p&gt;
  &lt;div class=&quot;cards&quot;&gt;
    &lt;div class=&quot;card span2&quot;&gt;&lt;h3&gt;검증 범위&lt;/h3&gt;
      &lt;p style=&quot;margin:0;font-size:13.5px;line-height:1.7&quot;&gt;공식 원문으로 핵심 법령·기관·제도변경을 확인했다. 모든 하위규정·정량요건·개별 협정·공고의 전 조문 대조는 완료하지 않아 law-linked로 분류한다.&lt;/p&gt;
      &lt;p style=&quot;margin:12px 0 0;font-size:12.5px;color:var(--muted)&quot;&gt;확인일 2026-07-28 · 자료집 기준일 2026-07-26&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;대조에 쓴 원문&lt;/h3&gt;&lt;ul class=&quot;srcs&quot; style=&quot;padding-left:16px;margin:0&quot;&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://mifer.gov.mm/en/about-ferd&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;About FERD&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;지침·정책&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;대조 조문 Functions; Asia and America Division; Development Management and Coordination Division; Legal Section&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-26 · Ministry of Investment and Foreign Economic Relations, Myanmar&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://lift-fund.org/sites/lift-fund.org/files/publication/gov_myanmar-dap_2020-compressed.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Myanmar Development Assistance Policy, September 2020&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;지침·정책&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;대조 조문 §§6.1-6.4; Annex A §§10.1-10.4&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-26 · Foreign Economic Relations Department, Ministry of Investment and Foreign Economic Relations&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://mifer.gov.mm/en/publications&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;MIFER Publications — Myanmar Development Assistance Policy&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;지침·정책&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-26 · Ministry of Investment and Foreign Economic Relations, Myanmar&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card span2&quot;&gt;&lt;h3&gt;주의&lt;/h3&gt;&lt;p class=&quot;note&quot;&gt;공식 정부·법령·담당기관 출처로 현행 근거와 핵심 역할을 확인했다.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;정량요건·하위규정·개별 공여협정·공고와 정치·제재 위험은 실제 사업 착수 전에 재확인해야 한다.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;h3 style=&quot;font-size:14px;margin:26px 0 12px&quot;&gt;확인하지 못한 것&lt;/h3&gt;&lt;div class=&quot;card&quot; style=&quot;margin-bottom:12px&quot;&gt;&lt;h3&gt;현행 하위규정·정량요건·개별 공여협정 및 실제 공고 &lt;span class=&quot;badge plain muted&quot;&gt;no-public-text&lt;/span&gt;&lt;/h3&gt;&lt;p style=&quot;margin:0 0 8px;font-size:13.5px&quot;&gt;핵심 공식 근거와 기관은 확인했으나 비공개 SOP, 정량요건, 모든 예외와 실제 사업문서를 전 조문 대조하지 않았다.&lt;/p&gt;&lt;p style=&quot;margin:0;font-size:13px;color:var(--muted)&quot;&gt;다음 조치 — Obtain written FERD confirmation for the grant/loan approval authority and signatory, and separately assess recognition and sanctions constraints.&lt;/p&gt;&lt;/div&gt;
  &lt;p style=&quot;margin:22px 0 0;font-size:12.5px;color:var(--muted)&quot;&gt;
    원문 링크 연결 — 조문의 존재와 문언 일치만 뜻합니다. 법적 해석·적용 타당성·개정 반영 여부는 별도 검토 대상입니다.
  &lt;/p&gt;
&lt;/section&gt;
&lt;/div&gt;

/* 엣지 그리기 — 노드 DOM 위치를 재서 SVG로 연결 */
function draw(){
  var board=document.getElementById(&#x27;board&#x27;),svg=document.getElementById(&#x27;edges&#x27;);
  if(!board||!svg)return;
  var bb=board.getBoundingClientRect();
  svg.setAttribute(&#x27;viewBox&#x27;,&#x27;0 0 &#x27;+board.scrollWidth+&#x27; &#x27;+board.scrollHeight);
  svg.setAttribute(&#x27;width&#x27;,board.scrollWidth); svg.setAttribute(&#x27;height&#x27;,board.scrollHeight);
  var cs=getComputedStyle(document.documentElement);
  var C={sequence:cs.getPropertyValue(&#x27;--muted&#x27;).trim(),
         message:cs.getPropertyValue(&#x27;--back&#x27;).trim(),
         loop:cs.getPropertyValue(&#x27;--warn&#x27;).trim()};
  var d=&#x27;&lt;defs&gt;&#x27;;
  [&#x27;sequence&#x27;,&#x27;message&#x27;,&#x27;loop&#x27;].forEach(function(t){
    d+=&#x27;&lt;marker id=&quot;m-&#x27;+t+&#x27;&quot; viewBox=&quot;0 0 8 8&quot; refX=&quot;7&quot; refY=&quot;4&quot; markerWidth=&quot;6&quot; markerHeight=&quot;6&quot; orient=&quot;auto&quot;&gt;&#x27;
      +&#x27;&lt;path d=&quot;M0 0 L8 4 L0 8 z&quot; fill=&quot;&#x27;+C[t]+&#x27;&quot;/&gt;&lt;/marker&gt;&#x27;;
  });
  d+=&#x27;&lt;/defs&gt;&#x27;;
  var GAP=5;
  function rel(rc){return {x:rc.left-bb.left+board.scrollLeft, y:rc.top-bb.top+board.scrollTop,
                            r:rc.right-bb.left+board.scrollLeft, b:rc.bottom-bb.top+board.scrollTop,
                            w:rc.width, h:rc.height};}
  function box(id){
    var el=board.querySelector(&#x27;.node[data-id=&quot;&#x27;+id+&#x27;&quot;]&#x27;);
    if(!el)return null; return rel(el.getBoundingClientRect());
  }

  /* 라우팅은 korea100studio의 거터 라우팅을 우리 그리드에 이식한 것이다.
     핵심: 카드를 지나야 하는 선은 카드가 없는 거터(행 하단·열 측면)로 우회한다.
     DOM에서 노드·행·열을 실측할 수 있어, 여러 직교 경로 후보를 만들고
     무관한 카드를 가장 적게 관통하는(동수면 가장 짧은) 것을 고른다. */

  // 장애물(모든 노드)과 거터(노드 없는 띠) 실측
  var OB=[];
  board.querySelectorAll(&#x27;.node&#x27;).forEach(function(el){ var r=box(el.dataset.id); r.id=el.dataset.id; OB.push(r); });
  var rowGut=[], colGut=[];
  board.querySelectorAll(&#x27;.brow:not(.head)&#x27;).forEach(function(el){ var r=rel(el.getBoundingClientRect());
    rowGut.push(r.y+9); rowGut.push(r.b-9); });
  var hc=board.querySelectorAll(&#x27;.brow.head .bcell&#x27;);
  for(var i=1;i&lt;hc.length;i++){ var r=rel(hc[i].getBoundingClientRect()); colGut.push(r.x+11); colGut.push(r.r-11); }

  function segHit(ax,ay,bx,by,e1,e2){
    var n=0, M=3;
    for(var i=0;i&lt;OB.length;i++){ var o=OB[i]; if(o.id===e1||o.id===e2) continue;
      var L=o.x+M,R=o.r-M,T=o.y+M,B=o.b-M;
      if(Math.abs(ay-by)&lt;0.5){ if(ay&gt;T&amp;&amp;ay&lt;B &amp;&amp; Math.max(ax,bx)&gt;L &amp;&amp; Math.min(ax,bx)&lt;R) n++; }
      else { if(ax&gt;L&amp;&amp;ax&lt;R &amp;&amp; Math.max(ay,by)&gt;T &amp;&amp; Math.min(ay,by)&lt;B) n++; }
    } return n;
  }
  function uniq(pts){ return pts.filter(function(p,i){ return i===0 || Math.abs(p.x-pts[i-1].x)&gt;0.5 || Math.abs(p.y-pts[i-1].y)&gt;0.5; }); }
  function score(pts,e1,e2){ pts=uniq(pts); var p=0,l=0;
    for(var i=0;i&lt;pts.length-1;i++){ p+=segHit(pts[i].x,pts[i].y,pts[i+1].x,pts[i+1].y,e1,e2);
      l+=Math.abs(pts[i].x-pts[i+1].x)+Math.abs(pts[i].y-pts[i+1].y); }
    return {pts:pts,p:p,l:l}; }

  function route(a,b,ed){
    var acx=a.x+a.w/2,acy=a.y+a.h/2,bcx=b.x+b.w/2,bcy=b.y+b.h/2, e1=ed.source,e2=ed.target, cs=[];
    // 세로 계열 — a의 위/아래 변에서 나가 b의 위/아래 변으로
    var below=bcy&gt;acy, sp={x:acx,y:below?a.b:a.y}, tp={x:bcx,y:below?b.y:b.b}, tg={x:tp.x,y:tp.y+(below?-GAP:GAP)};
    cs.push(score([sp,{x:sp.x,y:tg.y},tg,tp],e1,e2));                                   // 직선/L
    rowGut.forEach(function(my){ if(my&gt;Math.min(sp.y,tp.y)+6&amp;&amp;my&lt;Math.max(sp.y,tp.y)-6)   // 행 거터 크로스
      cs.push(score([sp,{x:sp.x,y:my},{x:tp.x,y:my},tg,tp],e1,e2)); });
    colGut.forEach(function(gx){                                                          // 열 측면 탈출
      var as={x:gx&gt;acx?a.r:a.x,y:acy};
      cs.push(score([as,{x:gx,y:acy},{x:gx,y:tg.y},tg,tp],e1,e2)); });
    // 가로 계열 — a의 좌/우 변에서 나가 b의 좌/우 변으로
    var right=bcx&gt;acx, sp2={x:right?a.r:a.x,y:acy}, tp2={x:right?b.x:b.r,y:bcy}, tg2={x:tp2.x+(right?-GAP:GAP),y:tp2.y};
    cs.push(score([sp2,{x:tg2.x,y:sp2.y},tg2,tp2],e1,e2));
    colGut.forEach(function(mx){ if(mx&gt;Math.min(sp2.x,tp2.x)+6&amp;&amp;mx&lt;Math.max(sp2.x,tp2.x)-6)
      cs.push(score([sp2,{x:mx,y:sp2.y},{x:mx,y:tp2.y},tg2,tp2],e1,e2)); });
    rowGut.forEach(function(gy){                                                          // 행 거터 우회
      var as={x:acx,y:gy&gt;acy?a.b:a.y};
      cs.push(score([as,{x:acx,y:gy},{x:tp2.x,y:gy},tg2,tp2],e1,e2)); });
    // 회귀선 — 아래로 크게 우회 (되돌아가는 흐름을 시각적으로 구분)
    if(ed.type===&#x27;loop&#x27;){ var gy=Math.max(a.b,b.b)+26;
      cs.push(score([{x:acx,y:a.b},{x:acx,y:gy},{x:bcx,y:gy},{x:bcx,y:b.b+GAP},{x:bcx,y:b.b}],e1,e2)); }
    cs=cs.filter(function(c){return c.pts.length&gt;=2;});
    cs.sort(function(x,y){ return x.p-y.p || x.l-y.l; });
    return cs[0];
  }

  function rnd(v){return Math.round(v*10)/10;}
  function orthPath(pts){                    // 직교 경로 + 모서리 라운딩
    pts=uniq(pts); if(pts.length&lt;2)return &#x27;&#x27;;
    var d=&#x27;M&#x27;+rnd(pts[0].x)+&#x27; &#x27;+rnd(pts[0].y);
    for(var i=1;i&lt;pts.length-1;i++){
      var p=pts[i-1],c=pts[i],n=pts[i+1];
      var d1=Math.hypot(c.x-p.x,c.y-p.y)||1, d2=Math.hypot(n.x-c.x,n.y-c.y)||1, r=Math.min(7,d1/2,d2/2);
      d+=&#x27; L&#x27;+rnd(c.x-(c.x-p.x)/d1*r)+&#x27; &#x27;+rnd(c.y-(c.y-p.y)/d1*r);
      d+=&#x27; Q&#x27;+rnd(c.x)+&#x27; &#x27;+rnd(c.y)+&#x27; &#x27;+rnd(c.x+(n.x-c.x)/d2*r)+&#x27; &#x27;+rnd(c.y+(n.y-c.y)/d2*r);
    }
    var e=pts[pts.length-1]; return d+&#x27; L&#x27;+rnd(e.x)+&#x27; &#x27;+rnd(e.y);
  }

  EDGES.forEach(function(ed){
    var a=box(ed.source),b=box(ed.target); if(!a||!b)return;
    var t=ed.type||&#x27;sequence&#x27;, rt=route(a,b,ed);
    d+=&#x27;&lt;path d=&quot;&#x27;+orthPath(rt.pts)+&#x27;&quot; fill=&quot;none&quot; stroke=&quot;&#x27;+C[t]+&#x27;&quot; stroke-width=&quot;1.5&quot; opacity=&quot;&#x27;
      +(t===&#x27;sequence&#x27;?&#x27;.55&#x27;:&#x27;.8&#x27;)+&#x27;&quot;&#x27;+(t!==&#x27;sequence&#x27;?&#x27; stroke-dasharray=&quot;4 3&quot;&#x27;:&#x27;&#x27;)
      +&#x27; marker-end=&quot;url(#m-&#x27;+t+&#x27;)&quot;/&gt;&#x27;;
  });
  svg.innerHTML=d;
}

  if(n.deadline) h+=&#x27;&lt;dt&gt;기한&lt;/dt&gt;&lt;dd&gt;&#x27;+n.deadline+&#x27;&lt;/dd&gt;&#x27;;
  if(n.output_documents&amp;&amp;n.output_documents.length)
    h+=&#x27;&lt;dt&gt;산출 문서&lt;/dt&gt;&lt;dd&gt;&#x27;+n.output_documents.join(&#x27; · &#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  if(n.blocker) h+=&#x27;&lt;dt&gt;병목&lt;/dt&gt;&lt;dd style=&quot;color:var(--warn)&quot;&gt;&#x27;+n.blocker+&#x27;&lt;/dd&gt;&#x27;;
  if(n.legal_basis&amp;&amp;n.legal_basis.length){
    h+=&#x27;&lt;dt&gt;근거 조문&lt;/dt&gt;&lt;dd&gt;&#x27;+n.legal_basis.map(function(l){
      var nm=l.url?&#x27;&lt;a class=&quot;ref&quot; href=&quot;&#x27;+l.url+&#x27;&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;&#x27;+l.law+&#x27;&lt;/a&gt;&#x27;:l.law;
      return &#x27;&lt;div style=&quot;margin-bottom:4px&quot;&gt;&#x27;+nm+&#x27; &lt;code&gt;&#x27;+l.article+&#x27;&lt;/code&gt;&lt;/div&gt;&#x27;;}).join(&#x27;&#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  }
  if(typeof n.confidence===&#x27;number&#x27;){
    h+=&#x27;&lt;dt&gt;법령 근거 확신도&lt;/dt&gt;&lt;dd&gt;&#x27;+n.confidence.toFixed(2)
      +(n.confidence&lt;0.8?&#x27; &lt;span class=&quot;badge warn&quot;&gt;현장 검증 필요&lt;/span&gt;&#x27;:&#x27;&#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  }
  var ins=EDGES.filter(function(x){return x.target===id}),
      outs=EDGES.filter(function(x){return x.source===id});
  if(ins.length) h+=&#x27;&lt;dt&gt;선행&lt;/dt&gt;&lt;dd&gt;&#x27;+ins.map(function(x){
    return (NODES[x.source]?NODES[x.source].name:x.source)+(x.label?&#x27; (&#x27;+x.label+&#x27;)&#x27;:&#x27;&#x27;);}).join(&#x27; · &#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  if(outs.length) h+=&#x27;&lt;dt&gt;후속&lt;/dt&gt;&lt;dd&gt;&#x27;+outs.map(function(x){
    return (NODES[x.target]?NODES[x.target].name:x.target)+(x.label?&#x27; (&#x27;+x.label+&#x27;)&#x27;:&#x27;&#x27;);}).join(&#x27; · &#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  h+=&#x27;&lt;/dl&gt;&#x27;;
  document.getElementById(&#x27;dbody&#x27;).innerHTML=h;
  document.getElementById(&#x27;dlg&#x27;).showModal();
}

document.querySelectorAll(&#x27;.node&#x27;).forEach(function(b){
  b.addEventListener(&#x27;click&#x27;,function(){openNode(b.dataset.id)});
  b.addEventListener(&#x27;mouseenter&#x27;,function(){
    var id=b.dataset.id;
    var rel={};rel[id]=1;
    EDGES.forEach(function(x){if(x.source===id)rel[x.target]=1;if(x.target===id)rel[x.source]=1;});
    document.querySelectorAll(&#x27;.node&#x27;).forEach(function(o){o.classList.toggle(&#x27;dim&#x27;,!rel[o.dataset.id])});
  });
  b.addEventListener(&#x27;mouseleave&#x27;,function(){
    document.querySelectorAll(&#x27;.node&#x27;).forEach(function(o){o.classList.remove(&#x27;dim&#x27;)});
  });
});
document.getElementById(&#x27;dlg&#x27;).addEventListener(&#x27;click&#x27;,function(ev){
  if(ev.target===this) this.close();
});

addEventListener(&#x27;load&#x27;,draw); addEventListener(&#x27;resize&#x27;,draw);
new MutationObserver(draw).observe(document.documentElement,{attributes:true,attributeFilter:[&#x27;data-theme&#x27;]});
&lt;/script&gt;
&lt;/body&gt;&lt;/html&gt;"></iframe></div>
<div class="foot">
  자료집 기준일 기준으로 작성된 참고자료입니다. 법률 자문이나 해당국 정부·KOICA의 공식 해석이 아닙니다.
  조달법은 개정이 잦으므로 실제 입찰 전 발주처 공고문과 현행 법령을 확인해야 합니다.
</div>
<script>
function fit(fr){ try{ fr.style.height=(fr.contentWindow.document.body.scrollHeight+20)+'px'; }catch(e){} }
function showTab(i){
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.toggle('active', +t.dataset.i===i); });
  document.querySelectorAll('.fr').forEach(function(fr){
    var on=+fr.dataset.i===i; fr.classList.toggle('active', on);
    if(on){ try{ fr.contentWindow.draw && fr.contentWindow.draw(); }catch(e){} setTimeout(function(){fit(fr);},60); }
  });
}
document.querySelectorAll('.fr').forEach(function(fr){
  fr.addEventListener('load', function(){
    // iframe 안의 테마 토글·업무구조도가 부모 테마를 따르도록, 그리고 높이를 맞춘다
    fit(fr);
    if(fr.classList.contains('active')) setTimeout(function(){ try{fr.contentWindow.draw&&fr.contentWindow.draw();}catch(e){} fit(fr); },80);
  });
});
addEventListener('resize', function(){ var a=document.querySelector('.fr.active'); if(a) fit(a); });
</script>
