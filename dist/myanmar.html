&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;한 장 캔버스&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;승인예산으로 수행하는 정부의 공사·재화·서비스 조달을 공개경쟁을 원칙으로 집행하되, 소액·복잡성·시장제한·긴급성에 따라 가격제안요청·제한입찰·2단계입찰·직접조달을 허용한다.&lt;/p&gt;
  &lt;div class=&quot;cards&quot;&gt;
    &lt;div class=&quot;card span2&quot;&gt;&lt;h3&gt;절차&lt;/h3&gt;&lt;ol class=&quot;steps&quot;&gt;&lt;li&gt;발주기관이 승인예산을 확인하고 조달계획·사양·평가기준·계약조건을 마련해 입찰위원회 승인을 받는다(제1/2017호 ¶¶16~20).&lt;/li&gt;&lt;li&gt;원칙은 공개입찰이며, 2천만 MMK 미만 단순 공사·시판 물품·서비스는 신뢰 가능한 3개 이상 업체의 가격제안, 기술·계약요건을 미리 확정하기 어려우면 2단계 입찰을 사용할 수 있다(제1/2022호 ¶¶3~6).&lt;/li&gt;&lt;li&gt;제한·직접조달은 법정 사유에 한하고, 1억 MMK 미만은 기관 관리위원회, 1억 MMK 초과는 권한기관의 승인을 받는다(제1/2022호 ¶¶7~9).&lt;/li&gt;&lt;li&gt;2천만~2억 MMK 공개입찰은 게시판에 7일 전, 2억 MMK 초과는 국영신문 2회와 부처 웹사이트에 14일 전 공고한다(제1/2022호 ¶10).&lt;/li&gt;&lt;li&gt;입찰자는 입찰서류에 따라 자격·기술·가격서류와 입찰가의 1% 입찰보증을 제출하고, 평가위원회가 공고된 기준으로 개찰·평가한다(제1/2017호 ¶¶22~30).&lt;/li&gt;&lt;li&gt;권한기관 승인 후 낙찰자를 공고·통지하고 낙찰자는 계약 전 계약가의 10% 이행보증을 제출한다. 가격제안 방식에는 이행보증을 요구하지 않는다(제1/2017호 ¶37).&lt;/li&gt;&lt;li&gt;입찰선정 이의는 증거를 갖춰 입찰위원회에 제기하고 불복 시 기획재정부가 구성한 3인 이상 부처합동 이의해결팀이 최종 결정한다(제1/2017호 ¶¶46~47).&lt;/li&gt;&lt;li&gt;발주기관은 계약 발효부터 완료까지 이행·지급·변경을 관리하고 관련 입찰·평가·계약기록을 최소 3년 보관한다(제1/2022호 ¶¶14~16; 제1/2017호 ¶43).&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;적용 대상&lt;/h3&gt;&lt;p style=&quot;margin:0;font-size:13.5px;line-height:1.7&quot;&gt;연방급 기관·연방부처·네피도위원회·주/지역 정부가 승인예산으로 수행하는 공사·물품·서비스 조달에 적용한다. 국방·국가안보, 장학·훈련, 공무원·임시근로자 채용, 토지·기존 건물 매입은 제1/2022호 제25항의 적용 제외다.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;법적 근거&lt;/h3&gt;&lt;div class=&quot;law&quot;&gt;&lt;span class=&quot;nm&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.moi.gov.mm/ppd/sites/default/files/book-pdf/2022-04/Vol-75%2CNo-16.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Office of the State Administration Council Directive No. 1/2022&lt;/a&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;¶¶1~16, 25~28&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:auto&quot;&gt;지침·정책&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;law&quot;&gt;&lt;span class=&quot;nm&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.mopf.gov.mm/sites/default/files/upload_pdf/2018/12/Procurement%20Directive.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;President’s Office Directive No. 1/2017&lt;/a&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;¶¶3~50 (제1/2022호와 충돌하지 않는 범위)&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:auto&quot;&gt;지침·정책&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;law&quot;&gt;&lt;span class=&quot;nm&quot;&gt;재원 제공 국제·협력기관의 조달규정&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;Directive No. 1/2017 ¶48(g)&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:auto&quot;&gt;공여기관 규정&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;권한 기관&lt;/h3&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;발주부서·기관별 입찰위원회(Tender Committee)&lt;/b&gt;&lt;span&gt;조달방식 선택, 가격제안 요청·공개입찰 실시, 입찰서 접수·평가, 낙찰·계약 관리&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;연방급 기관·연방부처·네피도위원회·주/지역 정부 관리위원회&lt;/b&gt;&lt;span&gt;제한입찰·직접조달 금액이 1억 짯 미만인 경우 해당 방식 사용을 회의로 결정&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;국정관리평의회 의장 또는 연방정부&lt;/b&gt;&lt;span&gt;제한입찰·직접조달 금액이 1억 짯 이상인 경우 사전 승인&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;차관·무상원조 제공 국제·협력기관&lt;/b&gt;&lt;span&gt;외부재원 조달에 자체 규정이 있으면 그 규정을 적용하고, 없으면 미얀마 지침 적용&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;이해관계자&lt;/h3&gt;&lt;p style=&quot;margin:0;font-size:13.5px;line-height:1.7&quot;&gt;연방급 기관·연방부처·네피도위원회·주/지역 정부의 발주부서, 발주부서별 입찰위원회, 국내외 입찰자, 기관 관리위원회, 국정관리평의회 의장 또는 연방정부, 차관·무상원조 제공 국제·협력기관&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;제출서류&lt;/h3&gt;&lt;div class=&quot;docset&quot;&gt;&lt;b&gt;입찰자&lt;/b&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;입찰서 또는 가격제안서&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;입찰서류가 정한 기술제안·가격제안&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;입찰서류가 정한 법인·납세·경험·재무·기술능력 증빙&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;입찰보증(요구되는 경우)&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;docset&quot;&gt;&lt;b&gt;외국기업 낙찰자&lt;/b&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;계약 체결 전 미얀마 법인등록 증빙(President’s Office Directive No. 1/2017 ¶42)&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;입찰서류가 정한 이행보증&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;docset&quot;&gt;&lt;b&gt;발주부서·입찰위원회&lt;/b&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;승인예산·조달계획&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;입찰공고·초청장&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;사양·평가기준·계약조건&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;평가보고서·낙찰결정·계약서&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;유의사항 · 병목&lt;/h3&gt;&lt;ul class=&quot;plain&quot;&gt;&lt;li&gt;제1/2017호 제46~47항은 이의신청·결정 기한과 자동 정지효를 두지 않으므로 실제 공고와 발주기관의 접수절차를 확인해야 한다.&lt;/li&gt;&lt;li&gt;외부재원·국제입찰은 재원협정, 제재·대표성 검토, 공고의 등록·통화·보증은행·서류언어 요건을 함께 확인해야 한다.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;진입장벽&lt;/h3&gt;&lt;ul class=&quot;plain&quot;&gt;&lt;li&gt;외국기업은 낙찰 후 계약 전 미얀마 법인등록, 현지 세무·인허가, 공고별 대사관 확인·언어·보증은행 및 제재 준수요건을 확인해야 한다.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;현장 검증 필요&lt;/h3&gt;&lt;ul class=&quot;plain&quot;&gt;&lt;li&gt;{&amp;#x27;item&amp;#x27;: &amp;#x27;공식 관보 원문·시행·후속 적용&amp;#x27;, &amp;#x27;question&amp;#x27;: &amp;#x27;제1/2022호의 관보 원문, 종전 지침과의 우선관계 및 2025·2026년 계속 적용을 확인했는가?&amp;#x27;, &amp;#x27;status&amp;#x27;: &amp;#x27;confirmed&amp;#x27;}&lt;/li&gt;&lt;li&gt;{&amp;#x27;item&amp;#x27;: &amp;#x27;기준금액·기한·입찰/이행보증·이의·예외&amp;#x27;, &amp;#x27;question&amp;#x27;: &amp;#x27;6개 정량·절차 항목을 제1/2022호와 비충돌 제1/2017호에서 조문별로 대조했는가?&amp;#x27;, &amp;#x27;status&amp;#x27;: &amp;#x27;confirmed&amp;#x27;}&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;관련 제도&lt;/h3&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;미얀마 조달 거버넌스·감독체계&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;미얀마 ODA 사업 발굴·형성 절차&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;법령 원문&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;현장에서 발주처에 그대로 제시할 수 있는 조문 원문입니다. 우리 요약이 아니라 verbatim이며,
    조문 번호를 누르면 원문 문서로 이동합니다. 한국어 요지 아래로 직역(참고용)을 펼칠 수 있습니다.&lt;/p&gt;
  &lt;div class=&quot;quotes&quot;&gt;&lt;div class=&quot;qc&quot;&gt;
  &lt;div class=&quot;qhd&quot;&gt;
    &lt;span class=&quot;qart&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.moi.gov.mm/ppd/sites/default/files/book-pdf/2022-04/Vol-75%2CNo-16.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;¶¶3-5&lt;/a&gt;&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;Office of the State Administration Council Directive No. 1/2022&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;qtext&quot;&gt;Departments and organisations of Union-level organisations, Union Ministries, the Nay Pyi Taw Council and Region and State governments shall use the following tendering methods when engaging in procurement: (a) Request for a price proposal; (b) unrestricted tendering; (c) restricted tendering; (d) two-stage tendering; (e) direct procurement. ... Procurements shall be made by the method of unrestricted tendering where anyone may submit a tender, except in the cases set forth in paragraphs 4, 6, 7 and 8 of this directive.&lt;/div&gt;
  &lt;p class=&quot;qgist&quot;&gt;5개 조달방식을 두되 공개입찰을 원칙으로 한다.&lt;/p&gt;

&lt;/div&gt;&lt;div class=&quot;qc&quot;&gt;
  &lt;div class=&quot;qhd&quot;&gt;
    &lt;span class=&quot;qart&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.moi.gov.mm/ppd/sites/default/files/book-pdf/2022-04/Vol-75%2CNo-16.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;¶10(a)-(c)&lt;/a&gt;&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;Office of the State Administration Council Directive No. 1/2022&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;qtext&quot;&gt;For purchases under 20 million kyats, the tender committee may solicit price proposals from at least 3 reliable companies without having to call an unrestricted tender; unrestricted calls for tenders for purchases from 20 million kyats to 200 million kyats must be prominently announced 7 days before the tender opening date ... unrestricted calls for tenders for purchases above 200 million kyats ... [must] be advertised at least twice in state-owned newspapers at least 14 days before the tender opening date. The same shall be announced on the ministry’s website at least 14 days in advance.&lt;/div&gt;
  &lt;p class=&quot;qgist&quot;&gt;2천만/2억 짯 구간에 따라 가격제안·게시판 7일·신문과 웹 14일로 갈린다.&lt;/p&gt;

&lt;/div&gt;&lt;div class=&quot;qc&quot;&gt;
  &lt;div class=&quot;qhd&quot;&gt;
    &lt;span class=&quot;qart&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.moi.gov.mm/ppd/sites/default/files/book-pdf/2022-04/Vol-75%2CNo-16.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;¶¶8-9&lt;/a&gt;&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;Office of the State Administration Council Directive No. 1/2022&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;qtext&quot;&gt;Direct procurement may be made in any of the following situations. ... When using the tendering methods in paragraphs 7 and 8 above, purchases of less than 100 million kyats may be decided by a meeting of the management committee ... and purchases above 100 million kyats may be made with the approval of the chairman of the State Administration Council or the Union government.&lt;/div&gt;
  &lt;p class=&quot;qgist&quot;&gt;제한입찰·직접조달의 1억 짯 이상 건은 상위 승인이 필요하다.&lt;/p&gt;

&lt;/div&gt;&lt;div class=&quot;qc&quot;&gt;
  &lt;div class=&quot;qhd&quot;&gt;
    &lt;span class=&quot;qart&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.moi.gov.mm/ppd/sites/default/files/book-pdf/2022-04/Vol-75%2CNo-16.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;¶28&lt;/a&gt;&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;Office of the State Administration Council Directive No. 1/2022&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;qtext&quot;&gt;If there are contradictions between the directives and the notification in paragraph 27 above and this directive, this directive shall prevail.&lt;/div&gt;
  &lt;p class=&quot;qgist&quot;&gt;2017·2018·2020 지침과 충돌하면 2022 지침이 우선한다.&lt;/p&gt;

&lt;/div&gt;&lt;div class=&quot;qc&quot;&gt;
  &lt;div class=&quot;qhd&quot;&gt;
    &lt;span class=&quot;qart&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.mopf.gov.mm/sites/default/files/upload_pdf/2018/12/Procurement%20Directive.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;¶48(g)&lt;/a&gt;&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;President’s Office Directive No. 1/2017&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;qtext&quot;&gt;The purchasing, procurement of services and hiring of consultants shall be done in compliance with the rules and regulations specified by the international or partner organizations that provide the corresponding loan or grant; if there are no such rules and regulations, this directive shall be complied with.&lt;/div&gt;
  &lt;p class=&quot;qgist&quot;&gt;차관·무상원조 제공기관의 조달규정이 있으면 그 규정을 우선 적용한다.&lt;/p&gt;

&lt;/div&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;현행 기준 반영 1건&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;공식 법령·기관 원문으로 확인한 현행 기준과 실무 확인사항입니다.
    출처는 각 항목에 연결했으며.&lt;/p&gt;
  &lt;div class=&quot;disc&quot; data-sev=&quot;high&quot;&gt;
  &lt;div class=&quot;top&quot;&gt;
    &lt;span class=&quot;badge bad&quot;&gt;필수 확인&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;미얀마&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;D01&lt;/span&gt;
  &lt;/div&gt;
  &lt;h3&gt;verification / 공식 원문·현행성·정량요건&lt;/h3&gt;
  &lt;div class=&quot;quote act&quot;&gt;&lt;b&gt;현행 기준&lt;/b&gt;정보부 관보 제75권 제16호에 제1/2022호 전체 원문이 수록되어 있고 2025년 관보가 이를 재적용한다. 제1/2017호는 충돌 부분만 후법 우선이며, 2026년 정부신문 입찰도 제23~24항을 계속 적용한다.&lt;/div&gt;
  &lt;p class=&quot;cite&quot;&gt;확인 출처 · Directive No.1/2022 ¶¶1~16, 25~28; Directive No.1/2017 ¶¶22, 37, 46~48; Myanmar Gazette Vol.78 No.20; GNLM June 2026 tender notice&lt;/p&gt;
  &lt;div class=&quot;todo&quot;&gt;&lt;b&gt;실무 확인&lt;/b&gt;실제 공고의 제출시각, 보증서 양식·발급은행, 공여협정 및 기관별 이의접수 방법을 확인한다.&lt;/div&gt;
  &lt;details class=&quot;review&quot;&gt;
  &lt;summary&gt;Field verification (English)&lt;/summary&gt;
  &lt;div class=&quot;rv&quot;&gt;
    &lt;p&gt;&lt;b&gt;Current legal basis&lt;/b&gt; — 공식 관보에 제1/2022호 전체가 수록되고 2025·2026년 정부 자료가 제1/2022호와 제1/2017호의 계속 적용을 확인한다.&lt;/p&gt;
    &lt;p class=&quot;rv-verify&quot;&gt;&lt;b&gt;✔ Verify&lt;/b&gt; — Check the live notice, security form and bank, financing agreement and entity complaint channel.&lt;/p&gt;
  &lt;/div&gt;
&lt;/details&gt;

  &lt;p class=&quot;act-row&quot;&gt;산출물 반영 — 공식 관보 원문과 2025·2026년 정부 적용자료로 현행성을 확정하고 정량·절차 요건을 조문별로 대조했다.&lt;/p&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;검증&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;정보부 공식 관보 제75권 제16호의 제1/2022호 미얀마어 원문을 전 조문 대조하고, 제1/2017호 공식 정부 게시본·영문 편의번역, 2025년 관보와 2026년 정부신문 실제 입찰을 교차 확인해 시행·우선관계, 기준금액, 기한, 입찰·이행보증, 이의와 예외를 확정했다.&lt;/p&gt;
  &lt;div class=&quot;cards&quot;&gt;
    &lt;div class=&quot;card span2&quot;&gt;&lt;h3&gt;검증 범위&lt;/h3&gt;
      &lt;p style=&quot;margin:0;font-size:13.5px;line-height:1.7&quot;&gt;Directive No.1/2022 ¶¶1~16, 25~28; Directive No.1/2017 ¶¶3~50, especially ¶¶16~26, 37~48; Myanmar Gazette Vol.78 No.20 current application; June 2026 official tender notice.&lt;/p&gt;
      &lt;p style=&quot;margin:12px 0 0;font-size:12.5px;color:var(--muted)&quot;&gt;확인일 2026-07-29 · 자료집 기준일 2026-07-29&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;대조에 쓴 원문&lt;/h3&gt;&lt;ul class=&quot;srcs&quot; style=&quot;padding-left:16px;margin:0&quot;&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.moi.gov.mm/ppd/sites/default/files/book-pdf/2022-04/Vol-75%2CNo-16.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Directive on public procurement and disposal/lease of state-owned assets — Myanmar Gazette Vol.75 No.16&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;지침·정책&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;대조 조문 ¶¶1~16 and 25~28; official Myanmar-language gazette pp.61~67&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-29 · Printing and Publishing Department, Ministry of Information&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.mopf.gov.mm/sites/default/files/upload_pdf/2018/12/Procurement%20Directive.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;President’s Office Directive No. 1/2017&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;지침·정책&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;대조 조문 ¶¶3~50, especially ¶¶16~26, 37~48 and 50&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-29 · Ministry of Planning and Finance&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.lincolnmyanmar.com/wp-content/uploads/2019/04/Tender-procedure-Presidents-Office-1-2017_NoCopy.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;President’s Office Directive No. 1/2017 — English convenience translation&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;지침·정책&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;대조 조문 ¶¶3~50 cross-read against official government references and later gazettes&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-29 · Lincoln Legal Services (Myanmar)&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.moi.gov.mm/ppd/sites/default/files/book-pdf/2025-05/Vol-78%2CNo-20.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Myanmar Gazette Vol.78 No.20 — current tender-committee orders&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;현장 관행&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;대조 조문 2025 orders applying Directive 1/2022 ¶¶19~20 and its two-month tender-validity rule&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-29 · Printing and Publishing Department, Ministry of Information&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.moi.gov.mm/nlm/file-download/download/public/5153&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Global New Light of Myanmar tender notice, June 2026&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;현장 관행&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;대조 조문 Myanmar Port Authority notice applying Directive 1/2017 ¶¶23~24 in June 2026&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-29 · Ministry of Information&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;

  /* 라우팅은 korea100studio의 거터 라우팅을 우리 그리드에 이식한 것이다.
     핵심: 카드를 지나야 하는 선은 카드가 없는 거터(행 하단·열 측면)로 우회한다.

  // 장애물(모든 노드)과 거터(노드 없는 띠) 실측
  var OB=[];
  board.querySelectorAll(&#x27;.node&#x27;).forEach(function(el){ var r=box(el.dataset.id); r.id=el.dataset.id; OB.push(r); });
  var rowGut=[], colGut=[];

  for(var i=1;i&lt;hc.length;i++){ var r=rel(hc[i].getBoundingClientRect()); colGut.push(r.x+11); colGut.push(r.r-11); }

  function segHit(ax,ay,bx,by,e1,e2){
    var n=0, M=3;
    for(var i=0;i&lt;OB.length;i++){ var o=OB[i]; if(o.id===e1||o.id===e2) continue;

    rowGut.forEach(function(gy){                                                          // 행 거터 우회

.subnav label{font-size:12px;color:var(--muted)}
select,.btn{font:inherit;font-size:13.5px;color:inherit;background:var(--bg);
  border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
.btn:hover{background:var(--soft)}
.btn[disabled]{opacity:.4;cursor:default}
.pos{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}

.dtl-hd{padding:26px 0 20px}
.dtl-hd .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dtl-hd h1{font-size:clamp(24px,3.4vw,36px);margin:12px 0 8px}
.dtl-hd .one{color:var(--muted);font-size:15.5px;max-width:78ch;margin:0}
.tiles{display:flex;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;
  margin-top:22px;width:fit-content;max-width:100%;flex-wrap:wrap}
.tile{padding:14px 22px;border-right:1px solid var(--line);min-width:104px}
.tile:last-child{border-right:0}
.tile b{display:block;font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.25}
.tile span{font-size:11.5px;color:var(--muted)}
.tile.ok b{color:var(--key)} .tile.warn b{color:var(--warn)} .tile.bad b{color:var(--bad)}

section.blk{padding:34px 0;border-top:1px solid var(--line)}
section.blk &gt; h2{font-size:21px;letter-spacing:-.02em;margin:0 0 6px;font-weight:800}
section.blk &gt; .desc{color:var(--muted);font-size:13.5px;margin:0 0 20px}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.hd-row{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.hd-row .legend{margin-left:auto}

.boardwrap{position:relative;border:1px solid var(--line);border-radius:12px;overflow:auto}
.board{position:relative;min-width:940px}
.board svg.edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.brow{display:grid;border-bottom:1px solid var(--line)}
.brow:last-child{border-bottom:0}
.brow.head{background:var(--soft);position:sticky;top:0;z-index:3}
/* gap은 같은 셀에 세로로 쌓인 노드 사이로 화살표가 지나갈 통로다. 좁히면 화살촉이 뭉갠다. */
.bcell{padding:14px 12px;border-right:1px solid var(--line);min-height:64px;
  display:flex;flex-direction:column;gap:26px;justify-content:center}
.bcell:last-child{border-right:0}
.brow.head .bcell{min-height:0;padding:11px 12px;justify-content:flex-start}
.stage-k{font-weight:800;font-size:12px;color:var(--key);letter-spacing:.02em}
.stage-t{font-size:13px;font-weight:700}
.lane-t{font-size:13px;font-weight:700;color:var(--muted)}
.node{position:relative;z-index:2;background:var(--bg);border:1px solid var(--line);
  border-radius:9px;padding:10px 12px;cursor:pointer;text-align:left;font:inherit;color:inherit;
  width:100%;display:block;transition:box-shadow .12s,border-color .12s}
.node:hover{border-color:var(--muted);box-shadow:0 2px 10px rgba(0,0,0,.07)}
.node .id{font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.04em;
  display:flex;justify-content:space-between;align-items:center;gap:8px}
.node .nm{font-size:13px;font-weight:700;margin-top:3px;letter-spacing:-.01em;line-height:1.4}
.node .tag{font-size:10px;font-weight:700;padding:1px 6px;border-radius:999px}
.node[data-tone=&quot;key&quot;]{border-color:var(--key);background:var(--key-bg)}
.node[data-tone=&quot;key&quot;] .tag{background:var(--key);color:var(--bg)}
.node[data-tone=&quot;warn&quot;]{border-color:var(--warn);background:var(--warn-bg)}
.node[data-tone=&quot;warn&quot;] .tag{background:var(--warn);color:var(--bg)}
.node[data-tone=&quot;back&quot;]{border-color:var(--back);background:var(--back-bg)}
.node[data-tone=&quot;back&quot;] .tag{background:var(--back);color:var(--bg)}
.node.dim{opacity:.34}

.drawer{position:fixed;inset:0;z-index:100;display:none;width:100vw;height:100vh;
  max-width:100vw;max-height:100vh;margin:0;padding:0;border:0;background:transparent;overflow:hidden}
.drawer[open]{display:block}
.drawer::backdrop{background:rgba(0,0,0,.34)}
.drawer .pane{position:absolute;right:0;top:0;bottom:0;width:min(440px,92vw);background:var(--bg);
  border-left:1px solid var(--line);padding:24px;overflow:auto}
.drawer h3{margin:10px 0 4px;font-size:19px;letter-spacing:-.02em}
.drawer .close{position:absolute;right:18px;top:18px;background:none;border:0;color:var(--muted);
  font-size:22px;cursor:pointer;line-height:1;padding:4px}
.kv{margin:18px 0 0;font-size:13.5px}
.kv dt{font-size:11.5px;color:var(--muted);font-weight:700;margin-top:14px}
.kv dd{margin:3px 0 0}
.kv code{font-size:12.5px;background:var(--soft);padding:1px 6px;border-radius:4px}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}
.card{border:1px solid var(--line);border-radius:11px;padding:17px 19px}
.card h3{margin:0 0 11px;font-size:13.5px;letter-spacing:.01em}
.card.span2{grid-column:span 2}
@media (max-width:820px){.card.span2{grid-column:span 1}}
ol.steps{margin:0;padding-left:20px;font-size:13.5px;line-height:1.75}
ol.steps li{margin-bottom:5px}
ul.plain{margin:0;padding-left:18px;font-size:13.5px;line-height:1.7}
ul.plain li{margin-bottom:6px}
.law{display:flex;gap:9px;align-items:baseline;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.law:last-child{border-bottom:0}
.law .nm{font-weight:600}
.law .ar{color:var(--muted);font-size:12.5px}
.docset{margin-bottom:13px}
.docset b{font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:12px;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:3px 8px}
.auth{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.auth:last-child{border-bottom:0}
.auth b{flex:none;max-width:42%;font-size:13px}
.auth span{color:var(--muted);font-size:12.5px}

.disc{border:1px solid var(--line);border-left-width:4px;border-radius:10px;padding:17px 19px;margin-bottom:15px}
.disc[data-sev=&quot;high&quot;]{border-left-color:var(--bad)}
.disc[data-sev=&quot;medium&quot;]{border-left-color:var(--warn)}
.disc[data-sev=&quot;low&quot;]{border-left-color:var(--muted)}
.disc .top{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:9px}
.disc .top .badge{white-space:normal;max-width:100%;overflow-wrap:anywhere}
.disc h3{margin:0;font-size:14.5px;letter-spacing:-.01em}
.disc .quote{font-size:13px;margin:9px 0;padding:10px 13px;border-radius:8px;background:var(--soft);line-height:1.65}
.disc .quote b{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;letter-spacing:.02em}
.disc .quote.src{border-left:2px solid var(--muted)}
.disc .quote.act{border-left:2px solid var(--key)}
.disc .cite{font-size:12px;color:var(--muted);margin:8px 0 0}
.disc .impact{font-size:13.5px;margin:11px 0 0;line-height:1.7}
.disc .act-row{font-size:13px;margin:11px 0 0;padding-top:11px;border-top:1px dashed var(--line);color:var(--muted)}
.review{margin:11px 0 0;border:1px solid var(--info);border-radius:8px;background:var(--info-bg)}
.review summary{cursor:pointer;padding:9px 13px;font-size:12px;font-weight:700;color:var(--info);list-style:none}
.review summary::-webkit-details-marker{display:none}
.review summary::before{content:&quot;▸ &quot;;font-size:10px}
.review[open] summary::before{content:&quot;▾ &quot;}
.review .rv{padding:2px 13px 13px}
.review .rv p{font-size:13px;line-height:1.65;margin:8px 0 0}
.review .rv-topic{font-weight:700;font-size:13.5px}
.review .rv-verify{padding:9px 11px;border-radius:6px;background:var(--bg);border:1px dashed var(--info)}
.fieldcheck{margin:11px 0 0;padding:11px 13px;border-radius:8px;background:var(--soft);border:1px solid var(--line)}
.fieldcheck .fc-hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.fieldcheck .fc-find{font-size:13px;line-height:1.7;margin:0}
.todo{margin:13px 0 0;padding:12px 14px;border-radius:9px;background:var(--key-bg);
  border:1px solid var(--key);font-size:13.5px;line-height:1.7}
.todo b{display:block;font-size:11px;color:var(--key);letter-spacing:.03em;margin-bottom:4px}
.up{margin:11px 0 0;padding:12px 14px;border-radius:9px;background:var(--soft);border:1px solid var(--line)}
.up .hd{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:7px}
.up .hd b{font-size:11px;color:var(--muted);letter-spacing:.03em}
.up .txt{font-size:13px;line-height:1.7;padding:9px 12px;border-radius:7px;background:var(--bg);
  border:1px dashed var(--line)}
.up .txt i{display:block;font-style:normal;font-size:10.5px;color:var(--muted);margin-bottom:3px}

.quotes{display:flex;flex-direction:column;gap:14px}
.qc{border:1px solid var(--line);border-left:3px solid var(--info);border-radius:9px;padding:15px 17px}
.qc .qhd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:9px}
.qc .qart{font-weight:700;font-size:13px}
.qc .qtext{font-family:ui-monospace,&quot;SF Mono&quot;,Menlo,monospace;font-size:12.5px;line-height:1.7;
  background:var(--soft);border-radius:7px;padding:11px 13px;white-space:pre-wrap;word-break:break-word}
.qc .qgist{font-size:13.5px;line-height:1.7;margin:10px 0 0}
.qc details{margin:8px 0 0}
.qc summary{font-size:12px;color:var(--muted);cursor:pointer;list-style:none}
.qc summary::-webkit-details-marker{display:none}
.qc summary::before{content:&quot;▸ &quot;;font-size:10px}
.qc details[open] summary::before{content:&quot;▾ &quot;}
.qc .qko{font-size:13px;line-height:1.7;color:var(--muted);margin:7px 0 0;padding-left:12px;border-left:1px solid var(--line)}
.srcs{font-size:13.5px}
.srcs li{margin-bottom:9px}
.srcs a{color:var(--info)}
.srcs .ar{display:block;color:var(--muted);font-size:12px;margin-top:1px}
.note{font-size:13.5px;line-height:1.7;color:var(--muted);margin:0 0 8px;padding-left:15px;position:relative}
.note::before{content:&quot;·&quot;;position:absolute;left:4px}

footer.site{border-top:1px solid var(--line);padding:28px 0 46px;color:var(--muted);font-size:12.5px;line-height:1.8}
footer.site a{color:var(--muted)}

  &lt;span class=&quot;nm&quot;&gt;부패·담합 제재&lt;/span&gt;&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;bcell&quot; data-lane=&quot;상위 승인기관&quot; data-stage=&quot;G4 이의&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;brow&quot; style=&quot;grid-template-columns:180px repeat(5,minmax(190px,1fr))&quot;&gt;&lt;div class=&quot;bcell&quot;&gt;&lt;span class=&quot;lane-t&quot;&gt;입찰자·재심기관&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;bcell&quot; data-lane=&quot;입찰자·재심기관&quot; data-stage=&quot;G0 구성&quot;&gt;&lt;/div&gt;&lt;div class=&quot;bcell&quot; data-lane=&quot;입찰자·재심기관&quot; data-stage=&quot;G1 집행&quot;&gt;&lt;/div&gt;&lt;div class=&quot;bcell&quot; data-lane=&quot;입찰자·재심기관&quot; data-stage=&quot;G2 평가·인수&quot;&gt;&lt;/div&gt;&lt;div class=&quot;bcell&quot; data-lane=&quot;입찰자·재심기관&quot; data-stage=&quot;G3 기록·감독&quot;&gt;&lt;/div&gt;&lt;div class=&quot;bcell&quot; data-lane=&quot;입찰자·재심기관&quot; data-stage=&quot;G4 이의&quot;&gt;&lt;button class=&quot;node&quot; data-id=&quot;P09&quot; data-tone=&quot;back&quot;&gt;

&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;한 장 캔버스&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;각 발주기관이 입찰위원회와 평가·품질검수 기능을 구성해 조달을 집행·기록하고, 비경쟁 방식에는 금액별 상위 승인을, 부패·담합에는 계약취소·제재를, 입찰 이의에는 기관 내부심사와 부처합동 재심을 적용한다.&lt;/p&gt;
  &lt;div class=&quot;cards&quot;&gt;
    &lt;div class=&quot;card span2&quot;&gt;&lt;h3&gt;절차&lt;/h3&gt;&lt;ol class=&quot;steps&quot;&gt;&lt;li&gt;발주기관이 승인예산을 확인하고 조달계획·사양·평가기준·계약조건을 마련해 입찰위원회 승인을 받는다(제1/2017호 ¶¶16~20).&lt;/li&gt;&lt;li&gt;원칙은 공개입찰이며, 2천만 MMK 미만 단순 공사·시판 물품·서비스는 신뢰 가능한 3개 이상 업체의 가격제안, 기술·계약요건을 미리 확정하기 어려우면 2단계 입찰을 사용할 수 있다(제1/2022호 ¶¶3~6).&lt;/li&gt;&lt;li&gt;제한·직접조달은 법정 사유에 한하고, 1억 MMK 미만은 기관 관리위원회, 1억 MMK 초과는 권한기관의 승인을 받는다(제1/2022호 ¶¶7~9).&lt;/li&gt;&lt;li&gt;2천만~2억 MMK 공개입찰은 게시판에 7일 전, 2억 MMK 초과는 국영신문 2회와 부처 웹사이트에 14일 전 공고한다(제1/2022호 ¶10).&lt;/li&gt;&lt;li&gt;입찰자는 입찰서류에 따라 자격·기술·가격서류와 입찰가의 1% 입찰보증을 제출하고, 평가위원회가 공고된 기준으로 개찰·평가한다(제1/2017호 ¶¶22~30).&lt;/li&gt;&lt;li&gt;권한기관 승인 후 낙찰자를 공고·통지하고 낙찰자는 계약 전 계약가의 10% 이행보증을 제출한다. 가격제안 방식에는 이행보증을 요구하지 않는다(제1/2017호 ¶37).&lt;/li&gt;&lt;li&gt;입찰선정 이의는 증거를 갖춰 입찰위원회에 제기하고 불복 시 기획재정부가 구성한 3인 이상 부처합동 이의해결팀이 최종 결정한다(제1/2017호 ¶¶46~47).&lt;/li&gt;&lt;li&gt;발주기관은 계약 발효부터 완료까지 이행·지급·변경을 관리하고 관련 입찰·평가·계약기록을 최소 3년 보관한다(제1/2022호 ¶¶14~16; 제1/2017호 ¶43).&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;적용 대상&lt;/h3&gt;&lt;p style=&quot;margin:0;font-size:13.5px;line-height:1.7&quot;&gt;연방급 기관·연방부처·네피도위원회·주/지역 정부가 승인예산으로 수행하는 공사·물품·서비스 조달에 적용한다. 국방·국가안보, 장학·훈련, 공무원·임시근로자 채용, 토지·기존 건물 매입은 제1/2022호 제25항의 적용 제외다.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;법적 근거&lt;/h3&gt;&lt;div class=&quot;law&quot;&gt;&lt;span class=&quot;nm&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.moi.gov.mm/ppd/sites/default/files/book-pdf/2022-04/Vol-75%2CNo-16.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Office of the State Administration Council Directive No. 1/2022&lt;/a&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;¶¶1~16, 25~28&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:auto&quot;&gt;지침·정책&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;law&quot;&gt;&lt;span class=&quot;nm&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.mopf.gov.mm/sites/default/files/upload_pdf/2018/12/Procurement%20Directive.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;President’s Office Directive No. 1/2017&lt;/a&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;¶¶3~50 (제1/2022호와 충돌하지 않는 범위)&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:auto&quot;&gt;지침·정책&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;law&quot;&gt;&lt;span class=&quot;nm&quot;&gt;재원 제공 국제·협력기관의 조달규정&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;Directive No. 1/2017 ¶48(g)&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:auto&quot;&gt;공여기관 규정&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;권한 기관&lt;/h3&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;발주기관별 입찰위원회(Tender Committee)&lt;/b&gt;&lt;span&gt;조달의 중심 집행기관. 방식·공고·평가·낙찰·계약을 관리하고 이의제기의 1차 사실조사를 수행&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;입찰접수·평가위원회&lt;/b&gt;&lt;span&gt;입찰서를 접수·개찰하고 공고된 기준으로 평가해 권고가 포함된 평가보고서를 입찰위원회에 제출&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;품질평가·인수위원회&lt;/b&gt;&lt;span&gt;납품 재화·서비스의 품질과 계약 사양 충족 여부를 검사하고 인수·거부 및 영수증 발급&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;기관 관리위원회&lt;/b&gt;&lt;span&gt;1억 짯 미만 제한입찰·직접조달 방식 사용을 회의로 결정&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;국정관리평의회 의장 또는 연방정부&lt;/b&gt;&lt;span&gt;1억 짯 이상 제한입찰·직접조달 방식 사용 승인&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;기획재정부(Ministry of Planning and Finance)&lt;/b&gt;&lt;span&gt;입찰위원회 결정에 불복한 이의가 있으면 연방정부 허가를 받아 3명 이상 부처 대표로 이의해결팀 구성&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;이해관계자&lt;/h3&gt;&lt;p style=&quot;margin:0;font-size:13.5px;line-height:1.7&quot;&gt;연방급 기관·연방부처·네피도위원회·주/지역 정부, 발주기관별 입찰위원회, 입찰접수·평가위원회, 품질평가·인수위원회, 기관 관리위원회, 국정관리평의회 의장 또는 연방정부, 기획재정부, 부처합동 이의해결팀, 입찰자·공급자&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;제출서류&lt;/h3&gt;&lt;div class=&quot;docset&quot;&gt;&lt;b&gt;입찰접수·평가위원회&lt;/b&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;개찰기록&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;평가기준별 심사결과&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;낙찰 권고가 포함된 평가보고서&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;docset&quot;&gt;&lt;b&gt;품질평가·인수위원회&lt;/b&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;품질·사양 검사결과&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;인수·거부 기록&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;물품 영수증&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;docset&quot;&gt;&lt;b&gt;발주기관&lt;/b&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;접수 입찰서&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;평가보고서&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;입찰위원회 회의기록&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;계약서&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;지급정보·영수증&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;기타 관련문서 — 최소 3년 보관&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;docset&quot;&gt;&lt;b&gt;이의제기 입찰자·이의해결팀&lt;/b&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;충분한 증거가 첨부된 이의신청&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;이의 접수·심사기록&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;최종 결정&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;유의사항 · 병목&lt;/h3&gt;&lt;ul class=&quot;plain&quot;&gt;&lt;li&gt;제1/2017호 제46~47항은 이의신청·결정 기한과 자동 정지효를 두지 않으므로 실제 공고와 발주기관의 접수절차를 확인해야 한다.&lt;/li&gt;&lt;li&gt;외부재원·국제입찰은 재원협정, 제재·대표성 검토, 공고의 등록·통화·보증은행·서류언어 요건을 함께 확인해야 한다.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;진입장벽&lt;/h3&gt;&lt;ul class=&quot;plain&quot;&gt;&lt;li&gt;외국기업은 낙찰 후 계약 전 미얀마 법인등록, 현지 세무·인허가, 공고별 대사관 확인·언어·보증은행 및 제재 준수요건을 확인해야 한다.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;현장 검증 필요&lt;/h3&gt;&lt;ul class=&quot;plain&quot;&gt;&lt;li&gt;{&amp;#x27;item&amp;#x27;: &amp;#x27;공식 관보 원문·시행·후속 적용&amp;#x27;, &amp;#x27;question&amp;#x27;: &amp;#x27;제1/2022호의 관보 원문, 종전 지침과의 우선관계 및 2025·2026년 계속 적용을 확인했는가?&amp;#x27;, &amp;#x27;status&amp;#x27;: &amp;#x27;confirmed&amp;#x27;}&lt;/li&gt;&lt;li&gt;{&amp;#x27;item&amp;#x27;: &amp;#x27;기준금액·기한·입찰/이행보증·이의·예외&amp;#x27;, &amp;#x27;question&amp;#x27;: &amp;#x27;6개 정량·절차 항목을 제1/2022호와 비충돌 제1/2017호에서 조문별로 대조했는가?&amp;#x27;, &amp;#x27;status&amp;#x27;: &amp;#x27;confirmed&amp;#x27;}&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;관련 제도&lt;/h3&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;미얀마 공공조달 입찰제도&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;미얀마 ODA 사업 발굴·형성 절차&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;법령 원문&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;현장에서 발주처에 그대로 제시할 수 있는 조문 원문입니다. 우리 요약이 아니라 verbatim이며,
    조문 번호를 누르면 원문 문서로 이동합니다. 한국어 요지 아래로 직역(참고용)을 펼칠 수 있습니다.&lt;/p&gt;
  &lt;div class=&quot;quotes&quot;&gt;&lt;div class=&quot;qc&quot;&gt;
  &lt;div class=&quot;qhd&quot;&gt;
    &lt;span class=&quot;qart&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.mopf.gov.mm/sites/default/files/upload_pdf/2018/12/Procurement%20Directive.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;¶8&lt;/a&gt;&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;President’s Office Directive No. 1/2017&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;qtext&quot;&gt;A “Tender Committee”, “Committee for Calculating the Floor Price”, “Tender Acceptance and Evaluation Committee” and “Tender Quality Assurance and Acceptance Committee“ shall be established for the Union, Region and State government departments and organizations for construction, purchases, procurement of services, lease and sales.&lt;/div&gt;
  &lt;p class=&quot;qgist&quot;&gt;발주기관별로 입찰·평가·품질인수 등 기능별 위원회를 구성한다.&lt;/p&gt;

&lt;/div&gt;&lt;div class=&quot;qc&quot;&gt;
  &lt;div class=&quot;qhd&quot;&gt;
    &lt;span class=&quot;qart&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.mopf.gov.mm/sites/default/files/upload_pdf/2018/12/Procurement%20Directive.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;¶43&lt;/a&gt;&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;President’s Office Directive No. 1/2017&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;qtext&quot;&gt;The purchasing department or organization shall record all tender procedures and maintain the following for at least 3 years. (a) Received bids. (b) Evaluation report. (c) Record of the Tender Committee. (d) Contracts that are signed. (e) Payment information. (f) Receipts. (g) Other related documents.&lt;/div&gt;
  &lt;p class=&quot;qgist&quot;&gt;입찰·평가·계약·지급 기록을 최소 3년 보관한다.&lt;/p&gt;

&lt;/div&gt;&lt;div class=&quot;qc&quot;&gt;
  &lt;div class=&quot;qhd&quot;&gt;
    &lt;span class=&quot;qart&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.mopf.gov.mm/sites/default/files/upload_pdf/2018/12/Procurement%20Directive.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;¶¶46-47&lt;/a&gt;&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;President’s Office Directive No. 1/2017&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;qtext&quot;&gt;The Tender Committee shall investigate if a bidder complains about a grievance stemming from the tender selection process with sufficient evidence. If he/she is not satisfied with the decision of the Tender Committee, the Ministry of Planning and Finance shall establish a complaint resolution team with the permission of the Union government comprising at least 3 representatives from the ministries. ... The decision of the complaint resolution team shall be final and binding.&lt;/div&gt;
  &lt;p class=&quot;qgist&quot;&gt;입찰위원회 1차 조사 뒤 기획재정부 부처합동팀이 최종·구속적 결정을 내린다.&lt;/p&gt;

&lt;/div&gt;&lt;div class=&quot;qc&quot;&gt;
  &lt;div class=&quot;qhd&quot;&gt;
    &lt;span class=&quot;qart&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.moi.gov.mm/ppd/sites/default/files/book-pdf/2022-04/Vol-75%2CNo-16.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;¶9&lt;/a&gt;&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;Office of the State Administration Council Directive No. 1/2022&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;qtext&quot;&gt;When using the tendering methods in paragraphs 7 and 8 above, purchases of less than 100 million kyats may be decided by a meeting of the management committee ... and purchases above 100 million kyats may be made with the approval of the chairman of the State Administration Council or the Union government.&lt;/div&gt;
  &lt;p class=&quot;qgist&quot;&gt;제한·직접조달은 1억 짯을 기준으로 승인 수준이 갈린다.&lt;/p&gt;

&lt;/div&gt;&lt;div class=&quot;qc&quot;&gt;
  &lt;div class=&quot;qhd&quot;&gt;
    &lt;span class=&quot;qart&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.moi.gov.mm/ppd/sites/default/files/book-pdf/2022-04/Vol-75%2CNo-16.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;¶28&lt;/a&gt;&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;Office of the State Administration Council Directive No. 1/2022&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;qtext&quot;&gt;If there are contradictions between the directives and the notification in paragraph 27 above and this directive, this directive shall prevail.&lt;/div&gt;
  &lt;p class=&quot;qgist&quot;&gt;거버넌스 세부규칙도 충돌하는 범위에서는 2022 지침을 우선한다.&lt;/p&gt;

&lt;/div&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;현행 기준 반영 1건&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;공식 법령·기관 원문으로 확인한 현행 기준과 실무 확인사항입니다.
    출처는 각 항목에 연결했으며.&lt;/p&gt;
  &lt;div class=&quot;disc&quot; data-sev=&quot;high&quot;&gt;
  &lt;div class=&quot;top&quot;&gt;
    &lt;span class=&quot;badge bad&quot;&gt;필수 확인&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;미얀마&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;D01&lt;/span&gt;
  &lt;/div&gt;
  &lt;h3&gt;verification / 공식 원문·현행성·정량요건&lt;/h3&gt;
  &lt;div class=&quot;quote act&quot;&gt;&lt;b&gt;현행 기준&lt;/b&gt;정보부 관보 제75권 제16호에 제1/2022호 전체 원문이 수록되어 있고 2025년 관보가 이를 재적용한다. 제1/2017호는 충돌 부분만 후법 우선이며, 2026년 정부신문 입찰도 제23~24항을 계속 적용한다.&lt;/div&gt;
  &lt;p class=&quot;cite&quot;&gt;확인 출처 · Directive No.1/2022 ¶¶1~16, 25~28; Directive No.1/2017 ¶¶22, 37, 46~48; Myanmar Gazette Vol.78 No.20; GNLM June 2026 tender notice&lt;/p&gt;
  &lt;div class=&quot;todo&quot;&gt;&lt;b&gt;실무 확인&lt;/b&gt;실제 공고의 제출시각, 보증서 양식·발급은행, 공여협정 및 기관별 이의접수 방법을 확인한다.&lt;/div&gt;
  &lt;details class=&quot;review&quot;&gt;
  &lt;summary&gt;Field verification (English)&lt;/summary&gt;
  &lt;div class=&quot;rv&quot;&gt;
    &lt;p&gt;&lt;b&gt;Current legal basis&lt;/b&gt; — 공식 관보에 제1/2022호 전체가 수록되고 2025·2026년 정부 자료가 제1/2022호와 제1/2017호의 계속 적용을 확인한다.&lt;/p&gt;
    &lt;p class=&quot;rv-verify&quot;&gt;&lt;b&gt;✔ Verify&lt;/b&gt; — Check the live notice, security form and bank, financing agreement and entity complaint channel.&lt;/p&gt;
  &lt;/div&gt;
&lt;/details&gt;

  &lt;p class=&quot;act-row&quot;&gt;산출물 반영 — 공식 관보 원문과 2025·2026년 정부 적용자료로 현행성을 확정하고 정량·절차 요건을 조문별로 대조했다.&lt;/p&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;검증&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;정보부 공식 관보 제75권 제16호의 제1/2022호 미얀마어 원문을 전 조문 대조하고, 제1/2017호 공식 정부 게시본·영문 편의번역, 2025년 관보와 2026년 정부신문 실제 입찰을 교차 확인해 시행·우선관계, 기준금액, 기한, 입찰·이행보증, 이의와 예외를 확정했다.&lt;/p&gt;
  &lt;div class=&quot;cards&quot;&gt;
    &lt;div class=&quot;card span2&quot;&gt;&lt;h3&gt;검증 범위&lt;/h3&gt;
      &lt;p style=&quot;margin:0;font-size:13.5px;line-height:1.7&quot;&gt;Directive No.1/2022 ¶¶1~16, 25~28; Directive No.1/2017 ¶¶3~50, especially ¶¶16~26, 37~48; Myanmar Gazette Vol.78 No.20 current application; June 2026 official tender notice.&lt;/p&gt;
      &lt;p style=&quot;margin:12px 0 0;font-size:12.5px;color:var(--muted)&quot;&gt;확인일 2026-07-29 · 자료집 기준일 2026-07-29&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;대조에 쓴 원문&lt;/h3&gt;&lt;ul class=&quot;srcs&quot; style=&quot;padding-left:16px;margin:0&quot;&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.moi.gov.mm/ppd/sites/default/files/book-pdf/2022-04/Vol-75%2CNo-16.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Directive on public procurement and disposal/lease of state-owned assets — Myanmar Gazette Vol.75 No.16&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;지침·정책&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;대조 조문 ¶¶1~16 and 25~28; official Myanmar-language gazette pp.61~67&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-29 · Printing and Publishing Department, Ministry of Information&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.mopf.gov.mm/sites/default/files/upload_pdf/2018/12/Procurement%20Directive.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;President’s Office Directive No. 1/2017&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;지침·정책&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;대조 조문 ¶¶3~50, especially ¶¶16~26, 37~48 and 50&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-29 · Ministry of Planning and Finance&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.lincolnmyanmar.com/wp-content/uploads/2019/04/Tender-procedure-Presidents-Office-1-2017_NoCopy.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;President’s Office Directive No. 1/2017 — English convenience translation&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;지침·정책&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;대조 조문 ¶¶3~50 cross-read against official government references and later gazettes&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-29 · Lincoln Legal Services (Myanmar)&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.moi.gov.mm/ppd/sites/default/files/book-pdf/2025-05/Vol-78%2CNo-20.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Myanmar Gazette Vol.78 No.20 — current tender-committee orders&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;현장 관행&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;대조 조문 2025 orders applying Directive 1/2022 ¶¶19~20 and its two-month tender-validity rule&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-29 · Printing and Publishing Department, Ministry of Information&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.moi.gov.mm/nlm/file-download/download/public/5153&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Global New Light of Myanmar tender notice, June 2026&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;현장 관행&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;대조 조문 Myanmar Port Authority notice applying Directive 1/2017 ¶¶23~24 in June 2026&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-29 · Ministry of Information&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card span2&quot;&gt;&lt;h3&gt;주의&lt;/h3&gt;&lt;p class=&quot;note&quot;&gt;제1/2022호는 2022-03-17 발령됐고 2022-04-22 관보에 원문이 게재됐다. 별도 유예 시행조항은 없다.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;제1/2017호는 전면 폐지가 아니라 제1/2022호와 충돌하는 부분만 후법 우선이다. 보증·평가·기록·이의 규정은 보충 적용되며 2026년 정부신문 입찰도 제1/2017호 조항을 직접 적용한다.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;이의신청의 법정 기한·자동 정지효는 공개 지침에 규정되지 않았다는 점까지 확인했으며, 이는 미결 조문이 아니라 현행 규정의 공백으로 기록한다.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;p style=&quot;margin:22px 0 0;font-size:12.5px;color:var(--muted)&quot;&gt;
    조문 대조 완료 — 조문의 존재와 문언 일치만 뜻합니다. 법적 해석·적용 타당성·개정 반영 여부는 별도 검토 대상입니다.
  &lt;/p&gt;
&lt;/section&gt;
&lt;/div&gt;

  &lt;p class=&quot;desc&quot;&gt;수원부처와 개발파트너가 국가·부문 우선순위에 맞는 사업을 발굴하고, MIFER 산하 FERD 단일창구를 통해 정부 고위 승인, 양자 협정·MoU·교환각서 협상과 서명, AIMS 등록, 이행 모니터링으로 연결한다.&lt;/p&gt;
  &lt;div class=&quot;cards&quot;&gt;
    &lt;div class=&quot;card span2&quot;&gt;&lt;h3&gt;절차&lt;/h3&gt;&lt;ol class=&quot;steps&quot;&gt;&lt;li&gt;수원부처·정부기관과 개발파트너가 국가·부문·지역계획에 맞는 사업수요와 선도기관을 정한다.&lt;/li&gt;&lt;li&gt;사업개념서와 관련 문서를 FERD 단일창구에 제출하고 주·지역 제안은 해당 최고책임자의 사전승인을 받는다(2020 DAP §6.2, Annex A §10.1).&lt;/li&gt;&lt;li&gt;FERD가 관계부처 의견과 DACU·필요한 고위 승인 절차를 조정한 뒤 승인된 제안을 개발파트너에 공식 전달한다.&lt;/li&gt;&lt;li&gt;개발파트너의 심사와 함께 수원기관이 설계·예산·조달계획을 구체화하고 FERD가 협정·MoU·교환각서 초안의 법률의견과 협상을 조정한다.&lt;/li&gt;&lt;li&gt;권한기관 승인과 서명 후 FERD·AIMS에 사업정보를 등록하고 PMU·PSC가 실행·분기보고를 담당한다(2020 DAP §§6.3~6.4, Annex A §§10.2~10.4).&lt;/li&gt;&lt;li&gt;사업 조달은 재원 제공기관의 별도 규정이 있으면 이를 적용하고, 없으면 제1/2022호와 충돌하지 않는 범위의 제1/2017호를 적용한다(제1/2017호 ¶48(g), 제1/2022호 ¶28).&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;적용 대상&lt;/h3&gt;&lt;p style=&quot;margin:0;font-size:13.5px;line-height:1.7&quot;&gt;미얀마 정부기관과 공식 협정·MoU·교환각서로 연결되는 무상·양허성 차관·기술협력 사업의 발굴·승인·실행에 적용한다. 정부 승인 없이 개발파트너가 독립 집행하는 사업은 DAP 정부승인 경로 밖이며, 정부조달은 재원협정의 별도 조달규정 또는 국내 지침을 적용한다.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;법적 근거&lt;/h3&gt;&lt;div class=&quot;law&quot;&gt;&lt;span class=&quot;nm&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://lift-fund.org/sites/lift-fund.org/files/publication/gov_myanmar-dap_2020-compressed.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Myanmar Development Assistance Policy, September 2020&lt;/a&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;§§6.1-6.4, Annex A §§10.1-10.4&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:auto&quot;&gt;지침·정책&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;law&quot;&gt;&lt;span class=&quot;nm&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://mifer.gov.mm/en/about-ferd&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;MIFER/FERD official functions and responsibilities&lt;/a&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:auto&quot;&gt;지침·정책&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;law&quot;&gt;&lt;span class=&quot;nm&quot;&gt;양자 개발협력협정·MoU·Exchange of Notes&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:auto&quot;&gt;양자합의&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;law&quot;&gt;&lt;span class=&quot;nm&quot;&gt;개발파트너별 사업형성·승인·조달 규정&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:auto&quot;&gt;공여기관 규정&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;law&quot;&gt;&lt;span class=&quot;nm&quot;&gt;MIFER/FERD current official functions and approval route&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:auto&quot;&gt;지침·정책&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;law&quot;&gt;&lt;span class=&quot;nm&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.moi.gov.mm/ppd/sites/default/files/book-pdf/2022-04/Vol-75%2CNo-16.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Office of the State Administration Council Directive No. 1/2022&lt;/a&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;¶¶1~16, 25~28&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:auto&quot;&gt;지침·정책&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;law&quot;&gt;&lt;span class=&quot;nm&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.mopf.gov.mm/sites/default/files/upload_pdf/2018/12/Procurement%20Directive.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;President’s Office Directive No. 1/2017&lt;/a&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;¶¶3~50 (제1/2022호와 충돌하지 않는 범위)&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:auto&quot;&gt;지침·정책&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;law&quot;&gt;&lt;span class=&quot;nm&quot;&gt;재원 제공 국제·협력기관의 조달규정&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;Directive No. 1/2017 ¶48(g)&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:auto&quot;&gt;공여기관 규정&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;권한 기관&lt;/h3&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;투자대외경제관계부(MIFER) 대외경제관계국(FERD)&lt;/b&gt;&lt;span&gt;외부 무상·차관·기술지원의 정부 초점기관으로 제안 상신·협상·협정·정부 간 조정·AIMS와 사업모니터링을 담당한다.&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;개발원조조정단위(DACU)&lt;/b&gt;&lt;span&gt;FERD를 사무국으로 두고 개발원조 정책·효과성 조정을 수행한다.&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;경제위원회·국가행정평의회 관련 승인회의&lt;/b&gt;&lt;span&gt;MIFER 현행 공식 페이지에 따라 서명 전 협정안 등 고위 승인을 담당한다.&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;수원부처·주·지역정부·실행기관&lt;/b&gt;&lt;span&gt;사업을 제안·준비하고 예산·PMU/PSC·분기보고를 통해 실행한다.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;이해관계자&lt;/h3&gt;&lt;p style=&quot;margin:0;font-size:13.5px;line-height:1.7&quot;&gt;투자대외경제관계부(MIFER), 대외경제관계국(FERD), 개발원조조정단위(DACU), 관련 수원부처·주/지역 정부, 고위 승인기관, 경제위원회, 개발파트너(PID), 프로젝트관리단(PMU)·운영위원회(PSC), 기획부서·사업평가진도보고부서&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;제출서류&lt;/h3&gt;&lt;div class=&quot;docset&quot;&gt;&lt;b&gt;선도 수원부처·정부기관&lt;/b&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;Concept Proposal Form 또는 사업개념서&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;사업/프로그램 설계문서&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;재원·예산계획&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;예비 조달계획&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;협정·MoU 초안&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;주/지역 정부 제안의 최고책임자 사전승인&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;docset&quot;&gt;&lt;b&gt;FERD·DACU·고위 승인기관&lt;/b&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;관계기관 검토의견&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;DACU 검토·승인 또는 고위 승인 상신안&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;법률의견 취합본&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;최종 협정·MoU·Exchange of Notes 승인안&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;docset&quot;&gt;&lt;b&gt;개발파트너·수원부처&lt;/b&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;서명된 Grant/Concessional Loan Agreement·MoU·Exchange of Notes&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;AIMS 사업등록 정보&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;PMU·PSC 회의록&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;분기 이행보고서&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;유의사항 · 병목&lt;/h3&gt;&lt;ul class=&quot;plain&quot;&gt;&lt;li&gt;제1/2017호 제46~47항은 이의신청·결정 기한과 자동 정지효를 두지 않으므로 실제 공고와 발주기관의 접수절차를 확인해야 한다.&lt;/li&gt;&lt;li&gt;외부재원·국제입찰은 재원협정, 제재·대표성 검토, 공고의 등록·통화·보증은행·서류언어 요건을 함께 확인해야 한다.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;진입장벽&lt;/h3&gt;&lt;ul class=&quot;plain&quot;&gt;&lt;li&gt;외국기업은 낙찰 후 계약 전 미얀마 법인등록, 현지 세무·인허가, 공고별 대사관 확인·언어·보증은행 및 제재 준수요건을 확인해야 한다.&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;현장 검증 필요&lt;/h3&gt;&lt;ul class=&quot;plain&quot;&gt;&lt;li&gt;{&amp;#x27;item&amp;#x27;: &amp;#x27;공식 관보 원문·시행·후속 적용&amp;#x27;, &amp;#x27;question&amp;#x27;: &amp;#x27;제1/2022호의 관보 원문, 종전 지침과의 우선관계 및 2025·2026년 계속 적용을 확인했는가?&amp;#x27;, &amp;#x27;status&amp;#x27;: &amp;#x27;confirmed&amp;#x27;}&lt;/li&gt;&lt;li&gt;{&amp;#x27;item&amp;#x27;: &amp;#x27;기준금액·기한·입찰/이행보증·이의·예외&amp;#x27;, &amp;#x27;question&amp;#x27;: &amp;#x27;6개 정량·절차 항목을 제1/2022호와 비충돌 제1/2017호에서 조문별로 대조했는가?&amp;#x27;, &amp;#x27;status&amp;#x27;: &amp;#x27;confirmed&amp;#x27;}&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;관련 제도&lt;/h3&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;미얀마 공공조달 입찰제도&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;미얀마 조달 거버넌스·감독체계&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;법령 원문&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;현장에서 발주처에 그대로 제시할 수 있는 조문 원문입니다. 우리 요약이 아니라 verbatim이며,
    조문 번호를 누르면 원문 문서로 이동합니다. 한국어 요지 아래로 직역(참고용)을 펼칠 수 있습니다.&lt;/p&gt;
  &lt;div class=&quot;quotes&quot;&gt;&lt;div class=&quot;qc&quot;&gt;
  &lt;div class=&quot;qhd&quot;&gt;
    &lt;span class=&quot;qart&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://lift-fund.org/sites/lift-fund.org/files/publication/gov_myanmar-dap_2020-compressed.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;§6.1 — MIFER as a Single Window&lt;/a&gt;&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;Myanmar Development Assistance Policy, September 2020&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;qtext&quot;&gt;The Ministry of Investment and Foreign Economic Relations shall be the single window for the submission of all cases requiring the DACU’s consideration prior to submission to the Economic Committee.&lt;/div&gt;
  &lt;p class=&quot;qgist&quot;&gt;개발원조 안건은 MIFER가 DACU·경제위원회 심의의 단일창구다.&lt;/p&gt;

&lt;/div&gt;&lt;div class=&quot;qc&quot;&gt;
  &lt;div class=&quot;qhd&quot;&gt;
    &lt;span class=&quot;qart&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://lift-fund.org/sites/lift-fund.org/files/publication/gov_myanmar-dap_2020-compressed.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;§6.3 — Phase 2: Project/Programme Concept Approval&lt;/a&gt;&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;Myanmar Development Assistance Policy, September 2020&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;qtext&quot;&gt;Once a project/programme concept has been agreed, the Government Entity shall submit all relevant documentation to FERD who shall prepare the case for submission to the DACU. The DACU will review the proposal and may either offer an endorsement, allowing for full Project/Programme development to begin, or convey the case to the Economic Committee for further review and approval.&lt;/div&gt;
  &lt;p class=&quot;qgist&quot;&gt;합의된 사업개념은 FERD를 통해 DACU가 검토하고 승인 또는 상위 심의로 보낸다.&lt;/p&gt;

&lt;/div&gt;&lt;div class=&quot;qc&quot;&gt;
  &lt;div class=&quot;qhd&quot;&gt;
    &lt;span class=&quot;qart&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://lift-fund.org/sites/lift-fund.org/files/publication/gov_myanmar-dap_2020-compressed.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Annex A §10.3 Step 3&lt;/a&gt;&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;Myanmar Development Assistance Policy, September 2020&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;qtext&quot;&gt;By now, the Lead Government Entity shall have gathered sufficient information to prepare the following documents (or documents comparable in nature): a draft Project/Programme/Concessional Loan Design; a draft Financing Plan; an Indicative Procurement Plan; and a draft Agreement/MoU.&lt;/div&gt;
  &lt;p class=&quot;qgist&quot;&gt;최종 승인 단계에는 설계·재원·조달계획·협정 초안을 함께 준비한다.&lt;/p&gt;

&lt;/div&gt;&lt;div class=&quot;qc&quot;&gt;
  &lt;div class=&quot;qhd&quot;&gt;
    &lt;span class=&quot;qart&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://lift-fund.org/sites/lift-fund.org/files/publication/gov_myanmar-dap_2020-compressed.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Annex A §10.3 Step 8&lt;/a&gt;&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;Myanmar Development Assistance Policy, September 2020&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;qtext&quot;&gt;Within two weeks of a Grant Agreement/MoU or Concessional Loan Agreement being signed, the Lead Government Entity shall submit to FERD for its records a copy of that Agreement/MoU and any other relevant documentation.&lt;/div&gt;
  &lt;p class=&quot;qgist&quot;&gt;협정 서명 후 2주 이내 FERD에 문서 사본을 제출한다는 2020 정책 기준이다.&lt;/p&gt;

&lt;/div&gt;&lt;div class=&quot;qc&quot;&gt;
  &lt;div class=&quot;qhd&quot;&gt;
    &lt;span class=&quot;qart&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://mifer.gov.mm/en/about-ferd&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Duties and Responsibilities of the Asia and America Division&lt;/a&gt;&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;MIFER/FERD official functions and responsibilities&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;qtext&quot;&gt;Responsibility to submit the projects proposal proposed by the relevant ministries in order to get the approval of the higher level organizations and after that, sending the project proposals to PIDs for their approval and assistance officially; Initiating and coordinating for the signing of Memorandum of Understanding (MOU), Exchange of Letters and Exchange of Notes between the two countries after the proposed projects approved by PIDs’ side;&lt;/div&gt;
  &lt;p class=&quot;qgist&quot;&gt;FERD는 수원부처 제안을 고위 승인에 상신하고 PID 승인 뒤 양자 문서 서명을 조정한다.&lt;/p&gt;

&lt;/div&gt;&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;현행 기준 반영 1건&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;공식 법령·기관 원문으로 확인한 현행 기준과 실무 확인사항입니다.
    출처는 각 항목에 연결했으며.&lt;/p&gt;
  &lt;div class=&quot;disc&quot; data-sev=&quot;high&quot;&gt;
  &lt;div class=&quot;top&quot;&gt;
    &lt;span class=&quot;badge bad&quot;&gt;필수 확인&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;미얀마&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;D01&lt;/span&gt;
  &lt;/div&gt;
  &lt;h3&gt;verification / 공식 원문·현행성·정량요건&lt;/h3&gt;
  &lt;div class=&quot;quote act&quot;&gt;&lt;b&gt;현행 기준&lt;/b&gt;정보부 관보 제75권 제16호에 제1/2022호 전체 원문이 수록되어 있고 2025년 관보가 이를 재적용한다. 제1/2017호는 충돌 부분만 후법 우선이며, 2026년 정부신문 입찰도 제23~24항을 계속 적용한다.&lt;/div&gt;
  &lt;p class=&quot;cite&quot;&gt;확인 출처 · Directive No.1/2022 ¶¶1~16, 25~28; Directive No.1/2017 ¶¶22, 37, 46~48; Myanmar Gazette Vol.78 No.20; GNLM June 2026 tender notice&lt;/p&gt;
  &lt;div class=&quot;todo&quot;&gt;&lt;b&gt;실무 확인&lt;/b&gt;실제 공고의 제출시각, 보증서 양식·발급은행, 공여협정 및 기관별 이의접수 방법을 확인한다.&lt;/div&gt;
  &lt;details class=&quot;review&quot;&gt;
  &lt;summary&gt;Field verification (English)&lt;/summary&gt;
  &lt;div class=&quot;rv&quot;&gt;
    &lt;p&gt;&lt;b&gt;Current legal basis&lt;/b&gt; — 공식 관보에 제1/2022호 전체가 수록되고 2025·2026년 정부 자료가 제1/2022호와 제1/2017호의 계속 적용을 확인한다.&lt;/p&gt;
    &lt;p class=&quot;rv-verify&quot;&gt;&lt;b&gt;✔ Verify&lt;/b&gt; — Check the live notice, security form and bank, financing agreement and entity complaint channel.&lt;/p&gt;
  &lt;/div&gt;
&lt;/details&gt;

  &lt;p class=&quot;act-row&quot;&gt;산출물 반영 — 공식 관보 원문과 2025·2026년 정부 적용자료로 현행성을 확정하고 정량·절차 요건을 조문별로 대조했다.&lt;/p&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;검증&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;정보부 공식 관보 제75권 제16호의 제1/2022호 미얀마어 원문을 전 조문 대조하고, 제1/2017호 공식 정부 게시본·영문 편의번역, 2025년 관보와 2026년 정부신문 실제 입찰을 교차 확인해 시행·우선관계, 기준금액, 기한, 입찰·이행보증, 이의와 예외를 확정했다.&lt;/p&gt;
  &lt;div class=&quot;cards&quot;&gt;
    &lt;div class=&quot;card span2&quot;&gt;&lt;h3&gt;검증 범위&lt;/h3&gt;
      &lt;p style=&quot;margin:0;font-size:13.5px;line-height:1.7&quot;&gt;Directive No.1/2022 ¶¶1~16, 25~28; Directive No.1/2017 ¶¶3~50, especially ¶¶16~26, 37~48; Myanmar Gazette Vol.78 No.20 current application; June 2026 official tender notice.&lt;/p&gt;
      &lt;p style=&quot;margin:12px 0 0;font-size:12.5px;color:var(--muted)&quot;&gt;확인일 2026-07-29 · 자료집 기준일 2026-07-29&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;대조에 쓴 원문&lt;/h3&gt;&lt;ul class=&quot;srcs&quot; style=&quot;padding-left:16px;margin:0&quot;&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.moi.gov.mm/ppd/sites/default/files/book-pdf/2022-04/Vol-75%2CNo-16.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Directive on public procurement and disposal/lease of state-owned assets — Myanmar Gazette Vol.75 No.16&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;지침·정책&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;대조 조문 ¶¶1~16 and 25~28; official Myanmar-language gazette pp.61~67&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-29 · Printing and Publishing Department, Ministry of Information&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.mopf.gov.mm/sites/default/files/upload_pdf/2018/12/Procurement%20Directive.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;President’s Office Directive No. 1/2017&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;지침·정책&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;대조 조문 ¶¶3~50, especially ¶¶16~26, 37~48 and 50&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-29 · Ministry of Planning and Finance&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.lincolnmyanmar.com/wp-content/uploads/2019/04/Tender-procedure-Presidents-Office-1-2017_NoCopy.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;President’s Office Directive No. 1/2017 — English convenience translation&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;지침·정책&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;대조 조문 ¶¶3~50 cross-read against official government references and later gazettes&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-29 · Lincoln Legal Services (Myanmar)&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.moi.gov.mm/ppd/sites/default/files/book-pdf/2025-05/Vol-78%2CNo-20.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Myanmar Gazette Vol.78 No.20 — current tender-committee orders&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;현장 관행&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;대조 조문 2025 orders applying Directive 1/2022 ¶¶19~20 and its two-month tender-validity rule&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-29 · Printing and Publishing Department, Ministry of Information&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.moi.gov.mm/nlm/file-download/download/public/5153&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Global New Light of Myanmar tender notice, June 2026&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;현장 관행&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;대조 조문 Myanmar Port Authority notice applying Directive 1/2017 ¶¶23~24 in June 2026&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-29 · Ministry of Information&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://mifer.gov.mm/en/about-ferd&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;About FERD&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;지침·정책&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;대조 조문 Functions; Asia and America Division; Development Management and Coordination Division; Legal Section&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-26 · Ministry of Investment and Foreign Economic Relations, Myanmar&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://lift-fund.org/sites/lift-fund.org/files/publication/gov_myanmar-dap_2020-compressed.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Myanmar Development Assistance Policy, September 2020&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;지침·정책&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;대조 조문 §§6.1-6.4; Annex A §§10.1-10.4&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-26 · Foreign Economic Relations Department, Ministry of Investment and Foreign Economic Relations&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://mifer.gov.mm/en/publications&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;MIFER Publications — Myanmar Development Assistance Policy&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;지침·정책&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-26 · Ministry of Investment and Foreign Economic Relations, Myanmar&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card span2&quot;&gt;&lt;h3&gt;주의&lt;/h3&gt;&lt;p class=&quot;note&quot;&gt;제1/2022호는 2022-03-17 발령됐고 2022-04-22 관보에 원문이 게재됐다. 별도 유예 시행조항은 없다.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;제1/2017호는 전면 폐지가 아니라 제1/2022호와 충돌하는 부분만 후법 우선이다. 보증·평가·기록·이의 규정은 보충 적용되며 2026년 정부신문 입찰도 제1/2017호 조항을 직접 적용한다.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;이의신청의 법정 기한·자동 정지효는 공개 지침에 규정되지 않았다는 점까지 확인했으며, 이는 미결 조문이 아니라 현행 규정의 공백으로 기록한다.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;p style=&quot;margin:22px 0 0;font-size:12.5px;color:var(--muted)&quot;&gt;
    조문 대조 완료 — 조문의 존재와 문언 일치만 뜻합니다. 법적 해석·적용 타당성·개정 반영 여부는 별도 검토 대상입니다.
  &lt;/p&gt;

                            w:rc.width, h:rc.height};}
  function box(id){
    var el=board.querySelector(&#x27;.node[data-id=&quot;&#x27;+id+&#x27;&quot;]&#x27;);

  /* 라우팅은 korea100studio의 거터 라우팅을 우리 그리드에 이식한 것이다.

  // 장애물(모든 노드)과 거터(노드 없는 띠) 실측

    rowGut.push(r.y+9); rowGut.push(r.b-9); });
  var hc=board.querySelectorAll(&#x27;.brow.head .bcell&#x27;);
  for(var i=1;i&lt;hc.length;i++){ var r=rel(hc[i].getBoundingClientRect()); colGut.push(r.x+11); colGut.push(r.r-11); }

  function segHit(ax,ay,bx,by,e1,e2){
    var n=0, M=3;
    for(var i=0;i&lt;OB.length;i++){ var o=OB[i]; if(o.id===e1||o.id===e2) continue;
      var L=o.x+M,R=o.r-M,T=o.y+M,B=o.b-M;
      if(Math.abs(ay-by)&lt;0.5){ if(ay&gt;T&amp;&amp;ay&lt;B &amp;&amp; Math.max(ax,bx)&gt;L &amp;&amp; Math.min(ax,bx)&lt;R) n++; }
      else { if(ax&gt;L&amp;&amp;ax&lt;R &amp;&amp; Math.max(ay,by)&gt;T &amp;&amp; Math.min(ay,by)&lt;B) n++; }
    } return n;
  }
  function uniq(pts){ return pts.filter(function(p,i){ return i===0 || Math.abs(p.x-pts[i-1].x)&gt;0.5 || Math.abs(p.y-pts[i-1].y)&gt;0.5; }); }
  function score(pts,e1,e2){ pts=uniq(pts); var p=0,l=0;

  function route(a,b,ed){
    var acx=a.x+a.w/2,acy=a.y+a.h/2,bcx=b.x+b.w/2,bcy=b.y+b.h/2, e1=ed.source,e2=ed.target, cs=[];
    // 세로 계열 — a의 위/아래 변에서 나가 b의 위/아래 변으로
    var below=bcy&gt;acy, sp={x:acx,y:below?a.b:a.y}, tp={x:bcx,y:below?b.y:b.b}, tg={x:tp.x,y:tp.y+(below?-GAP:GAP)};
    cs.push(score([sp,{x:sp.x,y:tg.y},tg,tp],e1,e2));                                   // 직선/L
    rowGut.forEach(function(my){ if(my&gt;Math.min(sp.y,tp.y)+6&amp;&amp;my&lt;Math.max(sp.y,tp.y)-6)   // 행 거터 크로스
      cs.push(score([sp,{x:sp.x,y:my},{x:tp.x,y:my},tg,tp],e1,e2)); });
    colGut.forEach(function(gx){                                                          // 열 측면 탈출

    // 가로 계열 — a의 좌/우 변에서 나가 b의 좌/우 변으로
    var right=bcx&gt;acx, sp2={x:right?a.r:a.x,y:acy}, tp2={x:right?b.x:b.r,y:bcy}, tg2={x:tp2.x+(right?-GAP:GAP),y:tp2.y};
    cs.push(score([sp2,{x:tg2.x,y:sp2.y},tg2,tp2],e1,e2));

    rowGut.forEach(function(gy){                                                          // 행 거터 우회
      var as={x:acx,y:gy&gt;acy?a.b:a.y};

    pts=uniq(pts); if(pts.length&lt;2)return &#x27;&#x27;;

      d+=&#x27; Q&#x27;+rnd(c.x)+&#x27; &#x27;+rnd(c.y)+&#x27; &#x27;+rnd(c.x+(n.x-c.x)/d2*r)+&#x27; &#x27;+rnd(c.y+(n.y-c.y)/d2*r);

}

var KIND={&quot;act&quot;: &quot;법률&quot;, &quot;regulation&quot;: &quot;시행규칙&quot;, &quot;ordinance&quot;: &quot;명령·조례&quot;, &quot;directive&quot;: &quot;지침·정책&quot;, &quot;standard-document&quot;: &quot;표준문서&quot;, &quot;treaty-agreement&quot;: &quot;양자합의&quot;, &quot;donor-rule&quot;: &quot;공여기관 규정&quot;, &quot;practice&quot;: &quot;현장 관행&quot;};
function openNode(id){
  var n=NODES[id]; if(!n)return;
  var h=&#x27;&lt;span class=&quot;badge plain muted&quot;&gt;&#x27;+n.id+&#x27;&lt;/span&gt; &#x27;
       +&#x27;&lt;span class=&quot;badge plain muted&quot;&gt;&#x27;+n.lane+&#x27;&lt;/span&gt; &#x27;
       +&#x27;&lt;span class=&quot;badge plain muted&quot;&gt;&#x27;+n.stage+&#x27;&lt;/span&gt;&#x27;;
  h+=&#x27;&lt;h3&gt;&#x27;+n.name+&#x27;&lt;/h3&gt;&#x27;;
  h+=&#x27;&lt;dl class=&quot;kv&quot;&gt;&#x27;;
  h+=&#x27;&lt;dt&gt;담당&lt;/dt&gt;&lt;dd&gt;&#x27;+n.actor+&#x27;&lt;/dd&gt;&#x27;;
  if(n.action) h+=&#x27;&lt;dt&gt;내용&lt;/dt&gt;&lt;dd&gt;&#x27;+n.action+&#x27;&lt;/dd&gt;&#x27;;
  if(n.deadline) h+=&#x27;&lt;dt&gt;기한&lt;/dt&gt;&lt;dd&gt;&#x27;+n.deadline+&#x27;&lt;/dd&gt;&#x27;;
  if(n.output_documents&amp;&amp;n.output_documents.length)
    h+=&#x27;&lt;dt&gt;산출 문서&lt;/dt&gt;&lt;dd&gt;&#x27;+n.output_documents.join(&#x27; · &#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  if(n.blocker) h+=&#x27;&lt;dt&gt;병목&lt;/dt&gt;&lt;dd style=&quot;color:var(--warn)&quot;&gt;&#x27;+n.blocker+&#x27;&lt;/dd&gt;&#x27;;
  if(n.legal_basis&amp;&amp;n.legal_basis.length){
    h+=&#x27;&lt;dt&gt;근거 조문&lt;/dt&gt;&lt;dd&gt;&#x27;+n.legal_basis.map(function(l){
      var nm=l.url?&#x27;&lt;a class=&quot;ref&quot; href=&quot;&#x27;+l.url+&#x27;&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;&#x27;+l.law+&#x27;&lt;/a&gt;&#x27;:l.law;
      return &#x27;&lt;div style=&quot;margin-bottom:4px&quot;&gt;&#x27;+nm+&#x27; &lt;code&gt;&#x27;+l.article+&#x27;&lt;/code&gt;&lt;/div&gt;&#x27;;}).join(&#x27;&#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  }
  if(typeof n.confidence===&#x27;number&#x27;){
    h+=&#x27;&lt;dt&gt;법령 근거 확신도&lt;/dt&gt;&lt;dd&gt;&#x27;+n.confidence.toFixed(2)
      +(n.confidence&lt;0.8?&#x27; &lt;span class=&quot;badge warn&quot;&gt;현장 검증 필요&lt;/span&gt;&#x27;:&#x27;&#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  }
  if(n.confidence_reason) h+=&#x27;&lt;dt&gt;확신도 산정 근거&lt;/dt&gt;&lt;dd&gt;&#x27;+n.confidence_reason+&#x27;&lt;/dd&gt;&#x27;;
  var ins=EDGES.filter(function(x){return x.target===id}),
      outs=EDGES.filter(function(x){return x.source===id});
  if(ins.length) h+=&#x27;&lt;dt&gt;선행&lt;/dt&gt;&lt;dd&gt;&#x27;+ins.map(function(x){
    return (NODES[x.source]?NODES[x.source].name:x.source)+(x.label?&#x27; (&#x27;+x.label+&#x27;)&#x27;:&#x27;&#x27;);}).join(&#x27; · &#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  if(outs.length) h+=&#x27;&lt;dt&gt;후속&lt;/dt&gt;&lt;dd&gt;&#x27;+outs.map(function(x){
    return (NODES[x.target]?NODES[x.target].name:x.target)+(x.label?&#x27; (&#x27;+x.label+&#x27;)&#x27;:&#x27;&#x27;);}).join(&#x27; · &#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  h+=&#x27;&lt;/dl&gt;&#x27;;
  document.getElementById(&#x27;dbody&#x27;).innerHTML=h;
  document.getElementById(&#x27;dlg&#x27;).showModal();
}

document.querySelectorAll(&#x27;.node&#x27;).forEach(function(b){
  b.addEventListener(&#x27;click&#x27;,function(){openNode(b.dataset.id)});
  b.addEventListener(&#x27;mouseenter&#x27;,function(){
    var id=b.dataset.id;
    var rel={};rel[id]=1;
    EDGES.forEach(function(x){if(x.source===id)rel[x.target]=1;if(x.target===id)rel[x.source]=1;});
    document.querySelectorAll(&#x27;.node&#x27;).forEach(function(o){o.classList.toggle(&#x27;dim&#x27;,!rel[o.dataset.id])});
  });
  b.addEventListener(&#x27;mouseleave&#x27;,function(){
    document.querySelectorAll(&#x27;.node&#x27;).forEach(function(o){o.classList.remove(&#x27;dim&#x27;)});
  });
});
document.getElementById(&#x27;dlg&#x27;).addEventListener(&#x27;click&#x27;,function(ev){
  if(ev.target===this) this.close();
});

addEventListener(&#x27;load&#x27;,draw); addEventListener(&#x27;resize&#x27;,draw);
new MutationObserver(draw).observe(document.documentElement,{attributes:true,attributeFilter:[&#x27;data-theme&#x27;]});
&lt;/script&gt;
&lt;/body&gt;&lt;/html&gt;"></iframe></div>
<div class="foot">
  자료집 기준일 기준으로 작성된 참고자료입니다. 법률 자문이나 해당국 정부·KOICA의 공식 해석이 아닙니다.
  조달법은 개정이 잦으므로 실제 입찰 전 발주처 공고문과 현행 법령을 확인해야 합니다.
</div>
<script>
function fit(fr){ try{ fr.style.height=(fr.contentWindow.document.body.scrollHeight+20)+'px'; }catch(e){} }
function showTab(i){
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.toggle('active', +t.dataset.i===i); });
  document.querySelectorAll('.fr').forEach(function(fr){
    var on=+fr.dataset.i===i; fr.classList.toggle('active', on);
    if(on){ try{ fr.contentWindow.draw && fr.contentWindow.draw(); }catch(e){} setTimeout(function(){fit(fr);},60); }
  });
}
document.querySelectorAll('.fr').forEach(function(fr){
  fr.addEventListener('load', function(){
    // iframe 안의 테마 토글·업무구조도가 부모 테마를 따르도록, 그리고 높이를 맞춘다
    fit(fr);
    if(fr.classList.contains('active')) setTimeout(function(){ try{fr.contentWindow.draw&&fr.contentWindow.draw();}catch(e){} fit(fr); },80);
  });
});
addEventListener('resize', function(){ var a=document.querySelector('.fr.active'); if(a) fit(a); });
</script>
</body></html>
