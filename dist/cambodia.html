&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;한 장 캔버스&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;공공조달을 금액구간에 따라 국제경쟁입찰·국내경쟁입찰·가격경쟁·비교견적·직접계약으로 나누어 발주하되, 품목(재화·공사·용역) 구분 없이 동일 제도로 평가·계약한다.&lt;/p&gt;
  &lt;div class=&quot;cards&quot;&gt;
    &lt;div class=&quot;card span2&quot;&gt;&lt;h3&gt;절차&lt;/h3&gt;&lt;ol class=&quot;steps&quot;&gt;&lt;li&gt;발주기관 조달계획 수립 및 재원 구분(국내재원 GDPP / 외부재원 GDICDM·SOP 2019)&lt;/li&gt;&lt;li&gt;금액구간에 따른 입찰방식 선택 — 국제경쟁·국내경쟁·가격경쟁·비교견적·직접계약&lt;/li&gt;&lt;li&gt;사전적격심사 또는 사후적격심사 여부 결정 (공고문에 명시)&lt;/li&gt;&lt;li&gt;입찰공고 — 방식별 공고기간(국제 60일·국내 30일·가격경쟁 15일)&lt;/li&gt;&lt;li&gt;입찰서 제출 — 입찰자 수 제한 없음(경쟁방식)&lt;/li&gt;&lt;li&gt;평가 — 품목 무관 동일 제도. 기술평가 기준 부재 시 가격평가에 의존&lt;/li&gt;&lt;li&gt;낙찰·계약 체결&lt;/li&gt;&lt;li&gt;(외부재원) DP 조달지침이 SOP에 우선하는 경우 그 절차를 따름&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;적용 대상&lt;/h3&gt;&lt;p style=&quot;margin:0;font-size:13.5px;line-height:1.7&quot;&gt;캄보디아 정부기관의 재화·공사·용역 조달에 적용된다. 2026 기준자료의 금액구간(USD)은 국제경쟁입찰: 재화 125만↑·시공 150만↑·용역 100만↑, 국내경쟁입찰: 재화 25만~125만·시공 25만~150만·용역 25만~100만, 가격경쟁: 0.5만~2.5만, 비교견적: 0.5만 미만이다. 현행 하위규정 전문을 확인하지 못했으므로 개별 공고와 발주기관에서 재확인한다.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;법적 근거&lt;/h3&gt;&lt;div class=&quot;law&quot;&gt;&lt;span class=&quot;nm&quot;&gt;Law on Public Procurement, 2023 (Royal Kram NS/RKM/0523/005)&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;15장 87조 (컨설팅 조달·이행절차·벌칙 신설)&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:auto&quot;&gt;법률&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;law&quot;&gt;&lt;span class=&quot;nm&quot;&gt;Law on Public Procurement, 2012 (Royal Kram NS/RKM/0112/004) — 폐지&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:auto&quot;&gt;법률&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;law&quot;&gt;&lt;span class=&quot;nm&quot;&gt;공공조달 하위규정(sub-decree·prakas) — 현행 원문 확인 필요&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:auto&quot;&gt;시행규칙&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;law&quot;&gt;&lt;span class=&quot;nm&quot;&gt;외부재원 조달 표준운영절차(SOP on Procurement for All Externally Financed Projects/Programs, 2019)&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:auto&quot;&gt;표준문서&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;권한 기관&lt;/h3&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;&lt;a class=&quot;ref&quot; href=&quot;http://gdpp.gov.kh/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;경제재무부(MEF) 공공조달국(GDPP)&lt;/a&gt;&lt;/b&gt;&lt;span&gt;국내재원 조달 정책·법제도 수립, 조달지침 제공, 감독·감사. 신법상 사후검토·부정기 검사권&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;발주 정부기관&lt;/b&gt;&lt;span&gt;금액구간에 따라 입찰방식 선택, 공고·평가·계약. 재원별로 GDPP 또는 GDICDM 관할&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;개발협력파트너(DP)&lt;/b&gt;&lt;span&gt;외부재원 사업에서 재정지원약정(Financing Agreement)의 특수조건으로 자체 조달지침을 우선 적용할 수 있음&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;국토인프라교통부(MLIT)&lt;/b&gt;&lt;span&gt;외국인 건설업 면허 발급&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;이해관계자&lt;/h3&gt;&lt;p style=&quot;margin:0;font-size:13.5px;line-height:1.7&quot;&gt;발주 정부기관(중앙·주·군/시), 경제재무부(MEF) 공공조달국(GDPP), 국제협력차관관리국(GDICDM), 국내외 입찰자, 개발협력파트너(DP), 국토인프라교통부(MLIT, 건설업 면허)&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;제출서류&lt;/h3&gt;&lt;div class=&quot;docset&quot;&gt;&lt;b&gt;입찰자(공통)&lt;/b&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;입찰서&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;법인등록증(Certificate of Incorporation)&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;세금완납증명서(tax clearance certificate)&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;사업 실적·자격 서류&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;docset&quot;&gt;&lt;b&gt;외국인 건설업 참여자&lt;/b&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;국토인프라교통부(MLIT) 건설업 면허 — 면허 종별 기술책임자·경력 요건 충족&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;docset&quot;&gt;&lt;b&gt;발주 정부기관&lt;/b&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;입찰공고문&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;입찰서류&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;평가결과&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;계약서&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;유의사항 · 병목&lt;/h3&gt;&lt;ul class=&quot;plain&quot;&gt;&lt;li&gt;현행 근거는 2023년 공공조달법(Royal Kram NS/RKM/0523/005)이다. 공식 영문본과 현행 하위규정 전문은 확인하지 못했으므로 조달방식·금액구간은 발주 시 재확인해야 한다&lt;/li&gt;&lt;li&gt;수의계약(직접계약) 비율이 높고 발주기관이 과업을 세분해 수의계약을 선호해, 공개입찰 공고가 적고 조달 정보 접근성이 낮다&lt;/li&gt;&lt;li&gt;기술평가 기준이 제시되지 않는 경우가 많아 가격평가에 의존하게 된다&lt;/li&gt;&lt;li&gt;제한경쟁 방식은 법에 있으나 실제 사례가 확인되지 않는다&lt;/li&gt;&lt;li&gt;외부재원 사업은 DP의 재정지원약정 특수조건으로 SOP가 수정·예외되거나 DP 자체 조달지침이 우선할 수 있다 — 발주 전 해당 DP의 유사 사업 이전 공고문 확인 필요&lt;/li&gt;&lt;li&gt;법인등록(평균 99일)·건설업 면허·세금완납증명 발급에 시일이 걸려 입찰 공고 전 사전 완비가 필요하다&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;진입장벽&lt;/h3&gt;&lt;ul class=&quot;plain&quot;&gt;&lt;li&gt;외국인 건설업은 국토인프라교통부(MLIT) 면허 필요 — 면허 종별로 10년 이상 경력 건설기사·건축설계사 요건&lt;/li&gt;&lt;li&gt;법인 등록·운영 시 회계·실적·운영현황 보고서를 3개월~1년 단위로 제출하되, 사업분야·지역별 관할 부처·지방정부에 따라 제출서류·빈도·작성언어가 상이&lt;/li&gt;&lt;li&gt;투자법 개정 전이라 지분 매각·투자금 회수 절차가 법적으로 명확히 보호되지 않음&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;현장 검증 필요&lt;/h3&gt;&lt;ul class=&quot;plain&quot;&gt;&lt;li&gt;금액구간·공고기간(국제 60일·국내 30일·가격경쟁 15일) — 현행 하위규정과 개별 공고에서 확인 필요&lt;/li&gt;&lt;li&gt;2023법의 조달방식 규정 — 공개·가격경쟁·비교견적·직접계약의 현행 적용 범위 확인 필요&lt;/li&gt;&lt;li&gt;직접계약(수의계약) 허용 요건의 신법상 강화 여부 — 신법이 벌칙·통제를 강화&lt;/li&gt;&lt;li&gt;사전/사후 적격심사 구분 기준&lt;/li&gt;&lt;li&gt;GDPP 공식 사이트(gdpp.gov.kh)가 해외에서 봇 차단(403)·타임아웃으로 접근이 불안정 — 현지에서 접속 가능 여부 확인 필요&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;관련 제도&lt;/h3&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;캄보디아 조달 거버넌스·감독체계&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;캄보디아 ODA 사업 발굴·형성 절차&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;



&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;현행 기준 반영 1건&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;공식 법령·기관 원문으로 확인한 현행 기준과 실무 확인사항입니다.
    출처는 각 항목에 연결했으며.&lt;/p&gt;
  &lt;div class=&quot;disc&quot; data-sev=&quot;medium&quot;&gt;
  &lt;div class=&quot;top&quot;&gt;
    &lt;span class=&quot;badge warn&quot;&gt;추가 확인&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;캄보디아&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;D01&lt;/span&gt;
  &lt;/div&gt;
  &lt;h3&gt;canvas.legalBasis / 근거 조달법의 현행 여부&lt;/h3&gt;
  &lt;div class=&quot;quote act&quot;&gt;&lt;b&gt;현행 기준&lt;/b&gt;캄보디아 법무부는 2023 공공조달법(Royal Kram NS/RKM/0523/005, 2023-05-16)을 공식 법령 목록에 게시하고 있다. GDPP 공식 페이지는 물품·공사·서비스와 컨설팅 조달을 관리 대상으로 명시한다. 공식 영문본과 현행 하위규정 전문은 확인하지 못했다.&lt;/div&gt;
  &lt;p class=&quot;cite&quot;&gt;확인 출처 · Law on Public Procurement, 2023 (Royal Kram NS/RKM/0523/005); Ministry of Justice Cambodia; GDPP official duties page&lt;/p&gt;
  &lt;div class=&quot;todo&quot;&gt;&lt;b&gt;실무 확인&lt;/b&gt;캄보디아 입찰 준비 시 2023 공공조달법을 기본 근거로 삼고, 입찰방식·금액구간·보증 요건은 개별 공고와 발주기관에서 재확인한다.&lt;/div&gt;
  &lt;details class=&quot;review&quot;&gt;
  &lt;summary&gt;Field verification (English)&lt;/summary&gt;
  &lt;div class=&quot;rv&quot;&gt;
    &lt;p&gt;&lt;b&gt;Current legal basis&lt;/b&gt; — Cambodia&amp;#x27;s Law on Public Procurement 2012 was abrogated by the new Law on Public Procurement 2023 (Royal Kram NS/RKM/0523/005, promulgated 16 May 2023), which adds consulting-services procurement, implementation procedures, heavier penalties (imprisonment for individuals, fines up to KHR 100 million), and MEF post-review/inspection powers. Its implementing regulations are still in draft, so the 2012-era sub-decrees remain in force until replaced.&lt;/p&gt;
    &lt;p class=&quot;rv-verify&quot;&gt;&lt;b&gt;✔ Verify&lt;/b&gt; — Treat thresholds/methods as provisionally valid under the 2012-era regulations, but check penalties and consulting-procurement rules against the 2023 law. Recheck thresholds once the new sub-decrees are issued.&lt;/p&gt;
  &lt;/div&gt;
&lt;/details&gt;

  &lt;p class=&quot;act-row&quot;&gt;산출물 반영 — 근거 법률을 2023 공공조달법으로 반영하고, 공식 영문본·하위규정 미확인 범위는 현지 확인사항으로 표시했다.&lt;/p&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;검증&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;캄보디아 법무부 공식 법령 목록에서 2023 공공조달법(Royal Kram NS/RKM/0523/005)을 확인하고, GDPP 공식 페이지에서 물품·공사·서비스·컨설팅 조달 관리 기능을 확인했다. 공식 영문본과 현행 하위규정 전문은 확보하지 못했다.&lt;/p&gt;
  &lt;div class=&quot;cards&quot;&gt;
    &lt;div class=&quot;card span2&quot;&gt;&lt;h3&gt;검증 범위&lt;/h3&gt;
      &lt;p style=&quot;margin:0;font-size:13.5px;line-height:1.7&quot;&gt;현행 근거 법률과 재원별 이원화(GDPP·GDICDM), 외부재원 SOP 2019를 확인했다. 조달방식·금액구간은 크메르어 법령과 하위규정 전문을 확보하지 못해 조문 단위 확인이 미완이다.&lt;/p&gt;
      &lt;p style=&quot;margin:12px 0 0;font-size:12.5px;color:var(--muted)&quot;&gt;확인일 2026-07-23 · 자료집 기준일 2026-02-23&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;대조에 쓴 원문&lt;/h3&gt;&lt;ul class=&quot;srcs&quot; style=&quot;padding-left:16px;margin:0&quot;&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.moj.gov.kh/en/law-regular/page-16/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Law on Public Procurement (16.05.2023), Royal Kram NS/RKM/0523/005&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;법률&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-28 · Ministry of Justice, Kingdom of Cambodia&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://vdb-loi.com/kh_publications/new-developments-under-the-public-procurement-law-2023/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;New Developments under the Public Procurement Law 2023 (로펌 해설)&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;지침·정책&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-28 · VDB Loi&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;http://gdpp.gov.kh/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;경제재무부 공공조달국(GDPP)&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;지침·정책&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-28 · Ministry of Economy and Finance, Cambodia&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card span2&quot;&gt;&lt;h3&gt;주의&lt;/h3&gt;&lt;p class=&quot;note&quot;&gt;캄보디아 법무부 공식 법령 목록에서 2023 공공조달법(Royal Kram NS/RKM/0523/005, 2023-05-16)을 현행 근거로 확인했다.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;경제재무부·GDPP 공식 공개 페이지에서 2023법 이후 별도 하위규정 전문을 특정하지 못했다. 금액구간·입찰방식·보증 요건은 공고와 발주기관에 재확인한다.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;신법 원문은 크메르어이며 공식 영문본을 확보하지 못했다. 세부 조문 해석은 크메르어 원문 또는 추후 공식 영문본으로 대조해야 한다.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;h3 style=&quot;font-size:14px;margin:26px 0 12px&quot;&gt;확인하지 못한 것&lt;/h3&gt;&lt;div class=&quot;card&quot; style=&quot;margin-bottom:12px&quot;&gt;&lt;h3&gt;&lt;a class=&quot;ref&quot; href=&quot;https://data.opendevelopmentcambodia.net/laws_record/public-procurement&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Law on Public Procurement 2023 크메르어 원문 조문&lt;/a&gt; &lt;span class=&quot;badge plain muted&quot;&gt;local-language-only&lt;/span&gt;&lt;/h3&gt;&lt;p style=&quot;margin:0 0 8px;font-size:13.5px&quot;&gt;신법 원문이 크메르어 스캔본(텍스트 레이어 없음)이고 공식 영문본을 확보하지 못했다. 조달방식·금액구간·직접계약 요건의 신법 조문을 verbatim 대조하지 못했다.&lt;/p&gt;&lt;p style=&quot;margin:0;font-size:13px;color:var(--muted)&quot;&gt;다음 조치 — MEF·GDPP의 공식 영문본 또는 신 시행규정이 공개되면 조달방식·금액구간을 조문 단위로 대조한다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; style=&quot;margin-bottom:12px&quot;&gt;&lt;h3&gt;신 시행규정(sub-decree·prakas) &lt;span class=&quot;badge plain muted&quot;&gt;no-public-text&lt;/span&gt;&lt;/h3&gt;&lt;p style=&quot;margin:0 0 8px;font-size:13.5px&quot;&gt;경제재무부·GDPP 공식 공개 페이지에서 2023법 이후 현행 하위규정 전문을 특정하지 못했다.&lt;/p&gt;&lt;p style=&quot;margin:0;font-size:13px;color:var(--muted)&quot;&gt;다음 조치 — 현행 하위규정 원문을 확보하면 금액구간·공고기간·적격심사 기준을 갱신한다.&lt;/p&gt;&lt;/div&gt;
  &lt;p style=&quot;margin:22px 0 0;font-size:12.5px;color:var(--muted)&quot;&gt;
    원문 링크 연결 — 조문의 존재와 문언 일치만 뜻합니다. 법적 해석·적용 타당성·개정 반영 여부는 별도 검토 대상입니다.
  &lt;/p&gt;
&lt;/section&gt;
&lt;/div&gt;

  자료집 기준일 기준으로 작성된 참고자료입니다. 법률 자문이나 해당국 정부·KOICA의 공식 해석이 아닙니다.&lt;br&gt;
  조달법은 개정이 잦습니다 — 실제 입찰 전 발주처 공고문과 현행 법령을 확인해야 합니다.&lt;br&gt;
  1차 출처 KOICA 2026 국가별 개발협력사업 참여전략 자료집 · 현행 기준 출처는 각 제도의 검증 블록 참조

ot;: &quot;발주 정부기관&quot;, &quot;action&quot;: &quot;계약기간 6개월 미만·기존 계약 25% 미만 추가구매 등 특별한 경우에 한한다. 실무상 과업 세분으로 선호되나 신법이 벌칙을 강화했다.&quot;, &quot;blocker&quot;: &quot;수의계약 남용은 2023 신법의 강화된 벌칙 대상이 될 수 있다&quot;, &quot;confidence&quot;: 0.7}};
var EDGES=[{&quot;id&quot;: &quot;E01&quot;, &quot;source&quot;: &quot;P01&quot;, &quot;target&quot;: &quot;P02&quot;, &quot;type&quot;: &quot;sequence&quot;}, {&quot;id&quot;: &quot;E02&quot;, &quot;source&quot;: &quot;P02&quot;, &quot;target&quot;: &quot;P03&quot;, &quot;type&quot;: &quot;sequence&quot;}, {&quot;id&quot;: &quot;E03&quot;, &quot;source&quot;: &quot;P02&quot;, &quot;target&quot;: &quot;P09&quot;, &quot;type&quot;: &quot;sequence&quot;, &quot;label&quot;: &quot;특별 사유&quot;}, {&quot;id&quot;: &quot;E04&quot;, &quot;source&quot;: &quot;P03&quot;, &quot;target&quot;: &quot;P04&quot;, &quot;type&quot;: &quot;sequence&quot;}, {&quot;id&quot;: &quot;E05&quot;, &quot;source&quot;: &quot;P04&quot;, &quot;target&quot;: &quot;P05&quot;, &quot;type&quot;: &quot;message&quot;, &quot;label&quot;: &quot;외부재원 시&quot;}, {&quot;id&quot;: &quot;E06&quot;, &quot;source&quot;: &quot;P04&quot;, &quot;target&quot;: &quot;P06&quot;, &quot;type&quot;: &quot;sequence&quot;}, {&quot;id&quot;: &quot;E07&quot;, &quot;source&quot;: &quot;P05&quot;, &quot;target&quot;: &quot;P06&quot;, &quot;type&quot;: &quot;message&quot;, &quot;label&quot;: &quot;DP 지침 우선&quot;}, {&quot;id&quot;: &quot;E08&quot;, &quot;source&quot;: &quot;P06&quot;, &quot;target&quot;: &quot;P07&quot;, &quot;type&quot;: &quot;sequence&quot;}, {&quot;id&quot;: &quot;E09&quot;, &quot;source&quot;: &quot;P07&quot;, &quot;target&quot;: &quot;P08&quot;, &quot;type&quot;: &quot;sequence&quot;}, {&quot;id&quot;: &quot;E10&quot;, &quot;source&quot;: &quot;P09&quot;, &quot;target&quot;: &quot;P08&quot;, &quot;type&quot;: &quot;sequence&quot;, &quot;label&quot;: &quot;수의 계약&quot;}];

/* 엣지 그리기 — 노드 DOM 위치를 재서 SVG로 연결 */
function draw(){
  var board=document.getElementById(&#x27;board&#x27;),svg=document.getElementById(&#x27;edges&#x27;);
  if(!board||!svg)return;
  var bb=board.getBoundingClientRect();
  svg.setAttribute(&#x27;viewBox&#x27;,&#x27;0 0 &#x27;+board.scrollWidth+&#x27; &#x27;+board.scrollHeight);
  svg.setAttribute(&#x27;width&#x27;,board.scrollWidth); svg.setAttribute(&#x27;height&#x27;,board.scrollHeight);
  var cs=getComputedStyle(document.documentElement);
  var C={sequence:cs.getPropertyValue(&#x27;--muted&#x27;).trim(),
         message:cs.getPropertyValue(&#x27;--back&#x27;).trim(),
         loop:cs.getPropertyValue(&#x27;--warn&#x27;).trim()};
  var d=&#x27;&lt;defs&gt;&#x27;;
  [&#x27;sequence&#x27;,&#x27;message&#x27;,&#x27;loop&#x27;].forEach(function(t){
    d+=&#x27;&lt;marker id=&quot;m-&#x27;+t+&#x27;&quot; viewBox=&quot;0 0 8 8&quot; refX=&quot;7&quot; refY=&quot;4&quot; markerWidth=&quot;6&quot; markerHeight=&quot;6&quot; orient=&quot;auto&quot;&gt;&#x27;
      +&#x27;&lt;path d=&quot;M0 0 L8 4 L0 8 z&quot; fill=&quot;&#x27;+C[t]+&#x27;&quot;/&gt;&lt;/marker&gt;&#x27;;
  });
  d+=&#x27;&lt;/defs&gt;&#x27;;
  var GAP=5;
  function rel(rc){return {x:rc.left-bb.left+board.scrollLeft, y:rc.top-bb.top+board.scrollTop,
                            r:rc.right-bb.left+board.scrollLeft, b:rc.bottom-bb.top+board.scrollTop,
                            w:rc.width, h:rc.height};}
  function box(id){
    var el=board.querySelector(&#x27;.node[data-id=&quot;&#x27;+id+&#x27;&quot;]&#x27;);
    if(!el)return null; return rel(el.getBoundingClientRect());
  }

  /* 라우팅은 korea100studio의 거터 라우팅을 우리 그리드에 이식한 것이다.
     핵심: 카드를 지나야 하는 선은 카드가 없는 거터(행 하단·열 측면)로 우회한다.
     DOM에서 노드·행·열을 실측할 수 있어, 여러 직교 경로 후보를 만들고
     무관한 카드를 가장 적게 관통하는(동수면 가장 짧은) 것을 고른다. */

  // 장애물(모든 노드)과 거터(노드 없는 띠) 실측
  var OB=[];
  board.querySelectorAll(&#x27;.node&#x27;).forEach(function(el){ var r=box(el.dataset.id); r.id=el.dataset.id; OB.push(r); });
  var rowGut=[], colGut=[];
  board.querySelectorAll(&#x27;.brow:not(.head)&#x27;).forEach(function(el){ var r=rel(el.getBoundingClientRect());
    rowGut.push(r.y+9); rowGut.push(r.b-9); });
  var hc=board.querySelectorAll(&#x27;.brow.head .bcell&#x27;);
  for(var i=1;i&lt;hc.length;i++){ var r=rel(hc[i].getBoundingClientRect()); colGut.push(r.x+11); colGut.push(r.r-11); }

  function segHit(ax,ay,bx,by,e1,e2){
    var n=0, M=3;
    for(var i=0;i&lt;OB.length;i++){ var o=OB[i]; if(o.id===e1||o.id===e2) continue;
      var L=o.x+M,R=o.r-M,T=o.y+M,B=o.b-M;
      if(Math.abs(ay-by)&lt;0.5){ if(ay&gt;T&amp;&amp;ay&lt;B &amp;&amp; Math.max(ax,bx)&gt;L &amp;&amp; Math.min(ax,bx)&lt;R) n++; }
      else { if(ax&gt;L&amp;&amp;ax&lt;R &amp;&amp; Math.max(ay,by)&gt;T &amp;&amp; Math.min(ay,by)&lt;B) n++; }
    } return n;
  }
  function uniq(pts){ return pts.filter(function(p,i){ return i===0 || Math.abs(p.x-pts[i-1].x)&gt;0.5 || Math.abs(p.y-pts[i-1].y)&gt;0.5; }); }
  function score(pts,e1,e2){ pts=uniq(pts); var p=0,l=0;
    for(var i=0;i&lt;pts.length-1;i++){ p+=segHit(pts[i].x,pts[i].y,pts[i+1].x,pts[i+1].y,e1,e2);
      l+=Math.abs(pts[i].x-pts[i+1].x)+Math.abs(pts[i].y-pts[i+1].y); }
    return {pts:pts,p:p,l:l}; }

  function route(a,b,ed){
    var acx=a.x+a.w/2,acy=a.y+a.h/2,bcx=b.x+b.w/2,bcy=b.y+b.h/2, e1=ed.source,e2=ed.target, cs=[];
    // 세로 계열 — a의 위/아래 변에서 나가 b의 위/아래 변으로
    var below=bcy&gt;acy, sp={x:acx,y:below?a.b:a.y}, tp={x:bcx,y:below?b.y:b.b}, tg={x:tp.x,y:tp.y+(below?-GAP:GAP)};
    cs.push(score([sp,{x:sp.x,y:tg.y},tg,tp],e1,e2));                                   // 직선/L
    rowGut.forEach(function(my){ if(my&gt;Math.min(sp.y,tp.y)+6&amp;&amp;my&lt;Math.max(sp.y,tp.y)-6)   // 행 거터 크로스
      cs.push(score([sp,{x:sp.x,y:my},{x:tp.x,y:my},tg,tp],e1,e2)); });
    colGut.forEach(function(gx){                                                          // 열 측면 탈출
      var as={x:gx&gt;acx?a.r:a.x,y:acy};
      cs.push(score([as,{x:gx,y:acy},{x:gx,y:tg.y},tg,tp],e1,e2)); });
    // 가로 계열 — a의 좌/우 변에서 나가 b의 좌/우 변으로
    var right=bcx&gt;acx, sp2={x:right?a.r:a.x,y:acy}, tp2={x:right?b.x:b.r,y:bcy}, tg2={x:tp2.x+(right?-GAP:GAP),y:tp2.y};
    cs.push(score([sp2,{x:tg2.x,y:sp2.y},tg2,tp2],e1,e2));
    colGut.forEach(function(mx){ if(mx&gt;Math.min(sp2.x,tp2.x)+6&amp;&amp;mx&lt;Math.max(sp2.x,tp2.x)-6)
      cs.push(score([sp2,{x:mx,y:sp2.y},{x:mx,y:tp2.y},tg2,tp2],e1,e2)); });
    rowGut.forEach(function(gy){                                                          // 행 거터 우회
      var as={x:acx,y:gy&gt;acy?a.b:a.y};
      cs.push(score([as,{x:acx,y:gy},{x:tp2.x,y:gy},tg2,tp2],e1,e2)); });
    // 회귀선 — 아래로 크게 우회 (되돌아가는 흐름을 시각적으로 구분)
    if(ed.type===&#x27;loop&#x27;){ var gy=Math.max(a.b,b.b)+26;
      cs.push(score([{x:acx,y:a.b},{x:acx,y:gy},{x:bcx,y:gy},{x:bcx,y:b.b+GAP},{x:bcx,y:b.b}],e1,e2)); }
    cs=cs.filter(function(c){return c.pts.length&gt;=2;});
    cs.sort(function(x,y){ return x.p-y.p || x.l-y.l; });
    return cs[0];
  }

  function rnd(v){return Math.round(v*10)/10;}
  function orthPath(pts){                    // 직교 경로 + 모서리 라운딩
    pts=uniq(pts); if(pts.length&lt;2)return &#x27;&#x27;;
    var d=&#x27;M&#x27;+rnd(pts[0].x)+&#x27; &#x27;+rnd(pts[0].y);
    for(var i=1;i&lt;pts.length-1;i++){
      var p=pts[i-1],c=pts[i],n=pts[i+1];
      var d1=Math.hypot(c.x-p.x,c.y-p.y)||1, d2=Math.hypot(n.x-c.x,n.y-c.y)||1, r=Math.min(7,d1/2,d2/2);
      d+=&#x27; L&#x27;+rnd(c.x-(c.x-p.x)/d1*r)+&#x27; &#x27;+rnd(c.y-(c.y-p.y)/d1*r);
      d+=&#x27; Q&#x27;+rnd(c.x)+&#x27; &#x27;+rnd(c.y)+&#x27; &#x27;+rnd(c.x+(n.x-c.x)/d2*r)+&#x27; &#x27;+rnd(c.y+(n.y-c.y)/d2*r);
    }
    var e=pts[pts.length-1]; return d+&#x27; L&#x27;+rnd(e.x)+&#x27; &#x27;+rnd(e.y);
  }

  EDGES.forEach(function(ed){
    var a=box(ed.source),b=box(ed.target); if(!a||!b)return;
    var t=ed.type||&#x27;sequence&#x27;, rt=route(a,b,ed);
    d+=&#x27;&lt;path d=&quot;&#x27;+orthPath(rt.pts)+&#x27;&quot; fill=&quot;none&quot; stroke=&quot;&#x27;+C[t]+&#x27;&quot; stroke-width=&quot;1.5&quot; opacity=&quot;&#x27;
      +(t===&#x27;sequence&#x27;?&#x27;.55&#x27;:&#x27;.8&#x27;)+&#x27;&quot;&#x27;+(t!==&#x27;sequence&#x27;?&#x27; stroke-dasharray=&quot;4 3&quot;&#x27;:&#x27;&#x27;)
      +&#x27; marker-end=&quot;url(#m-&#x27;+t+&#x27;)&quot;/&gt;&#x27;;
  });
  svg.innerHTML=d;
}

var KIND={&quot;act&quot;: &quot;법률&quot;, &quot;regulation&quot;: &quot;시행규칙&quot;, &quot;ordinance&quot;: &quot;명령·조례&quot;, &quot;directive&quot;: &quot;지침·정책&quot;, &quot;standard-document&quot;: &quot;표준문서&quot;, &quot;treaty-agreement&quot;: &quot;양자합의&quot;, &quot;donor-rule&quot;: &quot;공여기관 규정&quot;, &quot;practice&quot;: &quot;현장 관행&quot;};
function openNode(id){
  var n=NODES[id]; if(!n)return;
  var h=&#x27;&lt;span class=&quot;badge plain muted&quot;&gt;&#x27;+n.id+&#x27;&lt;/span&gt; &#x27;
       +&#x27;&lt;span class=&quot;badge plain muted&quot;&gt;&#x27;+n.lane+&#x27;&lt;/span&gt; &#x27;
       +&#x27;&lt;span class=&quot;badge plain muted&quot;&gt;&#x27;+n.stage+&#x27;&lt;/span&gt;&#x27;;
  h+=&#x27;&lt;h3&gt;&#x27;+n.name+&#x27;&lt;/h3&gt;&#x27;;
  h+=&#x27;&lt;dl class=&quot;kv&quot;&gt;&#x27;;
  h+=&#x27;&lt;dt&gt;담당&lt;/dt&gt;&lt;dd&gt;&#x27;+n.actor+&#x27;&lt;/dd&gt;&#x27;;
  if(n.action) h+=&#x27;&lt;dt&gt;내용&lt;/dt&gt;&lt;dd&gt;&#x27;+n.action+&#x27;&lt;/dd&gt;&#x27;;
  if(n.deadline) h+=&#x27;&lt;dt&gt;기한&lt;/dt&gt;&lt;dd&gt;&#x27;+n.deadline+&#x27;&lt;/dd&gt;&#x27;;
  if(n.output_documents&amp;&amp;n.output_documents.length)
    h+=&#x27;&lt;dt&gt;산출 문서&lt;/dt&gt;&lt;dd&gt;&#x27;+n.output_documents.join(&#x27; · &#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  if(n.blocker) h+=&#x27;&lt;dt&gt;병목&lt;/dt&gt;&lt;dd style=&quot;color:var(--warn)&quot;&gt;&#x27;+n.blocker+&#x27;&lt;/dd&gt;&#x27;;
  if(n.legal_basis&amp;&amp;n.legal_basis.length){

})();

&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;한 장 캔버스&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;재원에 따라 조달 관장기관을 나누어(국내재원 GDPP·외부재원 GDICDM), 조달정책·법제도를 중앙에서 수립하되 조달을 분권화해 정부기관·지방정부가 한도 내에서 직접 조달하도록 한다.&lt;/p&gt;
  &lt;div class=&quot;cards&quot;&gt;
    &lt;div class=&quot;card span2&quot;&gt;&lt;h3&gt;절차&lt;/h3&gt;&lt;ol class=&quot;steps&quot;&gt;&lt;li&gt;MEF가 조달정책·법제도를 총괄, GDPP가 국내재원 조달지침을 수립·제공&lt;/li&gt;&lt;li&gt;재원 구분 — 국내재원은 GDPP, 외부재원은 GDICDM 관할&lt;/li&gt;&lt;li&gt;(외부재원) 발주기관과 DP가 재정지원약정(Financing Agreement)을 체결해 방식·절차를 정함&lt;/li&gt;&lt;li&gt;GDICDM이 발주기관의 SOP 2019 준수를 감독하고 포트폴리오를 관리&lt;/li&gt;&lt;li&gt;조달 분권화 — 예산 출처별로 감독기관이 나뉨(중앙 GDPP·지방 GDPP·NCDD)&lt;/li&gt;&lt;li&gt;정부기관별 직접조달 한도 내에서 자체 조달&lt;/li&gt;&lt;li&gt;GDPP가 조달을 감독·감사, MEF가 사후검토·부정기 검사(신법 신설)&lt;/li&gt;&lt;li&gt;위반 시 신법의 강화된 벌칙(개인 징역·법인 벌금) 적용&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;적용 대상&lt;/h3&gt;&lt;p style=&quot;margin:0;font-size:13.5px;line-height:1.7&quot;&gt;캄보디아 정부의 모든 공공조달에 적용되며 재원에 따라 관장기관이 갈린다. 조달이 분권화돼 정부기관별 직접조달 한도가 있다 — 주정부 12.5만불, 내무부·국방부·대학병원 25만불, 교육청소년체육부·보건부 37.5만불, 광업에너지부 전력수자원공급 50만불, 전력청 70만불, 나머지 부처 20만불(USD). KOICA 무상사업은 외부재원으로 GDICDM·SOP 2019 관할이며, DP 자체 지침이 우선할 수 있다.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;법적 근거&lt;/h3&gt;&lt;div class=&quot;law&quot;&gt;&lt;span class=&quot;nm&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.moj.gov.kh/en/law-regular/page-16/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Law on Public Procurement, 2023 (Royal Kram NS/RKM/0523/005)&lt;/a&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:auto&quot;&gt;법률&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;law&quot;&gt;&lt;span class=&quot;nm&quot;&gt;공공조달 하위규정(sub-decree·prakas) — 현행 원문 확인 필요&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:auto&quot;&gt;시행규칙&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;law&quot;&gt;&lt;span class=&quot;nm&quot;&gt;외부재원 조달 표준운영절차(SOP on Procurement for All Externally Financed Projects/Programs, 2019)&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:auto&quot;&gt;표준문서&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;권한 기관&lt;/h3&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;&lt;a class=&quot;ref&quot; href=&quot;https://mef.gov.kh/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;경제재무부(MEF)&lt;/a&gt;&lt;/b&gt;&lt;span&gt;공공조달 중심기관. 신법상 조달정책 총괄, 사후검토·부정기 검사권&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;&lt;a class=&quot;ref&quot; href=&quot;http://gdpp.gov.kh/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;공공조달국(GDPP)&lt;/a&gt;&lt;/b&gt;&lt;span&gt;국내재원(locally funded) 조달 관장. 조달정책·법제도 수립, 중앙·주·군/시 정부에 조달지침 제공, 감독·감사. 정부기관 행정·사무용품 및 시설운영 서비스 조달&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;국제협력차관관리국(GDICDM)&lt;/b&gt;&lt;span&gt;외부재원(externally funded) 조달 관장. 발주기관의 SOP 2019 준수 감독, 사업 포트폴리오 관리, 절차 지침 제공&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;내무부 지방국가민주적발전위원회(NCDD)&lt;/b&gt;&lt;span&gt;구(코뮨) 예산 집행 조달 감독&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;개발협력파트너(DP)&lt;/b&gt;&lt;span&gt;외부재원 사업에서 발주기관과 재정지원약정 체결, 자체 조달지침 적용&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;이해관계자&lt;/h3&gt;&lt;p style=&quot;margin:0;font-size:13.5px;line-height:1.7&quot;&gt;경제재무부(MEF), 공공조달국(GDPP), 국제협력차관관리국(GDICDM), 중앙·주·군/시 정부, 내무부 산하 지방국가민주적발전위원회(NCDD), 개발협력파트너(DP), 산업별 발주부처(MPWT·MISTI·MoH·MoEYS)&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;제출서류&lt;/h3&gt;&lt;div class=&quot;docset&quot;&gt;&lt;b&gt;GDPP&lt;/b&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;조달지침(procurement guidelines)&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;감사 결과&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;표준입찰서류&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;docset&quot;&gt;&lt;b&gt;GDICDM&lt;/b&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;SOP 2019 준수 점검 결과&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;사업 포트폴리오 관리 문서&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;절차 지침&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;docset&quot;&gt;&lt;b&gt;발주기관·DP&lt;/b&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;재정지원약정(Financing Agreement)&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;유의사항 · 병목&lt;/h3&gt;&lt;ul class=&quot;plain&quot;&gt;&lt;li&gt;재원별 이원 구조라 KOICA 무상사업(외부재원)은 GDPP가 아니라 GDICDM·SOP 2019 관할이다 — 국내재원 조달과 절차·감독기관이 다르다&lt;/li&gt;&lt;li&gt;조달이 분권화돼 예산 출처(중앙·주·군/시·구)마다 감독기관이 달라 관할 확인이 필요하다&lt;/li&gt;&lt;li&gt;외부재원 사업은 DP 자체 조달지침이 SOP에 우선할 수 있어, 캄보디아 공공조달 규율만으로는 절차를 특정할 수 없다&lt;/li&gt;&lt;li&gt;현행 근거는 2023 공공조달법이다. 공식 영문본과 현행 하위규정 전문은 확인하지 못했으므로 직접조달 한도와 세부 감독절차는 재확인해야 한다&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;진입장벽&lt;/h3&gt;&lt;ul class=&quot;plain&quot;&gt;&lt;li&gt;정부기관별 직접조달 한도가 달라, 사업 규모에 따라 관할·방식이 갈림&lt;/li&gt;&lt;li&gt;분권화로 지방정부 조달은 지방 예산·절차를 별도 확인해야 함&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;현장 검증 필요&lt;/h3&gt;&lt;ul class=&quot;plain&quot;&gt;&lt;li&gt;정부기관별 직접조달 한도(주 12.5만·부처 20만·전력청 70만불 등) — 현행 하위규정 확인 필요&lt;/li&gt;&lt;li&gt;2023법 아래 GDPP·GDICDM의 현행 관할·권한 — 크메르어 원문 대조 필요&lt;/li&gt;&lt;li&gt;MEF 사후검토·부정기 검사권의 발동 요건·절차 — 신법 신설 조항&lt;/li&gt;&lt;li&gt;SOP 2019가 신법 하에서 개정·유지되는지&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;관련 제도&lt;/h3&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;캄보디아 공공조달 입찰제도&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;캄보디아 ODA 사업 발굴·형성 절차&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;



&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;현행 기준 반영 1건&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;공식 법령·기관 원문으로 확인한 현행 기준과 실무 확인사항입니다.
    출처는 각 항목에 연결했으며.&lt;/p&gt;
  &lt;div class=&quot;disc&quot; data-sev=&quot;medium&quot;&gt;
  &lt;div class=&quot;top&quot;&gt;
    &lt;span class=&quot;badge warn&quot;&gt;추가 확인&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;캄보디아&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;D01&lt;/span&gt;
  &lt;/div&gt;
  &lt;h3&gt;canvas.legalBasis / 감독체계 근거 법령 및 신설 권한&lt;/h3&gt;
  &lt;div class=&quot;quote act&quot;&gt;&lt;b&gt;현행 기준&lt;/b&gt;현행 근거는 2023 공공조달법(Royal Kram NS/RKM/0523/005)이다. GDPP 공식 페이지는 공사·서비스·컨설팅 조달의 입찰문서 검토, 개찰·협상 참여, 계약 제안 기술평가, 개발파트너 재원 조달 감독을 주요 기능으로 공개한다.&lt;/div&gt;
  &lt;p class=&quot;cite&quot;&gt;확인 출처 · &lt;a class=&quot;ref&quot; href=&quot;https://www.moj.gov.kh/en/law-regular/page-16/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Law on Public Procurement, 2023 (Royal Kram NS/RKM/0523/005)&lt;/a&gt;; GDPP Works and Services Management Department&lt;/p&gt;
  &lt;div class=&quot;todo&quot;&gt;&lt;b&gt;실무 확인&lt;/b&gt;KOICA 무상사업은 외부재원으로 분류해 GDICDM·SOP 2019 트랙을 확인하고, 세부 감독절차와 직접조달 한도는 발주기관에서 재확인한다.&lt;/div&gt;
  &lt;details class=&quot;review&quot;&gt;
  &lt;summary&gt;Field verification (English)&lt;/summary&gt;
  &lt;div class=&quot;rv&quot;&gt;
    &lt;p&gt;&lt;b&gt;Current legal basis&lt;/b&gt; — The 2023 Law on Public Procurement adds MEF post-review and ad-hoc inspection powers and raises penalties to imprisonment for individuals and fines for legal entities. The GDPP/GDICDM two-track structure itself matches the guide.&lt;/p&gt;
    &lt;p class=&quot;rv-verify&quot;&gt;&lt;b&gt;✔ Verify&lt;/b&gt; — Confirm KOICA grant projects fall under the GDICDM / SOP 2019 track (externally funded). Check penalties and MEF inspection powers against the 2023 law.&lt;/p&gt;
  &lt;/div&gt;
&lt;/details&gt;

  &lt;p class=&quot;act-row&quot;&gt;산출물 반영 — 2023 공공조달법과 GDPP 공식 공개기능을 근거로 감독체계를 정리하고, 하위규정 미확인 범위는 현지 확인사항으로 표시했다.&lt;/p&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;검증&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;GDPP·MEF 공식 사이트에서 조달 관장기관과 공개 업무를 확인하고, 캄보디아 법무부 공식 목록에서 2023 공공조달법을 확인했다. 공식 영문본과 현행 하위규정 전문은 확보하지 못했다.&lt;/p&gt;
  &lt;div class=&quot;cards&quot;&gt;
    &lt;div class=&quot;card span2&quot;&gt;&lt;h3&gt;검증 범위&lt;/h3&gt;
      &lt;p style=&quot;margin:0;font-size:13.5px;line-height:1.7&quot;&gt;MEF 산하 GDPP(국내재원)·GDICDM(외부재원) 이원 구조, SOP 2019 관할, 분권화 감독체계를 정리했다. 직접조달 한도와 2023법 세부 조문 확인은 미완이다.&lt;/p&gt;
      &lt;p style=&quot;margin:12px 0 0;font-size:12.5px;color:var(--muted)&quot;&gt;확인일 2026-07-23 · 자료집 기준일 2026-02-23&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;대조에 쓴 원문&lt;/h3&gt;&lt;ul class=&quot;srcs&quot; style=&quot;padding-left:16px;margin:0&quot;&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://www.moj.gov.kh/en/law-regular/page-16/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Law on Public Procurement (16.05.2023), Royal Kram NS/RKM/0523/005&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;법률&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-28 · Ministry of Justice, Kingdom of Cambodia&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;http://gdpp.gov.kh/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;경제재무부 공공조달국(GDPP)&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;지침·정책&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-28 · Ministry of Economy and Finance, Cambodia&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://mef.gov.kh/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;경제재무부(MEF)&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;지침·정책&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-28 · Ministry of Economy and Finance, Cambodia&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://vdb-loi.com/kh_publications/new-developments-under-the-public-procurement-law-2023/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;New Developments under the Public Procurement Law 2023 (로펌 해설)&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;지침·정책&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-28 · VDB Loi&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card span2&quot;&gt;&lt;h3&gt;주의&lt;/h3&gt;&lt;p class=&quot;note&quot;&gt;캄보디아 조달은 재원별로 이원화된다 — 국내재원(locally funded)은 GDPP, 외부재원(externally funded)은 GDICDM. KOICA 무상사업은 외부재원이라 GDICDM·SOP 2019 트랙이다.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;GDICDM은 발주기관이 &amp;#x27;외부재원 프로젝트/프로그램 조달 표준운영절차(SOP, 2019)&amp;#x27;를 준수하는지 감독하고 사업 포트폴리오를 관리한다. DP 재정지원약정의 특수조건이 SOP에 우선할 수 있다.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;현행 근거 법률은 2023 공공조달법이다. GDPP 공식 페이지에서 공사·서비스·컨설팅 조달의 검토·감독 기능을 확인했다.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;공식 영문본과 현행 하위규정 전문은 확보하지 못했다. 직접조달 한도 등은 발주기관에 재확인한다.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;h3 style=&quot;font-size:14px;margin:26px 0 12px&quot;&gt;확인하지 못한 것&lt;/h3&gt;&lt;div class=&quot;card&quot; style=&quot;margin-bottom:12px&quot;&gt;&lt;h3&gt;정부기관별 직접조달 한도 규정 &lt;span class=&quot;badge plain muted&quot;&gt;no-public-text&lt;/span&gt;&lt;/h3&gt;&lt;p style=&quot;margin:0 0 8px;font-size:13.5px&quot;&gt;직접조달 한도(주 12.5만·부처 20만불 등)의 현행 근거 규정 원문을 특정하지 못했다.&lt;/p&gt;&lt;p style=&quot;margin:0;font-size:13px;color:var(--muted)&quot;&gt;다음 조치 — GDPP의 현행 조달 한도 관련 prakas/sub-decree를 확보해 값을 대조한다.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot; style=&quot;margin-bottom:12px&quot;&gt;&lt;h3&gt;&lt;a class=&quot;ref&quot; href=&quot;https://data.opendevelopmentcambodia.net/laws_record/public-procurement&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Law on Public Procurement 2023 크메르어 원문&lt;/a&gt; &lt;span class=&quot;badge plain muted&quot;&gt;local-language-only&lt;/span&gt;&lt;/h3&gt;&lt;p style=&quot;margin:0 0 8px;font-size:13.5px&quot;&gt;신법 원문이 크메르어 스캔본이라 GDPP·GDICDM 권한·감독 조항을 verbatim 대조하지 못했다.&lt;/p&gt;&lt;p style=&quot;margin:0;font-size:13px;color:var(--muted)&quot;&gt;다음 조치 — 공식 영문본 확보 시 감독·검사권 조항을 대조한다.&lt;/p&gt;&lt;/div&gt;
  &lt;p style=&quot;margin:22px 0 0;font-size:12.5px;color:var(--muted)&quot;&gt;
    원문 링크 연결 — 조문의 존재와 문언 일치만 뜻합니다. 법적 해석·적용 타당성·개정 반영 여부는 별도 검토 대상입니다.
  &lt;/p&gt;
&lt;/section&gt;
&lt;/div&gt;

  자료집 기준일 기준으로 작성된 참고자료입니다. 법률 자문이나 해당국 정부·KOICA의 공식 해석이 아닙니다.&lt;br&gt;
  조달법은 개정이 잦습니다 — 실제 입찰 전 발주처 공고문과 현행 법령을 확인해야 합니다.&lt;br&gt;

id&quot;: &quot;P05&quot;, &quot;name&quot;: &quot;직접조달(한도 내)&quot;, &quot;lane&quot;: &quot;발주 정부기관&quot;, &quot;stage&quot;: &quot;G2 집행&quot;, &quot;type&quot;: &quot;task&quot;, &quot;status&quot;: &quot;current&quot;, &quot;actor&quot;: &quot;발주 정부기관&quot;, &quot;action&quot;: &quot;정부기관별 직접조달 한도 내에서 자체 조달한다(주 12.5만·부처 20만·전력청 70만불 등).&quot;, &quot;confidence&quot;: 0.75, &quot;legal_basis&quot;: [{&quot;law&quot;: &quot;공공조달 하위규정(sub-decree·prakas) — 현행 원문 확인 필요&quot;, &quot;article&quot;: &quot;직접조달 한도&quot;, &quot;url&quot;: &quot;&quot;}]}, &quot;P06&quot;: {&quot;id&quot;: &quot;P06&quot;, &quot;name&quot;: &quot;SOP 2019 준수 감독&quot;, &quot;lane&quot;: &quot;GDICDM·DP&quot;, &quot;stage&quot;: &quot;G3 감독&quot;, &quot;type&quot;: &quot;task&quot;, &quot;status&quot;: &quot;waiting&quot;, &quot;actor&quot;: &quot;GDICDM&quot;, &quot;action&quot;: &quot;GDICDM이 발주기관의 SOP 2019 준수를 감독하고 포트폴리오를 관리한다.&quot;, &quot;confidence&quot;: 0.8, &quot;legal_basis&quot;: [{&quot;law&quot;: &quot;외부재원 조달 표준운영절차(SOP on Procurement for All Externally Financed Projects/Programs, 2019)&quot;, &quot;article&quot;: &quot;—&quot;, &quot;url&quot;: &quot;&quot;}]}, &quot;P07&quot;: {&quot;id&quot;: &quot;P07&quot;, &quot;name&quot;: &quot;GDPP 감독·감사&quot;, &quot;lane&quot;: &quot;MEF·GDPP&quot;, &quot;stage&quot;: &quot;G3 감독&quot;, &quot;type&quot;: &quot;task&quot;, &quot;status&quot;: &quot;waiting&quot;, &quot;actor&quot;: &quot;GDPP&quot;, &quot;action&quot;: &quot;국내재원 조달을 예산 출처별(중앙 GDPP·지방 GDPP·NCDD)로 감독·감사한다.&quot;, &quot;confidence&quot;: 0.8}, &quot;P08&quot;: {&quot;id&quot;: &quot;P08&quot;, &quot;name&quot;: &quot;MEF 사후검토·검사&quot;, &quot;lane&quot;: &quot;MEF·GDPP&quot;, &quot;stage&quot;: &quot;G3 감독&quot;, &quot;type&quot;: &quot;gateway&quot;, &quot;status&quot;: &quot;risk&quot;, &quot;actor&quot;: &quot;MEF&quot;, &quot;action&quot;: &quot;신법상 MEF가 사후검토와 부정기 검사를 실시한다. 위반 시 강화된 벌칙(개인 징역·법인 벌금).&quot;, &quot;confidence&quot;: 0.7, &quot;legal_basis&quot;: [{&quot;law&quot;: &quot;Law on Public Procurement, 2023 (Royal Kram NS/RKM/0523/005)&quot;, &quot;article&quot;: &quot;검사·벌칙&quot;, &quot;url&quot;: &quot;https://www.moj.gov.kh/en/law-regular/page-16/&quot;}]}};
var EDGES=[{&quot;id&quot;: &quot;E01&quot;, &quot;source&quot;: &quot;P01&quot;, &quot;target&quot;: &quot;P02&quot;, &quot;type&quot;: &quot;sequence&quot;}, {&quot;id&quot;: &quot;E02&quot;, &quot;source&quot;: &quot;P02&quot;, &quot;target&quot;: &quot;P03&quot;, &quot;type&quot;: &quot;message&quot;, &quot;label&quot;: &quot;지침 제공&quot;}, {&quot;id&quot;: &quot;E03&quot;, &quot;source&quot;: &quot;P03&quot;, &quot;target&quot;: &quot;P04&quot;, &quot;type&quot;: &quot;sequence&quot;, &quot;label&quot;: &quot;외부재원&quot;}, {&quot;id&quot;: &quot;E04&quot;, &quot;source&quot;: &quot;P03&quot;, &quot;target&quot;: &quot;P05&quot;, &quot;type&quot;: &quot;sequence&quot;, &quot;label&quot;: &quot;국내재원&quot;}, {&quot;id&quot;: &quot;E05&quot;, &quot;source&quot;: &quot;P04&quot;, &quot;target&quot;: &quot;P06&quot;, &quot;type&quot;: &quot;sequence&quot;}, {&quot;id&quot;: &quot;E06&quot;, &quot;source&quot;: &quot;P05&quot;, &quot;target&quot;: &quot;P07&quot;, &quot;type&quot;: &quot;message&quot;, &quot;label&quot;: &quot;감사 대상&quot;}, {&quot;id&quot;: &quot;E07&quot;, &quot;source&quot;: &quot;P06&quot;, &quot;target&quot;: &quot;P08&quot;, &quot;type&quot;: &quot;sequence&quot;}, {&quot;id&quot;: &quot;E08&quot;, &quot;source&quot;: &quot;P07&quot;, &quot;target&quot;: &quot;P08&quot;, &quot;type&quot;: &quot;sequence&quot;}];

var _sel=document.getElementById(&#x27;sel&#x27;);
if(_sel) _sel.addEventListener(&#x27;change&#x27;,function(){ location.href=&#x27;../&#x27;+this.value+&#x27;/index.html&#x27;; });

/* 엣지 그리기 — 노드 DOM 위치를 재서 SVG로 연결 */
function draw(){
  var board=document.getElementById(&#x27;board&#x27;),svg=document.getElementById(&#x27;edges&#x27;);
  if(!board||!svg)return;
  var bb=board.getBoundingClientRect();
  svg.setAttribute(&#x27;viewBox&#x27;,&#x27;0 0 &#x27;+board.scrollWidth+&#x27; &#x27;+board.scrollHeight);
  svg.setAttribute(&#x27;width&#x27;,board.scrollWidth); svg.setAttribute(&#x27;height&#x27;,board.scrollHeight);
  var cs=getComputedStyle(document.documentElement);
  var C={sequence:cs.getPropertyValue(&#x27;--muted&#x27;).trim(),
         message:cs.getPropertyValue(&#x27;--back&#x27;).trim(),
         loop:cs.getPropertyValue(&#x27;--warn&#x27;).trim()};
  var d=&#x27;&lt;defs&gt;&#x27;;
  [&#x27;sequence&#x27;,&#x27;message&#x27;,&#x27;loop&#x27;].forEach(function(t){
    d+=&#x27;&lt;marker id=&quot;m-&#x27;+t+&#x27;&quot; viewBox=&quot;0 0 8 8&quot; refX=&quot;7&quot; refY=&quot;4&quot; markerWidth=&quot;6&quot; markerHeight=&quot;6&quot; orient=&quot;auto&quot;&gt;&#x27;
      +&#x27;&lt;path d=&quot;M0 0 L8 4 L0 8 z&quot; fill=&quot;&#x27;+C[t]+&#x27;&quot;/&gt;&lt;/marker&gt;&#x27;;
  });
  d+=&#x27;&lt;/defs&gt;&#x27;;
  var GAP=5;
  function rel(rc){return {x:rc.left-bb.left+board.scrollLeft, y:rc.top-bb.top+board.scrollTop,
                            r:rc.right-bb.left+board.scrollLeft, b:rc.bottom-bb.top+board.scrollTop,
                            w:rc.width, h:rc.height};}
  function box(id){
    var el=board.querySelector(&#x27;.node[data-id=&quot;&#x27;+id+&#x27;&quot;]&#x27;);
    if(!el)return null; return rel(el.getBoundingClientRect());
  }

  /* 라우팅은 korea100studio의 거터 라우팅을 우리 그리드에 이식한 것이다.
     핵심: 카드를 지나야 하는 선은 카드가 없는 거터(행 하단·열 측면)로 우회한다.
     DOM에서 노드·행·열을 실측할 수 있어, 여러 직교 경로 후보를 만들고
     무관한 카드를 가장 적게 관통하는(동수면 가장 짧은) 것을 고른다. */

  // 장애물(모든 노드)과 거터(노드 없는 띠) 실측
  var OB=[];
  board.querySelectorAll(&#x27;.node&#x27;).forEach(function(el){ var r=box(el.dataset.id); r.id=el.dataset.id; OB.push(r); });
  var rowGut=[], colGut=[];
  board.querySelectorAll(&#x27;.brow:not(.head)&#x27;).forEach(function(el){ var r=rel(el.getBoundingClientRect());
    rowGut.push(r.y+9); rowGut.push(r.b-9); });
  var hc=board.querySelectorAll(&#x27;.brow.head .bcell&#x27;);
  for(var i=1;i&lt;hc.length;i++){ var r=rel(hc[i].getBoundingClientRect()); colGut.push(r.x+11); colGut.push(r.r-11); }

  function segHit(ax,ay,bx,by,e1,e2){
    var n=0, M=3;
    for(var i=0;i&lt;OB.length;i++){ var o=OB[i]; if(o.id===e1||o.id===e2) continue;
      var L=o.x+M,R=o.r-M,T=o.y+M,B=o.b-M;
      if(Math.abs(ay-by)&lt;0.5){ if(ay&gt;T&amp;&amp;ay&lt;B &amp;&amp; Math.max(ax,bx)&gt;L &amp;&amp; Math.min(ax,bx)&lt;R) n++; }
      else { if(ax&gt;L&amp;&amp;ax&lt;R &amp;&amp; Math.max(ay,by)&gt;T &amp;&amp; Math.min(ay,by)&lt;B) n++; }
    } return n;
  }
  function uniq(pts){ return pts.filter(function(p,i){ return i===0 || Math.abs(p.x-pts[i-1].x)&gt;0.5 || Math.abs(p.y-pts[i-1].y)&gt;0.5; }); }
  function score(pts,e1,e2){ pts=uniq(pts); var p=0,l=0;
    for(var i=0;i&lt;pts.length-1;i++){ p+=segHit(pts[i].x,pts[i].y,pts[i+1].x,pts[i+1].y,e1,e2);
      l+=Math.abs(pts[i].x-pts[i+1].x)+Math.abs(pts[i].y-pts[i+1].y); }
    return {pts:pts,p:p,l:l}; }

  function route(a,b,ed){
    var acx=a.x+a.w/2,acy=a.y+a.h/2,bcx=b.x+b.w/2,bcy=b.y+b.h/2, e1=ed.source,e2=ed.target, cs=[];
    // 세로 계열 — a의 위/아래 변에서 나가 b의 위/아래 변으로
    var below=bcy&gt;acy, sp={x:acx,y:below?a.b:a.y}, tp={x:bcx,y:below?b.y:b.b}, tg={x:tp.x,y:tp.y+(below?-GAP:GAP)};
    cs.push(score([sp,{x:sp.x,y:tg.y},tg,tp],e1,e2));                                   // 직선/L
    rowGut.forEach(function(my){ if(my&gt;Math.min(sp.y,tp.y)+6&amp;&amp;my&lt;Math.max(sp.y,tp.y)-6)   // 행 거터 크로스
      cs.push(score([sp,{x:sp.x,y:my},{x:tp.x,y:my},tg,tp],e1,e2)); });
    colGut.forEach(function(gx){                                                          // 열 측면 탈출
      var as={x:gx&gt;acx?a.r:a.x,y:acy};
      cs.push(score([as,{x:gx,y:acy},{x:gx,y:tg.y},tg,tp],e1,e2)); });
    // 가로 계열 — a의 좌/우 변에서 나가 b의 좌/우 변으로
    var right=bcx&gt;acx, sp2={x:right?a.r:a.x,y:acy}, tp2={x:right?b.x:b.r,y:bcy}, tg2={x:tp2.x+(right?-GAP:GAP),y:tp2.y};
    cs.push(score([sp2,{x:tg2.x,y:sp2.y},tg2,tp2],e1,e2));
    colGut.forEach(function(mx){ if(mx&gt;Math.min(sp2.x,tp2.x)+6&amp;&amp;mx&lt;Math.max(sp2.x,tp2.x)-6)
      cs.push(score([sp2,{x:mx,y:sp2.y},{x:mx,y:tp2.y},tg2,tp2],e1,e2)); });
    rowGut.forEach(function(gy){                                                          // 행 거터 우회
      var as={x:acx,y:gy&gt;acy?a.b:a.y};
      cs.push(score([as,{x:acx,y:gy},{x:tp2.x,y:gy},tg2,tp2],e1,e2)); });
    // 회귀선 — 아래로 크게 우회 (되돌아가는 흐름을 시각적으로 구분)
    if(ed.type===&#x27;loop&#x27;){ var gy=Math.max(a.b,b.b)+26;
      cs.push(score([{x:acx,y:a.b},{x:acx,y:gy},{x:bcx,y:gy},{x:bcx,y:b.b+GAP},{x:bcx,y:b.b}],e1,e2)); }
    cs=cs.filter(function(c){return c.pts.length&gt;=2;});
    cs.sort(function(x,y){ return x.p-y.p || x.l-y.l; });
    return cs[0];
  }

  function rnd(v){return Math.round(v*10)/10;}
  function orthPath(pts){                    // 직교 경로 + 모서리 라운딩
    pts=uniq(pts); if(pts.length&lt;2)return &#x27;&#x27;;
    var d=&#x27;M&#x27;+rnd(pts[0].x)+&#x27; &#x27;+rnd(pts[0].y);
    for(var i=1;i&lt;pts.length-1;i++){
      var p=pts[i-1],c=pts[i],n=pts[i+1];
      var d1=Math.hypot(c.x-p.x,c.y-p.y)||1, d2=Math.hypot(n.x-c.x,n.y-c.y)||1, r=Math.min(7,d1/2,d2/2);
      d+=&#x27; L&#x27;+rnd(c.x-(c.x-p.x)/d1*r)+&#x27; &#x27;+rnd(c.y-(c.y-p.y)/d1*r);
      d+=&#x27; Q&#x27;+rnd(c.x)+&#x27; &#x27;+rnd(c.y)+&#x27; &#x27;+rnd(c.x+(n.x-c.x)/d2*r)+&#x27; &#x27;+rnd(c.y+(n.y-c.y)/d2*r);
    }
    var e=pts[pts.length-1]; return d+&#x27; L&#x27;+rnd(e.x)+&#x27; &#x27;+rnd(e.y);
  }

  EDGES.forEach(function(ed){
    var a=box(ed.source),b=box(ed.target); if(!a||!b)return;
    var t=ed.type||&#x27;sequence&#x27;, rt=route(a,b,ed);
    d+=&#x27;&lt;path d=&quot;&#x27;+orthPath(rt.pts)+&#x27;&quot; fill=&quot;none&quot; stroke=&quot;&#x27;+C[t]+&#x27;&quot; stroke-width=&quot;1.5&quot; opacity=&quot;&#x27;
      +(t===&#x27;sequence&#x27;?&#x27;.55&#x27;:&#x27;.8&#x27;)+&#x27;&quot;&#x27;+(t!==&#x27;sequence&#x27;?&#x27; stroke-dasharray=&quot;4 3&quot;&#x27;:&#x27;&#x27;)
      +&#x27; marker-end=&quot;url(#m-&#x27;+t+&#x27;)&quot;/&gt;&#x27;;
  });
  svg.innerHTML=d;
}

var KIND={&quot;act&quot;: &quot;법률&quot;, &quot;regulation&quot;: &quot;시행규칙&quot;, &quot;ordinance&quot;: &quot;명령·조례&quot;, &quot;directive&quot;: &quot;지침·정책&quot;, &quot;standard-document&quot;: &quot;표준문서&quot;, &quot;treaty-agreement&quot;: &quot;양자합의&quot;, &quot;donor-rule&quot;: &quot;공여기관 규정&quot;, &quot;practice&quot;: &quot;현장 관행&quot;};
function openNode(id){
  var n=NODES[id]; if(!n)return;
  var h=&#x27;&lt;span class=&quot;badge plain muted&quot;&gt;&#x27;+n.id+&#x27;&lt;/span&gt; &#x27;
       +&#x27;&lt;span class=&quot;badge plain muted&quot;&gt;&#x27;+n.lane+&#x27;&lt;/span&gt; &#x27;
       +&#x27;&lt;span class=&quot;badge plain muted&quot;&gt;&#x27;+n.stage+&#x27;&lt;/span&gt;&#x27;;
  h+=&#x27;&lt;h3&gt;&#x27;+n.name+&#x27;&lt;/h3&gt;&#x27;;
  h+=&#x27;&lt;dl class=&quot;kv&quot;&gt;&#x27;;
  h+=&#x27;&lt;dt&gt;담당&lt;/dt&gt;&lt;dd&gt;&#x27;+n.actor+&#x27;&lt;/dd&gt;&#x27;;
  if(n.action) h+=&#x27;&lt;dt&gt;내용&lt;/dt&gt;&lt;dd&gt;&#x27;+n.action+&#x27;&lt;/dd&gt;&#x27;;
  if(n.deadline) h+=&#x27;&lt;dt&gt;기한&lt;/dt&gt;&lt;dd&gt;&#x27;+n.deadline+&#x27;&lt;/dd&gt;&#x27;;
  if(n.output_documents&amp;&amp;n.output_documents.length)
    h+=&#x27;&lt;dt&gt;산출 문서&lt;/dt&gt;&lt;dd&gt;&#x27;+n.output_documents.join(&#x27; · &#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  if(n.blocker) h+=&#x27;&lt;dt&gt;병목&lt;/dt&gt;&lt;dd style=&quot;color:var(--warn)&quot;&gt;&#x27;+n.blocker+&#x27;&lt;/dd&gt;&#x27;;
  if(n.legal_basis&amp;&amp;n.legal_basis.length){
    h+=&#x27;&lt;dt&gt;근거 조문&lt;/dt&gt;&lt;dd&gt;&#x27;+n.legal_basis.map(function(l){
      var nm=l.url?&#x27;&lt;a class=&quot;ref&quot; href=&quot;&#x27;+l.url+&#x27;&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;&#x27;+l.law+&#x27;&lt;/a&gt;&#x27;:l.law;
      return &#x27;&lt;div style=&quot;margin-bottom:4px&quot;&gt;&#x27;+nm+&#x27; &lt;code&gt;&#x27;+l.article+&#x27;&lt;/code&gt;&lt;/div&gt;&#x27;;}).join(&#x27;&#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  }
  if(typeof n.confidence===&#x27;number&#x27;){
    h+=&#x27;&lt;dt&gt;법령 근거 확신도&lt;/dt&gt;&lt;dd&gt;&#x27;+n.confidence.toFixed(2)
      +(n.confidence&lt;0.8?&#x27; &lt;span class=&quot;badge warn&quot;&gt;현장 검증 필요&lt;/span&gt;&#x27;:&#x27;&#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  }
  var ins=EDGES.filter(function(x){return x.target===id}),
      outs=EDGES.filter(function(x){return x.source===id});
  if(ins.length) h+=&#x27;&lt;dt&gt;선행&lt;/dt&gt;&lt;dd&gt;&#x27;+ins.map(function(x){

    var nx=cur===&#x27;dark&#x27;?&#x27;light&#x27;:&#x27;dark&#x27;;
    document.documentElement.setAttribute(&#x27;data-theme&#x27;,nx);
    localStorage.setItem(&#x27;theme&#x27;,nx);
  };
})();
&lt;/script&gt;

&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;한 장 캔버스&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;무상·유상 수원총괄기관을 분리해(무상 CDC/CRDB·유상 MEF), 각 부처의 사업 수요를 국가발전전략·정책 우선순위와 대조한 뒤 개발파트너에 전달하고, 공여기관 내부 선정을 거쳐 사업을 형성한다.&lt;/p&gt;
  &lt;div class=&quot;cards&quot;&gt;
    &lt;div class=&quot;card span2&quot;&gt;&lt;h3&gt;절차&lt;/h3&gt;&lt;ol class=&quot;steps&quot;&gt;&lt;li&gt;(무상) 각 부처가 개발협력파트너와 협력사업 수요를 협의&lt;/li&gt;&lt;li&gt;부처가 구체화된 수요를 CDC/CRDB에 제출&lt;/li&gt;&lt;li&gt;CDC/CRDB가 국가발전전략·정책 우선순위를 검토하고 각 DP에 수요 전달(필요 시 DP와 사전협의)&lt;/li&gt;&lt;li&gt;DP별 내부 사업선정 절차 개시&lt;/li&gt;&lt;li&gt;(KOICA) CDC/CRDB 수요의 타당성을 검토해 PCP를 본부 검토위원회에 상정 — 수요제출 공식 서한 확인&lt;/li&gt;&lt;li&gt;PCP 검토위원회 통과 사업에 예비조사(문헌·현지답사·이해관계자 면담) 실시, 수원부처 참여&lt;/li&gt;&lt;li&gt;예비조사에서 타당한 사업의 PD 초안을 본부 심사위원회에 상정&lt;/li&gt;&lt;li&gt;PD 심사위원회 심사로 한국 예산당국 심사 대상 선정 — 공식 서한 재확인&lt;/li&gt;&lt;li&gt;(유상) MEF가 부처 사업요청서를 취합해 유상 DP별 정책협의로 후보사업 결정&lt;/li&gt;&lt;li&gt;신규사업 공식화 — 캄보디아 정부는 PCP·PD 제출과 사업수요 공식 서한으로, 한국은 시행기관 선정 후 주무부처·국무조정실·국회 심의로 확정&lt;/li&gt;&lt;/ol&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;적용 대상&lt;/h3&gt;&lt;p style=&quot;margin:0;font-size:13.5px;line-height:1.7&quot;&gt;캄보디아 정부가 수원하는 개발협력사업에 적용되며, 무상은 CDC/CRDB, 유상은 MEF가 총괄한다. 2023년 수원규모는 15.45억불(무상 35%·유상 65%). 일부 캄보디아 재원도 동원되는 사업은 수원부처가 MEF에 별도 절차를 밟는다. 외부재원 조달은 GDICDM·SOP 2019 관할이므로, 사업 형성(CDC/CRDB·MEF)과 조달 집행(GDICDM)의 주체가 다르다.&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;법적 근거&lt;/h3&gt;&lt;div class=&quot;law&quot;&gt;&lt;span class=&quot;nm&quot;&gt;국가발전전략 및 개발협력 정책 우선순위(CDC/CRDB 검토 기준)&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:auto&quot;&gt;지침·정책&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;law&quot;&gt;&lt;span class=&quot;nm&quot;&gt;사업수요 공식 제출 서한 및 PCP·PD (양자 절차 문서)&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:auto&quot;&gt;양자합의&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;law&quot;&gt;&lt;span class=&quot;nm&quot;&gt;KOICA 사업심사 가이드라인 및 PCP·예비조사·PD 심사 절차&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:auto&quot;&gt;공여기관 규정&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;law&quot;&gt;&lt;span class=&quot;nm&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://oda.cdc.gov.kh/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Cambodia ODA Database and CDCB development-cooperation mandate&lt;/a&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:auto&quot;&gt;지침·정책&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;law&quot;&gt;&lt;span class=&quot;nm&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://gdde.mef.gov.kh/private/83c8a60785c28e&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Public Investment Management System and externally financed project framework&lt;/a&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:auto&quot;&gt;지침·정책&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;law&quot;&gt;&lt;span class=&quot;nm&quot;&gt;&lt;a class=&quot;ref&quot; href=&quot;https://ppp.mef.gov.kh/project-development-facility&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Project Development Facility for externally financed public investments&lt;/a&gt;&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;&lt;/span&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:auto&quot;&gt;지침·정책&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;권한 기관&lt;/h3&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;캄보디아개발위원회(CDC) 캄보디아개발협력이사회(CDCB/구 CRDB)&lt;/b&gt;&lt;span&gt;개발협력 정책·파트너 조정과 정부 전체 ODA 데이터베이스를 관리한다.&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;경제재무부(MEF)&lt;/b&gt;&lt;span&gt;외부재원 포함 공공투자 관리·재정심사·차관과 국가예산 연계를 담당한다.&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;auth&quot;&gt;&lt;b&gt;부문부처·실행기관&lt;/b&gt;&lt;span&gt;국가계획에 맞춰 사업을 발굴·준비·제출하고 승인 후 조달·실행한다.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;이해관계자&lt;/h3&gt;&lt;p style=&quot;margin:0;font-size:13.5px;line-height:1.7&quot;&gt;캄보디아개발위원회(CDC) 재건개발이사회(CRDB, 무상 총괄), 경제재무부(MEF, 유상 총괄), 각 수원부처·기관, 개발협력파트너(DP), KOICA 캄보디아사무소·본부, 대한민국 외교부·기획재정부·국무조정실&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;제출서류&lt;/h3&gt;&lt;div class=&quot;docset&quot;&gt;&lt;b&gt;각 수원부처·기관&lt;/b&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;협력사업 수요서&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;사업수요 공식 제출 서한&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;(유상) 사업요청서&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;docset&quot;&gt;&lt;b&gt;CDC/CRDB · MEF&lt;/b&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;국가발전전략·우선순위 검토 결과&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;DP 앞 수요 전달&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;docset&quot;&gt;&lt;b&gt;KOICA&lt;/b&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;사업제안서(Project Concept Paper, PCP)&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;예비조사 보고서&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;사업계획서(Project Document, PD)&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;유의사항 · 병목&lt;/h3&gt;&lt;ul class=&quot;plain&quot;&gt;&lt;li&gt;무상·유상 수원총괄기관이 분리돼 있어(무상 CDC/CRDB·유상 MEF) 사업 성격에 따라 총괄 창구가 다르다&lt;/li&gt;&lt;li&gt;사업 형성(CDC/CRDB·MEF)과 조달 집행(외부재원 GDICDM·SOP 2019)의 주체가 달라, 형성 단계와 집행 단계에서 상대하는 기관이 바뀐다&lt;/li&gt;&lt;li&gt;부처별 사업 추진 선호방식이 상이해 태세가 다르다&lt;/li&gt;&lt;li&gt;일부 캄보디아 재원이 동원되면 수원부처가 MEF 절차를 추가로 밟아야 한다&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;진입장벽&lt;/h3&gt;&lt;ul class=&quot;plain&quot;&gt;&lt;li&gt;부처별·재원별로 절차가 갈려 사업 초기에 총괄기관(무상 CDC/CRDB·유상 MEF)을 정확히 특정해야 함&lt;/li&gt;&lt;li&gt;수요제출 공식 서한이 형성 단계마다 확인되므로 문서 절차 관리가 중요&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;현장 검증 필요&lt;/h3&gt;&lt;ul class=&quot;plain&quot;&gt;&lt;li&gt;{&amp;#x27;item&amp;#x27;: &amp;#x27;현행 기관·기본규정·핵심 적용경로&amp;#x27;, &amp;#x27;question&amp;#x27;: &amp;#x27;공식 원문이 모델의 핵심 경로와 일치하는가?&amp;#x27;, &amp;#x27;status&amp;#x27;: &amp;#x27;confirmed&amp;#x27;}&lt;/li&gt;&lt;li&gt;{&amp;#x27;item&amp;#x27;: &amp;#x27;하위규정·정량요건·개별 협정·공고&amp;#x27;, &amp;#x27;question&amp;#x27;: &amp;#x27;실제 사업 시점의 세부요건과 예외가 동일하게 적용되는가?&amp;#x27;, &amp;#x27;status&amp;#x27;: &amp;#x27;pending&amp;#x27;}&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;관련 제도&lt;/h3&gt;&lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;캄보디아 공공조달 입찰제도&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;캄보디아 조달 거버넌스·감독체계&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;



&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;현행 기준 반영 1건&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;공식 법령·기관 원문으로 확인한 현행 기준과 실무 확인사항입니다.
    출처는 각 항목에 연결했으며.&lt;/p&gt;
  &lt;div class=&quot;disc&quot; data-sev=&quot;medium&quot;&gt;
  &lt;div class=&quot;top&quot;&gt;
    &lt;span class=&quot;badge warn&quot;&gt;추가 확인&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;캄보디아&lt;/span&gt;
    &lt;span class=&quot;badge plain muted&quot;&gt;D01&lt;/span&gt;
  &lt;/div&gt;
  &lt;h3&gt;canvas.authorities·legalBasis / 현행 기관·법령&lt;/h3&gt;
  &lt;div class=&quot;quote act&quot;&gt;&lt;b&gt;현행 기준&lt;/b&gt;CDC 산하 CDCB가 정부 전체 ODA 정보·파트너 조정을 담당하고 MEF가 외부재원 공공투자의 준비·재정·관리체계를 운영한다.&lt;/div&gt;
  &lt;p class=&quot;cite&quot;&gt;확인 출처 · CDC ODA Database; MEF public-investment framework&lt;/p&gt;
  &lt;div class=&quot;todo&quot;&gt;&lt;b&gt;실무 확인&lt;/b&gt;Confirm CDCB registration, MEF public-investment screening, financing agreement and executing-agency approval.&lt;/div&gt;
  &lt;details class=&quot;review&quot;&gt;
  &lt;summary&gt;Field verification (English)&lt;/summary&gt;
  &lt;div class=&quot;rv&quot;&gt;
    &lt;p&gt;&lt;b&gt;Current legal basis&lt;/b&gt; — CDC 산하 CDCB가 정부 전체 ODA 정보·파트너 조정을 담당하고 MEF가 외부재원 공공투자의 준비·재정·관리체계를 운영한다.&lt;/p&gt;
    &lt;p class=&quot;rv-verify&quot;&gt;&lt;b&gt;✔ Verify&lt;/b&gt; — Confirm CDCB registration, MEF public-investment screening, financing agreement and executing-agency approval.&lt;/p&gt;
  &lt;/div&gt;
&lt;/details&gt;

  &lt;p class=&quot;act-row&quot;&gt;산출물 반영 — 현행 CDCB 명칭과 CDC·MEF·실행기관 역할 및 외부재원 공공투자 체계를 반영했다.&lt;/p&gt;
&lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;blk&quot;&gt;
  &lt;h2&gt;검증&lt;/h2&gt;
  &lt;p class=&quot;desc&quot;&gt;공식 정부·법령·조달·대외재원 기관의 현행 원문에서 기본규정, 시행시점, 기관 권한과 적용경로를 확인해 구조화본과 대조했다.&lt;/p&gt;
  &lt;div class=&quot;cards&quot;&gt;
    &lt;div class=&quot;card span2&quot;&gt;&lt;h3&gt;검증 범위&lt;/h3&gt;
      &lt;p style=&quot;margin:0;font-size:13.5px;line-height:1.7&quot;&gt;공식 원문으로 핵심 법령·기관·제도변경을 확인했다. 모든 하위규정·정량요건·개별 협정·공고의 전 조문 대조는 완료하지 않아 law-linked로 분류한다.&lt;/p&gt;
      &lt;p style=&quot;margin:12px 0 0;font-size:12.5px;color:var(--muted)&quot;&gt;확인일 2026-07-28 · 자료집 기준일 2026-02-23&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card&quot;&gt;&lt;h3&gt;대조에 쓴 원문&lt;/h3&gt;&lt;ul class=&quot;srcs&quot; style=&quot;padding-left:16px;margin:0&quot;&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://cdc.gov.kh/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;캄보디아개발위원회(CDC)&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;지침·정책&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-23 · Council for the Development of Cambodia&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://mef.gov.kh/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;경제재무부(MEF)&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;지침·정책&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-23 · Ministry of Economy and Finance, Cambodia&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://oda.cdc.gov.kh/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Cambodia ODA Database and CDCB development-cooperation mandate&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;지침·정책&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-28 · Council for the Development of Cambodia&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://gdde.mef.gov.kh/private/83c8a60785c28e&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Public Investment Management System and externally financed project framework&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;지침·정책&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-28 · Ministry of Economy and Finance&lt;/span&gt;&lt;/li&gt;&lt;li&gt;&lt;a class=&quot;ref&quot; href=&quot;https://ppp.mef.gov.kh/project-development-facility&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;Project Development Facility for externally financed public investments&lt;/a&gt;&lt;span class=&quot;badge plain muted&quot; style=&quot;margin-left:6px&quot;&gt;지침·정책&lt;/span&gt;&lt;span class=&quot;ar&quot;&gt;확인 2026-07-28 · Ministry of Economy and Finance&lt;/span&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;card span2&quot;&gt;&lt;h3&gt;주의&lt;/h3&gt;&lt;p class=&quot;note&quot;&gt;공식 정부·법령·담당기관 출처로 현행 근거와 핵심 역할을 확인했다.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;정량요건·하위규정·개별 공여협정·공고와 정치·제재 위험은 실제 사업 착수 전에 재확인해야 한다.&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;h3 style=&quot;font-size:14px;margin:26px 0 12px&quot;&gt;확인하지 못한 것&lt;/h3&gt;&lt;div class=&quot;card&quot; style=&quot;margin-bottom:12px&quot;&gt;&lt;h3&gt;현행 하위규정·정량요건·개별 공여협정 및 실제 공고 &lt;span class=&quot;badge plain muted&quot;&gt;local-language-only&lt;/span&gt;&lt;/h3&gt;&lt;p style=&quot;margin:0 0 8px;font-size:13.5px&quot;&gt;핵심 공식 근거와 기관은 확인했으나 비공개 SOP, 정량요건, 모든 예외와 실제 사업문서를 전 조문 대조하지 않았다.&lt;/p&gt;&lt;p style=&quot;margin:0;font-size:13px;color:var(--muted)&quot;&gt;다음 조치 — Confirm CDCB registration, MEF public-investment screening, financing agreement and executing-agency approval.&lt;/p&gt;&lt;/div&gt;
  &lt;p style=&quot;margin:22px 0 0;font-size:12.5px;color:var(--muted)&quot;&gt;
    원문 링크 연결 — 조문의 존재와 문언 일치만 뜻합니다. 법적 해석·적용 타당성·개정 반영 여부는 별도 검토 대상입니다.
  &lt;/p&gt;
&lt;/section&gt;
&lt;/div&gt;

;action&quot;: &quot;검토위 통과 사업에 예비조사(문헌·현지답사·면담)를 실시하고 수원부처가 참여한다.&quot;, &quot;output_documents&quot;: [&quot;예비조사 보고서&quot;], &quot;confidence&quot;: 0.8}, &quot;P06&quot;: {&quot;id&quot;: &quot;P06&quot;, &quot;name&quot;: &quot;PD 심사위원회&quot;, &quot;lane&quot;: &quot;KOICA&quot;, &quot;stage&quot;: &quot;G3 예비·심사&quot;, &quot;type&quot;: &quot;gateway&quot;, &quot;status&quot;: &quot;waiting&quot;, &quot;actor&quot;: &quot;KOICA&quot;, &quot;action&quot;: &quot;타당한 사업의 PD 초안을 본부 심사위원회에 상정해 예산당국 심사 대상을 선정한다.&quot;, &quot;output_documents&quot;: [&quot;사업계획서(PD)&quot;], &quot;confidence&quot;: 0.8}, &quot;P07&quot;: {&quot;id&quot;: &quot;P07&quot;, &quot;name&quot;: &quot;유상 정책협의&quot;, &quot;lane&quot;: &quot;CDC/CRDB·MEF&quot;, &quot;stage&quot;: &quot;G2 검토·전달&quot;, &quot;type&quot;: &quot;task&quot;, &quot;status&quot;: &quot;waiting&quot;, &quot;actor&quot;: &quot;MEF&quot;, &quot;action&quot;: &quot;(유상) MEF가 부처 사업요청서를 취합해 유상 DP별 정책협의로 후보사업을 결정한다.&quot;, &quot;confidence&quot;: 0.8}, &quot;P08&quot;: {&quot;id&quot;: &quot;P08&quot;, &quot;name&quot;: &quot;한국 예산·확정&quot;, &quot;lane&quot;: &quot;대한민국 정부&quot;, &quot;stage&quot;: &quot;G4 공식화&quot;, &quot;type&quot;: &quot;task&quot;, &quot;status&quot;: &quot;waiting&quot;, &quot;actor&quot;: &quot;외교부·기재부·국무조정실·국회&quot;, &quot;action&quot;: &quot;시행기관 선정 후 주무부처·국무조정실·국회 심의로 사업을 확정한다.&quot;, &quot;confidence&quot;: 0.85}, &quot;P09&quot;: {&quot;id&quot;: &quot;P09&quot;, &quot;name&quot;: &quot;공식화&quot;, &quot;lane&quot;: &quot;CDC/CRDB·MEF&quot;, &quot;stage&quot;: &quot;G4 공식화&quot;, &quot;type&quot;: &quot;notice&quot;, &quot;status&quot;: &quot;waiting&quot;, &quot;actor&quot;: &quot;CDC/CRDB · 수원부처&quot;, &quot;action&quot;: &quot;캄보디아 정부는 PCP·PD 제출과 사업수요 공식 서한 발송으로 공식화한다.&quot;, &quot;confidence&quot;: 0.8}};
var EDGES=[{&quot;id&quot;: &quot;E01&quot;, &quot;source&quot;: &quot;P01&quot;, &quot;target&quot;: &quot;P02&quot;, &quot;type&quot;: &quot;sequence&quot;}, {&quot;id&quot;: &quot;E02&quot;, &quot;source&quot;: &quot;P02&quot;, &quot;target&quot;: &quot;P03&quot;, &quot;type&quot;: &quot;sequence&quot;, &quot;label&quot;: &quot;무상&quot;}, {&quot;id&quot;: &quot;E03&quot;, &quot;source&quot;: &quot;P02&quot;, &quot;target&quot;: &quot;P07&quot;, &quot;type&quot;: &quot;sequence&quot;, &quot;label&quot;: &quot;유상&quot;}, {&quot;id&quot;: &quot;E04&quot;, &quot;source&quot;: &quot;P03&quot;, &quot;target&quot;: &quot;P04&quot;, &quot;type&quot;: &quot;message&quot;, &quot;label&quot;: &quot;수요 전달&quot;}, {&quot;id&quot;: &quot;E05&quot;, &quot;source&quot;: &quot;P04&quot;, &quot;target&quot;: &quot;P05&quot;, &quot;type&quot;: &quot;sequence&quot;, &quot;label&quot;: &quot;검토위 통과&quot;}, {&quot;id&quot;: &quot;E06&quot;, &quot;source&quot;: &quot;P05&quot;, &quot;target&quot;: &quot;P06&quot;, &quot;type&quot;: &quot;sequence&quot;, &quot;label&quot;: &quot;타당성 인정&quot;}, {&quot;id&quot;: &quot;E07&quot;, &quot;source&quot;: &quot;P06&quot;, &quot;target&quot;: &quot;P08&quot;, &quot;type&quot;: &quot;sequence&quot;}, {&quot;id&quot;: &quot;E08&quot;, &quot;source&quot;: &quot;P07&quot;, &quot;target&quot;: &quot;P08&quot;, &quot;type&quot;: &quot;sequence&quot;}, {&quot;id&quot;: &quot;E09&quot;, &quot;source&quot;: &quot;P08&quot;, &quot;target&quot;: &quot;P09&quot;, &quot;type&quot;: &quot;sequence&quot;}];

var _sel=document.getElementById(&#x27;sel&#x27;);
if(_sel) _sel.addEventListener(&#x27;change&#x27;,function(){ location.href=&#x27;../&#x27;+this.value+&#x27;/index.html&#x27;; });

/* 엣지 그리기 — 노드 DOM 위치를 재서 SVG로 연결 */
function draw(){
  var board=document.getElementById(&#x27;board&#x27;),svg=document.getElementById(&#x27;edges&#x27;);
  if(!board||!svg)return;
  var bb=board.getBoundingClientRect();
  svg.setAttribute(&#x27;viewBox&#x27;,&#x27;0 0 &#x27;+board.scrollWidth+&#x27; &#x27;+board.scrollHeight);
  svg.setAttribute(&#x27;width&#x27;,board.scrollWidth); svg.setAttribute(&#x27;height&#x27;,board.scrollHeight);
  var cs=getComputedStyle(document.documentElement);
  var C={sequence:cs.getPropertyValue(&#x27;--muted&#x27;).trim(),
         message:cs.getPropertyValue(&#x27;--back&#x27;).trim(),
         loop:cs.getPropertyValue(&#x27;--warn&#x27;).trim()};
  var d=&#x27;&lt;defs&gt;&#x27;;
  [&#x27;sequence&#x27;,&#x27;message&#x27;,&#x27;loop&#x27;].forEach(function(t){
    d+=&#x27;&lt;marker id=&quot;m-&#x27;+t+&#x27;&quot; viewBox=&quot;0 0 8 8&quot; refX=&quot;7&quot; refY=&quot;4&quot; markerWidth=&quot;6&quot; markerHeight=&quot;6&quot; orient=&quot;auto&quot;&gt;&#x27;
      +&#x27;&lt;path d=&quot;M0 0 L8 4 L0 8 z&quot; fill=&quot;&#x27;+C[t]+&#x27;&quot;/&gt;&lt;/marker&gt;&#x27;;
  });
  d+=&#x27;&lt;/defs&gt;&#x27;;
  var GAP=5;
  function rel(rc){return {x:rc.left-bb.left+board.scrollLeft, y:rc.top-bb.top+board.scrollTop,
                            r:rc.right-bb.left+board.scrollLeft, b:rc.bottom-bb.top+board.scrollTop,
                            w:rc.width, h:rc.height};}
  function box(id){
    var el=board.querySelector(&#x27;.node[data-id=&quot;&#x27;+id+&#x27;&quot;]&#x27;);
    if(!el)return null; return rel(el.getBoundingClientRect());
  }

  /* 라우팅은 korea100studio의 거터 라우팅을 우리 그리드에 이식한 것이다.
     핵심: 카드를 지나야 하는 선은 카드가 없는 거터(행 하단·열 측면)로 우회한다.
     DOM에서 노드·행·열을 실측할 수 있어, 여러 직교 경로 후보를 만들고
     무관한 카드를 가장 적게 관통하는(동수면 가장 짧은) 것을 고른다. */

  // 장애물(모든 노드)과 거터(노드 없는 띠) 실측
  var OB=[];
  board.querySelectorAll(&#x27;.node&#x27;).forEach(function(el){ var r=box(el.dataset.id); r.id=el.dataset.id; OB.push(r); });
  var rowGut=[], colGut=[];
  board.querySelectorAll(&#x27;.brow:not(.head)&#x27;).forEach(function(el){ var r=rel(el.getBoundingClientRect());
    rowGut.push(r.y+9); rowGut.push(r.b-9); });
  var hc=board.querySelectorAll(&#x27;.brow.head .bcell&#x27;);
  for(var i=1;i&lt;hc.length;i++){ var r=rel(hc[i].getBoundingClientRect()); colGut.push(r.x+11); colGut.push(r.r-11); }

  function segHit(ax,ay,bx,by,e1,e2){
    var n=0, M=3;
    for(var i=0;i&lt;OB.length;i++){ var o=OB[i]; if(o.id===e1||o.id===e2) continue;
      var L=o.x+M,R=o.r-M,T=o.y+M,B=o.b-M;
      if(Math.abs(ay-by)&lt;0.5){ if(ay&gt;T&amp;&amp;ay&lt;B &amp;&amp; Math.max(ax,bx)&gt;L &amp;&amp; Math.min(ax,bx)&lt;R) n++; }
      else { if(ax&gt;L&amp;&amp;ax&lt;R &amp;&amp; Math.max(ay,by)&gt;T &amp;&amp; Math.min(ay,by)&lt;B) n++; }
    } return n;
  }
  function uniq(pts){ return pts.filter(function(p,i){ return i===0 || Math.abs(p.x-pts[i-1].x)&gt;0.5 || Math.abs(p.y-pts[i-1].y)&gt;0.5; }); }
  function score(pts,e1,e2){ pts=uniq(pts); var p=0,l=0;
    for(var i=0;i&lt;pts.length-1;i++){ p+=segHit(pts[i].x,pts[i].y,pts[i+1].x,pts[i+1].y,e1,e2);
      l+=Math.abs(pts[i].x-pts[i+1].x)+Math.abs(pts[i].y-pts[i+1].y); }
    return {pts:pts,p:p,l:l}; }

  function route(a,b,ed){
    var acx=a.x+a.w/2,acy=a.y+a.h/2,bcx=b.x+b.w/2,bcy=b.y+b.h/2, e1=ed.source,e2=ed.target, cs=[];
    // 세로 계열 — a의 위/아래 변에서 나가 b의 위/아래 변으로
    var below=bcy&gt;acy, sp={x:acx,y:below?a.b:a.y}, tp={x:bcx,y:below?b.y:b.b}, tg={x:tp.x,y:tp.y+(below?-GAP:GAP)};
    cs.push(score([sp,{x:sp.x,y:tg.y},tg,tp],e1,e2));                                   // 직선/L
    rowGut.forEach(function(my){ if(my&gt;Math.min(sp.y,tp.y)+6&amp;&amp;my&lt;Math.max(sp.y,tp.y)-6)   // 행 거터 크로스
      cs.push(score([sp,{x:sp.x,y:my},{x:tp.x,y:my},tg,tp],e1,e2)); });
    colGut.forEach(function(gx){                                                          // 열 측면 탈출
      var as={x:gx&gt;acx?a.r:a.x,y:acy};
      cs.push(score([as,{x:gx,y:acy},{x:gx,y:tg.y},tg,tp],e1,e2)); });
    // 가로 계열 — a의 좌/우 변에서 나가 b의 좌/우 변으로
    var right=bcx&gt;acx, sp2={x:right?a.r:a.x,y:acy}, tp2={x:right?b.x:b.r,y:bcy}, tg2={x:tp2.x+(right?-GAP:GAP),y:tp2.y};
    cs.push(score([sp2,{x:tg2.x,y:sp2.y},tg2,tp2],e1,e2));
    colGut.forEach(function(mx){ if(mx&gt;Math.min(sp2.x,tp2.x)+6&amp;&amp;mx&lt;Math.max(sp2.x,tp2.x)-6)
      cs.push(score([sp2,{x:mx,y:sp2.y},{x:mx,y:tp2.y},tg2,tp2],e1,e2)); });
    rowGut.forEach(function(gy){                                                          // 행 거터 우회
      var as={x:acx,y:gy&gt;acy?a.b:a.y};
      cs.push(score([as,{x:acx,y:gy},{x:tp2.x,y:gy},tg2,tp2],e1,e2)); });
    // 회귀선 — 아래로 크게 우회 (되돌아가는 흐름을 시각적으로 구분)
    if(ed.type===&#x27;loop&#x27;){ var gy=Math.max(a.b,b.b)+26;
      cs.push(score([{x:acx,y:a.b},{x:acx,y:gy},{x:bcx,y:gy},{x:bcx,y:b.b+GAP},{x:bcx,y:b.b}],e1,e2)); }
    cs=cs.filter(function(c){return c.pts.length&gt;=2;});
    cs.sort(function(x,y){ return x.p-y.p || x.l-y.l; });
    return cs[0];
  }

  function rnd(v){return Math.round(v*10)/10;}
  function orthPath(pts){                    // 직교 경로 + 모서리 라운딩
    pts=uniq(pts); if(pts.length&lt;2)return &#x27;&#x27;;
    var d=&#x27;M&#x27;+rnd(pts[0].x)+&#x27; &#x27;+rnd(pts[0].y);
    for(var i=1;i&lt;pts.length-1;i++){
      var p=pts[i-1],c=pts[i],n=pts[i+1];
      var d1=Math.hypot(c.x-p.x,c.y-p.y)||1, d2=Math.hypot(n.x-c.x,n.y-c.y)||1, r=Math.min(7,d1/2,d2/2);
      d+=&#x27; L&#x27;+rnd(c.x-(c.x-p.x)/d1*r)+&#x27; &#x27;+rnd(c.y-(c.y-p.y)/d1*r);
      d+=&#x27; Q&#x27;+rnd(c.x)+&#x27; &#x27;+rnd(c.y)+&#x27; &#x27;+rnd(c.x+(n.x-c.x)/d2*r)+&#x27; &#x27;+rnd(c.y+(n.y-c.y)/d2*r);
    }
    var e=pts[pts.length-1]; return d+&#x27; L&#x27;+rnd(e.x)+&#x27; &#x27;+rnd(e.y);
  }

  EDGES.forEach(function(ed){
    var a=box(ed.source),b=box(ed.target); if(!a||!b)return;
    var t=ed.type||&#x27;sequence&#x27;, rt=route(a,b,ed);
    d+=&#x27;&lt;path d=&quot;&#x27;+orthPath(rt.pts)+&#x27;&quot; fill=&quot;none&quot; stroke=&quot;&#x27;+C[t]+&#x27;&quot; stroke-width=&quot;1.5&quot; opacity=&quot;&#x27;
      +(t===&#x27;sequence&#x27;?&#x27;.55&#x27;:&#x27;.8&#x27;)+&#x27;&quot;&#x27;+(t!==&#x27;sequence&#x27;?&#x27; stroke-dasharray=&quot;4 3&quot;&#x27;:&#x27;&#x27;)
      +&#x27; marker-end=&quot;url(#m-&#x27;+t+&#x27;)&quot;/&gt;&#x27;;
  });
  svg.innerHTML=d;
}

var KIND={&quot;act&quot;: &quot;법률&quot;, &quot;regulation&quot;: &quot;시행규칙&quot;, &quot;ordinance&quot;: &quot;명령·조례&quot;, &quot;directive&quot;: &quot;지침·정책&quot;, &quot;standard-document&quot;: &quot;표준문서&quot;, &quot;treaty-agreement&quot;: &quot;양자합의&quot;, &quot;donor-rule&quot;: &quot;공여기관 규정&quot;, &quot;practice&quot;: &quot;현장 관행&quot;};
function openNode(id){
  var n=NODES[id]; if(!n)return;
  var h=&#x27;&lt;span class=&quot;badge plain muted&quot;&gt;&#x27;+n.id+&#x27;&lt;/span&gt; &#x27;
       +&#x27;&lt;span class=&quot;badge plain muted&quot;&gt;&#x27;+n.lane+&#x27;&lt;/span&gt; &#x27;
       +&#x27;&lt;span class=&quot;badge plain muted&quot;&gt;&#x27;+n.stage+&#x27;&lt;/span&gt;&#x27;;
  h+=&#x27;&lt;h3&gt;&#x27;+n.name+&#x27;&lt;/h3&gt;&#x27;;
  h+=&#x27;&lt;dl class=&quot;kv&quot;&gt;&#x27;;
  h+=&#x27;&lt;dt&gt;담당&lt;/dt&gt;&lt;dd&gt;&#x27;+n.actor+&#x27;&lt;/dd&gt;&#x27;;
  if(n.action) h+=&#x27;&lt;dt&gt;내용&lt;/dt&gt;&lt;dd&gt;&#x27;+n.action+&#x27;&lt;/dd&gt;&#x27;;
  if(n.deadline) h+=&#x27;&lt;dt&gt;기한&lt;/dt&gt;&lt;dd&gt;&#x27;+n.deadline+&#x27;&lt;/dd&gt;&#x27;;
  if(n.output_documents&amp;&amp;n.output_documents.length)
    h+=&#x27;&lt;dt&gt;산출 문서&lt;/dt&gt;&lt;dd&gt;&#x27;+n.output_documents.join(&#x27; · &#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  if(n.blocker) h+=&#x27;&lt;dt&gt;병목&lt;/dt&gt;&lt;dd style=&quot;color:var(--warn)&quot;&gt;&#x27;+n.blocker+&#x27;&lt;/dd&gt;&#x27;;
  if(n.legal_basis&amp;&amp;n.legal_basis.length){
    h+=&#x27;&lt;dt&gt;근거 조문&lt;/dt&gt;&lt;dd&gt;&#x27;+n.legal_basis.map(function(l){
      var nm=l.url?&#x27;&lt;a class=&quot;ref&quot; href=&quot;&#x27;+l.url+&#x27;&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;&#x27;+l.law+&#x27;&lt;/a&gt;&#x27;:l.law;
      return &#x27;&lt;div style=&quot;margin-bottom:4px&quot;&gt;&#x27;+nm+&#x27; &lt;code&gt;&#x27;+l.article+&#x27;&lt;/code&gt;&lt;/div&gt;&#x27;;}).join(&#x27;&#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  }
  if(typeof n.confidence===&#x27;number&#x27;){
    h+=&#x27;&lt;dt&gt;법령 근거 확신도&lt;/dt&gt;&lt;dd&gt;&#x27;+n.confidence.toFixed(2)
      +(n.confidence&lt;0.8?&#x27; &lt;span class=&quot;badge warn&quot;&gt;현장 검증 필요&lt;/span&gt;&#x27;:&#x27;&#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  }
  var ins=EDGES.filter(function(x){return x.target===id}),
      outs=EDGES.filter(function(x){return x.source===id});
  if(ins.length) h+=&#x27;&lt;dt&gt;선행&lt;/dt&gt;&lt;dd&gt;&#x27;+ins.map(function(x){
    return (NODES[x.source]?NODES[x.source].name:x.source)+(x.label?&#x27; (&#x27;+x.label+&#x27;)&#x27;:&#x27;&#x27;);}).join(&#x27; · &#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  if(outs.length) h+=&#x27;&lt;dt&gt;후속&lt;/dt&gt;&lt;dd&gt;&#x27;+outs.map(function(x){
    return (NODES[x.target]?NODES[x.target].name:x.target)+(x.label?&#x27; (&#x27;+x.label+&#x27;)&#x27;:&#x27;&#x27;);}).join(&#x27; · &#x27;)+&#x27;&lt;/dd&gt;&#x27;;
  h+=&#x27;&lt;/dl&gt;&#x27;;
  document.getElementById(&#x27;dbody&#x27;).innerHTML=h;
  document.getElementById(&#x27;dlg&#x27;).showModal();
}

document.querySelectorAll(&#x27;.node&#x27;).forEach(function(b){
  b.addEventListener(&#x27;click&#x27;,function(){openNode(b.dataset.id)});
  b.addEventListener(&#x27;mouseenter&#x27;,function(){
    var id=b.dataset.id;
    var rel={};rel[id]=1;
    EDGES.forEach(function(x){if(x.source===id)rel[x.target]=1;if(x.target===id)rel[x.source]=1;});
    document.querySelectorAll(&#x27;.node&#x27;).forEach(function(o){o.classList.toggle(&#x27;dim&#x27;,!rel[o.dataset.id])});
  });
  b.addEventListener(&#x27;mouseleave&#x27;,function(){
    document.querySelectorAll(&#x27;.node&#x27;).forEach(function(o){o.classList.remove(&#x27;dim&#x27;)});
  });
});
document.getElementById(&#x27;dlg&#x27;).addEventListener(&#x27;click&#x27;,function(ev){
  if(ev.target===this) this.close();
});

addEventListener(&#x27;load&#x27;,draw); addEventListener(&#x27;resize&#x27;,draw);
new MutationObserver(draw).observe(document.documentElement,{attributes:true,attributeFilter:[&#x27;data-theme&#x27;]});
&lt;/script&gt;
&lt;/body&gt;&lt;/html&gt;"></iframe></div>

  조달법은 개정이 잦으므로 실제 입찰 전 발주처 공고문과 현행 법령을 확인해야 합니다.
</div>
<script>
function fit(fr){ try{ fr.style.height=(fr.contentWindow.document.body.scrollHeight+20)+'px'; }catch(e){} }
function showTab(i){
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.toggle('active', +t.dataset.i===i); });
  document.querySelectorAll('.fr').forEach(function(fr){
    var on=+fr.dataset.i===i; fr.classList.toggle('active', on);
    if(on){ try{ fr.contentWindow.draw && fr.contentWindow.draw(); }catch(e){} setTimeout(function(){fit(fr);},60); }
  });
}
document.querySelectorAll('.fr').forEach(function(fr){
  fr.addEventListener('load', function(){
    // iframe 안의 테마 토글·업무구조도가 부모 테마를 따르도록, 그리고 높이를 맞춘다
    fit(fr);
    if(fr.classList.contains('active')) setTimeout(function(){ try{fr.contentWindow.draw&&fr.contentWindow.draw();}catch(e){} fit(fr); },80);
  });
});
addEventListener('resize', function(){ var a=document.querySelector('.fr.active'); if(a) fit(a); });
</script>
