name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install board renderer
        run: npm ci

      - name: Validate data
        run: |
          python3 tools/validate.py
          python3 tools/build_construction_baselines.py --check
          python3 tools/validate_construction_regulations.py
          npm run check:boards

      - name: Build static site
        run: |
          python3 tools/build_site.py
          npm run build:construction-boards
          python3 tools/check_construction_site.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        # deploy-pages@v4 cancels queued deployments after a hard 10-minute limit.
        uses: actions/github-script@v9
        timeout-minutes: 32
        env:
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
          PAGES_DEPLOY_TIMEOUT_MS: "1800000"
        with:
          github-token: ${{ github.token }}
          script: |
            const deploy = require('./tools/deploy_pages_long_wait.cjs')
            await deploy({ github, context, core })
