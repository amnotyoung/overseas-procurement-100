name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Validate institution records
        run: python tools/validate.py

      - name: Check process boards
        run: npm run check:boards

      - name: Build documentation and site
        run: |
          python tools/build_docs.py
          python tools/build_site.py
