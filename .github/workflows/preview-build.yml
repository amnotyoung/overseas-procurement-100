name: Build PR Preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: preview-build
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Validate source and preview publisher
        run: |
          python tools/validate.py
          python tools/build_construction_baselines.py --check
          python tools/validate_construction_regulations.py
          python tools/check_construction_procedure_coverage.py
          python tools/check_construction_procedure_structure.py
          python tools/check_construction_terminology.py
          npm run check:boards
          python tools/check_pages_preview.py

      - name: Build preview site
        run: |
          python tools/build_docs.py
          python tools/build_construction_regulations.py
          python tools/build_site.py
          npm run build:construction-boards
          python tools/check_construction_site.py

      - name: Stage untrusted static artifact
        run: |
          mkdir -p preview-bundle
          cp -R site preview-bundle/site

      - name: Upload preview artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pages-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: preview-bundle
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
          include-hidden-files: true
